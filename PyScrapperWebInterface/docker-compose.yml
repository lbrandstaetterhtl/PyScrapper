# Web interface for PyScrapper.
#
#   docker compose up -d --build      ->  http://localhost:8080
#
# The LocalServer is not part of this compose file; it keeps running on the
# host. Point BACKEND_URL at it (default: the host's port 8765).
services:
  web:
    build: .
    image: pyscrapper-web:latest
    container_name: pyscrapper-web
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8765}
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too (Docker Desktop has it built in).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
