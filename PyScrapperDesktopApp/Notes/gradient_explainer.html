
<style>
* { box-sizing: border-box; }
canvas { display: block; border-radius: 8px; border: 0.5px solid var(--color-border-tertiary); }
label { font-size: 13px; color: var(--color-text-secondary); }
input[type=range] { flex: 1; }
.val { font-size: 13px; font-weight: 500; min-width: 38px; text-align: right; color: var(--color-text-primary); font-family: var(--font-mono); }
.row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--color-text-secondary); margin-top: 8px; flex-wrap: wrap; }
.legend span { display: flex; align-items: center; }
</style>

<div style="padding: 4px 0 16px;">

<canvas id="c" width="640" height="240"></canvas>

<div class="legend">
  <span><span class="dot" style="background:#3776d4"></span>StartPoint</span>
  <span><span class="dot" style="background:#f7c948"></span>EndPoint</span>
  <span><span class="dot" style="background:#e24b4a; width:8px; height:8px; border-radius:0; transform:rotate(45deg)"></span>Gradient-Achse</span>
</div>

<div style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px;">
  <div>
    <div style="font-size: 12px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .05em;">StartPoint</div>
    <div class="row"><label style="min-width:12px">X</label><input type="range" id="sx" min="0" max="100" value="0" step="1"><span class="val" id="sx-v">0%</span></div>
    <div class="row"><label style="min-width:12px">Y</label><input type="range" id="sy" min="0" max="100" value="0" step="1"><span class="val" id="sy-v">0%</span></div>
  </div>
  <div>
    <div style="font-size: 12px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .05em;">EndPoint</div>
    <div class="row"><label style="min-width:12px">X</label><input type="range" id="ex" min="0" max="100" value="100" step="1"><span class="val" id="ex-v">100%</span></div>
    <div class="row"><label style="min-width:12px">Y</label><input type="range" id="ey" min="0" max="100" value="100" step="1"><span class="val" id="ey-v">100%</span></div>
  </div>
</div>

<div style="margin-top: 12px; background: var(--color-background-secondary); border-radius: 8px; padding: 10px 14px; font-family: var(--font-mono); font-size: 12.5px; color: var(--color-text-primary);">
  StartPoint="<span id="code-s" style="color:#3776d4">0%,0%</span>" EndPoint="<span id="code-e" style="color:#f7c948">100%,100%</span>"
</div>

</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 640, H = 240;

function getVals() {
  return {
    sx: parseInt(document.getElementById('sx').value),
    sy: parseInt(document.getElementById('sy').value),
    ex: parseInt(document.getElementById('ex').value),
    ey: parseInt(document.getElementById('ey').value),
  };
}

function draw() {
  const v = getVals();
  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

  ctx.clearRect(0, 0, W, H);

  const x1 = v.sx / 100 * W, y1 = v.sy / 100 * H;
  const x2 = v.ex / 100 * W, y2 = v.ey / 100 * H;

  const grad = ctx.createLinearGradient(x1, y1, x2, y2);
  grad.addColorStop(0, '#3776d4');
  grad.addColorStop(0.5, isDark ? '#2a2a3a' : '#e8e8e0');
  grad.addColorStop(1, '#f7c948');

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(0, 0, W, H, 8);
  ctx.fill();

  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx*dx + dy*dy);
  if (len > 2) {
    const nx = dx/len, ny = dy/len;
    const ext = Math.max(W, H) * 1.5;
    ctx.save();
    ctx.strokeStyle = 'rgba(226,75,74,0.6)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(x1 - nx*ext, y1 - ny*ext);
    ctx.lineTo(x1 + nx*ext, y1 + ny*ext);
    ctx.stroke();
    ctx.restore();
  }

  const drawPoint = (x, y, color, label) => {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 6;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, 9, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = '500 12px sans-serif';
    ctx.textAlign = x > W*0.8 ? 'right' : 'left';
    ctx.textBaseline = y < 24 ? 'top' : 'bottom';
    const tx = x > W*0.8 ? x - 14 : x + 14;
    const ty = y < 24 ? y + 2 : y - 2;
    ctx.fillText(label, tx, ty);
  };

  drawPoint(x1, y1, '#3776d4', 'Start');
  drawPoint(x2, y2, '#f7c948', 'End');

  document.getElementById('code-s').textContent = v.sx + '%,' + v.sy + '%';
  document.getElementById('code-e').textContent = v.ex + '%,' + v.ey + '%';
  document.getElementById('sx-v').textContent = v.sx + '%';
  document.getElementById('sy-v').textContent = v.sy + '%';
  document.getElementById('ex-v').textContent = v.ex + '%';
  document.getElementById('ey-v').textContent = v.ey + '%';
}

['sx','sy','ex','ey'].forEach(id => document.getElementById(id).addEventListener('input', draw));
draw();
</script>
