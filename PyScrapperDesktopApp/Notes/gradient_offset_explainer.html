
<style>
* { box-sizing: border-box; }
canvas { display: block; border-radius: 8px; border: 0.5px solid var(--color-border-tertiary); }
.row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
label { font-size: 13px; color: var(--color-text-secondary); min-width: 80px; }
input[type=range] { flex: 1; }
.val { font-size: 13px; font-weight: 500; min-width: 34px; text-align: right; color: var(--color-text-primary); font-family: var(--font-mono); }
.code { margin-top: 12px; background: var(--color-background-secondary); border-radius: 8px; padding: 10px 14px; font-family: var(--font-mono); font-size: 12.5px; color: var(--color-text-primary); line-height: 1.8; }
.tg { color: #5a9fd4; } .at { color: #c68642; } .vl { color: #5aab7a; }
</style>

<div style="padding: 4px 0 16px;">

<canvas id="c" width="640" height="100"></canvas>

<div style="margin-top: 20px;">
  <div class="row">
    <label>Stop 1 Offset</label>
    <input type="range" id="o1" min="0" max="100" value="0" step="1">
    <span class="val" id="o1-v">0</span>
  </div>
  <div class="row">
    <label>Stop 2 Offset</label>
    <input type="range" id="o2" min="0" max="100" value="50" step="1">
    <span class="val" id="o2-v">0.5</span>
  </div>
  <div class="row">
    <label>Stop 3 Offset</label>
    <input type="range" id="o3" min="0" max="100" value="100" step="1">
    <span class="val" id="o3-v">1</span>
  </div>
</div>

<div class="code">
  <span class="tg">&lt;LinearGradientBrush</span> <span class="at">StartPoint</span>=<span class="vl">"0%,0%"</span> <span class="at">EndPoint</span>=<span class="vl">"100%,0%"</span><span class="tg">&gt;</span><br>
  &nbsp;&nbsp;<span class="tg">&lt;GradientStop</span> <span class="at">Color</span>=<span class="vl">"#3776d4"</span> <span class="at">Offset</span>=<span class="vl">"<span id="c1">0</span>"</span><span class="tg">/&gt;</span><br>
  &nbsp;&nbsp;<span class="tg">&lt;GradientStop</span> <span class="at">Color</span>=<span class="vl">"#ffffff"</span> <span class="at">Offset</span>=<span class="vl">"<span id="c2">0.5</span>"</span><span class="tg">/&gt;</span><br>
  &nbsp;&nbsp;<span class="tg">&lt;GradientStop</span> <span class="at">Color</span>=<span class="vl">"#f7c948"</span> <span class="at">Offset</span>=<span class="vl">"<span id="c3">1</span>"</span><span class="tg">/&gt;</span><br>
  <span class="tg">&lt;/LinearGradientBrush&gt;</span>
</div>

</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 640, H = 100;
const colors = ['#3776d4', '#ffffff', '#f7c948'];
const ids = ['o1','o2','o3'];
const cIds = ['c1','c2','c3'];

function draw() {
  ctx.clearRect(0, 0, W, H);

  const offsets = ids.map(id => parseInt(document.getElementById(id).value) / 100);

  const grad = ctx.createLinearGradient(0, 0, W, 0);
  offsets.forEach((o, i) => {
    try { grad.addColorStop(Math.min(1, Math.max(0, o)), colors[i]); } catch(e) {}
  });

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(0, 0, W, H, 8);
  ctx.fill();

  offsets.forEach((o, i) => {
    const x = o * W;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = '500 12px sans-serif';
    ctx.textAlign = o > 0.85 ? 'right' : o < 0.15 ? 'left' : 'center';
    ctx.textBaseline = 'top';
    const label = (Math.round(o * 100) / 100).toFixed(2).replace(/\.?0+$/, '') || '0';
    ctx.fillText('Offset ' + label, x + (o > 0.85 ? -6 : o < 0.15 ? 6 : 0), 8);

    ctx.fillStyle = colors[i];
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.setLineDash([]);
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.arc(x, H - 18, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    const disp = (Math.round(o * 100) / 100).toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
    document.getElementById(cIds[i]).textContent = disp === '' ? '0' : disp;
    document.getElementById(ids[i] + '-v').textContent = disp === '' ? '0' : disp;
  });
}

ids.forEach(id => document.getElementById(id).addEventListener('input', draw));
draw();
</script>
