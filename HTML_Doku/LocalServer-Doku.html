path.dirname(os.path.abspath(__file__))))\n\nimport fastapi\nfrom PythonModule.models.settings import PROGRESSDICT\nfrom PythonModule.models.responses import (\n    MessageResponse,\n    CreateResponse,\n    CreatePlaylistMediaResponse,\n    LoginResponse,\n    PlaylistResponse,\n    DownloadedMediaResponse,\n    SettingsResponse,\n    PlaylistMediaResponse,\n    UserResponse\n)\nfrom PythonModule.models.requests import SearchRequest, DownloadRequest, CommandRequest, CreateUserRequest, CreatePlaylistRequest, CreateDownloadedMediaRequest, CreateSettingsRequest, CreatePlaylistMediaRequest, DeletePlaylistMediaRequest, RegisterRequest, LoginRequest\nfrom PythonModule.serverservices import downloadProcessor, commandProcessor, searchProcessor, utils\nfrom PythonModule.core.request import Session\nfrom dotenv import load_dotenv\nfrom contextlib import asynccontextmanager\n\nfrom fastapi import FastAPI, HTTPException\nfrom fastapi.middleware.cors import CORSMiddleware\nfrom pydantic import BaseModel\nfrom typing import Optional, List\nimport  time, re, json, uuid\nfrom datetime import datetime\nimport bcrypt\n\nimport platform, subprocess\n\nimport os\nimport asyncio\nimport sqlite3\nimport secrets\n\n#Global Variables\ncurrent_path = os.path.dirname(os.path.abspath(__file__))\nproject_root = os.path.dirname(current_path)\ndb_path = os.path.join(current_path, \"Data\", \"data.db\")\nload_dotenv()\nADMIN_KEY = os.getenv(\"ADMIN_KEY\")\n\nlog_dir = os.path.join(project_root, \"LocalServer\", \"logs\")\nlog_file = os.path.join(log_dir, \"server_runtime.log\")\nos.makedirs(log_dir, exist_ok=True)\n\nses = Session.Session()\n\napp = FastAPI()\n\napp.add_middleware(\n    CORSMiddleware,\n    allow_origins=[\n        \"http://localhost:5173\",\n        \"http://127.0.0.1:5173\",\n    ],\n    allow_credentials=True,\n    allow_methods=[\"*\"],\n    allow_headers=[\"*\"],\n)\n\nlog_queue = asyncio.Queue(maxsize=5000)\nquit_event = asyncio.Event()\n\ndownload_jobs = set()\nsearch_jobs = set()\ndownload_progress = {}\n\n\nclass SearchError(Exception): ...\nclass CommandError(Exception): ...\nclass DownloadError(Exception): ...\n\n\nasync def logger(quit_event: asyncio.Event, log_queue: asyncio.Queue):\n    global log_file\n\n    while not quit_event.is_set():\n        try:\n            message = await log_queue.get()\n\n            if not isinstance(message, str):\n                message = json.dumps(message, ensure_ascii=False)\n\n            timestamp = datetime.now().strftime(\"%Y-%m-%d_%H-%M-%S\")\n\n            with open(log_file, \"a\", encoding=\"utf-8\") as f:\n                f.write(f\"[{str(timestamp)}] \" + message + \"\\n\")\n\n        except asyncio.CancelledError:\n            break\n        except Exception as e:\n            print(e)\n\n\ndownload_limiter = asyncio.Semaphore(50)\n\n\n@app.get(\"/\")\nasync def root():\n    return {\n        \"message\": \"Server startup successful!\",\n    }\n\n\n#'@app.on_event(\"startup\")\n#async def startup_event():\n #   global quit_event, log_queue\n#\n #   asyncio.create_task(logger(quit_event, log_queue))\n  #  log_queue.put_nowait(\"[INFO] Server started successfully\")\n   # create_app_tables()\n\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    global quit_event, log_queue\n    asyncio.create_task(logger(quit_event, log_queue))\n    log_queue.put_nowait(\"[INFO] Server started successfully\")\n    create_app_tables()\n    yield\n\napp = FastAPI(lifespan=lifespan)\n\n@app.post(\"/command\")\nasync def receive_command(data: CommandRequest):\n    global log_file, log_queue, quit_event\n    try:\n        await commandProcessor.CommandProcessor(\n            command=data.command,\n            logFile=log_file,\n            logQueue=log_queue,\n            quitEvent=quit_event\n        ).run()\n\n        log_queue.put_nowait(f\"[INFO] Command '{data.command}' executed successfully\")\n\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error handling command {data.command}.\\nError Message: {str(e)}\")\n        raise HTTPException(status_code=500, detail=str(e))\n\n\n@app.post(\"/download\")\nasync def receive_download(data: DownloadRequest):\n \n    global log_queue, ses, download_limiter\n    task_id = str(uuid.uuid4())\n    try:\n        ses.reloadCookies()\n        utils.validate_url(session=ses, url=data.url)\n\n        download_progress[task_id] = PROGRESSDICT.copy()\n        download_progress[task_id]['id'] = task_id\n\n\n        \n    \n        task = asyncio.create_task(downloadProcessor.DownloadProcessor(\n            downloadRequest=data,\n            progressDict=download_progress[task_id],\n            session=ses,\n            downloadLimiter=download_limiter,\n            logQueue=log_queue\n            ).run(),\n            name=task_id)\n\n        def done(t: asyncio.Task):\n            download_jobs.discard(t)\n            asyncio.create_task(utils.cleanup_progress(\n                download_progess=download_progress,\n                task_id=task_id,\n                delay=60\n            ))\n\n        task.add_done_callback(done)\n        download_jobs.add(task)\n\n        log_queue.put_nowait(f\"[INFO] Created download task with id {task_id} for provider {data.provider} with url {data.url}\")\n        return {\"id\": task_id, \"message\": f\"Request received for download, you can view progress under /download/progress/{task_id}\"}\n\n    except (ValueError, TypeError) as e:\n        log_queue.put_nowait(f\"[ERROR] failed to create download task with arguments given: provider {data.provider}, url: {data.url}, filepath {data.download_path}.\\nError Message: Invalid type for {str(e)}\")\n        raise HTTPException(status_code=400, detail=f\"Invalid type for {str(e)}\")\n\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] failed to create download task with arguments given: provider {data.provider}, url: {data.url}, filepath {data.download_path}.\\nError Message: {str(e)}\")\n        raise HTTPException(status_code=500, detail=str(e))\n\n\n@app.get(\"/download/progress/{task_id}\")\nasync def get_download_progress(task_id: str):\n    progress = download_progress.get(task_id)\n    if not progress:\n        log_queue.put_nowait(f\"[ERROR] Tried to access resource /download/progress/{task_id} which doesn't exist\")\n        raise HTTPException(status_code=404, detail=f\"No such resource /download/progress/{task_id}\")\n    return progress\n\n\n@app.post(\"/search\")\nasync def receive_search(data: SearchRequest):\n    global ses\n    search_id = str(uuid.uuid4())\n    try:\n        response = await searchProcessor.SearchProcessor(\n            searchRequest=data,\n            session=ses,\n            ).run()\n\n        log_queue.put_nowait(f\"[INFO] Search succesfull for job {search_id} with query {data.search} and provider {data.provider}\")\n        return response\n\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Failed search task with given arguments: id {search_id} provider {data.provider} and searchinput {data.search}.\\n Error Message:{str(e)}\")\n        raise HTTPException(status_code=500, detail=str(e))\n\n\nstart_time = time.time()\n\n@app.get(\"/health\")\ndef health():\n    try:\n        uptime_seconds = time.time() - start_time\n        try:\n            mem = self_memory_mb()\n        except Exception:\n            mem = None\n\n        active_downloads = [v for v in download_progress.values() if v[\"status\"] not in (\"complete\", \"error\")]\n        downloads_with_errors = [v for v in download_progress.values() if v[\"status\"] == \"error\"]\n        error_messages = [v[\"errorMessage\"] for v in downloads_with_errors if v[\"errorMessage\"]]\n\n        return {\n            \"ok\": True,\n            \"uptime_seconds\": round(uptime_seconds, 2),\n            \"memory_mb\": mem,\n            \"pid\": os.getpid(),\n            \"processes\": list_python_processes(),\n            \"active_downloads\": active_downloads,\n            \"error_messages\": error_messages\n        }\n    except Exception as e:\n        raise HTTPException(status_code=500, detail=str(e))\n\n\ndef self_memory_mb():\n    pid = os.getpid()\n    try:\n        if platform.system() == \"Windows\":\n            out = subprocess.check_output(\n                [\"tasklist\", \"/FI\", f\"PID eq {pid}\", \"/FO\", \"CSV\"],\n                text=True, errors=\"replace\"\n            )\n            line = out.splitlines()[1]\n            mem = line.split(\",\")[-1]\n            digits = re.sub(r\"\\D\", \"\", mem)\n            if not digits:\n                return None\n            return round(int(digits) / 1024, 2)\n        else:\n            with open(f\"/proc/{pid}/status\") as f:\n                for line in f:\n                    if line.startswith(\"VmRSS:\"):\n                        kb = int(line.split()[1])\n                        return round(kb / 1024, 2)\n            return None\n    except Exception:\n        return None\n\n\ndef list_python_processes():\n    if platform.system() != \"Windows\":\n        out = subprocess.check_output([\"ps\", \"-eo\", \"pid,comm\"], text=True)\n        procs = []\n        for line in out.splitlines()[1:]:\n            pid, name = line.strip().split(None, 1)\n            if name.lower().startswith(\"python\"):\n                procs.append({\"pid\": int(pid), \"name\": name})\n        return procs\n\n    ps = r\"\"\"\nGet-CimInstance Win32_Process -Filter \"Name LIKE 'python%'\" |\nSelect-Object ProcessId, Name |\nConvertTo-Json\n\"\"\".strip()\n\n    out = subprocess.check_output(\n        [\"powershell\", \"-NoProfile\", \"-ExecutionPolicy\", \"Bypass\", \"-Command\", ps],\n        text=True, encoding=\"utf-8\", errors=\"replace\"\n    ).strip()\n\n    if not out:\n        return []\n\n    data = json.loads(out)\n    if isinstance(data, dict):\n        data = [data]\n\n    return [{\"pid\": int(p[\"ProcessId\"]), \"name\": p[\"Name\"]} for p in data]\n\n\n#---------------- DB management ------------------------\n\ndef create_app_tables():\n    os.makedirs(os.path.dirname(db_path), exist_ok=True)\n\n    conn = connect_db()\n    cursor = conn.cursor()\n\n    cursor.execute(\"\"\"\n                   CREATE TABLE IF NOT EXISTS Users (\n                        Identifier TEXT NOT NULL PRIMARY KEY,\n                        Username TEXT NOT NULL UNIQUE,\n                        PasswordHash TEXT NOT NULL,\n                        CreatedAt TEXT NOT NULL)\"\"\")\n\n    cursor.execute(\"\"\"\n                   CREATE TABLE IF NOT EXISTS DownloadedMedias\n                   (\n                       Identifier TEXT NOT NULL PRIMARY KEY,\n                       UserIdentifier TEXT NOT NULL,\n                       Url TEXT,\n                       Title TEXT NOT NULL,\n                       MediaType TEXT NOT NULL,\n                       DownloadedAt TEXT,\n                       DownloadPath TEXT NOT NULL UNIQUE,\n                       IsPlayable BOOLEAN NOT NULL,\n                       FOREIGN KEY (UserIdentifier) REFERENCES Users (Identifier) ON DELETE CASCADE\n                   )\"\"\")\n\n    cursor.execute(\"\"\"\n                   CREATE TABLE IF NOT EXISTS Playlists\n                   (\n                       Identifier TEXT NOT NULL PRIMARY KEY,\n                       UserIdentifier TEXT NOT NULL,\n                       Name TEXT NOT NULL,\n                       Description TEXT,\n                       FOREIGN KEY (UserIdentifier) REFERENCES Users (Identifier) ON DELETE CASCADE\n                   )\"\"\")\n\n    cursor.execute(\"\"\"\n                   CREATE TABLE IF NOT EXISTS PlaylistMedias\n                   (\n                       PlaylistIdentifier TEXT NOT NULL,\n                       MediaIdentifier TEXT NOT NULL,\n                       Position INTEGER NOT NULL,\n                       PRIMARY KEY (PlaylistIdentifier, MediaIdentifier),\n                       FOREIGN KEY (PlaylistIdentifier) REFERENCES Playlists (Identifier) ON DELETE CASCADE,\n                       FOREIGN KEY (MediaIdentifier) REFERENCES DownloadedMedias (Identifier) ON DELETE CASCADE\n                   )\"\"\")\n\n    cursor.execute(\"\"\"\n                   CREATE TABLE IF NOT EXISTS Settings\n                   (\n                       Identifier TEXT NOT NULL PRIMARY KEY,\n                       UserIdentifier TEXT NOT NULL UNIQUE,\n                       DownloadPath TEXT NOT NULL,\n                       DarkModeEnabled BOOLEAN NOT NULL,\n                       ScanFolderOnStartup BOOLEAN NOT NULL,\n                       FOREIGN KEY (UserIdentifier) REFERENCES Users (Identifier) ON DELETE CASCADE\n                   )\"\"\")\n\n    conn.commit()\n    conn.close()\n\ndef connect_db():\n    conn = sqlite3.connect(db_path, timeout=20.0)\n    conn.execute(\"PRAGMA journal_mode=WAL\")\n    conn.execute(\"PRAGMA foreign_keys = ON\")\n    conn.execute(\"PRAGMA busy_timeout=5000\")\n    conn.row_factory = sqlite3.Row\n    return conn\n\nclass PlaylistModel(BaseModel):\n    Identifier: str\n    Name: str\n    Description: Optional[str] = None\n\nclass MediaModel(BaseModel):\n    Identifier: str\n    Url: str\n    MediaType: str\n    DownloadedAt: str\n    DownloadPath: str\n    IsPlayable: bool\n    Title: str\n\nclass PlaylistMediaModel(BaseModel):\n    PlaylistIdentifier: str\n    MediaIdentifier: str\n    Position: int\n\nclass SettingsModel(BaseModel):\n    Identifier: str\n    DownloadPath: str\n    DarkModeEnabled: bool\n    ScanFolderOnStartup: bool\n\nclass SaveUserDataRequest(BaseModel):\n    user_identifier: str\n    playlists: List[PlaylistModel]\n    medias: List[MediaModel]\n    playlist_medias: List[PlaylistMediaModel]\n    setting: SettingsModel\n\n\ndef save_user_data(request: SaveUserDataRequest):\n    user_identifier = request.user_identifier\n    playlists = request.playlists\n    medias = request.medias\n    playlist_medias = request.playlist_medias\n    setting = request.setting\n\n    conn = connect_db()\n    cursor = conn.cursor()\n\n    try:\n        for media in medias:\n            cursor.execute(\n                \"\"\"INSERT INTO DownloadedMedias \n                   (Identifier, UserIdentifier, Url, MediaType, DownloadedAt, DownloadPath, IsPlayable, Title)\n                   VALUES (?, ?, ?, ?, ?, ?, ?, ?)\n                   ON CONFLICT(Identifier) DO UPDATE SET\n                   Url = excluded.Url,\n                   MediaType = excluded.MediaType,\n                   DownloadedAt = excluded.DownloadedAt,\n                   DownloadPath = excluded.DownloadPath,\n                   IsPlayable = excluded.IsPlayable,\n                   Title = excluded.Title\"\"\",\n                (media.Identifier, user_identifier, media.Url, media.MediaType,\n                 media.DownloadedAt, media.DownloadPath, media.IsPlayable, media.Title)\n            )\n\n        for playlist in playlists:\n            cursor.execute(\n                \"\"\"INSERT INTO Playlists (Identifier, UserIdentifier, Name, Description)\n                   VALUES (?, ?, ?, ?) ON CONFLICT(Identifier) DO\n                UPDATE SET\n                    Name = excluded.Name,\n                    Description = excluded.Description\"\"\",\n                (playlist.Identifier, user_identifier, playlist.Name, playlist.Description)\n            )\n\n        for playlist_media in playlist_medias:\n            cursor.execute(\n                \"\"\"INSERT INTO PlaylistMedias (PlaylistIdentifier, MediaIdentifier, Position)\n                   VALUES (?, ?, ?) ON CONFLICT(PlaylistIdentifier, MediaIdentifier) DO\n                UPDATE SET\n                    Position = excluded.Position\"\"\",\n                (playlist_media.PlaylistIdentifier, playlist_media.MediaIdentifier, playlist_media.Position)\n            )\n\n        cursor.execute(\n            \"\"\"INSERT INTO Settings\n               (Identifier, UserIdentifier, DownloadPath, DarkModeEnabled, ScanFolderOnStartup)\n               VALUES (?, ?, ?, ?, ?) ON CONFLICT(Identifier) DO\n            UPDATE SET\n                DownloadPath = excluded.DownloadPath,\n                DarkModeEnabled = excluded.DarkModeEnabled,\n                ScanFolderOnStartup = excluded.ScanFolderOnStartup\"\"\",\n            (setting.Identifier, user_identifier, setting.DownloadPath,\n             setting.DarkModeEnabled, setting.ScanFolderOnStartup)\n        )\n\n        conn.commit()\n        conn.close()\n    except Exception as e:\n        raise fastapi.HTTPException(status_code=400, detail=str(e))\n\n@app.post(\"/save\")\nasync def handle_save_user_data(req: SaveUserDataRequest):\n\n    # Validiere user_identifier\n    if not req.user_identifier or len(req.user_identifier) > 100:\n        raise fastapi.HTTPException(status_code=400, detail=\"Invalid user identifier\")\n\n    # Validiere Größen (DoS Prevention)\n    if len(req.playlists) > 1000:\n        raise fastapi.HTTPException(status_code=400, detail=\"Too many playlists\")\n\n    if len(req.medias) > 10000:\n        raise fastapi.HTTPException(status_code=400, detail=\"Too many medias\")\n\n    try:\n        save_user_data(req)\n        log_queue.put_nowait(f\"[INFO] User data for '{req.user_identifier}' saved successfully\")\n        return {\"message\": \"User data saved successfully\"}\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error saving user data for '{req.user_identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n# ---------------- User Endpoints ----------------\n\ndef create_user(username: str, password: str, identifier: str, created_at: str):\n    conn = connect_db()\n    cursor = conn.cursor()\n\n    cursor.execute(\"\"\"INSERT INTO Users (Username, PasswordHash, Identifier, CreatedAt) VALUES (?, ?, ?, ?)\"\"\", (username, password, identifier, created_at))\n    conn.commit()\n    conn.close()\n\n@app.get(\"/get/user/{identifier}\", response_model=UserResponse)\nasync def get_users(identifier: str):\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT Identifier, Username, CreatedAt FROM Users WHERE Identifier = ?\", (identifier,))\n        row = cursor.fetchone()\n\n        if row is None:\n            cursor.execute(\"SELECT Identifier, Username, CreatedAt FROM Users WHERE Username = ?\", (identifier,))\n            row = cursor.fetchone()\n\n            if row is None:\n                conn.close()\n                log_queue.put_nowait(f\"[ERROR] User lookup failed for identifier/username '{identifier}'\")\n                raise fastapi.HTTPException(status_code=404, detail=\"User not found\")\n\n        conn.close()\n        log_queue.put_nowait(f\"[INFO] User '{identifier}' retrieved successfully\")\n        return dict(row)\n    except fastapi.HTTPException:\n        raise\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error retrieving user '{identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.get(\"/getall/users/{key}\", response_model=List[UserResponse])\nasync def get_all_users(key: str):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT Identifier, Username, CreatedAt FROM Users\")\n        rows = cursor.fetchall()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Retrieved {len(rows)} users\")\n        return [dict(row) for row in rows]\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error retrieving all users: {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.post(\"/create-tables/{key}\", response_model=MessageResponse)\nasync def create_table(key: str):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        create_app_tables()\n        log_queue.put_nowait(\"[INFO] Tables created successfully\")\n        return {\"message\": \"Tables created successfully\"}\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error creating tables: {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.post(\"/create/user/{key}\", response_model=CreateResponse)\nasync def handle_create_user_req(key: str, req: CreateUserRequest):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        identifier = str(uuid.uuid4())\n        username = req.username\n        password = req.password\n        created_at = datetime.now().isoformat()\n\n        password_hash = bcrypt.hashpw(password.encode(\"utf-8\"), bcrypt.gensalt()).decode(\"utf-8\")\n\n        create_user(username, password_hash, identifier, created_at)\n\n        log_queue.put_nowait(f\"[INFO] User '{username}' created successfully with id {identifier}\")\n        return {\"message\": \"User created successfully\", \"identifier\": identifier}\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error creating user '{req.username}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=400, detail=str(e))\n\n\n@app.post(\"/delete/user/{key}\", response_model=MessageResponse)\nasync def handle_delete_user_req(key: str, identifier: str):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"\"\"DELETE FROM Users WHERE Identifier = ?\"\"\", (identifier,))\n        conn.commit()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] User '{identifier}' deleted successfully\")\n        return {\"message\": \"User deleted successfully\"}\n    except Exception as e:\n        log_queue.p ", encoding=\"utf-8\") as f:\n        f.write(f\"PyScrapper create/delete Auth+Robustheitstest - {datetime.now()}\\n\")\n\n    log(\"=\" * 70)\n    log(f\"Skript: {Path(__file__).resolve()}\")\n    log(f\"Ziel:   {args.base_url}\")\n\n    admin_key = load_admin_key()\n    if not admin_key:\n        log(f\"ABBRUCH: ADMIN_KEY nicht in {ENV_FILE} gefunden.\")\n        sys.exit(2)\n    masked = admin_key[:3] + \"***\" + admin_key[-2:] if len(admin_key) > 5 else \"***\"\n    log(f\"ADMIN_KEY geladen (maskiert): {masked}\")\n\n    valid = {HEADER_NAME: admin_key}\n    passed = failed = noted = 0\n\n    def tally(ok):\n        nonlocal passed, failed, noted\n        if ok is True:\n            passed += 1\n        elif ok is False:\n            failed += 1\n        else:\n            noted += 1\n\n    # ================================================================\n    # EBENE 1 - AUTH: jeder Endpoint muss ohne/mit falschem Key ablehnen\n    # ================================================================\n    log(\"=\" * 70)\n    log(\"EBENE 1 - AUTH (kein Key / falscher Key -> 401 erwartet)\")\n\n    bad_key = {HEADER_NAME: \"definitiv-falscher-key\"}\n\n    # create-body-Endpoints\n    for ep in CREATE_BODY_ENDPOINTS:\n        b = VALID_BODIES.get(ep, {})\n        tally(run(args.base_url, f\"{ep} ohne Key\", ep, {}, \"unauth\", body=b))\n        time.sleep(0.15)\n        tally(run(args.base_url, f\"{ep} falscher Key\", ep, bad_key, \"unauth\", body=b))\n        time.sleep(0.15)\n\n    # delete-path-Endpoints\n    for ep in DELETE_PATH_ENDPOINTS:\n        tally(run(args.base_url, f\"{ep}{{id}} ohne Key\", ep, {}, \"unauth\",\n                  path_suffix=NONEXISTENT_ID))\n        time.sleep(0.15)\n        tally(run(args.base_url, f\"{ep}{{id}} falscher Key\", ep, bad_key, \"unauth\",\n                  path_suffix=NONEXISTENT_ID))\n        time.sleep(0.15)\n\n    # delete-body-Endpoints\n    for ep in DELETE_BODY_ENDPOINTS:\n        b = VALID_BODIES.get(ep, {})\n installieren: pip install requests\")\n    sys.exit(1)\n\n\nTESTS_DIR = Path(__file__).resolve().parent\nSERVER_DIR = TESTS_DIR.parent\nLOG_FILE = TESTS_DIR / \"crud_endpoint_test.log\"\nENV_FILE = SERVER_DIR / \".env\"\n\nHEADER_NAME = \"X-Admin-Key\"\n\n# Eine Identifier-Form, die garantiert nicht existiert (fuer Delete-Tests)\nNONEXISTENT_ID = \"00000000-dead-beef-0000-000000000000\"\n\n\n# --------------------------------------------------------------------------\n# ADMIN_KEY laden\n# --------------------------------------------------------------------------\ndef load_admin_key():\n    try:\n        from dotenv import dotenv_values\n        vals = dotenv_values(ENV_FILE)\n        if vals.get(\"ADMIN_KEY\"):\n            return vals[\"ADMIN_KEY\"]\n    except ImportError:\n        pass\n    if ENV_FILE.exists():\n        for raw in ENV_FILE.read_text(encoding=\"utf-8\").splitlines():\n            line = raw.strip()\n            if not line or line.startswith(\"#\") or \"=\" not in line:\n                continue\n            k, _, v = line.partition(\"=\")\n            if k.strip() == \"ADMIN_KEY\":\n                return v.strip().strip('\"').strip(\"'\")\n    return None\n\n\ndef log(msg, to_file=True):\n    line = f\"[{datetime.now().strftime('%Y-%m-%d %H:%M:%S')}] {msg}\"\n    print(line)\n    if to_file:\n        with open(LOG_FILE, \"a\", encoding=\"utf-8\") as f:\n            f.write(line + \"\\n\")\n\n\n# --------------------------------------------------------------------------\n# Endpoint-Definitionen. method_path baut die volle URL.\n# 'style' sagt, wie der kaputte Input reinkommt:\n#   \"body\"      -> JSON-Body (create-Endpoints + playlistmedia)\n#   \"path_id\"   -> Identifier im Pfad (delete user/playlist/media/settings)\n# --------------------------------------------------------------------------\n\n# Gueltige Beispiel-Bodies je create-Endpoint (Feldnamen exakt aus den\n# Request-Modellen). Werden fuer die AUTH-Tests als \"sonst valider\" Body\n# genutzt - die Datensaetze werden aber nie wirklich angelegt, weil ohne/mit\n# falschem Key vorher 401 kommt.\nVALID_BODIES = {\n    \"/create/user/\": {\n        \"username\": \"authtest_dummy\", \"password\": \"x\"},\n    \"/create/playlist/\": {\n        \"user_identifier\": NONEXISTENT_ID, \"name\": \"authtest\", \"description\": \"x\"},\n    \"/create/downloadedmedia\": {\n        \"user_identifier\": NONEXISTENT_ID, \"url\": \"https://example.com/x\",\n        \"mediatype\": \".mp3\", \"downloaded_at\": \"2026-01-01T00:00:00\",\n        \"download_path\": \"x\", \"is_playable\": True, \"title\": \"authtest\"},\n    \"/create/settings/\": {\n        \"user_identifier\": NONEXISTENT_ID, \"default_download_path\": \"x\",\n        \"dark_mode_enabled\": True, \"scan_folder_on_startup\": False},\n    \"/create/playlistmedia\": {\n        \"playlist_identifier\": NONEXISTENT_ID, \"media_identifier\": NONEXISTENT_ID},\n    \"/delete/playlistmedia\": {\n        \"playlist_identifier\": NONEXISTENT_ID, \"media_identifier\": NONEXISTENT_ID},\n}\n\n\n# create-Endpoints mit Body: hier testen wir kaputte Bodies\nCREATE_BODY_ENDPOINTS = [\n    \"/create/user/\",\n    \"/create/playlist/\",\n    \"/create/downloadedmedia\",\n    \"/create/settings/\",\n    \"/create/playlistmedia\",\n]\n\n# delete-Endpoints mit ID im Pfad\nDELETE_PATH_ENDPOINTS = [\n    \"/delete/user/\",\n    \"/delete/playlist/\",\n    \"/delete/downloadedmedia/\",\n    \"/delete/settings/\",\n]\n\n# delete mit Body\nDELETE_BODY_ENDPOINTS = [\n    \"/delete/playlistmedia\",\n]\n\n\n# Kaputte Bodies, die JEDER create-/body-Endpoint ablehnen sollte\nBAD_BODIES = [\n    (\"leerer Body\", {}),\n    (\"falsche Felder\", {\"foo\": \"bar\", \"banana\": 42}),\n    (\"null in Feldern\", {\"username\": None, \"user_identifier\": None,\n                         \"name\": None, \"url\": None, \"playlist_identifier\": None,\n                         \"media_identifier\": None}),\n    (\"falsche Typen\", {\"username\": 123, \"user_identifier\": [\"a\"],\n                       \"name\": {\"x\": 1}, \"is_playable\": \"nope\",\n                       \"playlist_identifier\": 999, \"media_identifier\": True}),\n    (\"riesige Strings\", {\"username\": \"A\" * 10000, \"name\": \"A\" * 10000,\n                         \"user_identifier\": \"A\" * 10000,\n                         \"playlist_identifier\": \"A\" * 10000,\n                         \"media_identifier\": \"A\" * 10000}),\n]\n\n\ndef evaluate(status, expectation):\n    if expectation == \"unauth\":\n        if status in (401, 403):\n            return True, f\"OK - {status} (Auth greift)\"\n        return False, (f\"PROBLEM - erwartete 401, bekam {status}. \"\n                       \"-> Endpoint NICHT durch Key geschuetzt!\")\n    if expectation == \"reject\":\n        if 400 <= status < 500:\n            return True, \"OK - korrekt abgelehnt (4xx)\"\n        if status >= 500:\n            return False, (\"PROBLEM - 5xx Crash statt sauberem 4xx. \"\n                           \"-> unbehandelter Fehler in der Validierung.\")\n        return False, (\"PROBLEM - 2xx akzeptiert, obwohl ablehnen erwartet. \"\n                       \"-> Luecke.\")\n    if expectation == \"note\":\n        return None, f\"NOTIZ - Status {status} (nur zur Info)\"\n    return None, f\"Status {status}\"\n\n\ndef call(base_url, endpoint, headers, body=None, path_suffix=\"\"):\n    url = f\"{base_url}{endpoint}{path_suffix}\"\n    return requests.post(url, json=body, headers=headers, timeout=10), url\n\n\ndef run(base_url, name, endpoint, headers, expectation,\n        body=None, path_suffix=\"\"):\n    log(\"-\" * 70)\n    log(f\"TEST: {name}\")\n    full = f\"{endpoint}{path_suffix}\"\n    log(f\"  POST {full}\")\n    if body is not None:\n        log(f\"  Body: {json.dumps(body, ensure_ascii=False)[:180]}\")\n    log(f\"  Header {HEADER_NAME}: {'gesetzt' if HEADER_NAME in headers else 'NICHT gesetzt'}\")\n\n    try:\n        resp, _ = call(base_url, y -> 401 erwartet)\")\n\n    bad_key = {HEADER_NAME: \"definitiv-falscher-key\"}\n\n    # create-body-Endpoints\n    for ep in CREATE_BODY_ENDPOINTS:\n        b = VALID_BODIES.get(ep, {})\n        tally(run(args.base_url, f\"{ep} ohne Key\", ep, {}, \"unauth\", body=b))\n        time.sleep(0.15)\n        tally(run(args.base_url, f\"{ep} falscher Key\", ep, bad_key, \"unauth\", body=b))\n        time.sleep(0.15)\n\n    # delete-path-Endpoints\n    for ep in DELETE_PATH_ENDPOINTS:\n        tally(run(args.base_url, f\"{ep}{{id}} ohne Key\", ep, {}, \"unauth\",\n                  path_suffix=NONEXISTENT_ID))\n        time.sleep(0.15)\n        tally(run(args.base_url, f\"{ep}{{id}} falscher Key\", ep, bad_key, \"unauth\",\n                  path_suffix=NONEXISTENT_ID))\n        time.sleep(0.15)\n\n    # delete-body-Endpoints\n    for ep in DELETE_BODY_ENDPOINTS:\n        b = VALID_BODIES.get(ep, {})\n        tally(run(args.base_url, f\"{ep} ohne Key\", ep, {}, \"unauth\", body=b))\n        time.sleep(0.15)\n        tally(run(args.base_url, f\"{ep} falscher Key\", ep, bad_key, \"unauth\", body=b))\n        time.sleep(0.15)\n\n    # ================================================================\n    # EBENE 2 - INPUT: mit gueltigem Key kaputte Bodies -> 4xx\n    # ================================================================\n    log(\"=\" * 70)\n    log(\"EBENE 2 - INPUT-VALIDIERUNG (gueltiger Key, kaputte Bodies)\")\n\n    try:\n        h = requests.get(f\"{args.base_url}/health\", headers=valid, timeout=5)\n        log(f\"Health-Check: HTTP {h.status_code}\")\n    except Exception:\n        log(\"WARNUNG: /health nicht erreichbar - laeuft der Server?\")\n\n    # create-body-Endpoints: alle BAD_BODIES durchspielen\n    for ep in CREATE_BODY_ENDPOINTS:\n        log(\"#\" * 50)\n        log(f\"# Endpoint: {ep}\")\n        for bad_name, bad_body in BAD_BODIES:\n            tally(run(args.base_url, f\"{ep} | {bad_name}\", ep, valid, \"reject\",\n                      body=bad_body))\n            time.sleep(0.15)\n\n    # delete-body-Endpoint (playlistmedia): kaputte Bodies\n    for ep in DELETE_BODY_ENDPOINTS:\n        log(\"#\" * 50)\n        log(f\"# Endpoint: {ep}\")\n        for bad_name, bad_body in BAD_BODIES:\n            tally(run(args.base_url, f\"{ep} | {bad_name}\", ep, valid, \"reject\",\n                      body=bad_body))\n            time.sleep(0.15)\n\n    # delete-path-Endpoints: Loeschen einer nicht-existenten ID.\n    # ACHTUNG: Deine Handler geben hier vermutlich 200 zurueck (SQLite\n    # loescht 0 Zeilen ohne Fehler). Das ist KEIN Bug, nur Verhalten ->\n    # daher als \"note\", nicht als \"reject\" bewertet.\n    log(\"#\" * 50)\n    log(\"# delete/{id} mit nicht-existenter ID (Verhalten, nicht Fehler)\")\n    for ep in DELETE_PATH_ENDPOINTS:\n        tally(run(args.base_url, f\"{ep}{{nonexistent}}\", ep, valid, \"note\",\n                  path_suffix=NONEXISTENT_ID))\n        time.sleep(0.15)\n\n    total = passed + failed + noted\n    log(\"=\" * 70)\n    log(f\"ZUSAMMENFASSUNG: {passed} wie erwartet, {failed} auffaellig, \"\n        f\"{noted} nur notiert (gesamt {total})\")\n    if failed:\n        log(\"-> Auffaellige Faelle oben pruefen.\")\n    log(f\"Volles Log: {LOG_FILE}\")\n\n    sys.exit(0 if failed == 0 else 1)\n\n\nif __name__ == \"__main__\":\n    main()", "loc": 332, "error": null}, {"path": "tests/download_tests.py", "name": "tests.download_tests", "doc": "download_endpoint_test.py\n--------------------------\nRobustheits- und Negativtest fuer den PyScrapper /download-Endpoint.\n\nLiegt in: LocalServer/tests/\nZweck: pruefen, ob die serverseitige Auth UND Input-Validierung halten.\n\nGetestet werden zwei Ebenen:\n  1. AUTH   - fehlender / falscher X-Admin-Key -> 401 erwartet\n  2. INPUT  - mit gueltigem Key: kaputter/unsinniger Body -> 4xx erwartet\n\nDer ADMIN_KEY wird aus LocalServer/.env geladen und als Header\n\"X-Admin-Key\" mitgeschickt.\n\nNutzung (aus beliebigem Verzeichnis, Pfade _CASES:\n        ok = run_case(args.base_url, name, payload, exp, valid_headers)\n        passed += ok\n        failed += not ok\n        time.sleep(0.2)\n\n    total = len(auth_cases) + len(INPUT_CASES)\n    log(\"=\" * 70)\n    log(f\"ZUSAMMENFASSUNG: {passed} wie erwartet, {failed} auffaellig (von {total})\")\n    if failed:\n        log(\"-> Auffaellige Faelle oben pruefen: echte Luecke oder Sonderfall.\")\n    log(f\"Volles Log: {LOG_FILE}\")\n\n    sys.exit(0 if failed == 0 else 1)", "is_method": false, "private": false, "dunder": false}], "source": "\"\"\"\ndownload_endpoint_test.py\n--------------------------\nRobustheits- und Negativtest fuer den PyScrapper /download-Endpoint.\n\nLiegt in: LocalServer/tests/\nZweck: pruefen, ob die serverseitige Auth UND Input-Validierung halten.\n\nGetestet werden zwei Ebenen:\n  1. AUTH   - fehlender / falscher X-Admin-Key -> 401 erwartet\n  2. INPUT  - mit gueltigem Key: kaputter/unsinniger Body -> 4xx erwartet\n\nDer ADMIN_KEY wird aus LocalServer/.env geladen und als Header\n\"X-Admin-Key\" mitgeschickt.\n\nNutzung (aus beliebigem Verzeichnis, Pfade sind skript-relativ):\n    python download_endpoint_test.py\n    python download_endpoint_test.py --base-url http://127.0.0.1:8765\n\"\"\"\n\nimport argparse\nimport json\nimport sys\nimport time\nfrom datetime import datetime\nfrom pathlib import Path\n\ntry:\n    import requests\nexcept ImportError:\n    print(\"Bitte 'requests' installieren: pip install requests\")\n    sys.exit(1)\n\n\n# --------------------------------------------------------------------------\n# Pfade - skript-relativ\n#   Skript:      LocalServer/tests/download_endpoint_test.py\n#   TESTS_DIR:   LocalServer/tests\n#   SERVER_DIR:  LocalServer      <- hier liegt die .env\n#   REPO_ROOT:   PyScrapper\n# --------------------------------------------------------------------------\nTESTS_DIR = Path(__file__).resolve().parent\nSERVER_DIR = TESTS_DIR.parent\nREPO_ROOT = SERVER_DIR.parent\nLOG_FILE = TESTS_DIR / \"download_endpoint_test.log\"\nENV_FILE = SERVER_DIR / \".env\"\n\nHEADER_NAME = \"X-Admin-Key\"\n\n\n# --------------------------------------------------------------------------\n# .env laden: ADMIN_KEY aus LocalServer/.env\n# Bevorzugt python-dotenv, faellt auf simplen Eigenparser zurueck.\n# --------------------------------------------------------------------------\ndef load_admin_key():\n    # 1) python-dotenv, falls installiert\n    try:\n        from dotenv import dotenv_values\n        vals = dotenv_values(ENV_FILE)\n        if vals.get(\"ADMIN_KEY\"):\n            return vals[\"ADMIN_KEY\"]\n    except ImportError:\n        pass\n\n    # 2) simpler Eigenparser\n    if ENV_FILE.exists():\n        for raw in ENV_FILE.read_text(encoding=\"utf-8\").splitlines():\n            line = raw.strip()\n            if not line or line.startswith(\"#\") or \"=\" not in line:\n                continue\n            key, _, val = line.partition(\"=\")\n            if key.strip() == \"ADMIN_KEY\":\n                # umschliessende Quotes entfernen\n                return val.strip().strip('\"').strip(\"'\")\n    return None\n\n\ndef log(msg, to_file=True):\n    line = f\"[{datetime.now().strftime('%Y-%m-%d %H:%M:%S')}] {msg}\"\n    print(line)\n    if to_file:\n        with open(LOG_FILE, \"a\", encoding=\"utf-8\") as f:\n            f.write(line + \"\\n\")\n\n\n# --------------------------------------------------------------------------\n# Ein gueltiger Basis-Payload (wird fuer die Auth-Tests wiederverwendet)\n# --------------------------------------------------------------------------\nVALID_PAYLOAD = {\n    \"provider\": \"youtube\",\n    \"url\": \"https://example.com/x\",\n    \"mediatype\": \".mp3\",\n    \"filename\": \"test\",\n}\n\n\n# --------------------------------------------------------------------------\n# INPUT-Testfaelle (jeweils MIT gueltigem Key gesendet)\n#   (name, payload, expectation)\n# --------------------------------------------------------------------------\nINPUT_CASES = [\n    (\"leerer Body\", {}, \"reject\"),\n    (\"voellig falsche Felder\", {\"foo\": \"bar\", \"banana\": 42}, \"reject\"),\n    (\"null-Werte in Pflichtfeldern\",\n     {\"provider\": None, \"url\": None, \"mediatype\": None, \"filename\": None}, \"reject\"),\n\n    (\"unbekannter Provider\",\n     {\"provider\": \"totallynotaprovider\", \"url\": \"https://example.com/x\",\n      \"mediatype\": \".mp3\", \"filename\": \"test\"}, \"reject\"),\n    (\"leerer Provider\",\n     {\"provider\": \"\", \"url\": \"https://example.com/x\",\n      \"mediatype\": \".mp3\", \"filename\": \"test\"}, \"reject\"),\n\n    (\"http statt https\",\n     {\"provider\": \"youtube\", \"url\": \"http://example.com/x\",\n      \"mediatype\": \".mp3\", \"filename\": \"test\"}, \"reject\"),\n    (\"gar keine URL, nur Text\",\n     {\"provider\": \"youtube\", \"url\": \"das ist keine url\",\n      \"mediatype\": \".mp3\", \"filename\": \"test\"}, \"reject\"),\n    (\"file://-Schema (lokaler Zugriff)\",\n     {\"provider\": \"youtube\", \"url\": \"file:///etc/passwd\",\n      \"mediatype\": \".mp3\", \"filename\": \"test\"}, \"reject\"),\n\n    (\"nicht erlaubter Media-Type\",\n     {\"provider\": \"youtube\", \"url\": \"https://example.com/x\",\n      \"mediatype\": \".exe\", \"filename\": \"test\"}, \"reject\"),\n\n    (\"Path-Traversal im Dateinamen\",\n     {\"provider\": \"youtube\", \"url\": \"https://example.com/x\",\n      \"mediatype\": \".mp3\", \"filename\": \"..\\\\..\\\\..\\\\windows\\\\system32\\\\evil\"}, \"reject\"),\n    (\"Path-Traversal unix-style\",\n     {\"provider\": \"youtube\", \"url\": \"https://example.com/x\",\n      \"mediatype\": \".mp3\", \"filename\": \"../../../../etc/cron.d/x\"}, \"reject\"),\n    (\"absoluter Pfad als Dateiname\",\n     {\"provider\": \"youtube\", \"url\": \"https://example.com/x\",\n      \"mediatype\": \".mp3\", \"filename\": \"C:\\\\Windows\\\\evil\"}, \"reject\"),\n    (\"Windows-Reserved-Name (CON)\",\n     {\"provider\": \"youtube\", \"url\": \"https://example.com/x\",\n      \"mediatype\": \".mp3\", \"filename\": \"CON\"}, \"reject\"),\n\n    (\"extrem langer Dateiname\",\n     {\"provider\": \"youtube\", \"url\": \"https://example.com/x\",\n      \"mediatype\": \".mp3\", \"filename\": \"A\" * 5000}, \"reject\"),\n    (\"falscher Typ (Zahl statt String)\",\n     {\"provider\": 12345, \"url\": [\"not\", \"a\", \"string\"],\n      \"mediatype\": True, \"filename\": {\"nested\": \"object\"}}, \"reject\"),\n]\n\n\n# --------------------------------------------------------------------------\n# HTTP-Aufruf\n# --------------------------------------------------------------------------\ndef post(base_url, payload, headers):\n    return requests.post(f\"{base_url}/download\", json=payload,\n                         headers=headers, timeout=10)\n\n\ndef evaluate(status, expectation):\n    \"\"\"Gibt (ok: bool, note: str) zurueck.\"\"\"\n    if expectation == \"reject\":\n        if 400 <= status < 500:\n            return True, \"OK - korrekt abgelehnt (4xx wie erwartet)\"\n        if status >= 500:\n            return False, (\"PROBLEM - Server-Crash (5xx). Sollte 4xx sein! \"\n                           \"-> Validierung faengt diesen Fall nicht sauber ab.\")\n        return False, (\"PROBLEM - Server hat AKZEPTIERT (2xx), obwohl er \"\n                       \"ablehnen sollte! -> Luecke.\")\n    if expectation == \"unauth\":\n        if status == 401:\n            return True, \"OK - 401 wie erwartet (Auth greift)\"\n        if status == 403:\n            return True, \"OK - 403 (Auth greift, wenn auch 403 statt 401)\"\n        return False, (f\"PROBLEM - erwartete 401, bekam {status}. \"\n                       \"-> Endpoint ist NICHT durch den Key geschuetzt!\")\n    # accept\n    if 200 <= status < 300:\n        return True, \"OK - korrekt angenommen (2xx wie erwartet)\"\n    return False, f\"unerwartet - erwartete 2xx, bekam {status}\"\n\n\ndef run_case(base_url, name, payload, expectation, headers):\n    log(\"-\" * 70)\n    log(f\"TEST: {name}\")\n    log(f\"  Payload: {json.dumps(payload, ensure_ascii=False)[:200]}\")\n    has_key = HEADER_NAME in headers\n    log(f\"  Header {HEADER_NAME}: {'gesetzt' if has_key else 'NICHT gesetzt'}\")\n\n    try:\n        resp = post(base_url, payload, headers)\n    except requests.exceptions.ConnectionError:\n        log(f\"  ERGEBNIS: FEHLER - Server nicht erreichbar auf {base_url}.\")\n        return False\n    except requests.exceptions.Timeout:\n        log(\"  ERGEBNIS: TIMEOUT - keine Antwort innerhalb 10s.\")\n        return False\n    except Exception as e:\n        log(f\"  ERGEBNIS: UNERWARTETER FEHLER - {type(e).__name__}: {e}\")\n        return False\n\n    body_preview = resp.text[:300].replace(\"\\n\", \" \")\n    log(f\"  HTTP {resp.status_code}  |  Body: {body_preview}\")\n    ok, note = evaluate(resp.status_code, expectation)\n    log(f\"  ERGEBNIS: {note}\")\n    return ok\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=\"Auth- und Robustheitstest fuer /download\")\n    parser.add_argument(\"--base-url\", default=\"http://127.0.0.1:8765\",\n                        help=\"Basis-URL (Default: http://127.0.0.1:8765)\")\n    args = parser.parse_args()\n\n    with open(LOG_FILE, \"w\", encoding=\"utf-8\") as f:\n        f.write(f\"PyScrapper /download Auth+Robustheitstest - {datetime.now()}\\n\")\n\n    log(\"=\" * 70)\n    log(f\"Skript:     {Path(__file__).resolve()}\")\n    log(f\"Server-Dir: {SERVER_DIR}\")\n    log(f\"Ziel:       {args.base_url}/download\")\n\n    admin_key = load_admin_key()\n    if not admin_key:\n        log(f\"ABBRUCH: ADMIN_KEY nicht in {ENV_FILE} gefunden. \"\n            \"Ohne Key koennen die Input-Tests nicht sinnvoll laufen \"\n            \"(alles wuerde 401 liefern).\")\n        sys.exit(2)\n    # Key nicht im Klartext loggen - nur bestaetigen und maskieren\n    masked = admin_key[:3] + \"***\" + admin_key[-2:] if len(admin_key) > 5 else \"***\"\n    log(f\"ADMIN_KEY aus .env geladen (maskiert): {masked}\")\n\n    valid_headers = {HEADER_NAME: admin_key}\n    passed = failed = 0\n\n    # ---- EBENE 1: AUTH -------------------------------------------------\n    log(\"=\" * 70)\n    log(\"EBENE 1 - AUTH (Endpoint muss ohne/mit falschem Key ablehnen)\")\n    auth_cases = [\n        (\"kein Key im Header\", VALID_PAYLOAD, {}, \"unauth\"),\n        (\"falscher Key\", VALID_PAYLOAD, {HEADER_NAME: \"definitiv-falscher-key\"}, \"unauth\"),\n        (\"leerer Key\", VALID_PAYLOAD, {HEADER_NAME: \"\"}, \"unauth\"),\n    ]\n    for name, payload, hdr, exp in auth_cases:\n        ok = run_case(args.base_url, name, payload, exp, hdr)\n        passed += ok\n        failed += not ok\n        time.sleep(0.2)\n\n    # ---- EBENE 2: INPUT-VALIDIERUNG (mit gueltigem Key) ---------------\n    log(\"=\" * 70)\n    log(\"EBENE 2 - INPUT-VALIDIERUNG (mit gueltigem Key)\")\n    # Health-Check\n    try:\n        h = requests.get(f\"{args.base_url}/health\",\n                         headers=valid_headers, timeout=5)\n        log(f\"Health-Check: HTTP {h.status_code}\")\n    except Exception:\n        log(\"WARNUNG: /health nicht erreichbar - laeuft der Server?\")\n\n    for name, payload, exp in INPUT_CASES:\n        ok = run_case(args.base_url, name, payload, exp, valid_headers)\n        passed += ok\n        failed += not ok\n        time.sleep(0.2)\n\n    total = len(auth_cases) + len(INPUT_CASES)\n    log(\"=\" * 70)\n    log(f\"ZUSAMMENFASSUNG: {passed} wie erwartet, {failed} auffaellig (von {total})\")\n    if failed:\n        log(\"-> Auffaellige Faelle oben pruefen: echte Luecke oder Sonderfall.\")\n    log(f\"Volles Log: {LOG_FILE}\")\n\n    sys.exit(0 if failed == 0 else 1)\n\n\nif __name__ == \"__main__\":\n    main()", "loc": 276, "error": null}, {"path": "tests/serach_tests.py", "name": "tests.serach_tests", "doc": "search_endpoint_test.py\n-----------------------\nRobustheits- und Negativtest fuer de "raises": [], "source": "def main():\n    parser = argparse.ArgumentParser(description=\"Auth- und Robustheitstest fuer /search\")\n    parser.add_argument(\"--base-url\", default=\"http://127.0.0.1:8765\",\n                        help=\"Basis-URL (Default: http://127.0.0.1:8765)\")\n    args = parser.parse_args()\n\n    with open(LOG_FILE, \"w\", encoding=\"utf-8\") as f:\n        f.write(f\"PyScrapper /search Auth+Robustheitstest - {datetime.now()}\\n\")\n\n    log(\"=\" * 70)\n    log(f\"Skript:     {Path(__file__).resolve()}\")\n    log(f\"Server-Dir: {SERVER_DIR}\")\n    log(f\"Ziel:       {args.base_url}/search\")\n\n    admin_key = load_admin_key()\n    if not admin_key:\n        log(f\"ABBRUCH: ADMIN_KEY nicht in {ENV_FILE} gefunden.\")\n        sys.exit(2)\n    masked = admin_key[:3] + \"***\" + admin_key[-2:] if len(admin_key) > 5 else \"***\"\n    log(f\"ADMIN_KEY aus .env geladen (maskiert): {masked}\")\n\n    valid_headers = {HEADER_NAME: admin_key}\n    passed = failed = noted = 0\n\n    # ---- EBENE 1: AUTH ------------------------------------------------\n    log(\"=\" * 70)\n    log(\"EBENE 1 - AUTH (Endpoint muss ohne/mit falschem Key ablehnen)\")\n    auth_cases = [\n        (\"kein Key im Header\", VALID_PAYLOAD, {}, \"unauth\"),\n        (\"falscher Key\", VALID_PAYLOAD, {HEADER_NAME: \"definitiv-falscher-key\"}, \"unauth\"),\n        (\"leerer Key\", VALID_PAYLOAD, {HEADER_NAME: \"\"}, \"unauth\"),\n    ]\n    for name, payload, hdr, exp in auth_cases:\n        ok = run_case(args.base_url, name, payload, exp, hdr)\n        if ok is True:\n            passed += 1\n        elif ok is False:\n            failed += 1\n        time.sleep(0.2)\n\n    # ---- EBENE 2: INPUT-VALIDIERUNG -----------------------------------\n    log(\"=\" * 70)\n    log(\"EBENE 2 - INPUT-VALIDIERUNG (mit gueltigem Key)\")\n    try:\n        h = requests.get(f\"{args.base_url}/health\",\n                         headers=valid_headers, timeout=5)\n        log(f\"Health-Check: HTTP {h.status_code}\")\n    except Exception:\n        log(\"WARNUNG: /health nicht erreichbar - laeuft der Server?\")\n\n    for name, payload, exp in INPUT_CASES:\n        ok = run_case(args.base_url, name, payload, exp, valid_headers)\n        if ok is True:\n            passed += 1\n        elif ok is False:\n            failed += 1\n        else:  # None -> note\n            noted += 1\n        time.sleep(0.2)\n\n    total = len(auth_cases) + len(INPUT_CASES)\n    log(\"=\" * 70)\n    log(f\"ZUSAMMENFASSUNG: {passed} wie erwartet, {failed} auffaellig, \"\n        f\"{noted} nur notiert (von {total})\")\n    if failed:\n        log(\"-> Auffaellige Faelle oben pruefen: echte Luecke oder Sonderfall.\")\n    log(f\"Volles Log: {LOG_FILE}\")\n\n    sys.exit(0 if failed == 0 else 1)", "is_method": false, "private": false, "dunder": false}], "source": "\"\"\"\nsearch_endpoint_test.py\n-----------------------\nRobustheits- und Negativtest fuer den PyScrapper /search-Endpoint.\n\nLiegt in: LocalServer/tests/\nZweck: pruefen, ob die serverseitige Auth UND Input-Validierung halten.\n\nGetestet werden zwei Ebenen:\n  1. AUTH   - fehlender / falscher X-Admin-Key -> 401 erwartet\n  2. INPUT  - mit gueltigem Key: kaputter/unsinniger Body -> 4xx erwartet\n\nDer ADMIN_KEY wird aus LocalServer/.env geladen und als Header\n\"X-Admin-Key\" mitgeschickt.\n\nHINWEIS: Ein GUELTIGER /search-Request loest eine echte externe Suche aus\n(YouTube/Bandcamp/Archive). Die Nonsense-Faelle hier sollen an der\nValidierung scheitern, BEVOR echtes Scraping passiert. Kommt ein Fall doch\nmit 2xx durch (und dauert lange), hat er echten Traffic erzeugt - das ist\ndann selbst ein Hinweis, dass die Validierung zu spaet greift.\n\nNutzung:\n    python search_endpoint_test.py\n    python search_endpoint_test.py --base-url http://127.0.0.1:8765\n\"\"\"\n\nimport argparse\nimport json\nimport sys\nimport time\nfrom datetime import datetime\nfrom pathlib import Path\n\ntry:\n    import requests\nexcept ImportError:\n    print(\"Bitte 'requests' installieren: pip install requests\")\n    sys.exit(1)\n\n\n# --------------------------------------------------------------------------\n# Pfade - skript-relativ (LocalServer/tests/)\n# --------------------------------------------------------------------------\nTESTS_DIR = Path(__file__).resolve().parent\nSERVER_DIR = TESTS_DIR.parent\nREPO_ROOT = SERVER_DIR.parent\nLOG_FILE = TESTS_DIR / \"search_endpoint_test.log\"\nENV_FILE = SERVER_DIR / \".env\"\n\nHEADER_NAME = \"X-Admin-Key\"\n\n\n# --------------------------------------------------------------------------\n# ADMIN_KEY aus LocalServer/.env laden\n# --------------------------------------------------------------------------\ndef load_admin_key():\n    try:\n        from dotenv import dotenv_values\n        vals = dotenv_values(ENV_FILE)\n        if vals.get(\"ADMIN_KEY\"):\n            return vals[\"ADMIN_KEY\"]\n    except ImportError:\n        pass\n\n    if ENV_FILE.exists():\n        for raw in ENV_FILE.read_text(encoding=\"utf-8\").splitlines():\n            line = raw.strip()\n            if not line or line.startswith(\"#\") or \"=\" not in line:\n                continue\n            key, _, val = line.partition(\"=\")\n            if key.strip() == \"ADMIN_KEY\":\n                return val.strip().strip('\"').strip(\"'\")\n    return None\n\n\ndef log(msg, to_file=True):\n    line = f\"[{datetime.now().strftime('%Y-%m-%d %H:%M:%S')}] {msg}\"\n    print(line)\n    if to_file:\n        with open(LOG_FILE, \"a\", encoding=\"utf-8\") as f:\n            f.write(line + \"\\n\")\n\n\n# --------------------------------------------------------------------------\n# Gueltiger Basis-Payload fuer die Auth-Tests.\n# Bewusst ein Provider mit funktionierender Suche (nicht suno).\n# --------------------------------------------------------------------------\nVALID_PAYLOAD = {\n    \"provider\": \"youtube\",\n    \"query\": \"test\",\n    \"mediatype\": \".mp3\",\n}\n\n\n# --------------------------------------------------------------------------\n# INPUT-Testfaelle (jeweils MIT gueltigem Key gesendet)\n#   (name, payload, expectation)\n# Feldnamen (provider/query/mediatype) ggf. an dein SearchRequest-Modell\n# anpassen - manche Backends nutzen \"search_query\" o.ae.\n# --------------------------------------------------------------------------\nINPUT_CASES = [\n    # ---- Voelliger Nonsense ------------------------------------------\n    (\"leerer Body\", {}, \"reject\"),\n    (\"voellig falsche Felder\", {\"foo\": \"bar\", \"banana\": 42}, \"reject\"),\n    (\"null-Werte in Pflichtfeldern\",\n     {\"provider\": None, \"query\": None, \"mediatype\": None}, \"reject\"),\n\n    # ---- Ungueltiger Provider ----------------------------------------\n    (\"unbekannter Provider\",\n     {\"provider\": \"totallynotaprovider\", \"query\": \"test\", \"mediatype\": \".mp3\"}, \"reject\"),\n    (\"leerer Provider\",\n     {\"provider\": \"\", \"query\": \"test\", \"mediatype\": \".mp3\"}, \"reject\"),\n\n    # ---- Query-spezifisch --------------------------------------------\n    (\"leere Query\",\n     {\"provider\": \"youtube\", \"query\": \"\", \"mediatype\": \".mp3\"}, \"reject\"),\n    (\"Query nur Whitespace\",\n     {\"provider\": \"youtube\", \"query\": \"     \", \"mediatype\": \".mp3\"}, \"reject\"),\n    (\"extrem lange Query\",\n     {\"provider\": \"youtube\", \"query\": \"A\" * 10000, \"mediatype\": \".mp3\"}, \"reject\"),\n\n    # ---- Ungueltiger Media-Type --------------------------------------\n    (\"nicht erlaubter Media-Type\",\n     {\"provider\": \"youtube\", \"query\": \"test\", \"mediatype\": \".exe\"}, \"reject\"),\n    (\"Media-Type fehlt ganz\",\n     {\"provider\": \"youtube\", \"query\": \"test\"}, \"reject\"),\n\n    # ---- Suno-Sonderfall (Suche ist Platzhalter) ---------------------\n    # Erwartung offen gelassen als \"note\": kann je nach Implementierung\n    # leeres 2xx oder ein 4xx sein. Wird nur protokolliert, nicht bewertet.\n    (\"suno-Suche (Platzhalter im Backend)\",\n     {\"provider\": \"suno\", \"query\": \"test\", \"mediatype\": \".mp3\"}, \"note\"),\n\n    # ---- Typfehler ---------------------------------------------------\n    (\"falscher Typ (Zahl/Liste/Objekt)\",\n     {\"provider\": 123, \"query\": [\"a\", \"b\"], \"mediatype\": {\"x\": 1}}, \"reject\"),\n\n    # ---- Injection-artige Query (soll als harmloser String behandelt\n    #      werden, nicht crashen) ---------------------------------------\n    (\"SQL-artige Zeichen in Query\",\n     {\"provider\": \"youtube\", \"query\": \"'; DROP TABLE Users;--\", \"mediatype\": \".mp3\"}, \"note\"),\n]\n\n\ndef post(base_url, payload, headers):\n    return requests.post(f\"{base_url}/search\", json=payload,\n                         headers=headers, timeout=20)\n\n\ndef evaluate(status, expectation):\n    \"\"\"Gibt (ok: bool|None, note: str). ok=None -> nur protokollieren.\"\"\"\n    if expectation == \"unauth\":\n        if status == 401:\n            return True, \"OK - 401 wie erwartet (Auth greift)\"\n        if status == 403:\n            return True, \"OK - 403 (Auth greift, wenn auch 403 statt 401)\"\n        return False, (f\"PROBLEM - erwartete 401, bekam {status}. \"\n                       \"-> Endpoint ist NICHT durch den Key geschuetzt!\")\n    if expectation == \"reject\":\n        if 400 <= status < 500:\n            return True, \"OK - korrekt abgelehnt (4xx wie erwartet)\"\n        if status >= 500:\n            return False, (\"PROBLEM - Server-Crash (5xx). Sollte 4xx sein! \"\n                           \"-> Validierung faengt diesen Fall nicht sauber ab.\")\n        return False, (\"PROBLEM - Server hat AKZEPTIERT (2xx), obwohl er \"\n                       \"ablehnen sollte! -> Luecke (evtl. echter Traffic ausgeloest).\")\n    if expectation == \"note\":\n        return None, f\"NOTIZ - Status {status}, nur zur Info (nicht bewertet)\"\n    # accept\n    if 200 <= status < 300:\n        return True, \"OK - korrekt angenommen (2xx wie erwartet)\"\n    return False, f\"unerwartet - erwartete 2xx, bekam {status}\"\n\n\ndef run_case(base_url, name, payload, expectation, headers):\n    log(\"-\" * 70)\n    log(f\"TEST: {name}\")\n    log(f\"  Payload: {json.dumps(payload, ensure_ascii=False)[:200]}\")\n    log(f\"  Header {HEADER_NAME}: {'gesetzt' if HEADER_NAME in headers else 'NICHT gesetzt'}\")\n\n    t0 = time.time()\n    try:\n        resp = post(base_url, payload, headers)\n    except requests.exceptions.ConnectionError:\n        log(f\"  ERGEBNIS: FEHLER - Server nicht erreichbar auf {base_url}.\")\n        return False\n    except requests.exceptions.Timeout:\n        log(\"  ERGEBNIS: TIMEOUT - keine Antwort innerhalb 20s \"\n            \"(evtl. echte Suche ausgeloest).\")\n        return False\n    except Exception as e:\n        log(f\"  ERGEBNIS: UNERWARTETER FEHLER - {type(e).__name__}: {e}\")\n        return False\n\n    dt = time.time() - t0\n    body_preview = resp.text[:300].replace(\"\\n\", \" \")\n    log(f\"  HTTP {resp.status_code}  ({dt:.2f}s)  |  Body: {body_preview}\")\n    if dt > 3.0 and 200 <= resp.status_code < 300:\n        log(\"  HINWEIS: langsame 2xx-Antwort -> hier lief vermutlich eine \"\n            \"echte externe Suche.\")\n\n    ok, note = evaluate(resp.status_code, expectation)\n    log(f\"  ERGEBNIS: {note}\")\n    return ok  # kann True/False/None sein\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=\"Auth- und Robustheitstest fuer /search\")\n    parser.add_argument(\"--base-url\", default=\"http://127.0.0.1:8765\",\n                        help=\"Basis-URL (Default: http://127.0.0.1:8765)\")\n    args = parser.parse_args()\n\n    with open(LOG_FILE, \"w\", encoding=\"utf-8\") as f:\n        f.write(f\"PyScrapper /search Auth+Robustheitstest - {datetime.now()}\\n\")\n\n    log(\"=\" * 70)\n    log(f\"Skript:     {Path(__file__).resolve()}\")\n    log(f\"Server-Dir: {SERVER_DIR}\")\n    log(f\"Ziel:       {args.base_url}/search\")\n\n    admin_key = load_admin_key()\n    if not admin_key:\n        log(f\"ABBRUCH: ADMIN_KEY nicht in {ENV_FILE} gefunden.\")\n        sys.exit(2)\n    masked = admin_key[:3] + \"***\" + admin_key[-2:] if len(admin_key) > 5 else \"***\"\n    log(f\"ADMIN_KEY aus .env geladen (maskiert): {masked}\")\n\n    valid_headers = {HEADER_NAME: admin_key}\n    passed = failed = noted = 0\n\n    # ---- EBENE 1: AUTH ------------------------------------------------\n    log(\"=\" * 70)\n    log(\"EBENE 1 - AUTH (Endpoint muss ohne/mit falschem Key ablehnen)\")\n    auth_cases = [\n        (\"kein Key im Header\", VALID_PAYLOAD, {}, \"unauth\"),\n        (\"falscher Key\", VALID_PAYLOAD, {HEADER_NAME: \"definitiv-falscher-key\"}, \"unauth\"),\n        (\"leerer Key\", VALID_PAYLOAD, {HEADER_NAME: \"\"}, \"unauth\"),\n    ]\n    for name, payload, hdr, exp in auth_cases:\n        ok = run_case(args.base_url, name, payload, exp, hdr)\n        if ok is True:\n            passed += 1\n        elif ok is False:\n            failed += 1\n        time.sleep(0.2)\n\n    # ---- EBENE 2: INPUT-VALIDIERUNG -----------------------------------\n    log(\"=\" * 70)\n    log(\"EBENE 2 - INPUT-VALIDIERUNG (mit gueltigem Key)\")\n    try:\n        h = requests.get(f\"{args.base_url}/health\",\n                         headers=valid_headers, timeout=5)\n        log(f\"Health-Check: HTTP {h.status_code}\")\n    except Exception:\n        log(\"WARNUNG: /health nicht erreichbar - laeuft der Server?\")\n\n    for name, payload, exp in INPUT_CASES:\n        ok = run_case(args.base_url, name, payload, exp, valid_headers)\n        if ok is True:\n            passed += 1\n        elif ok is False:\n            failed += 1\n        else:  # None -> note\n            noted += 1\n        time.sleep(0.2)\n\n    total = len(auth_cases) + len(INPUT_CASES)\n    log(\"=\" * 70)\n    log(f\"ZUSAMMENFASSUNG: {passed} wie erwartet, {failed} auffaellig, \"\n        f\"{noted} nur notiert (von {total})\")\n    if failed:\n        log(\"-> Auffaellige Faelle oben pruefen: echte Luecke oder Sonderfall.\")\n    log(f\"Volles Log: {LOG_FILE}\")\n\n    sys.exit(0 if failed == 0 else 1)\n\n\nif __name__ == \"__main__\":\n    main()", "loc": 279, "error": null}], "xref": {"cleanup_loop": [["server.py", "lifespan"]], "create_app_tables": [["server.py", "lifespan"], ["server.py", "create_table"], ["serverBak.py", "lifespan"], ["serverBak.py", "create_table"]], "logger": [["server.py", "lifespan"], ["serverBak.py", "lifespan"]], "cleanup_server": [["server.py", "cleanup_loop"]], "post": [["server.py", "receive_command"], ["server.py", "receive_download"], ["server.py", "receive_search"], ["server.py", "handle_save_user_data"], ["server.py", "handle_set_logged_in"], ["server.py", "handle_set_last_logged_in"], ["server.py", "create_table"], ["server.py", "handle_create_user_req"], ["server.py", "handle_delete_user_req"], ["server.py", "handle_create_playlist_req"], ["server.py", "handle_delete_playlist_req"], ["server.py", "handle_create_downloaded_media_req"], ["server.py", "handle_delete_downloaded_media_req"], ["server.py", "handle_create_setting_req"], ["server.py", "handle_delete_setting_req"], ["server.py", "handle_create_playlist_media_req"], ["server.py", "handle_delete_playlist_media_req"], ["server.py", "handle_login_req"], ["server.py", "handle_register_req"], ["server.py", "handle_logout_req"], ["serverBak.py", "receive_command"], ["serverBak.py", "receive_download"], ["serverBak.py", "receive_search"], ["serverBak.py", "handle_save_user_data"], ["serverBak.py", "create_table"], ["serverBak.py", "handle_create_user_req"], ["serverBak.py", "handle_delete_user_req"], ["serverBak.py", "handle_create_playlist_req"], ["serverBak.py", "handle_delete_playlist_req"], ["serverBak.py", "handle_create_downloaded_media_req"], ["serverBak.py", "handle_delete_downloaded_media_req"], ["serverBak.py", "handle_create_setting_req"], ["serverBak.py", "  H698\" stroke-width=\"1.2\"/><\/svg><\/div>\n<h2 id=\"aufbau\">Was wo liegt<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Datei<\/th><th>Rolle<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"mono\"><a class=\"x\" href=\"#/m/server.py\">server.py<\/a><\/td>\n<td>Die gesamte Anwendung: Zustand, Auth, alle 38 Routen, SQLite-Zugriff<\/td><\/tr>\n<tr><td class=\"mono\"><a class=\"x\" href=\"#/m/serverBak.py\">serverBak.py<\/a><\/td>\n<td>Ältere Fassung ohne Streaming und ohne <span class=\"mono\">ServerState<\/span>. Wird nicht geladen.<\/td><\/tr>\n<tr><td class=\"mono\">tests/<\/td><td>Drei eigenständige Skripte, die gegen einen laufenden Server prüfen<\/td><\/tr>\n<tr><td class=\"mono\">scripts/startServer.ps1<\/td><td>Startet uvicorn, bevorzugt das venv im Serverordner<\/td><\/tr>\n<tr><td class=\"mono\">installer/server-installer.iss<\/td><td>Inno-Setup-Skript für den Windows-Installer<\/td><\/tr>\n<tr><td class=\"mono\">.env<\/td><td>Enthält <span class=\"mono\">ADMIN_KEY<\/span>. Nicht Teil dieser Doku.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n\n<h2 id=\"zustand\">Der Zustand<\/h2>\n<p>Ein einziges globales <a class=\"x\" href=\"#/m/server.py#ServerState\">ServerState<\/a>-Objekt hält\nalles Flüchtige. Es überlebt keinen Neustart — Downloadjobs sind bewusst nicht persistent.<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Feld<\/th><th>Bedeutung<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"mono\">jobs<\/td><td>task_id → ServerJob, darin die Kontexte und die Streamjobs<\/td><\/tr>\n<tr><td class=\"mono\">log_queue<\/td><td>Warteschlange für 5000 Zeilen, ein Task schreibt sie in die Logdatei<\/td><\/tr>\n<tr><td class=\"mono\">download_limiter<\/td><td>Semaphore, maximal 10 parallele Downloads<\/td><\/tr>\n<tr><td class=\"mono\">search_limiter<\/td><td>Semaphore, maximal 10 parallele Suchen<\/td><\/tr>\n<tr><td class=\"mono\">quit_event<\/td><td>Wird vom <span class=\"mono\">/command<\/span>-Endpoint gesetzt<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><span class=\"mono\">cleanup_loop()<\/span> läuft im Hintergrund, prüft alle zehn Minuten und wirft\nJobs weg, die älter als 24 Stunden sind. Einzelne Streams räumt\n<span class=\"mono\">cleanup_download()<\/span> zeitversetzt nach dem Abruf auf.<\/p>\n\n<h2 id=\"auth\">Authentifizierung<\/h2>\n<p>Jeder Endpoint ausser <span class=\"mono\">GET /<\/span>,\n<span class=\"mono\">POST /command<\/span> und den Streamrouten verlangt den Header\n<span class=\"mono\">X-Admin-Key<\/span>. Der Vergleich läuft über\n<span class=\"mono\">secrets.compare_digest<\/span>, ist also nicht zeitanfällig.<\/p>\n<div class=\"note risk\"><b>Der Schlüssel schützt nicht die Streamrouten<\/b>\n<p>Alle <code>/stream/...<\/code>-Routen und <code>/download/progress/...<\/code> haben keine\nAbhängigkeit auf <code>require_admin<\/code>, weil ein <code>&lt;video&gt;<\/code>-Tag keine eigenen\nHeader setzen kann. Wer eine gültige <code>task_id<\/code> und <code>stream_id<\/code> kennt, kommt\nohne Schlüssel an den Inhalt. Beide sind UUIDs, das ist der einzige Schutz.<\/p>\n<p>Dazu kommt die CORS-Konfiguration: <code>allow_origins=[\"*\"]<\/code> zusammen mit\n<code>allow_credentials=True<\/code>. Browser lehnen diese Kombination ohnehin ab, und für einen\nDienst auf localhost ist eine feste Origin-Liste angebracht.<\/p><\/div>\n<\/div>", "endpoints": "<div class=\"wrap\">\n<div class=\"crumb\">LocalServer / API<\/div>\n<h1>Endpoints<\/h1>\n<p class=\"lede\">38 Routen, alle in <span class=\"mono\">server.py<\/span>. Zeile anklicken\nfür Parameter, Antwortmodell und Sprung in den Quelltext.<\/p>\n<div class=\"epfilter\">\n  <span class=\"pill on\" data-f=\"*\">alle 38<\/span>\n  <span class=\"pill\" data-f=\"Download &amp; Streaming\">Download &amp; Streaming 6<\/span><span class=\"pill\" data-f=\"Suche\">Suche 1<\/span><span class=\"pill\" data-f=\"Auth\">Auth 3<\/span><span class=\"pill\" data-f=\"CRUD\">CRUD 25<\/span><span class=\"pill\" data-f=\"System\">System 3<\/span>\n  <span class=\"pill\" data-f
