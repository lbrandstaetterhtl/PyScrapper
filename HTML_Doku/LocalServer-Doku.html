<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>pyscrapper/server :: doc</title>
<style>
*,*::before,*::after{box-sizing:border-box}

/* ============================================================ palette
   dark = default. base is a deep desaturated ink with a cool cast,
   never pure black. accents are a semantic ANSI-derived set: each
   symbol kind owns a hue, so colour carries information.            */
:root, html[data-theme="dark"]{
  --bg:#0B100F; --panel:#101614; --panel2:#151D1A; --panel3:#1B2521;
  --line:#1F2C27; --line2:#2C3D36; --line3:#3D5249;
  --fg:#CBD8D1; --fg2:#8FA298; --fg3:#74897E;
  --grn:#5BD97A; --cyn:#4FD3D3; --mag:#EE7BC8; --yel:#E0B44E;
  --vio:#AC92FF; --red:#FF7373; --blu:#77A9FF; --org:#F09A4B;
  --sel:#1B2E28; --caret:#5BD97A;
  --code:#0D1312; --gutter:#3D5249;
  --tk-k:#EE7BC8; --tk-s:#5BD97A; --tk-c:#4E6259; --tk-n:#E0B44E;
  --tk-d:#F09A4B; --tk-b:#4FD3D3; --tk-def:#AC92FF;
  --glow:0 0 12px rgba(91,217,122,.22);
  --scan:rgba(255,255,255,.014);
}
html[data-theme="light"]{
  --bg:#F2F1EC; --panel:#FBFAF7; --panel2:#EFEEE8; --panel3:#E4E3DC;
  --line:#DCDAD1; --line2:#C4C2B7; --line3:#A6A498;
  --fg:#1B211F; --fg2:#4E5754; --fg3:#68716D;
  --grn:#1E7A3C; --cyn:#0E6E74; --mag:#A4267E; --yel:#8A6206;
  --vio:#5B3FBF; --red:#B32626; --blu:#1D53BF; --org:#A85C10;
  --sel:#DDEADF; --caret:#1E7A3C;
  --code:#F7F6F1; --gutter:#A6A498;
  --tk-k:#A4267E; --tk-s:#1E7A3C; --tk-c:#8D948F; --tk-n:#8A6206;
  --tk-d:#A85C10; --tk-b:#0E6E74; --tk-def:#5B3FBF;
  --glow:none; --scan:rgba(0,0,0,.012);
}
:root{
  --mono:"Cascadia Mono","JetBrains Mono","SF Mono","SFMono-Regular",ui-monospace,
         Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;
  --sans:"Inter","Segoe UI Variable Text","Segoe UI",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --hdr:46px; --bar:26px;
}

html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);
     font-size:13.5px;line-height:1.6;-webkit-font-smoothing:antialiased;
     font-variant-ligatures:none;overflow:hidden}
/* faint scanline wash - the only decorative layer, deliberately near-invisible */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:200;
  background:repeating-linear-gradient(to bottom,var(--scan) 0 1px,transparent 1px 3px)}
a{color:inherit;text-decoration:none}
a.x{color:var(--cyn);border-bottom:1px dotted currentColor}
a.x:hover{background:var(--sel);border-bottom-style:solid}
:focus-visible{outline:1px solid var(--grn);outline-offset:2px}
::selection{background:var(--sel);color:var(--fg)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line2);border:2px solid var(--bg);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--line3)}

/* ============================================================ header */
.top{position:relative;z-index:60;display:flex;align-items:center;gap:14px;height:var(--hdr);
     padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line2)}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .sig{color:var(--grn);text-shadow:var(--glow)}
.brand b{font-size:13.5px;font-weight:600;letter-spacing:-.01em;color:var(--fg)}
.brand span{font-size:11px;color:var(--fg3)}
.searchwrap{position:relative;flex:1;max-width:560px;display:flex;align-items:center;
  background:var(--panel2);border:1px solid var(--line2);height:30px;padding:0 8px;border-radius:3px}
.searchwrap:focus-within{border-color:var(--line3);box-shadow:var(--glow)}
.searchwrap .ps{color:var(--grn);font-size:12.5px;margin-right:7px;user-select:none}
#q{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--fg);
   font-family:var(--mono);font-size:12.5px;outline:none;padding:0}
#q::placeholder{color:var(--fg3)}
.searchwrap .kbd{display:flex;gap:4px;margin-left:8px}
kbd{font-size:10px;padding:1px 5px;border:1px solid var(--line2);border-radius:2px;
    color:var(--fg3);background:var(--panel3)}
.topright{margin-left:auto;display:flex;align-items:center;gap:8px}
.tbtn{height:26px;padding:0 9px;border:1px solid var(--line2);background:var(--panel2);
      color:var(--fg2);border-radius:3px;font-size:11.5px;cursor:pointer;font-family:var(--mono);
      transition:background .12s,color .12s,border-color .12s}
.tbtn:hover{background:var(--panel3);color:var(--fg);border-color:var(--line3)}

/* ============================================================ results */
#results{position:absolute;top:34px;left:-1px;right:-1px;max-height:66vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line3);border-radius:3px;
  box-shadow:0 18px 46px rgba(0,0,0,.5);display:none;z-index:70}
#results.on{display:block}
.res{display:flex;gap:9px;align-items:center;padding:5px 10px;cursor:pointer;font-size:12.5px}
.res.sel{background:var(--sel);box-shadow:inset 2px 0 0 var(--grn)}
.res .nm{color:var(--fg)}
.res .pt{margin-left:auto;font-size:11px;color:var(--fg3);
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:48%}
.res .hl{color:var(--grn);font-weight:600}
.nores{padding:12px;color:var(--fg3);font-size:12.5px}

/* ============================================================ shell */
.shell{display:grid;grid-template-columns:280px minmax(0,1fr) 214px;
       height:calc(100vh - var(--hdr) - var(--bar))}
.side{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:10px 0 40px}
.main{overflow:auto;padding:0 0 90px;background:var(--bg)}
.toc{overflow:auto;border-left:1px solid var(--line);padding:18px 12px 40px}
.wrap{max-width:880px;margin:0 auto;padding:24px 28px}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.wrap{animation:fadein .16s ease-out}

/* ============================================================ status bar */
.statusbar{position:fixed;bottom:0;left:0;right:0;height:var(--bar);z-index:80;
  display:flex;align-items:center;background:var(--panel);
  border-top:1px solid var(--line2);font-size:11px;color:var(--fg3)}
.statusbar .seg{padding:0 11px;height:100%;display:flex;align-items:center;
  border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusbar .seg.mode{color:var(--bg);background:var(--grn);font-weight:700;letter-spacing:.06em;
  border-right:0}
html[data-theme="light"] .statusbar .seg.mode{color:#FBFAF7}
.statusbar .seg.path{color:var(--fg2);flex:0 1 auto;min-width:0}
.statusbar .spacer{flex:1}
.statusbar .seg.keys{border-right:0;border-left:1px solid var(--line);color:var(--fg3)}
.statusbar .seg.keys b{color:var(--fg2);font-weight:600}

/* ============================================================ sidebar */
.navsec{padding:2px 10px 8px}
.navsec h4{margin:8px 0 5px;font-size:10.5px;color:var(--fg3);font-weight:600;letter-spacing:.08em}
.navsec h4::before{content:"-- ";color:var(--line3)}
.navlink{display:block;padding:3px 9px;font-size:12.5px;color:var(--fg2);border-radius:2px;
         transition:background .1s,color .1s}
.navlink::before{content:"  ";white-space:pre}
.navlink:hover{background:var(--panel2);color:var(--fg)}
.navlink.act{background:var(--sel);color:var(--fg)}
.navlink.act::before{content:"> ";color:var(--grn)}
.tree{padding:0 6px}
.dir{margin:0}
.dirhead{display:flex;align-items:center;gap:5px;padding:2px 8px;cursor:pointer;
         font-size:12px;color:var(--fg2);border-radius:2px}
.dirhead:hover{background:var(--panel2);color:var(--fg)}
.dirhead .car{width:8px;color:var(--fg3);transition:transform .12s}
.dir.closed>.dirkids{display:none}
.dir.closed .car{transform:rotate(-90deg)}
.dirkids{padding-left:9px;border-left:1px solid var(--line);margin-left:11px}
.modlink{display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:2px;
         font-size:12px;color:var(--fg2);transition:background .1s,color .1s}
.modlink:hover{background:var(--panel2);color:var(--fg)}
.modlink.act{background:var(--sel);color:var(--fg);box-shadow:inset 2px 0 0 var(--cyn)}
.modlink .cnt{margin-left:auto;font-size:10px;color:var(--fg3)}
.filterbox{padding:0 10px 8px}
#navfilter{width:100%;height:25px;padding:0 8px;border:1px solid var(--line2);border-radius:3px;
           background:var(--panel2);color:var(--fg);font-family:var(--mono);font-size:11.5px;outline:none}
#navfilter:focus{border-color:var(--line3)}

/* ============================================================ type */
h1{font-size:24px;line-height:1.2;letter-spacing:-.02em;margin:0 0 4px;font-weight:600;color:var(--fg)}
h1::before{content:"$ ";color:var(--grn);font-weight:400}
h2{font-size:15px;margin:34px 0 10px;font-weight:600;color:var(--fg);
   padding-bottom:5px;border-bottom:1px solid var(--line2);letter-spacing:0}
h2::before{content:"## ";color:var(--fg3);font-weight:400}
h3{font-size:13.5px;margin:22px 0 7px;font-weight:600;color:var(--fg)}
h3::before{content:"# ";color:var(--fg3);font-weight:400}
p{margin:0 0 11px;max-width:70ch;color:var(--fg2);font-family:var(--sans);font-size:14px;line-height:1.62}
p strong{color:var(--fg);font-weight:600}
.lede{font-size:14.5px;color:var(--fg2);max-width:68ch}
ul,ol{max-width:70ch;color:var(--fg2);padding-left:18px;font-family:var(--sans);font-size:14px}
li{margin:3px 0}
li::marker{color:var(--fg3)}
.crumb{font-size:11.5px;color:var(--fg3);margin-bottom:9px}
.crumb::before{content:"~/";color:var(--line3)}
.mono,code{font-family:var(--mono)}
p .mono,li .mono,td .mono{font-size:12.5px;color:var(--fg)}

/* ============================================================ badges */
.b{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;
   letter-spacing:.02em;color:var(--fg3)}
.b::before{content:"["}
.b::after{content:"]"}
.b-class{color:var(--vio)} .b-func{color:var(--grn)} .b-enum{color:var(--yel)}
.b-data{color:var(--cyn)} .b-route{color:var(--mag)} .b-const{color:var(--fg3)}
.b-pyd{color:var(--blu)} .b-err{color:var(--red)} .b-mod{color:var(--fg3)}
.b-async{color:var(--blu)} .b-priv{color:var(--fg3)} .b-abs{color:var(--org)}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}

/* ============================================================ symbols */
.sym{border:1px solid var(--line);background:var(--panel);margin:12px 0;border-radius:3px;
     scroll-margin-top:60px;transition:border-color .12s}
.sym:hover{border-color:var(--line2)}
.sym.cls{box-shadow:inset 0 2px 0 var(--vio)}
.sym.fnc{box-shadow:inset 0 2px 0 var(--grn)}
.sym.enm{box-shadow:inset 0 2px 0 var(--yel)}
.sym.dcl{box-shadow:inset 0 2px 0 var(--cyn)}
.sym.pyd{box-shadow:inset 0 2px 0 var(--blu)}
.sym.rte{box-shadow:inset 0 2px 0 var(--mag)}
.symhead{display:flex;align-items:center;gap:9px;padding:10px 12px 4px;flex-wrap:wrap}
.symname{font-size:14px;font-weight:600;color:var(--fg)}
.symname .own{color:var(--fg3);font-weight:400}
.sigline{font-size:12px;color:var(--fg2);padding:0 12px 9px;white-space:pre-wrap;word-break:break-word}
.sigline .pn{color:var(--fg)}
.sigline .an{color:var(--cyn)}
.sigline .dv{color:var(--org)}
.sigline .rt{color:var(--vio)}
.symbody{padding:0 12px 11px}
.doc{background:var(--panel2);border-left:2px solid var(--line3);padding:7px 10px;
     font-size:12.5px;color:var(--fg2);white-space:pre-wrap;margin:0 0 9px;border-radius:0 3px 3px 0}
.tag{font-size:11px;padding:0 6px;border:1px solid var(--line2);border-radius:2px;
     background:var(--panel2);color:var(--fg2);line-height:17px;transition:border-color .1s,color .1s}
a.tag:hover{color:var(--fg);border-color:var(--line3)}
.tag.warn{border-color:var(--org);color:var(--org);background:transparent}

/* ============================================================ tables */
.tbl-wrap{border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--panel);
          margin:8px 0 12px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin:0}
th{text-align:left;font-weight:600;color:var(--fg3);font-size:10.5px;letter-spacing:.05em;
   padding:5px 9px;background:var(--panel2);border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:5px 9px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--fg2)}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel2)}
td.mono,th.mono{font-size:12.5px}
td .req{color:var(--red)}
.tbl-wrap+p,.tbl-wrap+h2,.tbl-wrap+h3{margin-top:14px}

/* ============================================================ code */
.srcbtn{font-family:var(--mono);font-size:11px;color:var(--fg3);background:var(--panel2);
        border:1px solid var(--line2);border-radius:2px;padding:1px 8px;cursor:pointer;
        transition:color .1s,border-color .1s}
.srcbtn::before{content:"> "}
.srcbtn:hover{color:var(--grn);border-color:var(--line3)}
pre.code{margin:0;background:var(--code);border:1px solid var(--line);border-radius:3px;
  overflow:auto;font-size:12px;line-height:1.55;max-height:600px}
pre.code.full{max-height:none}
.code table{margin:0;border:0;width:auto;min-width:100%;background:transparent}
.code td{border:0;padding:0;color:var(--fg);background:transparent}
.code tbody tr:hover td{background:var(--panel2)}
.code td.ln{width:1%;text-align:right;padding:0 11px;color:var(--gutter);
  user-select:none;font-size:11px;white-space:pre;position:sticky;left:0;
  background:var(--code);border-right:1px solid var(--line)}
.code td.cd{padding:0 16px 0 11px;white-space:pre}
.code tr.hit td.cd{background:var(--sel)}
.code tr.hit td.ln{color:var(--grn)}
.tk-k{color:var(--tk-k)} .tk-s{color:var(--tk-s)} .tk-c{color:var(--tk-c);font-style:italic}
.tk-n{color:var(--tk-n)} .tk-d{color:var(--tk-d)} .tk-b{color:var(--tk-b)}
.tk-def{color:var(--tk-def);font-weight:600}
.hidden{display:none}

/* ============================================================ callouts */
.note{border:1px solid var(--line2);border-left:2px solid var(--blu);background:var(--panel);
      padding:9px 12px;border-radius:0 3px 3px 0;margin:12px 0;font-size:13px;color:var(--fg2)}
.note b{display:block;color:var(--fg);margin-bottom:2px;font-size:12.5px;font-family:var(--mono)}
.note b::before{content:"! ";color:inherit}
.note p{margin:0 0 7px;font-size:13.5px;max-width:68ch}
.note p:last-child{margin:0}
.note code{background:var(--panel3);padding:0 4px;border-radius:2px;font-size:12px;color:var(--fg)}
.note.warn{border-left-color:var(--org)} .note.warn b{color:var(--org)}
.note.risk{border-left-color:var(--red)} .note.risk b{color:var(--red)}

/* ============================================================ overview */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);
       border-radius:3px;overflow:hidden;background:var(--panel);margin:18px 0 22px}
.stat{padding:10px 13px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:21px;letter-spacing:-.02em;color:var(--grn);
        font-weight:600;text-shadow:var(--glow)}
.stat span{font-size:10.5px;color:var(--fg3)}
.hero{border:1px solid var(--line);border-radius:3px;background:var(--panel);
      padding:4px 8px 0;margin:18px 0}
.hero svg{width:100%;height:auto;display:block}
.svg-box{fill:var(--panel2);stroke:var(--line3)}
.svg-t{fill:var(--fg);font-family:var(--mono);font-size:10.5px}
.svg-s{fill:var(--fg3);font-family:var(--mono);font-size:9px}
.svg-l{stroke:var(--line3);fill:none}
.svg-ar{fill:var(--line3)}

/* ============================================================ endpoints */
.epfilter{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0 8px}
.pill{font-size:11.5px;padding:1px 9px;border-radius:2px;cursor:pointer;
      border:1px solid var(--line2);background:var(--panel);color:var(--fg2);
      transition:background .1s,color .1s,border-color .1s}
.pill:hover{border-color:var(--line3);color:var(--fg)}
.pill.on{background:var(--grn);color:var(--bg);border-color:var(--grn);font-weight:600}
html[data-theme="light"] .pill.on{color:#FBFAF7}
#epq{width:100%;height:28px;padding:0 9px;border:1px solid var(--line2);border-radius:3px;
     background:var(--panel2);color:var(--fg);font-family:var(--mono);font-size:12px;
     margin-bottom:8px;outline:none}
#epq:focus{border-color:var(--line3)}
.ep{border:1px solid var(--line);border-radius:3px;background:var(--panel);margin:5px 0;
    overflow:hidden;transition:border-color .12s}
.ep:hover{border-color:var(--line2)}
.ephead{display:flex;align-items:center;gap:10px;padding:6px 11px;cursor:pointer}
.ephead:hover{background:var(--panel2)}
.m{font-size:10.5px;font-weight:700;padding:0 6px;border-radius:2px;line-height:17px;
   min-width:46px;text-align:center;border:1px solid currentColor}
.m-GET{color:var(--blu)} .m-POST{color:var(--grn)} .m-DELETE{color:var(--red)}
.m-PUT{color:var(--yel)} .m-PATCH{color:var(--yel)}
.eppath{font-size:12.5px;color:var(--fg)}
.eppath .prm{color:var(--mag)}
.epfn{margin-left:auto;font-size:11.5px;color:var(--fg3)}
.epbody{padding:0 11px 11px;border-top:1px solid var(--line)}

/* ============================================================ toc */
.toc h5{margin:0 0 7px;font-size:10.5px;color:var(--fg3);font-weight:600;letter-spacing:.06em}
.toc h5::before{content:"-- ";color:var(--line3)}
.toc a{display:block;padding:2px 0 2px 8px;font-size:11.5px;color:var(--fg3);
       border-left:1px solid var(--line2);overflow:hidden;text-overflow:ellipsis;
       white-space:nowrap;transition:color .1s,border-color .1s}
.toc a:hover{color:var(--fg2);border-left-color:var(--line3)}
.toc a.lvl2{padding-left:17px;font-size:11px}

@media(max-width:1180px){.shell{grid-template-columns:250px minmax(0,1fr)}.toc{display:none}}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .side.open{display:block;position:fixed;top:var(--hdr);left:0;bottom:var(--bar);width:262px;z-index:50}
  .wrap{padding:18px 14px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .brand span{display:none}
  .statusbar .seg.keys{display:none}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
@media print{.side,.toc,.top,.statusbar,body::after{display:none}
  .shell{display:block;height:auto}body{overflow:visible}}
</style>
</head>
<body>
<header class="top">
  <button class="tbtn" id="burger" aria-label="Navigation">&#9776;</button>
  <div class="brand"><span class="sig">&#9608;</span><b>pyscrapper/server</b>
    <span>LocalServer</span></div>
  <div class="searchwrap">
    <span class="ps">server $</span>
    <input id="q" type="search" placeholder="grep symbol — module, klasse, funktion, endpoint"
           autocomplete="off" spellcheck="false" aria-label="Suche">
    <div class="kbd"><kbd>/</kbd><kbd>^K</kbd></div>
    <div id="results"></div>
  </div>
  <div class="topright"><button class="tbtn" id="theme">light</button></div>
</header>
<div class="shell">
  <nav class="side">
    <div class="navsec"><h4>doc</h4><a class="navlink" href="#/overview">überblick</a><a class="navlink" href="#/endpoints">endpoints</a><a class="navlink" href="#/db">datenbank</a><a class="navlink" href="#/ops">betrieb</a></div>
    <div class="navsec"><h4>tree</h4></div>
    <div class="filterbox"><input id="navfilter" placeholder="filter pfad" spellcheck="false"></div>
    <div class="tree" id="tree"></div>
  </nav>
  <main class="main" id="main"></main>
  <aside class="toc" id="toc"></aside>
</div>
<footer class="statusbar">
  <span class="seg mode" id="stmode">DOC</span>
  <span class="seg path" id="stpath">-</span>
  <span class="seg" id="stinfo">-</span>
  <span class="spacer"></span>

E CASCADE,\n                       FOREIGN KEY (MediaIdentifier) REFERENCES DownloadedMedias (Identifier) ON DELETE CASCADE\n                   )\"\"\")\n\n    cursor.execute(\"\"\"\n                   CREATE TABLE IF NOT EXISTS Settings\n                   (\n                       Identifier TEXT NOT NULL PRIMARY KEY,\n                       UserIdentifier TEXT NOT NULL UNIQUE,\n                       DownloadPath TEXT NOT NULL,\n                       DarkModeEnabled BOOLEAN NOT NULL,\n                       ScanFolderOnStartup BOOLEAN NOT NULL,\n                       FOREIGN KEY (UserIdentifier) REFERENCES Users (Identifier) ON DELETE CASCADE\n                   )\"\"\")\n\n    conn.commit()\n    conn.close()", "is_method": false, "private": false, "dunder": false}, {"kind": "function", "name": "connect_db", "qualname": "connect_db", "async": false, "signature": "()", "params": [], "returns": null, "doc": null, "decorators": [], "route": null, "lineno": 1011, "end_lineno": 1017, "calls": ["conn.execute", "sqlite3.connect"], "raises": [], "source": "def connect_db():\n    conn = sqlite3.connect(db_path, timeout=20.0)\n    conn.execute(\"PRAGMA journal_mode=WAL\")\n    conn.execute(\"PRAGMA foreign_keys = ON\")\n    conn.execute(\"PRAGMA busy_timeout=5000\")\n    conn.row_factory = sqlite3.Row\n    return conn", "is_method": false, "private": false, "dunder": false}, {"kind": "function", "name": "save_user_data", "qualname": "save_user_data", "async": false, "signature": "(request: SaveUserDataRequest)", "params": [{"name": "request", "annotation": "SaveUserDataRequest", "default": null, "kind": "pos"}], "returns": null, "doc": null, "decorators": [], "route": null, "lineno": 1052, "end_lineno": 1170, "calls": ["','.join", "conn.close", "conn.commit", "conn.cursor", "conn.rollback", "connect_db", "cursor.execute", "cursor.fetchone", "fastapi.HTTPException", "server_state.log_queue.put_nowait", "str"], "raises": ["fastapi.HTTPException"], "source": "def save_user_data(request: SaveUserDataRequest):\n    user_identifier = request.user_identifier\n    playlists = request.playlists\n    medias = request.medias\n    playlist_medias = request.playlist_medias\n    setting = request.setting\n\n    conn = connect_db()\n    cursor = conn.cursor()\n\n    try:\n        # ---- 1. Medias upserten ----\n        for media in medias:\n            cursor.execute(\n                \"\"\"INSERT INTO DownloadedMedias \n                   (Identifier, UserIdentifier, Url, MediaType, DownloadedAt, DownloadPath, IsPlayable, Title)\n                   VALUES (?, ?, ?, ?, ?, ?, ?, ?)\n                   ON CONFLICT(Identifier) DO UPDATE SET\n                   Url = excluded.Url,\n                   MediaType = excluded.MediaType,\n                   DownloadedAt = excluded.DownloadedAt,\n                   DownloadPath = excluded.DownloadPath,\n                   IsPlayable = excluded.IsPlayable,\n                   Title = excluded.Title\"\"\",\n                (media.Identifier, user_identifier, media.Url, media.MediaType,\n                 media.DownloadedAt, media.DownloadPath, media.IsPlayable, media.Title)\n            )\n\n        # ---- 2. Playlists upserten ----\n        for playlist in playlists:\n            cursor.execute(\n                \"\"\"INSERT INTO Playlists (Identifier, UserIdentifier, Name, Description)\n                   VALUES (?, ?, ?, ?) ON CONFLICT(Identifier) DO\n                UPDATE SET\n                    Name = excluded.Name,\n                    Description = excluded.Description\"\"\",\n                (playlist.Identifier, user_identifier, playlist.Name, playlist.Description)\n            )\n\n        # ---- 3. Verwaiste Medias löschen (die in der DB sind, aber nicht mehr im Request) ----\n        # CASCADE entfernt automatisch zugehörige PlaylistMedias-Einträge.\n        media_ids = [m.Identifier for m in medias]\n        if media_ids:\n            placeholders = \",\".join(\"?\" for _ in media_ids)\n            cursor.execute(\n                f\"\"\"DELETE FROM DownloadedMedias\n                    WHERE UserIdentifier = ?\n                      AND Identifier NOT IN ({placeholders})\"\"\",\n                (user_identifier, *media_ids)\n            )\n        else:\n            # Request enthält gar keine Medias -> alle des Users löschen\n            cursor.execute(\n                \"DELETE FROM DownloadedMedias WHERE UserIdentifier = ?\",\n                (user_identifier,)\n            )\n\n        # ---- 4. Verwaiste Playlists löschen ----\n        playlist_ids = [p.Identifier for p in playlists]\n        if playlist_ids:\n            placeholders = \",\".join(\"?\" for _ in playlist_ids)\n            cursor.execute(\n                f\"\"\"DELETE FROM Playlists\n                    WHERE UserIdentifier = ?\n                      AND Identifier NOT IN ({placeholders})\"\"\",\n                (user_identifier, *playlist_ids)\n            )\n        else:\n            cursor.execute(\n                \"DELETE FROM Playlists WHERE UserIdentifier = ?\",\n                (user_identifier,)\n            )\n\n        # ---- 5. PlaylistMedias komplett neu setzen ----\n        # Alle PlaylistMedias der (jetzt noch existierenden) Playlists dieses Users löschen...\n        cursor.execute(\n            \"\"\"DELETE FROM PlaylistMedias\n               WHERE PlaylistIdentifier IN (\n                   SELECT Identifier FROM Playlists WHERE UserIdentifier = ?\n               )\"\"\",\n            (user_identifier,)\n        )\n        # ...und aus dem Request neu einfügen. Nur Einträge, deren Parents wirklich existieren.\n        for pm in playlist_medias:\n            cursor.execute(\"SELECT 1 FROM Playlists WHERE Identifier = ?\", (pm.PlaylistIdentifier,))\n            if cursor.fetchone() is None:\n                server_state.log_queue.put_nowait(f\"[WARN] Skipping PlaylistMedia, missing Playlist parent: {pm.PlaylistIdentifier}\")\n                continue\n\n            cu ": true, "signature": "(req: requests.RegisterRequest)", "params": [{"name": "req", "annotation": "requests.RegisterRequest", "default": null, "kind": "pos"}], "returns": null, "doc": null, "decorators": ["app.post('/register', dependencies=[Security(require_admin)])"], "route": {"method": "POST", "path": "/register", "decorator": "app.post('/register', dependencies=[Security(require_admin)])"}, "lineno": 1803, "end_lineno": 1816, "calls": ["Security", "app.post", "fastapi.HTTPException", "handle_create_user_req", "requests.CreateUserRequest", "server_state.log_queue.put_nowait", "str"], "raises": ["fastapi.HTTPException"], "source": "async def handle_register_req(req: requests.RegisterRequest):\n    try:\n\n        create_user_req = requests.CreateUserRequest(username=req.username, password=req.password)\n        response = await handle_create_user_req(create_user_req)\n\n        if response:\n            server_state.log_queue.put_nowait(f\"[INFO] User '{req.username}' registered successfully\")\n            return {\"message\": \"User registered successfully\", \"identifier\": response[\"identifier\"]}\n    except fastapi.HTTPException:\n        raise\n    except Exception as e:\n        server_state.log_queue.put_nowait(f\"[ERROR] Error during registration for user '{req.username}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))", "is_method": false, "private": false, "dunder": false}, {"kind": "function", "name": "handle_logout_req", "qualname": "handle_logout_req", "async": true, "signature": "(identifier: str)", "params": [{"name": "identifier", "annotation": "str", "default": null, "kind": "pos"}], "returns": null, "doc": null, "decorators": ["app.post('/logout/{identifier}', dependencies=[Security(require_admin)])"], "route": {"method": "POST", "path": "/logout/{identifier}", "decorator": "app.post('/logout/{identifier}', dependencies=[Security(require_admin)])"}, "lineno": 1821, "end_lineno": 1836, "calls": ["Security", "app.post", "conn.close", "conn.commit", "conn.cursor", "connect_db", "cursor.execute", "fastapi.HTTPException", "server_state.log_queue.put_nowait", "str"], "raises": ["fastapi.HTTPException"], "source": "async def handle_logout_req(identifier: str):\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"\"\"UPDATE Users\n                          SET LoggedIn = 0\n                          WHERE Identifier = ?\"\"\", (identifier,))\n        conn.commit()\n        conn.close()\n\n        server_state.log_queue.put_nowait(f\"[INFO] User '{identifier}' logged out successfully\")\n        return {\"message\": \"Logout successful\"}\n    except Exception as e:\n        server_state.log_queue.put_nowait(f\"[ERROR] Error during logout for user '{identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))", "is_method": false, "private": false, "dunder": false}], "source": "#Python Default Imports\nimport sys\nimport os\nfrom datetime import datetime\nimport platform, subprocess\nimport  time, re, json, uuid\n\nfrom dataclasses import dataclass, field\n\nimport os\nprint(\"DISPLAY:\", os.environ.get(\"DISPLAY\"))\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nimport asyncio\nimport sqlite3\nimport secrets\nfrom typing import Optional, List\n\n#Python Pip Imports\nfrom uvicorn import lifespan\n\nfrom fastapi.security import APIKeyHeader\n\n\nimport fastapi\nfrom dotenv import load_dotenv\nimport bcrypt\nfrom fastapi import FastAPI, HTTPException, Query, Depends, Security, Request, Response\nfrom fastapi.middleware.cors import CORSMiddleware\nfrom pydantic import BaseModel\n\nfrom fastapi.responses import StreamingResponse\n\n\n#PythonModule imports\n\nfrom PythonModule.models.responses import (\n    MessageResponse,\n    CreateResponse,\n    CreatePlaylistMediaResponse,\n    LoginResponse,\n    PlaylistResponse,\n    DownloadedMediaResponse,\n    SettingsResponse,\n    PlaylistMediaResponse,\n    UserResponse\n)\n\nfrom PythonModule.models import requests as requests\nfrom PythonModule.models import responses as responses\nfrom PythonModule.models import settings\n\nimport PythonModule.core as core\nfrom PythonModule.core.network import file, html\n\nimport PythonModule.providers.models as providermodels\nfrom PythonModule.core.network.Session import Session\n\n\n\n\nfrom PythonModule.serverservices import commandProcessor, searchProcessor, utils\n\n\nfrom contextlib import asynccontextmanager\n\n\n\n@dataclass\nclass ServerStream:\n    stream_id: str\n    context: core.models.Download.DownloadContext\n\n    segments: list | None = None\n    audio_segments: list | None = None\n\n\n\n\n@dataclass\nclass ServerJob:\n    job_id: str\n\n    download_information: core.models.Download.DownloadInformation\n\n    creation_timestamp: float\n\n    stream_jobs : dict[str, ServerStream] = field(default_factory=dict)\n\n\n\n\n@dataclass\nclass ServerState: \n    jobs: dict[str, ServerJob] = field(default_factory=dict)\n\n    log_queue: asyncio.Queue = field(\n        default_factory=lambda: asyncio.Queue(maxsize=5000)\n    )\n\n    quit_event: asyncio.Event = field(\n        default_factory=lambda: asyncio.Event()\n    )\n\n    download_limiter: asyncio.Semaphore = field(\n        default_factory=lambda: asyncio.Semaphore(10)\n    )\n\n    search_limiter: asyncio.Semaphore = field(\n        default_factory=lambda: asyncio.Semaphore(10)\n    )\n\n    download_path : str = field(\n        default_factory=lambda: os.path.dirname(__file__)\n    )\n\n\n\n#Global Variables\ncurrent_path = os.path.dirname(os.path.abspath(__file__))\nproject_root = os.path.dirname(current_path)\ndb_path = os.path.join(current_path, \"Data\", \"data.db\")\n\n\n\nenv_path = os.path.join(current_path, \".env\")\nload_dotenv(dotenv_path=env_path)\n\nADMIN_KEY = os.getenv(\"ADMIN_KEY\")\n\nlog_dir = os.path.join(project_root, \"LocalServer\", \"logs\")\nlog_file = os.path.join(log_dir, \"server_runtime.log\")\n\ncookie_path = os.path.join(project_root, \"LocalServer\", \"cookies\")\n\nos.makedirs(cookie_path, exist_ok=True)\nos.makedirs(log_dir, exist_ok=True)\n\n\n\n\n\nadmin_key_header = APIKeyHeader(name=\"X-Admin-Key\", auto_error=False)\n\n\ndef require_admin(key: str | None = Security(admin_key_header)) -> bool:\n    # compare_digest = konstante Laufzeit -> kein Timing-Angriff\n    if not key or not secrets.compare_digest(key, ADMIN_KEY):\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n    return True\n\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    \n\n    logger_task = asyncio.create_task(\n        logger(server_state.quit_event, server_state.log_queue)\n    )\n\n    cleanup_task = asyncio.create_task(\n        cleanup_loop()\n    )\n\n    server_state.log_queue.put_nowait(\"[INFO] Server started successfully\")\n\n    create_app_tables()\n    yield\n    cleanup_task.cancel()\n    logger_task.cancel()\n\napp = FastAPI(lifespan=lifespan)\n\n\napp.add_middleware(\n    CORSMiddleware,\n    allow_origins=[\n        \"*\"\n    ],\n    allow_credentials=True,\n    allow_methods=[\"*\"],\n    allow_headers=[\"*\"],\n    expose_headers=[\"Content-Disposition\"]\n)\n\nserver_state = ServerState(\n    download_path=os.path.join(project_root, \"downloads\")\n)\n\n#\"http://localhost:5173\",\n #       \"http://127.0.0.1:5173\"\n\n\n\nasync def logger(quit_event: asyncio.Event, log_queue: asyncio.Queue):\n    global log_file\n\n    while not quit_event.is_set():\n        try:\n            message = await log_queue.get()\n\n            if not isinstance(message, str):\n                message = json.dumps(message, ensure_ascii=False)\n\n            timestamp = datetime.now().strftime(\"%Y-%m-%d_%H-%M-%S\")\n\n            with open(log_file, \"a\", encoding=\"utf-8\") as f:\n                f.write(f\"[{str(timestamp)}] \" + message + \"\\n\")\n\n        except asyncio.CancelledError:\n            break\n        except Exception as e:\n            print(e)\n\n\n\n\n@app.get(\"/\")\nasync def root():\n    return {\n        \"message\": \"Server startup successful!\",\n    }\n\n\n#'@app.on_event(\"startup\")\n#async def startup_event():\n #   global quit_event, log_queue\n#\n #   asyncio.create_task(logger(quit_event, log_queue))\n  #  log_queue.put_nowait(\"[INFO] Server started successfully\")\n   # create_app_tables()\n\nasync def cleanup_server(CLEANUP_AFTER_SECONDS):\n    now = time.monotonic()\n\n\n    for job_id, job in list(server_state.jobs.items()):\n        if now - job.creation_timestamp > CLEANUP_AFTER_SECONDS:\n            server_state.jobs.pop(job_id, None)\n\n    server_state.log_queue.put_nowait(\"[INFO] ended server cleanup!\")\n\n\n\nasync def cleanup_download(\n        delay: float,\n        *,\n        task_id: str,\n        stream_id: str | None = None\n):\n    await asyncio.sleep(delay)\n\n    job = server_state.jobs.get(task_id)\n\n    if job is None: return\n\n    if stream_id is None:\n        server_state.jobs.pop(task_id, None)\n        return\n\n    job.stream_jobs.pop(stream_id, None)\n\n    job.download_information.contexts = [\n        context for context in job.download_information.contexts\n        if context.context_id != stream_id\n    ]\n\n    if (\n        not job.stream_jobs\n        and not job.download_information.contexts\n    ):\n        server_state.jobs.pop(task_id, None)\n\n\nasync def cleanup_loop():\n    try:\n        CHECK_INTERVAL = 60 * 10\n        JOB_AGE_LIMIT = 24 * 60 * 60\n\n        while True:\n            await cleanup_server(JOB_AGE_LIMIT)\n            await asyncio.sleep(CHECK_INTERVAL)\n\n    except asyncio.QueueFull:\n        pass\n\n\n \n\n\n\n\n@app.post(\"/command\")\nasync def receive_command(data: requests.CommandRequest):\n    global log_file\n    try:\n        await commandProcessor.CommandProcessor(\n            command=data.command,\n            logFile=log_file,\n            logQueue=server_state.log_queue,\n            quitEvent=server_state.quit_event\n        ).run()\n\n        server_state.log_queue.put_nowait(f\"[INFO] Command '{data.command}' executed successfully\")\n\n    except Exception as e:\n        server_state.log_queue.put_nowait(f\"[ERROR] Error handling command {data.command}.\\nError Message: {str(e)}\")\n        raise HTTPException(status_code=500, detail=str(e))\n\n\n\n\nasync def _resolve_provider(request, searchFunc):\n    async with server_state.search_limiter:\n        result: providermodels.ProviderResult = await asyncio.to_thread(\n            searchFunc,\n            request\n        )\n        return result\n\n\n\nasync def _resolveMediaAndCreateContexts(\n        data: requests.DownloadRequest,\n        session: Session,\n        task_id: str,\n        ):\n    \n    searchFunc = _resolveProviderSearchFunction(data.provider)\n    \n    contexts : list[core.models.Download.DownloadContext] = []\n\n    tasks = []\n    \n    for url, filename in zip(data.urls, data.filenames):\n        \n        request = providermodels.ProviderResultRequest(\n            url,\n            ses=session,\n            extra_headers=data.extra_headers,\n            preferred_file=data.preferred_file,\n            preferred_type=data.preferred_type\n        )\n        tasks.append(_resolve_provider(request, searchFunc))\n\n    results = await asyncio.gather(*tasks)\n\n    for result, url, filename in zip(\n        results,\n        data.urls,\n        data.filenames\n    ):\n        result : providermodels.ProviderResult\n        target = core.models.Download.DownloadTarget(\n            url=url,\n            resolved_url=result.url,\n            download_type=result.download_type,\n            extra_headers=result.extra_headers,\n            post_body=result.post_body\n        )\n\n        info = core.models.Download.MediaInfo(\n            mime_type=result.mime_type,\n            file_extension=result.file_ending,\n            total_size=result.total_size\n        )\n\n        outputTarget = core.models.Download.OutputTarget(\n            full_filename=f\"{filename}.{result.file_ending}\",\n            download_path=data.download_path\n        )\n\n        context = core.models.Download.DownloadContext(\n            context_id=f\"{task_id}-{filename}\",\n            target=target,\n            media_info=info,\n            output=outputTarget,\n            info=result.info,\n            \n        )\n\n        contexts.append(context)\n            \n            \n\n    return contexts\n\n\n\n        \n\ndef _resolveProviderSearchFunction(provider: str) -> callable:\n\n    providerResolved:settings.ProviderTypes = utils.validateProviders(provider)\n\n    if providerResolved is None:\n        raise core.models.errors.TaskFailedError(\n            task=\"/download/video-audio/\",\n            reason=\"Invalid provider string was given that couldn't be resolved\",\n            caller=\"server/download/video-audio\"\n        )\n\n    func = settings.PROVIDER_GETRESULTS_MAPPING.get(providerResolved)\n\n    if func is None:\n        raise core.models.errors.TaskFailedError(\n            task=\"/download/video-audio/\",\n            reason=f\"Couldn't map provider {providerResolved} to a function\",\n            caller=\"server/download/video-audio\"\n        )\n\n    return func\n\n\nasync def _run_local_download(\n    task_id: str,\n    downloader: core.download.Dispatcher.DownloadDispatcher,\n    convert: bool = False\n):\n    try:\n        await downloader.downloadToFile()\n        if convert is True:\n            raise ValueError(\"Converting isn't supported yet\")\n\n    except Exception as e:\n        server_state.log_queue.put_nowait(\n            f\"[ERROR] Download job {task_id} failed: {e}\"\n        )\n        raise e\n\n\n\n\n@app.post(\"/download/video-audio\", dependencies=[Depends(require_admin)])\nasync def receive_download(data: requests.DownloadRequest):\n#Settings and creation\n    global server_state\n    taskId = str(uuid.uuid4())\n    ses = Session()\n\n    try:\n\n        contexts : list[core.models.Download.DownloadContext] = await _resolveMediaAndCreateContexts(data, ses, taskId)\n\n        downloadInformation = core.models.Download.DownloadInformation(\n            job_id=taskId,\n            session=ses,\n            download_limiter=server_state.download_limiter,\n            download_strategie=data.download_strategie,\n            contexts=contexts,\n        )\n        job = ServerJob(\n            job_id=taskId,\n            download_information=downloadInformation,\n            creation_timestamp=time.monotonic()\n        )\n        server_state.jobs[taskId] = job\n        resources : list[responses.Resources] = []\n        \n#Depending on the strategy something different will happen\n        if data.download_strategie == core.models.Download.DownloadStrategie.LOCAL:\n            downloader = core.download.Dispatcher.DownloadDispatcher(downloadInformation)\n            asyncio.create_task(\n                _run_local_download(\n                    taskId,\n                    downloader\n                    )\n                )\n\n            \n            for context in downloadInformation.contexts:\n                resource = responses.Resources(\n                    context=context,\n                    progress_url=f\"/download/progress/{taskId}/{context.context_id}\"\n                )\n                resources.append(resource)\n    \n\n        elif data.download_strategie == core.models.Download.DownloadStrategie.STREAM:\n            for context in downloadInformation.contexts:\n    \n                streamJob = ServerStream(\n                    stream_id=context.context_id,\n                    context=context,\n                )\n\n             \n\n                if context.target.download_type == core.models.Download.DownloadType.HLS:\n                    segments, audioSegments = await asyncio.to_thread(\n                        _getIndexSegmentsForStreaming,\n                        job,\n                        streamJob.stream_id,\n                        context\n                    )\n                    watchUrlExtension = \"/index.m3u8\"\n                    streamType = \"hls\"\n\n\n                    streamJob.segments = segments\n                    streamJob.audio_segments = audioSegments\n\n#Includes UMP and FILE\n                else:\n                    watchUrlExtension = f\"/{context.output.full_filename}\"\n                    streamType = \"file\"\n               \n                server_state.jobs[taskId].stream_jobs[streamJob.stream_id] = streamJob\n\n                resource = responses.Resources(\n                        context=context,\n                        progress_url=f\"/download/progress/{taskId}/{context.context_id}\",\n                        download_url=f\"/stream/download/{taskId}/{context.context_id}\",\n                        watch_url=f\"/stream/watch/{taskId}/{context.context_id}{watchUrlExtension}\",\n                        stream_type = streamType\n                    )\n                resources.append(resource)\n                \n            \n        \n\n        else:\n            raise core.models.errors.TaskFailedError(\n                task=f\"/download/video-audio/\",\n                reason=\"Unknown download strategie was given\",\n                caller=\"server/download/video-audio\"\n            )\n        \n        return responses.DownloadResponse(\n            task_id=taskId,\n            resources=resources\n        ).model_dump(\n            exclude={\n                \"resources\": {\n                    \"__all__\": {\n                        \"context\": {\n                            \"target\": {\n                                \"post_body\"\n                            }\n                        }\n                    }\n                }\n            }\n        )\n\n\n\n    except (ValueError, TypeError, core.models.errors.ArgumentError, core.models.errors.ArgumentErrorCompare) as e:\n        server_state.log_queue.put_nowait(f\"[ERROR] failed to create download task with given request: {data}\")\n        raise HTTPException(status_code=400, detail=f\"Invalid type for {str(e)}\")\n\n    except core.models.errors.TaskFailedError as e:\n        server_state.log_queue.put_nowait(f\"[ERROR] Failed download. Request: {data}. Message from Resolver: {e}\")\n        raise HTTPException(status_code=500, detail=str(e))\n\n\n\n\n\ndef _getIndexSegmentsForStreaming(job: ServerJob,stream_id: str ,context: core.models.Download.DownloadContext):\n    from PythonModule.core.download.HLS import models as hlsmodels\n    segmentList = []\n\n    file = html.getHtml(\n        session=job.download_information.session,\n        url=context.target.resolved_url,\n        extra_headers=context.target.extra_headers\n    )\n\n    fileType:hlsmodels.FileType = core.download.HLSDispatcher(job.download_information).dertermineFileType(file)\n\n\n    if fileType == hlsmodels.FileType.MASTER_FILE:\n        masterResults = core.download.MasterHLSDownload(context, job.download_information.session).getUrls()\n        indexUrl, audioUrl = masterResults\n\n        context.target.resolved_url = indexUrl\n        segmentList, audioSegmentList = core.download.IndexHLSDownload(context, job.download_information.session).getIndexSegmentList()\n\n\n    elif fileType == hlsmodels.FileType.INDEX_FILE:\n        segmentList, audioSegmentList = core.download.IndexHLSDownload(context, job.download_information.session).getIndexSegmentList()\n\n\n    if not segmentList:\n        raise core.models.errors.TaskFailedError(\n            task=\"_getIndexSegmentsForStreaming\",\n            reason=\"Didn't get segmentList from index\"\n        )\n\n    return (segmentList, audioSegmentList)\n\n\n\n\n\n@app.get(\"/stream/watch/{task_id}/{stream_id}/index.m3u8\")\nasync def stream_hls_index(task_id: str, stream_id: str):\n    job = server_state.jobs.get(task_id)\n\n    if job is None:\n        raise HTTPException(status_code=404)\n\n    stream = job.stream_jobs.get(stream_id)\n\n    if stream is None or not stream.segments:\n        raise HTTPException(status_code=404)\n\n    max_duration = max(\n        segment.duration\n        for segment in stream.segments\n    )\n\n    lines = [\n        \"#EXTM3U\",\n        \"#EXT-X-VERSION:3\",\n        f\"#EXT-X-TARGETDURATION:{int(max_duration + 0.999)}\",\n        \"#EXT-X-MEDIA-SEQUENCE:0\",\n    ]\n\n    for index, segment in enumerate(stream.segments):\n        lines.append(f\"#EXTINF:{segment.duration:.3f},\")\n        lines.append(\n            f\"/stream/watch/{task_id}/{stream_id}/segment/{index}\"\n        )\n\n    lines.append(\"#EXT-X-ENDLIST\")\n\n    playlist = \"\\n\".join(lines)\n\n    return Response(\n        content=playlist,\n        media_type=\"application/vnd.apple.mpegurl\"\n    )\n\n\n@app.get(\"/stream/watch/{task_id}/{stream_id}/segment/{segment_id}\")\nasync def stream_hls_segment(\n    task_id: str,\n    stream_id: str,\n    segment_id: int\n):\n    job = server_state.jobs.get(task_id)\n\n    if job is None:\n        raise HTTPException(status_code=404)\n\n    stream = job.stream_jobs.get(stream_id)\n\n    if stream is None or not stream.segments:\n        raise HTTPException(status_code=404)\n\n    if segment_id < 0 or segment_id >= len(stream.segments):\n        raise HTTPException(status_code=404)\n\n    segment = stream.segments[segment_id]\n\n    return StreamingResponse(\n        file.asyncDownloadYieldSimple(\n            session=job.download_information.session,\n            url=segment.url,\n            extra_headers=stream.context.target.extra_headers,\n        ),\n        media_type=\"video/mp2t\"\n    )\n\n\n\n    \n\n@app.get(\"/stream/watch/{task_id}/{stream_id}/{file_name}.{file_type}\")\nasync def client_watch_stream(task_id: str, stream_id: str, file_name: str, file_type: str, request: Request):\n    job = server_state.jobs.get(task_id)\n\n    if job is None:\n        raise HTTPException(status_code=404)\n\n    stream_job = job.stream_jobs.get(stream_id)\n\n    if stream_job is None:\n        raise HTTPException(status_code=404)\n\n    context: core.models.Download.DownloadContext = stream_job.context\n\n    if context.output.full_filename != f\"{file_name}.{file_type}\":\n        raise HTTPException(status_code=404)\n\n    status_code = 200\n\n    headers = {\n      \"Accept-Ranges\": \"bytes\"\n    }\n    total_size = context.media_info.total_size\n\n    range_headers = request.headers.get(\"range\")\n    start_byte = 0\n    end_byte = None\n\n    if range_headers:\n        print(\"[WATCH] Browser Range: \", range_headers)\n        value = range_headers.removeprefix(\"bytes=\")\n        start, end = value.split(\"-\", 1)\n     \n\n        if start:\n            start_byte = int(start)\n\n        if end:\n            end_byte = int(end)\n        else:\n            end_byte = total_size - 1\n\n        status_code = 206\n\n        headers[\"Content-Range\"] = (\n            f\"bytes {start_byte}-{end_byte}/{total_size}\"\n        )\n\n        headers[\"Content-Length\"] = str(\n            end_byte - start_byte + 1\n        )\n    else:\n        headers[\"Content-Length\"] = str(total_size)\n\n    print(\n        \"Serving:\",\n        start_byte,\n        end_byte,\n        \"/\",\n        total_size\n    )\n    \n\n\n    if context.target.download_type == core.models.Download.DownloadType.FILE:\n        return StreamingResponse(\n            file.asyncDownloadYieldSimple(\n                session=job.download_information.session,\n                url=context.target.resolved_url,\n                extra_headers=context.target.extra_headers,\n                start_byte=start_byte,\n                end_byte=end_byte,\n            ),\n            status_code=status_code,\n            headers=headers,\n            media_type=providermodels.EXTENSION_CONTENT_TYPES.get(\n                context.media_info.file_extension\n            ),\n        )\n\n    elif context.target.download_type == core.models.Download.DownloadType.UMP:\n        from PythonModule.core.download.UMP import download\n\n        return StreamingResponse(\n            download.downloadAndYieldUMPRange(\n                session=job.download_information.session,\n                start_url=context.target.resolved_url,\n                extra_headers=context.target.extra_headers,\n                max_len=total_size,\n                media_start=start_byte,\n                media_end=end_byte,\n            ),\n            status_code=status_code,\n            headers=headers,\n            media_type=\"audio/webm\"\n        )\n\n\n\n\n@app.get(\"/stream/download/{task_id}/{stream_id}\")\nasync def client_download_stream(task_id: str, stream_id: str):\n    job = server_state.jobs.get(task_id)\n    \n\n    if job is None:\n        raise HTTPException(\n            status_code=404,\n            detail=f\"Ressource /stream/download/{task_id}/{stream_id} doesn't exist\"\n            )\n\n    streamJob = job.stream_jobs.get(stream_id)\n    if streamJob is None:\n        raise HTTPException(\n            status_code=404,\n            detail=f\"Ressource /stream/download/{task_id}/{stream_id} doesn't exist\"\n            )\n\n    \n    context: core.models.Download.DownloadContext = streamJob.context\n\n    downloadInformation = job.download_information\n    downloader = core.download.Dispatcher.DownloadDispatcher(downloadInformation)\n\n    async def download_and_cleanup():\n        \n        async for chunk in downloader.downloadContextAndYield(context):\n            yield chunk\n\n        \n\n\n    return StreamingResponse(\n        download_and_cleanup(),\n        media_type=\"application/octet-stream\",\n        headers={\n            \"Content-Disposition\":\n                f'attachment; filename=\"{context.output.full_filename if context.output.full_filename is not None else (context.context_id + context.media_info.file_extension)}\"'\n        }\n    )\n    \n    \n    \n    \ndef _findContext(download_information, context_id):\n    for context in download_information.contexts:\n        if context.context_id == context_id:\n            return context\n\n    return None\n\n\n@app.get(\"/download/progress/{task_id}/{context_id}\")\nasync def get_download_progress(task_id: str, context_id: str):\n\n    job = server_state.jobs.get(task_id)\n    \n\n    if job is None:\n        raise HTTPException(status_code=404)\n\n    info: core.models.Download.DownloadInformation = job.download_information\n\n    context = _findContext(info, context_id)\n    if context is None: \n        raise HTTPException(status_code=404)\n    \n\n    return context.download_progress\n\n\n\n@app.post(\"/search\", dependencies=[Depends(require_admin)])\nasync def receive_search(data: requests.SearchRequest):\n    ses = Session()\n    search_id = str(uuid.uuid4())\n    try:\n        response = await searchProcessor.SearchProcessor(\n            searchRequest=data,\n            session=ses,\n            ).run()\n\n        server_state.log_queue.put_nowait(f\"[INFO] Search succesfull for job {search_id} with query {data.search} and provider {data.provider}\")\n        return response\n\n    except Exception as e:\n        server_state.log_queue.put_nowait(f\"[ERROR] Failed search task with given arguments: id {search_id} provider {data.provider} and searchinput {data.search}.\\n Error Message:{str(e)}\")\n        raise HTTPException(status_code=500, detail=str(e))\n\n\nstart_time = time.time()\n\n@app.get(\"/health\", dependencies=[Depends(require_admin)])\ndef health():\n    try:\n        uptime_seconds = time.time() - start_time\n        try:\n            mem = self_memory_mb()\n        except Exception:\n            mem = None\n\n        #active_downloads = [v for v in download_progress.values() if v[\"status\"] not in (\"complete\", \"error\")]\n        #downloads_with_errors = [v for v in download_progress.values() if v[\"status\"] == \"error\"]\n        #error_messages = [v[\"errorMessage\"] for v in downloads_with_errors if v[\"errorMessage\"]]\n\n        return {\n            \"ok\": True,\n            \"uptime_seconds\": round(uptime_seconds, 2),\n            \"memory_mb\": mem,\n            \"pid\": os.getpid(),\n            \"processes\": list_python_processes(),\n            #\"active_downloads\": active_downloads,\n            #\"error_messages\": error_messages\n        }\n    except Exception as e:\n        raise HTTPException(status_code=500, detail=str(e))\n\n\ndef self_memory_mb():\n    pid = os.getpid()\n    try:\n        if platform.system() == \"Windows\":\n            out = subprocess.check_output(\n                [\"tasklist\", \"/FI\", f\"PID eq {pid}\", \"/FO\", \"CSV\"],\n                text=True, errors=\"replace\"\n            )\n            line = out.splitlines()[1]\n            mem = line.split(\",\")[-1]\n            digits = re.sub(r\"\\D\", \"\", mem)\n            if not digits:\n                return None\n            return round(int(digits) / 1024, 2)\n        else:\n            with open(f\"/proc/{pid}/status\") as f:\n                for line in f:\n                    if line.startswith(\"VmRSS:\"):\n                        kb = int(line.split()[1])\n                        return round(kb / 1024, 2)\n            return None\n    except Exception:\n        return None\n\n\ndef list_python_processes():\n    if platform.system() != \"Windows\":\n        out = subprocess.check_output([\"ps\", \"-eo\", \"pid,comm\"], text=True)\n        procs = []\n        for line in out.splitlines()[1:]:\n            pid, name = line.strip().split(None, 1)\n            if name.lower().startswith(\"python\"):\n                procs.append({\"pid\": int(pid), \"name\": name})\n        return procs\n\n    ps = r\"\"\"\nGet-CimInstance Win32_Process -Filter \"Name LIKE 'python%'\" |\nSelect-Object ProcessId, Name |\nConvertTo-Json\n\"\"\".strip()\n\n    out = subprocess.check_output(\n        [\"powershell\", \"-NoProfile\", \"-ExecutionPolicy\", \"Bypass\", \"-Command\", ps],\n        text=True, encoding=\"utf-8\", errors=\"replace\"\n    ).strip()\n\n    if not out:\n        return []\n\n    data = json.loads(out)\n    if isinstance(data, dict):\n        data = [data]\n\n    return [{\"pid\": int(p[\"ProcessId\"]), \"name\": p[\"Name\"]} for p in data]\n\n\n#---------------- DB management ------------------------\n\ndef create_app_tables():\n    os.makedirs(os.path.dirname(db_path), exist_ok=True)\n\n    conn = connect_db()\n    cursor = conn.cursor()\n\n    cursor.execute(\"\"\"\n                   CREATE TABLE IF NOT EXISTS Users (\n                        Identifier TEXT NOT NULL PRIMARY KEY,\n                        Username TEXT NOT NULL UNIQUE,\n                        PasswordHash TEXT NOT NULL,\n                        CreatedAt TEXT NOT NULL,\n                        LoggedIn BOOLEAN NOT NULL,\n                        LastLoggedIn TEXT NOT NULL)\"\"\")\n\n    cursor.execute(\"\"\"\n                   CREATE TABLE IF NOT EXISTS DownloadedMedias\n                   (\n                       Identifier TEXT NOT NULL PRIMARY KEY,\n                       UserIdentifier TEXT NOT NULL,\n                       Url TEXT,\n                       Title TEXT NOT NULL,\n                       MediaType TEXT NOT NULL,\n                       DownloadedAt TEXT,\n                       DownloadPath TEXT NOT NULL UNIQUE,\n                       IsPlayable BOOLEAN NOT NULL,\n                       FOREIGN KEY (UserIdentifier) REFERENCES Users (Identifier) ON DELETE CASCADE\n                   )\"\"\")\n\n    cursor.execute(\"\"\"\n                   CREATE TABLE IF NOT EXISTS Playlists\n                   (\n                       Identifier TEXT NOT NULL PRIMARY KEY,\n                       UserIdentifier TEXT NOT NULL,\n                       Name TEXT NOT NULL,\n                       Description TEXT,\n                       FOREIGN KEY (UserIdentifier) REFERENCES Users (Identifier) ON DELETE CASCADE\n                   )\"\"\")\n\n    cursor.execute(\"\"\"\n                   CREATE TABLE IF NOT EXISTS PlaylistMedias\n                   (\n                       PlaylistIdentifier TEXT NOT NULL,\n                       MediaIdentifier TEXT NOT NULL,\n                       Position INTEGER NOT NULL,\n                       PRIMARY KEY (PlaylistIdentifier, MediaIdentifier),\n                       FOREIGN KEY (PlaylistIdentifier) REFERENCES Playlists (Identifier) ON DELETE CASCADE,\n                       FOREIGN KEY (MediaIdentifier) REFERENCES DownloadedMedias (Identifier) ON DELETE CASCADE\n                   )\"\"\")\n\n    cursor.execute(\"\"\"\n                   CREATE TABLE IF NOT EXISTS Settings\n                   (\n                       Identifier TEXT NOT NULL PRIMARY KEY,\n                       UserIdentifier TEXT NOT NULL UNIQUE,\n                       DownloadPath TEXT NOT NULL,\n                       DarkModeEnabled BOOLEAN NOT NULL,\n                       ScanFolderOnStartup BOOLEAN NOT NULL,\n                       FOREIGN KEY (UserIdentifier) REFERENCES Users (Identifier) ON DELETE CASCADE\n                   )\"\"\")\n\n    conn.commit()\n    conn.close()\n\ndef connect_db():\n    conn = sqlite3.connect(db_path, timeout=20.0)\n    conn.execute(\"PRAGMA journal_mode=WAL\")\n    conn.execute(\"PRAGMA foreign_keys = ON\")\n    conn.execute(\"PRAGMA busy_timeout=5000\")\n    conn.row_factory = sqlite3.Row\n    return conn\n\nclass PlaylistModel(BaseModel):\n    Identifier: str\n    Name: str\n    Description: Optional[str] = None\n\nclass MediaModel(BaseModel):\n    Identifier: str\n    Url: str\n    MediaType: str\n    DownloadedAt: str\n    DownloadPath: str\n    IsPlayable: bool\n    Title: str\n\nclass PlaylistMediaModel(BaseModel):\n    PlaylistIdentifier: str\n    MediaIdentifier: str\n    Position: int\n\nclass SettingsModel(BaseModel):\n    Identifier: str\n    DownloadPath: str\n    DarkModeEnabled: bool\n    ScanFolderOnStartup: bool\n\nclass SaveUserDataRequest(BaseModel):\n    user_identifier: str\n    playlists: List[PlaylistModel]\n    medias: List[MediaModel]\n    playlist_medias: List[PlaylistMediaModel]\n    setting: SettingsModel\n\n\ndef save_user_data(request: SaveUserDataRequest):\n    user_identifier = request.user_identifier\n    playlists = request.playlists\n    medias = request.medias\n    playlist_medias = request.playlist_medias\n    setting = request.setting\n\n    conn = connect_db()\n    cursor = conn.cursor()\n\n    try:\n        # ---- 1. Medias upserten ----\n        for media in medias:\n            cursor.execute(\n                \"\"\"INSERT INTO DownloadedMedias \n                   (Identifier, UserIdentifier, Url, MediaType, DownloadedAt, DownloadPath, IsPlayable, Title)\n                   VALUES (?, ?, ?, ?, ?, ?, ?, ?)\n                   ON CONFLICT(Identifier) DO UPDATE SET\n                   Url = excluded.Url,\n                   MediaType = excluded.MediaType,\n                   DownloadedAt = excluded.DownloadedAt,\n                   DownloadPath = excluded.DownloadPath,\n                   IsPlayable = excluded.IsPlayable,\n                   Title = excluded.Title\"\"\",\n                (media.Identifier, user_identifier, media.Url, media.MediaType,\n                 media.DownloadedAt, media.DownloadPath, media.IsPlayable, media.Title)\n            )\n\n        # ---- 2. Playlists upserten ----\n        for playlist in playlists:\n            cursor.execute(\n                \"\"\"INSERT INTO Playlists (Identifier, UserIdentifier, Name, Description)\n                   VALUES (?, ?, ?, ?) ON CONFLICT(Identifier) DO\n                UPDATE SET\n                    Name = excluded.Name,\n                    Description = excluded.Description\"\"\",\n                (playlist.Identifier, user_identifier, playlist.Name, playlist.Description)\n            )\n\n        # ---- 3. Verwaiste Medias löschen (die in der DB sind, aber nicht mehr im Request) ----\n        # CASCADE entfernt automatisch zugehörige PlaylistMedias-Einträge.\n        media_ids = [m.Identifier for m in medias]\n        if media_ids:\n            placeholders = \",\".join(\"?\" for _ in media_ids)\n            cursor.execute(\n                f\"\"\"DELETE FROM DownloadedMedias\n                    WHERE UserIdentifier = ?\n                      AND Identifier NOT IN ({placeholders})\"\"\",\n                (user_identifier, *media_ids)\n            )\n        else:\n            # Request enthält gar keine Medias -> alle des Users löschen\n            cursor.execute(\n                \"DELETE FROM DownloadedMedias WHERE UserIdentifier = ?\",\n                (user_identifier,)\n            )\n\n        # ---- 4. Verwaiste Playlists löschen ----\n        playlist_ids = [p.Identifier for p in playlists]\n        if playlist_ids:\n            placeholders = \",\".join(\"?\" for _ in playlist_ids)\n            cursor.execute(\n                f\"\"\"DELETE FROM Playlists\n                    WHERE UserIdentifier = ?\n                      AND Identifier NOT IN ({placeholders})\"\"\",\n                (user_identifier, *playlist_ids)\n            )\n        else:\n            cursor.execute(\n                \"DELETE FROM Playlists WHERE UserIdentifier = ?\",\n                (user_identifier,)\n            )\n\n        # ---- 5. PlaylistMedias komplett neu setzen ----\n        # Alle PlaylistMedias der (jetzt noch existierenden) Playlists dieses Users löschen...\n        cursor.execute(\n            \"\"\"DELETE FROM PlaylistMedias\n               WHERE PlaylistIdentifier IN (\n                   SELECT Identifier FROM Playlists WHERE UserIdentifier = ?\n               )\"\"\",\n            (user_identifier,)\n        )\n        # ...und aus dem Request neu einfügen. Nur Einträge, deren Parents wirklich existieren.\n        for pm in playlist_medias:\n            cursor.execute(\"SELECT 1 FROM Playlists WHERE Identifier = ?\", (pm.PlaylistIdentifier,))\n            if cursor.fetchone() is None:\n                server_state.log_queue.put_nowait(f\"[WARN] Skipping PlaylistMedia, missing Playlist parent: {pm.PlaylistIdentifier}\")\n                continue\n\n            cursor.execute(\"SELECT 1 FROM DownloadedMedias WHERE Identifier = ?\", (pm.MediaIdentifier,))\n            if cursor.fetchone() is None:\n                server_state.log_queue.put_nowait(f\"[WARN] Skipping PlaylistMedia, missing Media parent: {pm.MediaIdentifier}\")\n                continue\n\n            cursor.execute(\n                \"\"\"INSERT INTO PlaylistMedias (PlaylistIdentifier, MediaIdentifier, Position)\n                   VALUES (?, ?, ?)\"\"\",\n                (pm.PlaylistIdentifier, pm.MediaIdentifier, pm.Position)\n            )\n\n        # ---- 6. Settings upserten ----\n        cursor.execute(\n            \"\"\"INSERT INTO Settings\n               (Identifier, UserIdentifier, DownloadPath, DarkModeEnabled, ScanFolderOnStartup)\n               VALUES (?, ?, ?, ?, ?) ON CONFLICT(Identifier) DO\n            UPDATE SET\n                DownloadPath = excluded.DownloadPath,\n                DarkModeEnabled = excluded.DarkModeEnabled,\n                ScanFolderOnStartup = excluded.ScanFolderOnStartup\"\"\",\n            (setting.Identifier, user_identifier, setting.DownloadPath,\n             setting.DarkModeEnabled, setting.ScanFolderOnStartup)\n        )\n\n        conn.commit()\n    except Exception as e:\n        conn.rollback()\n        raise fastapi.HTTPException(status_code=400, detail=str(e))\n    finally:\n        conn.close()\n\n@app.post(\"/save\", dependencies=[Security(require_admin)])\nasync def handle_save_user_data(req: SaveUserDataRequest):\n\n    # Validiere user_identifier\n    if not req.user_identifier or len(req.user_identifier) > 100:\n        raise fastapi.HTTPException(status_code=400, detail=\"Invalid user identifier\")\n\n    # Validiere Größen (DoS Prevention)\n    if len(req.playlists) > 1000:\n        raise fastapi.HTTPException(status_code=400, detail=\"Too many playlists\")\n\n    if len(req.medias) > 10000:\n        raise fastapi.HTTPException(status_code=400, detail=\"Too many medias\")\n\n    try:\n        save_user_data(req)\n        server_state.log_queue.put_nowait(f\"[INFO] User data for '{req.user_identifier}' saved successfully\")\n        return {\"message\": \"User data saved successfully\"}\n    except Exception as e:\n        server_state.log_queue.put_nowait(f\"[ERROR] Error saving user data for '{req.user_identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n# ---------------- User Endpoints ---------------\n\n# ============================================================\n# User Endpoints\n# ============================================================\n\n# create_user() unverändert – reine DB-Funktion, kein Key.\ndef create_user(username: str, password: str, identifier: str, created_at: str):\n    conn = connect_db()\n    cursor = conn.cursor()\n\n    date = datetime.now()\n    formatted = date.isoformat()\n\n    cursor.execute(\"\"\"INSERT INTO Users (Username, PasswordHash, Identifier, CreatedAt, LoggedIn, LastLoggedIn)\n                      VALUES (?, ?, ?, ?, ?, ?)\"\"\", (username, password, identifier, created_at, False, formatted))\n    conn.commit()\n    conn.close()\n\n\n@app.post(\"/set/user/loggedIn\", dependencies=[Security(require_admin)])\nasync def handle_set_logged_in(identifier: str = Query(...)):\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"\"\"SELECT LoggedIn\n                          FROM Users\n                          WHERE Identifier = ?\"\"\", (identifier,))\n        logged_in = cursor.fetchone()[0]\n\n        if logged_in is None:\n            server_state.log_queue.put_nowait(f\"[ERROR] User with identifier '{identifier}' not found\")\n            raise fastapi.HTTPException(status_code=404, detail=f\"User with identifier '{identifier}' not found\")\n\n        if logged_in:\n            cursor.execute(\"\"\"UPDATE Users\n                              SET LoggedIn = 0\n                              WHERE Identifier = ?\"\"\", (identifier,))\n            conn.commit()\n        else:\n            cursor.execute(\"\"\"UPDATE Users\n                              SET LoggedIn = 1\n                              WHERE Identifier = ?\"\"\", (identifier,))\n            conn.commit()\n\n    except Exception as e:\n        server_state.log_queue.put_nowait(f\"[ERROR] Error setting user logged-in status for '{identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.post(\"/set/user/lastLoggedIn\", dependencies=[Security(require_admin)])\nasync def handle_set_last_logged_in(identifier: str = Query(None)):\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n        date = datetime.now()\n        formatted = date.isoformat()\n\n        cursor.execute(\"\"\"SELECT Username\n                          FROM Users\n                          WHERE Identifier = ?\"\"\", (identifier,))\n        username = cursor.fetchone()\n\n        if username is None:\n            server_state.log_queue.put_nowait(f\"[ERROR] User with identifier '{identifier}' not found\")\n            raise fastapi.HTTPException(status_code=404, detail=f\"User with identifier '{identifier}' not found\")\n\n        cursor.execute(\"\"\"UPDATE Users\n                          SET LastLoggedIn = ?\n                          WHERE Identifier = ?\"\"\", (formatted, identifier))\n\n        conn.commit()\n        conn.close()\n    except Exception as e:\n        server_state.log_queue.put_nowait(f\"[ERROR] Error setting user last logged-in status for '{identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n# --- get_users: KEIN Admin-Key, unverändert ---\n@app.get(\"/get/user/{identifier}\", dependencies=[Security(require_admin)], response_model=UserResponse)\nasync def get_users(identifier: str):\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT Identifier, Username, CreatedAt FROM Users WHERE Identifier = ?\", (identifier,))\n        row = cursor.fetchone()\n\n        if row is None:\n            cursor.execute(\"SELECT Identifier, Username, CreatedAt FROM Users WHERE Username = ?\", (identifier,))\n            row = cursor.fetchone()\n\n            if row is None:\n                conn.close()\n                server_state.log_queue.put_nowait(f\"[ERROR] User lookup failed for identifier/username '{identifier}'\")\n                raise fastapi.HTTPException(status_code=404, detail=\"User not found\")\n\n        conn.close()\n        server_state.log_queue.put_nowait(f\"[INFO] User '{identifier}' retrieved successfully\")\n        return dict(row)\n    except fastapi.HTTPException:\n        raise\n    except Exception as e:\n        server_state.log_queue.put_nowait(f\"[ERROR] Error retrieving user '{identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.get(\"/getall/users\", response_model=List[UserResponse], dependencies=[Security(require_admin)])\nasync def get_all_users():\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT Identifier, Username, CreatedAt FROM Users\")\n        rows = cursor.fetchall()\n        conn.close()\n\n        server_state.log_queue.put_nowait(f\"[INFO] Retrieved {len(rows)} users\")\n        return [dict(row) for row in rows]\n    except Exception as e:\n        server_state.log_queue.put_nowait(f\"[ERROR] Error retrieving all users: {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.post(\"/create-tables/\", response_model=MessageResponse, dependencies=[Security(require_admin)])\nasync def create_table():\n    try:\n        create_app_tables()\n        server_state.log_queue.put_nowait(\"[INFO] Tables created successfully\")\n        return {\"message\": \"Tables created successfully\"}\n    except Exception as e:\n        server_state.log_queue.put_nowait(f\"[ERROR] Error creating tables: {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.post(\"/create/user/\", response_model=CreateResponse, dependencies=[Security(require_admin)])\nasync def handle_create_user_req(req: requests.CreateUserRequest):\n    try:\n        identifier = str(uuid.uuid4())\n        username = req.username\n        password = req.password\n        created_at = datetime.now().isoformat()\n\n        password_hash = bcrypt.hashpw(password.encode(\"utf-8\"), bcrypt.gensalt()).decode(\"utf-8\")\n\n        create_user(username, password_hash, identifier, created_at)\n\n        server_state.log_queue.put_nowait(f\"[INFO] User '{username}' created successfully with id {identifier}\")\n        return {\"message\": \"User created successfully\", \"identifier\": identifier}\n    except Exception as e:\n        server_state.log_queue.put_nowait(f\"[ERROR] Error creating user '{req.username}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=400, detail=str(e))\n\n\n@app.post(\"/delete/user/{identifier}\", response_model=MessageResponse, dependencies=[Security(require_admin)])\nasync def handle_delete_user_req(identifier: str):\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"\"\"DELETE\n                          FROM Users\n                          WHERE Identifier = ?\"\"\", (identifier,))\n        conn.commit()\n        conn.close()\n\n        server_state.log_queue.put_nowait(f\"[INFO] User '{identifier}' deleted successfully\")\n        return {\"message\": \"User deleted successfully\"}\n    except Exception as e:\n        server_state.log_queue.put_nowait(f\"[ERROR] Error deleting user '{identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n# ============================================================\n# Playlist Endpoints\n# ============================================================\n\n# --- get_playlists: KEIN Admin-Key, unverändert ---\n@app.get(\"/get/playlists/{identifier}\", response_model=List[PlaylistResponse], dependencies=[Security(require_admin)])\nasync def get_playlists(identifier: str):\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT Identifier, UserIdentifier, Name, Description FROM Playlists WHERE Identifier = ?\",\n                       (identifier,))\n        rows = cursor.fetchall()\n        conn.close()\n\n        server_state.log_queue.put_nowait(f\"[INFO] Retrieved playlist(s) for identifier '{identifier}'\")\n        return [dict(row) for row in rows]\n    except Exception as e:\n        server_state.log_queue.put_nowait(f\"[ERROR] Error retrieving playlists for '{identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.post(\"/create/playlist/\", response_model=CreateResponse, dependencies=[Security(require_admin)])\nasync def handle_create_playlist_req(req: requests.CreatePlaylistRequest):\n    try:\n        identifier = str(uuid.uuid4())\n\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"\"\"INSERT INTO Playlists (Identifier, UserIdentifier, Name, Description)\n                          VALUES (?, ?, ?, ?)\"\"\", (identifier, req.user_identifier, req.name, req.description))\n        conn.commit()\n        conn.close()\n\n        server_state.log_queue.put_nowait(f\"[INFO] Playlist '{req.name}' created successfully with id {identifier}\")\n        return {\"message\": \"Playlist created successfully\", \"identifier\": identifier}\n    except Exception as e:\n        server_state.log_queue.put_nowait(f\"[ERROR] Error creating playlist '{req.name}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=400, detail=str(e))\n\n\n# HINWEIS: 'identifier' ist hier undefiniert (Bug im Original) – bewusst NICHT angefasst.\n@app.post(\"/delete/playlist/{identifier}\", response_model=MessageResponse, dependencies=[Security(require_admin)])\nasync def handle_delete_playlist_req(identifier: str):\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"\"\"DELETE\n                          FROM Playlists\n                          WHERE Identifier = ?\"\"\", (identifier,))\n        conn.commit()\n        conn.close()\n\n        server_state.log_queue.put_nowait(f\"[INFO] Playlist '{identifier}' deleted successfully\")\n        return {\"message\": \"Playlist deleted successfully\"}\n    except Exception as e:\n        server_state.log_queue.put_nowait(f\"[ERROR] Error deleting playlist '{identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.get(\"/getall/playlists\", response_model=List[PlaylistResponse], dependencies=[Security(require_admin)])\nasync def get_all_playlists():\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT Identifier, UserIdentifier, Name, Description FROM Playlists\")\n        rows = cursor.fetchall()\n        conn.close()\n\n        server_state.log_queue.put_nowait(f\"[INFO] Retrieved {len(rows)} playlists\")\n        return [dict(row) for row in rows]\n    except Exception as e:\n        server_state.log_queue.put_nowait(f\"[ERROR] Error retrieving all playlists: {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n# ============================================================\n# DownloadedMedia Endpoints\n# ============================================================\n\n@app.post(\"/create/downloadedmedia\", response_model=CreateResponse, dependencies=[Security(require_admin)])\nasync def handle_create_downloaded_media_req(req: requests.CreateDownloadedMediaRequest):\n    try:\n\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"\"\"SELECT Identifier FROM DownloadedMedias WHERE DownloadPath = ?\"\"\", (req.download_path,))\n\n        existing = cursor.fetchone()\n        if existing is not None:\n            identifier = existing[\"Identifier\"]\n            conn.close()\n            server_state.log_queue.put_nowait(f\"[INFO] Downloaded media with path '{req.download_path}' already exists\")\n            return {\"message\": f\"Downloaded media with path '{req.download_path}' already exists\", \"identifier\": identifier}\n\n        identifier = str(uuid.uuid4())\n        cursor.execute(\n            \"\"\"INSERT INTO DownloadedMedias (Identifier, UserIdentifier, Url, MediaType, DownloadedAt, DownloadPath,\n                                             IsPlayable, Title)\n               VALUES (?, ?, ?, ?, ?, ?, ?, ?)\"\"\",\n            (identifier, req.user_identifier, req.url, req.media_type, req.downloaded_at, req.download_path,\n             req.is_playable, req.title)\n        )\n        conn.commit()\n        conn.close()\n\n        server_state.log_queue.put_nowait(f\"[INFO] Downloaded media '{req.title}' created successfully with id {identifier}\")\n        return {\"message\": \"Downloaded media created successfully\", \"identifier\": identifier}\n    except Exception as e:\n        server_state.log_queue.put_nowait(f\"[ERROR] Error creating downloaded media '{req.title}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=400, detail=str(e))\n\n\n# HINWEIS: 'identifier' ist hier undefiniert (Bug im Original) – bewusst NICHT angefasst.\n@app.post(\"/delete/downloadedmedia/{identifier}\", response_model=MessageResponse, dependencies=[Security(require_admin)])\nasync def handle_delete_downloaded_media_req(identifier: str):\n
