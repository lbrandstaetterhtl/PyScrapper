sition<\/td><td class=\"mono\">INTEGER<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><\/tbody><\/table><\/div><div class=\"chips\" style=\"margin:9px 0 2px\"><span class=\"tag\">PRIMARY KEY (PlaylistIdentifier, MediaIdentifier)<\/span><span class=\"tag\">FOREIGN KEY (PlaylistIdentifier) REFERENCES Playlists (Identifier) ON DELETE CASCADE<\/span><span class=\"tag\">FOREIGN KEY (MediaIdentifier) REFERENCES DownloadedMedias (Identifier) ON DELETE CASCADE<\/span><\/div><h3 id=\"tSettings\">Settings<\/h3><div class=\"tbl-wrap\"><table><thead><tr><th>Spalte<\/th><th>Typ<\/th><th>Constraints<\/th><\/tr><\/thead><tbody><tr><td class=\"mono\">Identifier<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-enum\">PK<\/span><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">UserIdentifier<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-pyd\">UNIQUE<\/span><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">DownloadPath<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">DarkModeEnabled<\/td><td class=\"mono\">BOOLEAN<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">ScanFolderOnStartup<\/td><td class=\"mono\">BOOLEAN<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><\/tbody><\/table><\/div><div class=\"chips\" style=\"margin:9px 0 2px\"><span class=\"tag\">FOREIGN KEY (UserIdentifier) REFERENCES Users (Identifier) ON DELETE CASCADE<\/span><\/div>\n<h2 id=\"zugriff\">Zugriffsmuster<\/h2>\n<p><a class=\"x\" href=\"#/m/server.py#connect_db\">connect_db()<\/a> öffnet die Datei mit 20 Sekunden\nTimeout. Jeder Handler öffnet und schliesst seine eigene Verbindung; es gibt keinen Pool und\nkeine ORM-Schicht, alle Abfragen sind handgeschriebenes SQL mit Platzhaltern.<\/p>\n<div class=\"note warn\"><b>Fremdschlüssel sind deklariert, aber nicht zwingend aktiv<\/b>\n<p>SQLite prüft <code>FOREIGN KEY<\/code> nur, wenn <code>PRAGMA foreign_keys = ON<\/code> pro\nVerbindung gesetzt wird. Ohne das greifen weder die Constraints noch die\n<code>ON DELETE CASCADE<\/code>-Klauseln, und verwaiste Zeilen bleiben stehen.<\/p><\/div>\n<div class=\"note\"><b>Schreibzugriffe laufen im Eventloop<\/b>\n<p>Die Handler sind <code>async<\/code>, rufen sqlite3 aber direkt auf. Bei gleichzeitigen Schreibern\nblockiert das den Loop und kann in <code>database is locked<\/code> laufen. Ein\n<code>asyncio.to_thread<\/code> um die DB-Aufrufe oder WAL-Modus würde das entschärfen.<\/p><\/div>\n<\/div>", "ops": "<div class=\"wrap\">\n<div class=\"crumb\">LocalServer / Betrieb<\/div>\n<h1>Starten, testen, ausliefern<\/h1>\n\n<h2 id=\"start\">Starten<\/h2>\n<p>Das PowerShell-Skript bevorzugt das venv im Serverordner und fällt sonst auf das Python im PATH\nzurück. Es wechselt vorher ins Serververzeichnis — das ist wichtig, weil\n<span class=\"mono\">Session<\/span> den Cookie-Pfad aus dem Arbeitsverzeichnis ableitet.<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Was<\/th><th>Wert<\/th><\/tr><\/thead><tbody>\n<tr><td>Kommando<\/td><td class=\"mono\">python -m uvicorn server:app --host 127.0.0.1 --port 8765<\/td><\/tr>\n<tr><td>Skript<\/td><td class=\"mono\">scripts/startServer.ps1<\/td><\/tr>\n<tr><td>Abhängigkeiten<\/td><td class=\"mono\">fastapi, uvicorn[standard], pydantic, certifi, yt-dlp, playwright, bcrypt, dotenv<\/td><\/tr>\n<tr><td>Geheimnis<\/td><td class=\"mono\">ADMIN_KEY in .env neben server.py<\/td><\/tr>\n<tr><td>Logdatei<\/td><td class=\"mono\">logs/server_runtime.log<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Playwright braucht nach der Installation zusätzlich seine Browserbinaries\n(<span class=\"mono\">playwright install chromium<\/span>). Ohne sie schlagen alle Provider fehl, die\nauf Sniffing angewiesen sind.<\/p>\n\n<h2 id=\"tests\">Tests<\/h2>\n<p>Drei Skripte in <span class=\"mono\">tests/<\/span>, die keinen Testrunner brauchen. Sie lesen den\nAdminkey aus der <span class=\"mono\">.env<\/span>, schicken echte Anfragen an einen laufenden Server\nund schreiben ihr Ergebnis in eine eigene Logdatei.<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Skript<\/th><th>Prüft<\/th><th>Log<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"mono\"><a class=\"x\" href=\"#/m/tests%2Fdownload_tests.py\">download_tests.py<\/a><\/td>\n<td>Eingabevalidierung von <span class=\"mono\">/download/video-audio<\/span><\/td>\n<td class=\"mono\">download_endpoint_test.log<\/td><\/tr>\n<tr><td class=\"mono\"><a class=\"x\" href=\"#/m/tests%2Fserach_tests.py\">serach_tests.py<\/a><\/td>\n<td>Dasselbe für <span class=\"mono\">/search<\/span><\/td>\n<td class=\"mono\">search_endpoint_test.log<\/td><\/tr>\n<tr><td class=\"mono\"><a class=\"x\" href=\"#/m/tests%2Fcreate_delete_tests.py\">create_delete_tests.py<\/a><\/td>\n<td>Alle create- und delete-Routen, gültig wie ungültig<\/td>\n<td class=\"mono\">crud_endpoint_test.log<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Der Aufbau ist in allen dreien gleich: eine Liste von Fällen mit erwartetem Statuscode,\neine <span class=\"mono\">evaluate()<\/span>-Funktion und ein <span class=\"mono\">main()<\/span>, das\ndurchzählt. Neue Fälle ergänzt man in der Konstantenliste am Dateikopf, nicht im Code darunter.<\/p>\n\n<h2 id=\"fehler\">Fehlerbehandlung in den Routen<\/h2>\n<p>Die Handler fangen breit und übersetzen in HTTP-Codes. Das Muster wiederholt sich:<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Gefangen<\/th><th>Wird zu<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"mono\">ValueError, TypeError, ArgumentError<\/td><td>400 mit Präfix „Invalid type for\"<\/td><\/tr>\n<tr><td class=\"mono\">TaskFailedError<\/td><td>500 mit dem Text der Exception<\/td><\/tr>\n<tr><td class=\"mono\">sqlite3.IntegrityError<\/td><td>409 in den CRUD-Routen<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"note risk\"><b>UnicodeDecodeError landet im falschen Zweig<\/b>\n<p><code>UnicodeDecodeError<\/code> erbt über <code>UnicodeError<\/code> von <code>ValueError<\/code>\nund wird deshalb vom ersten Zweig gefangen. Der Client bekommt dann „Invalid type for 'utf-8'\ncodec can't decode byte ...\" und einen 400er, obwohl der Fehler weder am Typ liegt noch am Client.\nDazu wird nur <code>data<\/code> geloggt, nicht die Exception — es gibt also keinen Traceback zum\nNachsehen.<\/p>\n<p>Ein eigener <code>except UnicodeDecodeError<\/code> vor dem ValueError-Zweig und ein\n<code>traceback.format_exc()<\/code> in jedem Handler beheben beides.<\/p><\/div>\n<\/div>"}, "pages_index": [{"title": "Überblick", "hash": "#/overview", "sub": "Einstieg"}, {"title": "Endpoints", "hash": "#/endpoints", "sub": "HTTP-API"}, {"title": "Datenbank", "hash": "#/db", "sub": "SQLite-Schema"}, {"title": "Betrieb", "hash": "#/ops", "sub": "Start, Tests, Fehler"}, {"title": "GET /", "hash": "#/m/server.py#root", "sub": "root"}, {"title": "POST /command", "hash": "#/m/server.py#receive_command", "sub": "receive_command"}, {"title": "POST /download/video-audio", "hash": "#/m/server.py#receive_download", "sub": "receive_download"}, {"title": "GET /stream/watch/{task_id}/{stream_id}/index.m3u8", "hash": "#/m/server.py#stream_hls_index", "sub": "stream_hls_index"}, {"title": "GET /stream/watch/{task_id}/{stream_id}/segment/{segment_id}", "hash": "#/m/server.py#stream_hls_segment", "sub": "stream_hls_segment"}, {"title": "GET /stream/watch/{task_id}/{stream_id}/{file_name}.{file_type}", "hash": "#/m/server.py#client_watch_stream", "sub": "client_watch_stream"}, {"title": "GET /stream/download/{task_id}/{stream_id}", "hash": "#/m/server.py#client_download_stream", "sub": "client_download_stream"}, {"title": "GET /download/progress/{task_id}/{context_id}", "hash": "#/m/server.py#get_download_progress", "sub": "get_download_progress"}, {"title": "POST /search", "hash": "#/m/server.py#receive_search", "sub": "receive_search"}, {"title": "GET /health", "hash": "#/m/server.py#health", "sub": "health"}, {"title": "POST /save", "hash": "#/m/server.py#handle_save_user_data", "sub": "handle_save_user_data"}, {"title": "POST /set/user/loggedIn", "hash": "#/m/server.py#handle_set_logged_in", "sub": "handle_set_logged_in"}, {"title": "POST /set/user/lastLoggedIn", "hash": "#/m/server.py#handle_set_last_logged_in", "sub": "handle_set_last_logged_in"}, {"title": "GET /get/user/{identifier}", "hash": "#/m/server.py#get_users", "sub": "get_users"}, {"title": "GET /getall/users", "hash": "#/m/server.py#get_all_users", "sub": "get_all_users"}, {"title": "POST /create-tables/", "hash": "#/m/server.py#create_table", "sub": "create_table"}, {"title": "POST /create/user/", "hash": "#/m/server.py#handle_create_user_req", "sub": "handle_create_user_req"}, {"title": "POST /delete/user/{identifier}", "hash": "#/m/server.py#handle_delete_user_req", "sub": "handle_delete_user_req"}, {"title": "GET /get/playlists/{identifier}", "hash": "#/m/server.py#get_playlists", "sub": "get_playlists"}, {"title": "POST /create/playlist/", "hash": "#/m/server.py#handle_create_playlist_req", "sub": "handle_create_playlist_req"}, {"title": "POST /delete/playlist/{identifier}", "hash": "#/m/server.py#handle_delete_playlist_req", "sub": "handle_delete_playlist_req"}, {"title": "GET /getall/playlists", "hash": "#/m/server.py#get_all_playlists", "sub": "get_all_playlists"}, {"title": "POST /create/downloadedmedia", "hash": "#/m/server.py#handle_create_downloaded_media_req", "sub": "handle_create_downloaded_media_req"}, {"title": "POST /delete/downloadedmedia/{identifier}", "hash": "#/m/server.py#handle_delete_downloaded_media_req", "sub": "handle_delete_downloaded_media_req"}, {"title": "GET /get/downloadedmedia/{identifier}", "hash": "#/m/server.py#get_downloaded_media", "sub": "get_downloaded_media"}, {"title": "GET /getall/downloadedmedias", "hash": "#/m/server.py#get_all_downloaded_media", "sub": "get_all_downloaded_media"}, {"title": "GET /getuser/downloadedmedias/{user_identifier}", "hash": "#/m/server.py#get_user_downloaded_medias", "sub": "get_user_downloaded_medias"}, {"title": "POST /create/settings/", "hash": "#/m/server.py#handle_create_setting_req", "sub": "handle_create_setting_req"}, {"title": "POST /delete/settings/{identifier}", "hash": "#/m/server.py#handle_delete_setting_req", "sub": "handle_delete_setting_req"}, {"title": "GET /get/settings/{user_identifier}", "hash": "#/m/server.py#get_setting", "sub": "get_setting"}, {"title": "GET /getall/settings", "hash": "#/m/server.py#get_all_settings", "sub": "get_all_settings"}, {"title": "POST /create/playlistmedia", "hash": "#/m/server.py#handle_create_playlist_media_req", "sub": "handle_create_playlist_media_req"}, {"title": "POST /delete/playlistmedia", "hash": "#/m/server.py#handle_delete_playlist_media_req", "sub": "handle_delete_playlist_media_req"}, {"title": "GET /get/playlistmedias/{playlist_identifier}", "hash": "#/m/server.py#get_playlist_medias", "sub": "get_playlist_medias"}, {"title": "GET /getuser/playlists/{user_identifier}", "hash": "#/m/server.py#get_user_playlists", "sub": "get_user_playlists"}, {"title": "POST /login", "hash": "#/m/server.py#handle_login_req", "sub": "handle_login_req"}, {"title": "POST /register", "hash": "#/m/server.py#handle_register_req", "sub": "handle_register_req"}, {"title": "POST /logout/{identifier}", "hash": "#/m/server.py#handle_logout_req", "sub": "handle_logout_req"}], "notes": {"server.py": "<div class=\"note\"><b>Eine Datei, vier Zuständigkeiten<\/b>\n<p><code>server.py<\/code> enthält Zustandsverwaltung, Auth, die Download- und Streamlogik und die\nkomplette SQLite-Schicht. Zum Navigieren: die Datenklassen stehen oben, danach Auth und Lifespan,\nab <code>receive_download<\/code> die Downloadstrecke, ab <code>create_app_tables<\/code> das CRUD.<\/p><\/div>", "serverBak.py": "<div class=\"note warn\"><b>Altstand, nicht aktiv<\/b>\n<p>Diese Datei wird von nichts importiert. Ihr fehlen <code>ServerState<\/code>, die Streamrouten\nund <code>/logout<\/code>; der Zustand liegt stattdessen in einzelnen globalen Variablen. Nur als\nVergleich lesen, nicht als Vorlage.<\/p><\/div>"}}</script>
<script>
const DATA = JSON.parse(document.getElementById('payload').textContent);
const MODS = DATA.modules;
const BY_PATH = {};
MODS.forEach(m => BY_PATH[m.path] = m);

/* ------------------------------------------------------------------ utils */
const esc = s => (s == null ? '' : String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'));
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const q1 = s => document.querySelector(s);

/* ------------------------------------------------ python syntax highlight */
const PY_KW = new Set(('False None True and as assert async await break class continue def del elif else ' +
  'except finally for from global if import in is lambda nonlocal not or pass raise return try while ' +
  'with yield match case self cls').split(' '));
const PY_BI = new Set(('abs all any bool bytes callable dict dir enumerate filter float format getattr ' +
  'hasattr int isinstance issubclass len list map max min next object open print range repr reversed ' +
  'round set setattr sorted str sum super tuple type zip Exception ValueError TypeError KeyError ' +
  'IndexError RuntimeError NotImplementedError StopIteration StopAsyncIteration OSError IOError ' +
  'UnicodeDecodeError AttributeError').split(' '));

const PY_RE = new RegExp([
  '(#[^\\n]*)',                                            // 1 comment
  '([rbfuRBFU]{0,3}[\"]{3}[\\s\\S]*?[\"]{3}|[rbfuRBFU]{0,3}[\']{3}[\\s\\S]*?[\']{3})',   // 2 triple str
  '([rbfuRBFU]{0,3}"(?:\\\\.|[^"\\\\\\n])*"|[rbfuRBFU]{0,3}\'(?:\\\\.|[^\'\\\\\\n])*\')', // 3 str
  '(@[A-Za-z_][\\w.]*)',                                   // 4 decorator
  '\\b(?:def|class)\\s+([A-Za-z_]\\w*)',                   // 5 def name
  '\\b(\\d[\\w.]*)\\b',                                    // 6 number
  '\\b([A-Za-z_]\\w*)\\b'                                  // 7 word
].join('|'), 'g');

function pyHighlight(code) {
  let out = '', last = 0, m;
  PY_RE.lastIndex = 0;
  while ((m = PY_RE.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    if (m[1]) out += '<span class="tk-c">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="tk-s">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="tk-s">' + esc(m[3]) + '</span>';
    else if (m[4]) out += '<span class="tk-d">' + esc(m[4]) + '</span>';
    else if (m[5]) {
      const kw = m[0].slice(0, m[0].length - m[5].length);
      out += '<span class="tk-k">' + esc(kw.trimEnd()) + '</span>' +
             esc(kw.slice(kw.trimEnd().length)) + '<span class="tk-def">' + esc(m[5]) + '</span>';
    }
    else if (m[6]) out += '<span class="tk-n">' + esc(m[6]) + '</span>';
    else if (m[7]) {
      const w = m[7];
      if (PY_KW.has(w)) out += '<span class="tk-k">' + esc(w) + '</span>';
      else if (PY_BI.has(w)) out += '<span class="tk-b">' + esc(w) + '</span>';
      else out += esc(w);
    }
    last = m.index + m[0].length;
  }
  out += esc(code.slice(last));
  return out;
}

function codeBlock(src, startLine, opts) {
  opts = opts || {};
  const lines = src.replace(/\r/g, '').split('\n');
  const hl = pyHighlight(lines.join('\n')).split('\n');
  let rows = '';
  for (let i = 0; i < lines.length; i++) {
    const n = (startLine || 1) + i;
    rows += '<tr id="' + (opts.anchorPrefix || '') + 'L' + n + '"><td class="ln">' + n +
            '</td><td class="cd">' + (hl[i] || ' ') + '</td></tr>';
  }
  return '<pre class="code' + (opts.full ? ' full' : '') + '"><table><tbody>' + rows + '</tbody></table></pre>';
}

/* --------------------------------------------------------------- badges */
function flavorMeta(c) {
  if (c.flavor === 'enum')      return ['enm', 'b-enum', 'enum'];
  if (c.flavor === 'dataclass') return ['dcl', 'b-data', 'dataclass'];
  if (c.flavor === 'pydantic')  return ['pyd', 'b-pyd', 'pydantic'];
  return ['cls', 'b-class', 'class'];
}

function renderSig(fn) {
  let s = '<span class="pn">' + esc(fn.name) + '</span>(';
  const parts = fn.params.map(p => {
    let t = '';
    if (p.kind === 'vararg') t += '*';
    if (p.kind === 'kwarg') t += '**';
    t += '<span class="pn">' + esc(p.name) + '</span>';
    if (p.annotation) t += ': <span class="an">' + esc(p.annotation) + '</span>';
    if (p.default !== null && p.default !== undefined) t += ' = <span class="dv">' + esc(p.default) + '</span>';
    return t;
  });
  const long = parts.join(', ').replace(/<[^>]+>/g, '').length > 74;
  s += long ? '\n    ' + parts.join(',\n    ') + '\n' : parts.join(', ');
  s += ')';
  if (fn.returns) s += ' &rarr; <span class="rt">' + esc(fn.returns) + '</span>';
  return s;
}

let uid = 0;
function srcToggle(src, line) {
  const id = 'src' + (uid++);
  return '<button class="srcbtn" data-t="' + id + '">Quelle</button>' +
         '<div class="hidden" id="' + id + '" style="margin-top:9px">' + codeBlock(src, line) + '</div>';
}

function paramTable(fn) {
  const ps = fn.params.filter(p => !(fn.is_method && (p.name === 'self' || p.name === 'cls')));
  if (!ps.length) return '';
  let r = '';
  for (const p of ps) {
    r += '<tr><td class="mono">' + esc(p.name) + (p.kind === 'kwonly' ? ' <span class="tag">kw-only</span>' : '') +
         '</td><td class="mono">' + (p.annotation ? esc(p.annotation) : '<span style="color:var(--ink3)">—</span>') +
         '</td><td class="mono">' + (p.default !== null && p.default !== undefined
            ? esc(p.default) : '<span class="req">erforderlich</span>') + '</td></tr>';
  }
  return '<div class="tbl-wrap"><table><thead><tr><th>Parameter</th><th>Typ</th><th>Default</th>' +
         '</tr></thead><tbody>' + r + '</tbody></table></div>';
}

function xrefFor(name) {
  const u = DATA.xref[name];
  if (!u || !u.length) return '';
  const links = u.slice(0, 14).map(x =>
    '<a class="tag" href="#/m/' + encodeURIComponent(x[0]) + '#' + x[1] + '">' + esc(x[1]) + '</a>').join('');
  return '<div style="margin-top:9px"><span style="font-size:11px;color:var(--ink3)">Aufgerufen von</span>' +
         '<div class="chips" style="margin-top:5px">' + links +
         (u.length > 14 ? '<span class="tag">+' + (u.length - 14) + '</span>' : '') + '</div></div>';
}

function fnCard(fn, mod, owner) {
  const cls = fn.route ? 'rte' : 'fnc';
  let badges = '';
  if (fn.async) badges += '<span class="b b-async">async</span>';
  if (fn.route) badges += '<span class="b b-route">' + fn.route.method + '</span>';
  else badges += '<span class="b b-func">' + (fn.is_method ? 'method' : 'function') + '</span>';
  if (fn.private) badges += '<span class="b b-priv">intern</span>';
  for (const d of fn.decorators) {
    if (/abstractmethod/.test(d)) badges += '<span class="b b-abs">abstract</span>';
    else if (/staticmethod/.test(d)) badges += '<span class="b b-priv">static</span>';
    else if (/classmethod/.test(d)) badges += '<span class="b b-priv">classmethod</span>';
    else if (/property/.test(d)) badges += '<span class="b b-priv">property</span>';
  }
  const anchor = (owner ? owner + '.' : '') + fn.name;
  let h = '<div class="sym ' + cls + '" id="' + esc(anchor) + '">';
  h += '<div class="symhead"><div class="symname">' +
       (owner ? '<span class="own">' + esc(owner) + '.</span>' : '') + esc(fn.name) +
       '</div><div class="chips">' + badges + '</div>' +
       '<div style="margin-left:auto"><a class="tag" href="#/src/' + encodeURIComponent(mod.path) +
       '#L' + fn.lineno + '">Zeile ' + fn.lineno + '</a></div></div>';
  h += '<div class="sigline">' + renderSig(fn) + '</div>';
  h += '<div class="symbody">';
  if (fn.doc) h += '<div class="doc">' + esc(fn.doc) + '</div>';
  h += paramTable(fn);
  if (fn.raises.length)
    h += '<div class="chips" style="margin:6px 0"><span style="font-size:11px;color:var(--ink3)">Wirft</span>' +
         fn.raises.slice(0, 8).map(r => '<span class="tag warn">' + esc(r) + '</span>').join('') + '</div>';
  h += xrefFor(fn.name);
  h += '<div style="margin-top:10px">' + srcToggle(fn.source, fn.lineno) + '</div>';
  h += '</div></div>';
  return h;
}

function clsCard(c, mod) {
  const [k, badge, label] = flavorMeta(c);
  let h = '<div class="sym ' + k + '" id="' + esc(c.name) + '">';
  h += '<div class="symhead"><div class="symname">' + esc(c.name) + '</div><div class="chips">' +
       '<span class="b ' + badge + '">' + label + '</span>' +
       (c.bases.length ? c.bases.map(b => '<span class="b b-mod">' + esc(b) + '</span>').join('') : '') +
       '</div><div style="margin-left:auto"><a class="tag" href="#/src/' + encodeURIComponent(mod.path) +
       '#L' + c.lineno + '">Zeile ' + c.lineno + '</a></div></div>';
  h += '<div class="symbody">';
  if (c.doc) h += '<div class="doc">' + esc(c.doc) + '</div>';
  if (c.fields.length) {
    let r = '';
    for (const f of c.fields) {
      r += '<tr><td class="mono">' + esc(f.name) + '</td><td class="mono">' +
           (f.annotation ? esc(f.annotation) : '<span style="color:var(--ink3)">—</span>') +
           '</td><td class="mono">' + (f.default != null ? esc(f.default)
             : (c.flavor === 'enum' ? '' : '<span class="req">erforderlich</span>')) + '</td></tr>';
    }
    h += '<div class="tbl-wrap"><table><thead><tr><th>' +
         (c.flavor === 'enum' ? 'Member' : 'Feld') + '</th><th>Typ</th><th>' +
         (c.flavor === 'enum' ? 'Wert' : 'Default') + '</th></tr></thead><tbody>' + r + '</tbody></table></div>';
  }
  h += xrefFor(c.name);
  if (!c.methods.length) h += '<div style="margin-top:10px">' + srcToggle(c.source, c.lineno) + '</div>';
  h += '</div></div>';
  for (const m of c.methods) h += '<div style="margin-left:18px">' + fnCard(m, mod, c.name) + '</div>';
  return h;
}

/* ------------------------------------------------------------- module page */
function modulePage(mod) {
  let h = '<div class="wrap">';
  h += '<div class="crumb">' + esc(DATA.package) + ' / ' + esc(mod.path) + '</div>';
  h += '<h1>' + esc(mod.name) + '</h1>';
  h += '<div class="chips" style="margin:10px 0 4px">' +
       '<span class="tag">' + mod.loc + ' Zeilen</span>' +
       '<span class="tag">' + mod.classes.length + ' Klassen</span>' +
       '<span class="tag">' + mod.functions.length + ' Funktionen</span>' +
       '<span class="tag">' + mod.constants.length + ' Konstanten</span>' +
       '<a class="tag" href="#/src/' + encodeURIComponent(mod.path) + '">Ganze Datei ansehen</a></div>';
  if (mod.doc) h += '<div class="doc" style="margin-top:14px">' + esc(mod.doc) + '</div>';
  if (DATA.notes && DATA.notes[mod.path]) h += DATA.notes[mod.path];

  if (mod.imports.length) {
    h += '<h2 id="__imports">Imports</h2>';
    const own = mod.imports.filter(i => /^from \.|^from PythonModule|^import PythonModule/.test(i));
    const ext = mod.imports.filter(i => own.indexOf(i) === -1);
    const box = (title, arr) => arr.length
      ? '<h3>' + title + '</h3>' + codeBlock(arr.join('\n'), 1, { full: true }) : '';
    h += box('Projektintern', own) + box('Extern / Stdlib', ext);
  }

  if (mod.constants.length) {
    h += '<h2 id="__consts">Konstanten</h2>';
    let r = '';
    for (const c of mod.constants) {
      const v = c.big
        ? '<button class="srcbtn" data-t="c' + uid + '">' + c.value.length + ' Zeichen anzeigen</button>' +
          '<div class="hidden" id="c' + (uid++) + '" style="margin-top:6px">' +
          codeBlock(c.value, 1, { full: true }) + '</div>'
        : '<span class="mono">' + esc(c.value) + '</span>';
      r += '<tr><td class="mono" style="white-space:nowrap">' + esc(c.name) + '</td><td>' + v + '</td></tr>';
    }
    h += '<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Wert</th></tr></thead><tbody>' +
         r + '</tbody></table></div>';
  }

  if (mod.classes.length) {
    h += '<h2 id="__classes">Klassen</h2>';
    for (const c of mod.classes) h += clsCard(c, mod);
  }
  if (mod.functions.length) {
    h += '<h2 id="__functions">Funktionen</h2>';
    for (const f of mod.functions) h += fnCard(f, mod, null);
  }
  h += '</div>';
  return h;
}

function sourcePage(mod) {
  let h = '<div class="wrap">';
  h += '<div class="crumb"><a class="x" href="#/m/' + encodeURIComponent(mod.path) + '">&larr; ' +
       esc(mod.name) + '</a></div>';
  h += '<h1>' + esc(mod.path) + '</h1>';
  h += '<p class="lede">Vollständiger Quelltext, ' + mod.loc +
       ' Zeilen. Zeilennummern sind verlinkbar (<span class="mono">#L42</span>).</p>';
  h += codeBlock(mod.source, 1, { full: true });
  h += '</div>';
  return h;
}

/* ---------------------------------------------------------------- sidebar */
function buildTree() {
  const root = { dirs: {}, files: [] };
  for (const m of MODS) {
    const parts = m.path.split('/');
    let node = root;
    for (let i = 0; i < parts.length - 1; i++) {
      node.dirs[parts[i]] = node.dirs[parts[i]] || { dirs: {}, files: [] };
      node = node.dirs[parts[i]];
    }
    node.files.push(m);
  }
  const render = (node, depth) => {
    let h = '';
    for (const name of Object.keys(node.dirs).sort()) {
      const d = node.dirs[name];
      h += '<div class="dir' + (depth > 0 ? ' closed' : '') + '">' +
           '<div class="dirhead"><span class="car">&#9660;</span>' + esc(name) + '/</div>' +
           '<div class="dirkids">' + render(d, depth + 1) + '</div></div>';
    }
    for (const f of node.files.sort((a, b) => a.path.localeCompare(b.path))) {
      const base = f.path.split('/').pop();
      const n = f.classes.length + f.functions.length;
      h += '<a class="modlink" data-p="' + esc(f.path) + '" href="#/m/' + encodeURIComponent(f.path) + '">' +
           esc(base) + '<span class="cnt">' + (n || '') + '</span></a>';
    }
    return h;
  };
  q1('#tree').innerHTML = render(root, 0);
  q1('#tree').addEventListener('click', e => {
    const dh = e.target.closest('.dirhead');
    if (dh) dh.parentElement.classList.toggle('closed');
  });
}

/* ----------------------------------------------------------------- search */
const INDEX = [];
(function buildIndex() {
  for (const p of DATA.pages_index) INDEX.push({ n: p.title, k: 'seite', h: p.hash, p: p.sub || '' });
  for (const m of MODS) {
    INDEX.push({ n: m.name, k: 'modul', h: '#/m/' + encodeURIComponent(m.path), p: m.path });
    for (const c of m.classes) {
      INDEX.push({ n: c.name, k: c.flavor, h: '#/m/' + encodeURIComponent(m.path) + '#' + c.name, p: m.path });
      for (const f of c.methods)
        INDEX.push({ n: c.name + '.' + f.name, k: 'method', h: '#/m/' + encodeURIComponent(m.path) + '#' + c.name + '.' + f.name, p: m.path });
    }
    for (const f of m.functions) {
      const kind = f.route ? f.route.method : 'function';
      INDEX.push({ n: f.name, k: kind, h: '#/m/' + encodeURIComponent(m.path) + '#' + f.name, p: m.path,
                   extra: f.route ? f.route.path : '' });
    }
    for (const c of m.constants)
      INDEX.push({ n: c.name, k: 'const', h: '#/m/' + encodeURIComponent(m.path) + '#__consts', p: m.path });
  }
})();

function score(name, term) {
  const n = name.toLowerCase();
  const i = n.indexOf(term);
  if (i === -1) return -1;
  let s = 100 - i;
  if (i === 0) s += 60;
  if (n === term) s += 200;
  s -= Math.min(name.length, 40) * 0.3;
  return s;
}
function markHit(name, term) {
  const i = name.toLowerCase().indexOf(term);
  if (i === -1) return esc(name);
  return esc(name.slice(0, i)) + '<span class="hl">' + esc(name.slice(i, i + term.length)) +
         '</span>' + esc(name.slice(i + term.length));
}
let selIdx = 0, curRes = [];
function runSearch(term) {
  const box = q1('#results');
  term = term.trim().toLowerCase();
  if (!term) { box.classList.remove('on'); return; }
  const out = [];
  for (const it of INDEX) {
    let s = score(it.n, term);
    if (s < 0 && it.extra) s = score(it.extra, term) - 20;
    if (s > 0) out.push([s, it]);
  }
  out.sort((a, b) => b[0] - a[0]);
  curRes = out.slice(0, 40).map(x => x[1]);
  selIdx = 0;
  if (!curRes.length) { box.innerHTML = '<div class="nores">grep: ' + esc(term) + ': kein treffer</div>'; box.classList.add('on'); return; }
  box.innerHTML = curRes.map((r, i) =>
    '<div class="res' + (i === 0 ? ' sel' : '') + '" data-h="' + esc(r.h) + '">' +
    '<span class="b b-mod">' + esc(r.k) + '</span>' +
    '<span class="nm">' + markHit(r.n, term) + '</span>' +
    '<span class="pt">' + esc(r.extra || r.p) + '</span></div>').join('');
  box.classList.add('on');
}
function moveSel(d) {
  const items = document.querySelectorAll('.res');
  if (!items.length) return;
  items[selIdx].classList.remove('sel');
  selIdx = (selIdx + d + items.length) % items.length;
  items[selIdx].classList.add('sel');
  items[selIdx].scrollIntoView({ block: 'nearest' });
}

/* ------------------------------------------------------------------ router */
function setActive(hash) {
  document.querySelectorAll('.navlink,.modlink').forEach(a => a.classList.remove('act'));
  const a = document.querySelector('[href="' + CSS.escape(hash) + '"]');
  if (a) {
    a.classList.add('act');
    let p = a.parentElement;
    while (p) { if (p.classList && p.classList.contains('dir')) p.classList.remove('closed'); p = p.parentElement; }
  }
}

function buildToc() {
  const main = q1('#main');
  const heads = [...main.querySelectorAll('h2, .sym > .symhead > .symname')];
  if (heads.length < 2) { q1('#toc').innerHTML = ''; return; }
  let h = '<h5>outline</h5>';
  for (const n of heads) {
    if (n.tagName === 'H2') {
      h += '<a href="#' + (n.id || '') + '" data-i="' + (n.id || '') + '">' + esc(n.textContent) + '</a>';
    } else {
      const box = n.closest('.sym');
      h += '<a class="lvl2" href="#' + box.id + '" data-i="' + box.id + '">' + esc(n.textContent) + '</a>';
    }
  }
  q1('#toc').innerHTML = h;
  q1('#toc').querySelectorAll('a').forEach(a => a.addEventListener('click', ev => {
    ev.preventDefault();
    const t = document.getElementById(a.dataset.i);
    if (t) t.scrollIntoView({ block: 'start' });
  }));
}

function render() {
  const raw = location.hash || '#/overview';
  const [route, frag] = raw.split(/#(?![/])/);
  const main = q1('#main');
  let html = '';
  if (route.startsWith('#/m/')) {
    const mod = BY_PATH[decodeURIComponent(route.slice(4))];
    html = mod ? modulePage(mod) : '<div class="wrap"><h1>404</h1><p>Modul nicht gefunden.</p></div>';
  } else if (route.startsWith('#/src/')) {
    const mod = BY_PATH[decodeURIComponent(route.slice(6))];
    html = mod ? sourcePage(mod) : '<div class="wrap"><h1>404</h1></div>';
  } else {
    const key = route.replace('#/', '');
    html = DATA.pages[key] || DATA.pages['overview'];
  }
  main.innerHTML = html;
  main.scrollTop = 0;
  setActive(route);
  buildToc();
  wirePage();
  updateStatus(route);
  if (frag) {
    const t = document.getElementById(frag);
    if (t) { t.scrollIntoView({ block: 'start' }); if (t.tagName === 'TR') t.classList.add('hit'); }
  }
}

function updateStatus(route) {
  const mode = q1('#stmode'), path = q1('#stpath'), info = q1('#stinfo');
  if (route.startsWith('#/m/') || route.startsWith('#/src/')) {
    const p = decodeURIComponent(route.replace(/^#\/(m|src)\//, ''));
    const mod = BY_PATH[p];
    mode.textContent = route.startsWith('#/src/') ? 'SOURCE' : 'MODULE';
    path.textContent = DATA.package + '/' + p;
    if (mod) {
      const nm = mod.classes.length + mod.functions.length +
                 mod.classes.reduce((a, c) => a + c.methods.length, 0);
      info.textContent = mod.loc + ' zeilen  ' + nm + ' symbole';
    } else info.textContent = '-';
  } else {
    mode.textContent = 'DOC';
    path.textContent = DATA.package;
    info.textContent = MODS.length + ' module  ' + DATA.total_loc + ' zeilen';
  }
}

function wirePage() {
  document.querySelectorAll('.srcbtn[data-t]').forEach(b => {
    if (b.dataset.wired) return;
    b.dataset.wired = '1';
    b.dataset.label = b.textContent;
    b.addEventListener('click', () => {
      const t = document.getElementById(b.dataset.t);
      const closed = t.classList.toggle('hidden');
      b.textContent = closed ? b.dataset.label : 'Verbergen';
    });
  });
  document.querySelectorAll('.ephead').forEach(hd => {
    if (hd.dataset.wired) return;
    hd.dataset.wired = '1';
    hd.addEventListener('click', () => hd.parentElement.querySelector('.epbody').classList.toggle('hidden'));
  });
  const pills = document.querySelectorAll('.pill[data-f]');
  pills.forEach(p => {
    if (p.dataset.wired) return;
    p.dataset.wired = '1';
    p.addEventListener('click', () => {
      pills.forEach(x => x.classList.remove('on'));
      p.classList.add('on');
      const f = p.dataset.f;
      document.querySelectorAll('.ep').forEach(e => {
        e.style.display = (f === '*' || e.dataset.m === f || e.dataset.g === f) ? '' : 'none';
      });
    });
  });
  const epq = document.getElementById('epq');
  if (epq && !epq.dataset.wired) {
    epq.dataset.wired = '1';
    epq.addEventListener('input', () => {
      const v = epq.value.toLowerCase();
      document.querySelectorAll('.ep').forEach(e => {
        e.style.display = e.dataset.s.indexOf(v) > -1 ? '' : 'none';
      });
    });
  }
}

/* -------------------------------------------------------------------- init */
buildTree();
window.addEventListener('hashchange', render);

const qi = q1('#q');
qi.addEventListener('input', () => runSearch(qi.value));
qi.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
  else if (e.key === 'Enter') {
    const s = document.querySelector('.res.sel');
    if (s) { location.hash = s.dataset.h; qi.blur(); q1('#results').classList.remove('on'); }
  } else if (e.key === 'Escape') { qi.blur(); q1('#results').classList.remove('on'); }
});
q1('#results').addEventListener('click', e => {
  const r = e.target.closest('.res');
  if (r) { location.hash = r.dataset.h; q1('#results').classList.remove('on'); qi.value = ''; }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.searchwrap')) q1('#results').classList.remove('on');
});
document.addEventListener('keydown', e => {
  if ((e.key === '/' || (e.key === 'k' && (e.ctrlKey || e.metaKey))) &&
      document.activeElement !== qi) { e.preventDefault(); qi.focus(); qi.select(); }
});

q1('#navfilter').addEventListener('input', e => {
  const v = e.target.value.toLowerCase();
  document.querySelectorAll('.modlink').forEach(a => {
    const ok = a.dataset.p.toLowerCase().indexOf(v) > -1;
    a.style.display = ok ? '' : 'none';
  });
  document.querySelectorAll('.dir').forEach(d => {
    const any = [...d.querySelectorAll('.modlink')].some(a => a.style.display !== 'none');
    d.style.display = any ? '' : 'none';
    if (v && any) d.classList.remove('closed');
  });
});

q1('#theme').addEventListener('click', () => {
  const h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
  q1('#theme').textContent = h.dataset.theme === 'dark' ? 'light' : 'dark';
});
q1('#burger').addEventListener('click', () => q1('.side').classList.toggle('open'));

render();
</script>
</body></html>
