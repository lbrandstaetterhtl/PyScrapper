)\n    return out", "is_method": false, "private": false, "dunder": false}, {"kind": "function", "name": "check_server", "qualname": "check_server", "async": false, "signature": "(reporter: Reporter, base_url: str, headers: Mapping[str, str], timeout: float = 5.0)", "params": [{"name": "reporter", "annotation": "Reporter", "default": null, "kind": "pos"}, {"name": "base_url", "annotation": "str", "default": null, "kind": "pos"}, {"name": "headers", "annotation": "Mapping[str, str]", "default": null, "kind": "pos"}, {"name": "timeout", "annotation": "float", "default": "5.0", "kind": "pos"}], "returns": "bool", "doc": null, "decorators": [], "route": null, "lineno": 508, "end_lineno": 520, "calls": ["'Server'.ljust", "C.p", "base_url.rstrip", "http_call", "reporter.out", "type"], "raises": [], "source": "def check_server(reporter: Reporter, base_url: str, headers: Mapping[str, str],\n                 timeout: float = 5.0) -> bool:\n    try:\n        response = http_call(\"GET\", base_url.rstrip(\"/\") + \"/health\", headers, None, timeout)\n        text = (C.p(f\"erreichbar (HTTP {response.status_code})\", C.GREEN)\n                if response.status_code < 400\n                else C.p(f\"antwortet mit HTTP {response.status_code}\", C.YELLOW))\n        reporter.out(f\" {C.p('Server'.ljust(11), C.GREY)}{text}\")\n        return response.status_code < 400\n    except Exception as exc:\n        reporter.out(f\" {C.p('Server'.ljust(11), C.GREY)}\"\n                     f\"{C.p('nicht erreichbar - laeuft er?', C.RED)}  ({type(exc).__name__})\")\n        return False", "is_method": false, "private": false, "dunder": false}, {"kind": "function", "name": "run_suite", "qualname": "run_suite", "async": false, "signature": "(reporter: Reporter, base_url: str, cases: list[Case], default_path: str, valid_headers: dict, args: argparse.Namespace, timeout: float, pause: float, sections: dict[str, str] | None = None)", "params": [{"name": "reporter", "annotation": "Reporter", "default": null, "kind": "pos"}, {"name": "base_url", "annotation": "str", "default": null, "kind": "pos"}, {"name": "cases", "annotation": "list[Case]", "default": null, "kind": "pos"}, {"name": "default_path", "annotation": "str", "default": null, "kind": "pos"}, {"name": "valid_headers", "annotation": "dict", "default": null, "kind": "pos"}, {"name": "args", "annotation": "argparse.Namespace", "default": null, "kind": "pos"}, {"name": "timeout", "annotation": "float", "default": null, "kind": "pos"}, {"name": "pause", "annotation": "float", "default": null, "kind": "pos"}, {"name": "sections", "annotation": "dict[str, str] | None", "default": "None", "kind": "pos"}], "returns": "None", "doc": "Fuehrt die Faelle aus und gruppiert sie nach ihrem Abschnitt.", "decorators": [], "route": null, "lineno": 523, "end_lineno": 543, "calls": ["C.p", "base_url.rstrip", "grouped.items", "grouped.setdefault", "grouped.setdefault(case.section, []).append", "perform_request", "reporter.out", "reporter.section", "time.sleep"], "raises": [], "source": "def run_suite(reporter: Reporter, base_url: str, cases: list[Case],\n              default_path: str, valid_headers: dict, args: argparse.Namespace,\n              timeout: float, pause: float, sections: dict[str, str] | None = None) -> None:\n    \"\"\"Fuehrt die Faelle aus und gruppiert sie nach ihrem Abschnitt.\"\"\"\n    grouped: dict[str, list[Case]] = {}\n    for case in cases:\n        grouped.setdefault(case.section, []).append(case)\n\n    for section_name, section_cases in grouped.items():\n        reporter.section(section_name)\n        for case in section_cases:\n            url = base_url.rstrip(\"/\") + (case.path or default_path)\n            headers = case.headers if case.expect == \"unauth\" else valid_headers\n            perform_request(reporter, name=case.name, method=case.method, url=url,\n                            headers=headers, expectation=case.expect, body=case.body,\n                            timeout=timeout, checks=case.checks)\n            if args.fail_fast and reporter.rows and reporter.rows[-1][1] == \"FAIL\":\n                reporter.out(C.p(\"\\n  Abbruch wegen --fail-fast.\", C.RED))\n                return\n            if pause:\n                time.sleep(pause)", "is_method": false, "private": false, "dunder": false}], "source": "\"\"\"\ntest_common.py\n==============\nGemeinsame Basis der PyScrapper-Endpoint-Tests.\n\nEnthaelt Argumentparser, .env-Zugriff, HTTP-Client (urllib, keine externen\nPakete) und die Ergebnisausgabe.\n\nAusgabe pro Fall ist eine Zeile:\n\n    <symbol> <nr>  <name>                    <status>  <dauer>  <urteil>\n\nDetails (Request, Antwort, geprueftes Verhalten) erscheinen nur bei\nAuffaelligkeiten - oder bei allen Faellen mit --verbose. Am Ende steht eine\nTabelle pro Abschnitt und eine Wiederholung aller Auffaelligkeiten.\n\nDas Logfile enthaelt dasselbe ohne Farbcodes.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport json\nimport os\nimport re\nimport socket\nimport sys\nimport time\nfrom dataclasses import dataclass, field\nfrom datetime import datetime\nfrom pathlib import Path\nfrom typing import Any, Callable, Mapping\n\nfrom urllib import error as urllib_error\nfrom urllib import request as urllib_request\n\nMODES = (\"quick\", \"normal\", \"intense\")\nRANK = {\"quick\": 0, \"normal\": 1, \"intense\": 2}\n\nMODE_HELP = {\n    \"quick\":   \"Auth und die wichtigsten Schemafaelle - wenige Sekunden\",\n    \"normal\":  \"Auth und vollstaendige Eingabepruefung - Standard\",\n    \"intense\": \"zusaetzlich Grenzwerte, Pfade, Unicode und Lastfaelle\",\n}\n\n\n# ==========================================================================\n# Farben\n# ==========================================================================\nclass C:\n    on = False\n    RESET = \"\\033[0m\"; BOLD = \"\\033[1m\"\n    RED = \"\\033[31m\"; GREEN = \"\\033[32m\"; YELLOW = \"\\033[33m\"\n    BLUE = \"\\033[34m\"; CYAN = \"\\033[36m\"; GREY = \"\\033[90m\"\n\n    @classmethod\n    def p(cls, text, *codes):\n        return \"\".join(codes) + text + cls.RESET if cls.on else text\n\n\nANSI = re.compile(r\"\\033\\[[0-9;]*m\")\n\n\ndef enable_colors(force_off: bool = False) -> None:\n    if force_off or os.environ.get(\"NO_COLOR\") or not sys.stdout.isatty():\n        C.on = False\n        return\n    if os.name == \"nt\":\n        try:\n            import ctypes\n            handle = ctypes.windll.kernel32.GetStdHandle(-11)\n            ctypes.windll.kernel32.SetConsoleMode(handle, 7)\n        except Exception:\n            C.on = False\n            return\n    C.on = True\n\n\n# ==========================================================================\n# Argumente\n# ==========================================================================\ndef add_common_arguments(parser: argparse.ArgumentParser) -> None:\n    parser.add_argument(\"mode\", nargs=\"?\", choices=MODES,\n                        help=\"Testtiefe: quick, normal oder intense (Default: normal)\")\n    parser.add_argument(\"--mode\", dest=\"mode_flag\", choices=MODES,\n                        help=\"alternative Schreibweise fuer den Modus\")\n    parser.add_argument(\"--base-url\", default=\"http://127.0.0.1:8765\",\n                        help=\"Basis-URL des Servers (Default: http://127.0.0.1:8765)\")\n    parser.add_argument(\"--verbose\", \"-v\", action=\"store_true\",\n                        help=\"Detailblock zu jedem Fall, nicht nur zu Auffaelligkeiten\")\n    parser.add_argument(\"--only\", metavar=\"TEXT\",\n                        help=\"nur Faelle ausfuehren, deren Name diesen Text enthaelt\")\n    parser.add_argument(\"--allow-external\", action=\"store_true\",\n                        help=\"auch Faelle ausfuehren, die echte externe Anfragen ausloesen \"\n                             \"(in intense automatisch aktiv)\")\n    parser.add_argument(\"--fail-fast\", action=\"store_true\",\n                        help=\"beim ersten auffaelligen Fall abbrechen\")\n    parser.add_argument(\"--no-color\", action=\"store_true\", help=\"ohne Farben ausgeben\")\n\n\ndef selected_mode(args: argparse.Namespace) -> str:\n    return args.mode_flag or args.mode or \"normal\"\n\n\ndef mode_at_least(mode: str, required: str) -> bool:\n    return RANK[mode] >= RANK[required]\n\n\n# ==========================================================================\n# .env\n# ==========================================================================\ndef load_env_value(env_file: Path, key: str) -> str | None:\n    try:\n        from dotenv import dotenv_values\n        value = dotenv_values(env_file).get(key)\n        if value:\n            return str(value)\n    except ImportError:\n        pass\n\n    if not env_file.exists():\n        return None\n    for raw in env_file.read_text(encoding=\"utf-8-sig\").splitlines():\n        line = raw.strip()\n        if not line or line.startswith(\"#\") or \"=\" not in line:\n            continue\n        current, _, value = line.partition(\"=\")\n        if current.strip() == key:\n            return value.strip().strip('\"').strip(\"'\")\n    return None\n\n\ndef mask_secret(value: str) -> str:\n    return f\"{value[:3]}***{value[-2:]}\" if len(value) > 6 else \"***\"\n\n\n# ==========================================================================\n# Fall\n# ==========================================================================\n@dataclass(slots=True)\nclass Case:\n    \"\"\"Ein Testfall.\n\n    expect  : \"unauth\" 401/403 | \"reject\" 4xx | \"accept\" 2xx | \"note\" nur notieren\n    level   : ab welchem Modus der Fall laeuft\n    external: True, wenn ein gueltiger Request echte externe Anfragen ausloest\n    checks  : was der Fall inhaltlich prueft (erscheint bei Auffaelligkeiten)\n    \"\"\"\n    name: str\n    expect: str\n    section: str = \"TESTS\"\n    body: Any = None\n    path: str = \"\"\n    headers: dict = field(default_factory=dict)\n    level: str = \"normal\"\n    external: bool = False\n    checks: str = \"\"\n    method: str = \"POST\"\n\n\n@dataclass(slots=True)\nclass TestOutcome:\n    state: str      # PASS / FAIL / NOTE\n    reason: str\n\n\n@dataclass(slots=True)\nclass HttpResponse:\n    status_code: int\n    text: str\n    headers: Mapping[str, str]\n\n    def detail(self) -> str:\n        \"\"\"Gibt das FastAPI-detail kompakt zurueck, sonst den Rohtext.\"\"\"\n        try:\n            parsed = json.loads(self.text)\n        except ValueError:\n            return self.text\n        if isinstance(parsed, dict) and \"detail\" in parsed:\n            d = parsed[\"detail\"]\n            if isinstance(d, list):\n                parts = []\n                for item in d:\n                    if isinstance(item, dict):\n                        loc = \".\".join(str(x) for x in item.get(\"loc\", [])[1:])\n                        parts.append(f\"{loc}: {item.get('msg', '')}\")\n                    else:\n                        parts.append(str(item))\n                return \" | \".join(parts)\n            return str(d)\n        return json.dumps(parsed, ensure_ascii=False)\n\n\n# ==========================================================================\n# HTTP\n# ==========================================================================\ndef _decode(raw: bytes, headers: Mapping[str, str]) -> str:\n    charset = \"utf-8\"\n    for part in headers.get(\"content-type\", \"\").split(\";\")[1:]:\n        key, sep, value = part.strip().partition(\"=\")\n        if sep and key.lower() == \"charset\" and value.strip():\n            charset = value.strip().strip('\"')\n            break\n    try:\n        return raw.decode(charset, errors=\"replace\")\n    except LookupError:\n        return raw.decode(\"utf-8\", errors=\"replace\")\n\n\ndef http_call(method: str, url: str, headers: Mapping[str, str],\n              body: Any, timeout: float) -> HttpResponse:\n    request_headers = dict(headers)\n    data = None\n    if body is not None:\n        data = json.dumps(body).encode(\"utf-8\")\n        if not any(k.lower() == \"content-type\" for k in request_headers):\n            request_headers[\"Content-Type\"] = \"application/json\"\n\n    req = urllib_request.Request(url=url, data=data,\n                                 headers=request_headers, method=method.upper())\n    try:\n        with urllib_request.urlopen(req, timeout=timeout) as resp:\n            head = {k.lower(): v for k, v in resp.headers.items()}\n            return HttpResponse(resp.status, _decode(resp.read(), head), head)\n    except urllib_error.HTTPError as exc:\n        # 4xx/5xx sind hier normale Antworten und werden bewertet, nicht geworfen.\n        head = {k.lower(): v for k, v in exc.headers.items()}\n        return HttpResponse(exc.code, _decode(exc.read(), head), head)\n\n\n# ==========================================================================\n# Standardbewertung\n# ==========================================================================\ndef evaluate(status: int, expect: str) -> TestOutcome:\n    if expect == \"unauth\":\n        if status in (401, 403):\n            return TestOutcome(\"PASS\", f\"Auth greift ({status})\")\n        if status == 404:\n            return TestOutcome(\"FAIL\", \"404 - Pfad existiert nicht, Auth ungeprueft\")\n        return TestOutcome(\"FAIL\", f\"erwartet 401 · bekommen {status} · Endpoint ungeschuetzt\")\n\n    if expect == \"reject\":\n        if status == 404:\n            return TestOutcome(\"FAIL\", \"404 - Pfad existiert nicht, Validierung ungeprueft\")\n        if 400 <= status < 500:\n            return TestOutcome(\"PASS\", f\"korrekt abgelehnt ({status})\")\n        if status >= 500:\n            return TestOutcome(\"FAIL\", f\"5xx statt 4xx · Fehler wurde nicht abgefangen ({status})\")\n        return TestOutcome(\"FAIL\", f\"erwartet 4xx · bekommen {status} · angenommen statt abgelehnt\")\n\n    if expect == \"accept\":\n        if 200 <= status < 300:\n            return TestOutcome(\"PASS\", f\"korrekt angenommen ({status})\")\n        return TestOutcome(\"FAIL\", f\"erwartet 2xx · bekommen {status}\")\n\n    return TestOutcome(\"NOTE\", f\"nur notiert ({status})\")\n\n\n# ==========================================================================\n# Ausgabe\n# ==========================================================================\nclass Reporter:\n    def __init__(self, suite: str, mode: str, base_url: str, log_file: Path,\n                 verbose: bool = False):\n        self.suite = suite\n        self.mode = mode\n        self.base_url = base_url.rstrip(\"/\")\n        self.log_file = log_file\n        self.verbose = verbose\n        self.started = time.perf_counter()\n        self.index = 0\n        self.passed = self.failed = self.noted = 0\n        self.section_name = \"-\"\n        self.rows: list[tuple] = []      # (nr, state, name, section, method, path, reason, checks)\n        self.sections: dict[str, list[int]] = {}\n        self.durations: list[tuple[float, str]] = []\n        log_file.parent.mkdir(parents=True, exist_ok=True)\n        self._fh = log_file.open(\"w\", encoding=\"utf-8\")\n        self._fh.write(f\"{suite} | mode={mode} | started={datetime.now().isoformat()}\\n\")\n\n    # ------------------------------------------------------------ basis\n    def out(self, text: str = \"\") -> None:\n        print(text)\n        self._fh.write(ANSI.sub(\"\", text) + \"\\n\")\n        self._fh.flush()\n\n    # alte API beibehalten\n    def log(self, message: str = \"\") -> None:\n        self.out(message)\n\n    def rule(self, char: str = \"─\") -> None:\n        self.out(C.p(char * 78, C.GREY))\n\n    def banner(self, target: str, script: Path, env_file: Path,\n               planned: int = 0, total: int = 0, extra: dict | None = None) -> None:\n        self.out()\n        self.out(C.p(\"═\" * 78, C.CYAN))\n        self.out(C.p(f\" {self.suite}\", C.BOLD, C.CYAN))\n        self.out(C.p(\"═\" * 78, C.CYAN))\n        rows = {\n            \"Ziel\": target,\n            \"Modus\": f\"{self.mode}  -  {MODE_HELP[self.mode]}\",\n            \"Skript\": str(script.resolve()),\n            \"ENV\": str(env_file.resolve()),\n            \"Log\": str(self.log_file.resolve()),\n        }\n        if extra:\n            rows.update(extra)\n        for key, value in rows.items():\n            self.out(f\" {C.p(key.ljust(11), C.GREY)}{value}\")\n        if total:\n            line = f\" {C.p('Faelle'.ljust(11), C.GREY)}{planned} von {total}\"\n            if total - planned:\n                line += C.p(f\"   ({total - planned} durch Modus/Filter uebersprungen)\", C.GREY)\n            self.out(line)\n        self.rule()\n\n    def section(self, title: str) -> None:\n        self.section_name = title\n        self.sections.setdefault(title, [])\n        self.out()\n        self.out(C.p(f\"▌ {title}\", C.BOLD))\n\n    def info(self, text: str) -> None:\n        self.out(C.p(f\"  i  {text}\", C.BLUE))\n\n    # ------------------------------------------------------------ fall\n    def record(self, *, name: str, method: str, url: str, expectation: str,\n               headers: Mapping[str, str], request_body: Any,\n               outcome: TestOutcome, elapsed: float,\n               response: HttpResponse | None = None, error: Exception | None = None,\n               header_name: str = \"X-Admin-Key\", checks: str = \"\") -> str:\n        self.index += 1\n        state = outcome.state\n        if state == \"PASS\":\n            self.passed += 1\n            symbol, color = \"✓\", C.GREEN\n        elif state == \"FAIL\":\n            self.failed += 1\n            symbol, color = \"✗\", C.RED\n        else:\n            self.noted += 1\n            symbol, color = \"·\", C.YELLOW\n\n        status = str(response.status_code) if response else \"---\"\n        path = url[len(self.base_url):] or \"/\"\n        self.sections.setdefault(self.section_name, []).append(self.index)\n        self.rows.append((self.index, state, name, self.section_name,\n                          method, path, outcome.reason, checks))\n        self.durations.append((elapsed, name))\n\n        self.out(\n            f\"  {C.p(symbol, color, C.BOLD)} \"\n            f\"{C.p(f'{self.index:03d}', C.GREY)}  \"\n            f\"{name[:44].ljust(44)} \"\n            f\"{C.p(status.rjust(3), color)} \"\n            f\"{C.p(f'{elapsed * 1000:>7.0f}ms', C.GREY)}  \"\n            f\"{C.p(outcome.reason, color if state != 'PASS' else C.RESET)}\"\n        )\n\n        if state == \"FAIL\" or self.verbose:\n            pad = \"         \"\n            self.out(C.p(f\"{pad}{method} {path}\", C.GREY))\n            if checks:\n                self.out(C.p(f\"{pad}prueft   {checks}\", C.GREY))\n            self.out(C.p(f\"{pad}auth     {header_name}=\"\n                         f\"{'gesetzt' if header_name in headers else 'fehlt'}\", C.GREY))\n            if request_body is not None:\n                self.out(C.p(f\"{pad}gesendet {clip(json.dumps(request_body, ensure_ascii=False))}\",\n                             C.GREY))\n            if response is not None:\n                self.out(C.p(f\"{pad}Antwort  {clip(response.detail())}\", C.GREY))\n            if error is not None:\n                self.out(C.p(f\"{pad}Fehler   {type(error).__name__}: {error}\", C.RED))\n        return state\n\n    # ------------------------------------------------------------ ende\n    def summary(self) -> int:\n        elapsed = time.perf_counter() - self.started\n        total = self.passed + self.failed + self.noted\n\n        self.out()\n        self.out(C.p(\"═\" * 78, C.CYAN))\n        self.out(C.p(\" ERGEBNIS\", C.BOLD, C.CYAN))\n        self.rule()\n        self.out(C.p(f\" {'Abschnitt'.ljust(40)}{'ok'.rjust(6)}\"\n                     f\"{'auffaellig'.rjust(12)}{'notiert'.rjust(10)}{'gesamt'.rjust(9)}\", C.GREY))\n\n        by_index = {row[0]: row for row in self.rows}\n        for name, indexes in self.sections.items():\n            if not indexes:\n                continue\n            states = [by_index[i][1] for i in indexes]\n            a = states.count(\"PASS\"); b = states.count(\"FAIL\"); n = states.count(\"NOTE\")\n            self.out(f\" {name[:40].ljust(40)}\"\n                     f\"{C.p(str(a).rjust(6), C.GREEN if a else C.GREY)}\"\n                     f\"{C.p(str(b).rjust(12), C.RED if b else C.GREY)}\"\n                     f\"{C.p(str(n).rjust(10), C.YELLOW if n else C.GREY)}\"\n                     f\"{str(a + b + n).rjust(9)}\")\n        self.rule()\n        self.out(f\" {C.p('Gesamt'.ljust(40), C.BOLD)}\"\n                 f\"{C.p(str(self.passed).rjust(6), C.GREEN, C.BOLD)}\"\n                 f\"{C.p(str(self.failed).rjust(12), C.RED if self.failed else C.GREY, C.BOLD)}\"\n                 f\"{C.p(str(self.noted).rjust(10), C.YELLOW if self.noted else C.GREY)}\"\n                 f\"{str(total).rjust(9)}\")\n\n        if self.durations:\n            slowest, slow_name = max(self.durations)\n            average = sum(d for d, _ in self.durations) / len(self.durations)\n            self.out(f\" {C.p('Dauer'.ljust(40), C.GREY)}{elapsed:.1f}s gesamt, \"\n                     f\"{average * 1000:.0f}ms im Schnitt, langsamster \"\n                     f\"{slowest * 1000:.0f}ms ({clip(slow_name, 40)})\")\n        self.out(f\" {C.p('Modus'.ljust(40), C.GREY)}{self.mode}\")\n        self.out(f\" {C.p('Log'.ljust(40), C.GREY)}{self.log_file.resolve()}\")\n\n        if self.failed:\n            self.out()\n            self.out(C.p(\" AUFFAELLIG\", C.RED, C.BOLD))\n            for nr, state, name, section, method, path, reason, checks in self.rows:\n                if state != \"FAIL\":\n                    continue\n                self.out(C.p(f\"  ✗ {nr:03d}  {name}\", C.RED))\n                self.out(C.p(f\"         {section} · {method} {path}\", C.GREY))\n                self.out(C.p(f\"         {reason}\", C.GREY))\n                if checks:\n                    self.out(C.p(f\"         prueft {checks}\", C.GREY))\n\n        if self.noted:\n            self.out()\n            self.out(C.p(\" NOTIERT - dokumentiertes Verhalten, nicht bewertet\", C.YELLOW))\n            for nr, state, name, section, method, path, reason, checks in self.rows:\n                if state == \"NOTE\":\n                    self.out(C.p(f\"  · {nr:03d}  {section} · {name}  →  {reason}\", C.GREY))\n\n        self.out()\n        if self.failed == 0:\n            self.out(C.p(\" OK - kein bewerteter Fall weicht ab.\", C.GREEN, C.BOLD))\n        else:\n            self.out(C.p(f\" {self.failed} von {total} Faellen weichen ab.\", C.RED, C.BOLD))\n        self.out()\n        self._fh.close()\n        return 0 if self.failed == 0 else 1\n\n\ndef clip(text: Any, limit: int = 300) -> str:\n    text = str(text).replace(\"\\r\", \"\\\\r\").replace(\"\\n\", \"\\\\n\")\n    text = \" \".join(text.split())\n    return text if len(text) <= limit else f\"{text[:limit]} … (+{len(text) - limit} Zeichen)\"\n\n\n# ==========================================================================\n# Ausfuehrung\n# ==========================================================================\ndef perform_request(reporter: Reporter, *, name: str, method: str, url: str,\n                    headers: Mapping[str, str], expectation: str,\n                    evaluator: Callable[[int, str, str], TestOutcome] | None = None,\n                    body: Any = None, timeout: float = 10.0,\n                    header_name: str = \"X-Admin-Key\", checks: str = \"\") -> str:\n    started = time.perf_counter()\n    try:\n        response = http_call(method, url, headers, body, timeout)\n        elapsed = time.perf_counter() - started\n        outcome = (evaluator(response.status_code, expectation, response.text)\n                   if evaluator else evaluate(response.status_code, expectation))\n        return reporter.record(name=name, method=method, url=  args.allow_external or mode == \"intense\"\n    out = []\n    for case in cases:\n        if not mode_at_least(mode, case.level):\n            continue\n        if case.external and not allow_external:\n            continue\n        if args.only and args.only.lower() not in case.name.lower():\n            continue\n        out.append(case)\n    return out\n\n\ndef check_server(reporter: Reporter, base_url: str, headers: Mapping[str, str],\n                 timeout: float = 5.0) -> bool:\n    try:\n        response = http_call(\"GET\", base_url.rstrip(\"/\") + \"/health\", headers, None, timeout)\n        text = (C.p(f\"erreichbar (HTTP {response.status_code})\", C.GREEN)\n                if response.status_code < 400\n                else C.p(f\"antwortet mit HTTP {response.status_code}\", C.YELLOW))\n        reporter.out(f\" {C.p('Server'.ljust(11), C.GREY)}{text}\")\n        return response.status_code < 400\n    except Exception as exc:\n        reporter.out(f\" {C.p('Server'.ljust(11), C.GREY)}\"\n                     f\"{C.p('nicht erreichbar - laeuft er?', C.RED)}  ({type(exc).__name__})\")\n        return False\n\n\ndef run_suite(reporter: Reporter, base_url: str, cases: list[Case],\n              default_path: str, valid_headers: dict, args: argparse.Namespace,\n              timeout: float, pause: float, sections: dict[str, str] | None = None) -> None:\n    \"\"\"Fuehrt die Faelle aus und gruppiert sie nach ihrem Abschnitt.\"\"\"\n    grouped: dict[str, list[Case]] = {}\n    for case in cases:\n        grouped.setdefault(case.section, []).append(case)\n\n    for section_name, section_cases in grouped.items():\n        reporter.section(section_name)\n        for case in section_cases:\n            url = base_url.rstrip(\"/\") + (case.path or default_path)\n            headers = case.headers if case.expect == \"unauth\" else valid_headers\n            perform_request(reporter, name=case.name, method=case.method, url=url,\n                            headers= (WAL)<\/text><text class=\"svg-s\" x=\"711\" y=\"233\">Data/data.db, 5 tables<\/text><path class=\"svg-l\" d=\"M596,44 H698\" stroke-width=\"1.2\"/><path class=\"svg-l\" d=\"M596,168 H660 V224 H698\" stroke-width=\"1.2\"/><path class=\"svg-l\" d=\"M596,230 H698\" stroke-width=\"1.2\"/><\/svg><\/div>\n<h2 id=\"layout\">What lives where<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>File<\/th><th>Role<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"mono\"><a class=\"x\" href=\"#/m/server.py\">server.py<\/a><\/td>\n<td>The whole application: state, auth, all 38 routes, SQLite access<\/td><\/tr>\n<tr><td class=\"mono\"><a class=\"x\" href=\"#/m/serverBak.py\">serverBak.py<\/a><\/td>\n<td>Older revision without streaming and without <span class=\"mono\">ServerState<\/span>. Nothing imports it.<\/td><\/tr>\n<tr><td class=\"mono\">tests/<\/td><td>Standalone scripts that run against a live server, plus a shared harness<\/td><\/tr>\n<tr><td class=\"mono\">scripts/startServer.ps1<\/td><td>Starts uvicorn, prefers the venv inside the server folder<\/td><\/tr>\n<tr><td class=\"mono\">installer/server-installer.iss<\/td><td>Inno Setup script for the Windows installer<\/td><\/tr>\n<tr><td class=\"mono\">.env<\/td><td>Holds <span class=\"mono\">ADMIN_KEY<\/span>. Not part of this documentation.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n\n<h2 id=\"state\">The state<\/h2>\n<p>One global <a class=\"x\" href=\"#/m/server.py#ServerState\">ServerState<\/a> object holds\neverything transient. It does not survive a restart &mdash; download jobs are deliberately not\npersisted.<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Field<\/th><th>Meaning<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"mono\">jobs<\/td><td>task_id &rarr; ServerJob, holding the contexts and the stream jobs<\/td><\/tr>\n<tr><td class=\"mono\">log_queue<\/td><td>Queue capped at 5000 lines; one task drains it into the log file<\/td><\/tr>\n<tr><td class=\"mono\">download_limiter<\/td><td>Semaphore, at most 10 downloads in parallel<\/td><\/tr>\n<tr><td class=\"mono\">search_limiter<\/td><td>Semaphore, at most 10 searches in parallel<\/td><\/tr>\n<tr><td class=\"mono\">quit_event<\/td><td>Set by the <span class=\"mono\">/command<\/span> endpoint<\/td><\/tr>\n<tr><td class=\"mono\">download_path<\/td><td>Base directory downloads are written to<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><span class=\"mono\">cleanup_loop()<\/span> runs in the background, checks every ten minutes and\ndiscards jobs older than 24 hours. Individual streams are cleaned up by\n<span class=\"mono\">cleanup_download()<\/span> a short while after they were fetched.<\/p>\n\n<h2 id=\"auth\">Authentication<\/h2>\n<p>There are three header-based schemes now, and most routes combine two of them.<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Header<\/th><th>Dependency<\/th><th>Checks<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"mono\">X-Admin-Key<\/td><td class=\"mono\"><a class=\"x\" href=\"#/m/server.py#require_admin\">require_admin<\/a><\/td>\n<td>Constant-time compare against <span class=\"mono\">ADMIN_KEY<\/span> from the .env. Guards the server as a whole.<\/td><\/tr>\n<tr><td class=\"mono\">X-User-Key + Auth<\/td><td class=\"mono\"><a class=\"x\" href=\"#/m/server.py#require_user\">require_user<\/a><\/td>\n<td>Looks the user up by the identifier in <span class=\"mono\">Auth<\/span>, compares the key with\n<span class=\"mono\">secrets.compare_digest<\/span>, returns the user row<\/td><\/tr>\n<tr><td class=\"mono\">Auth<\/td><td class=\"mono\"><a class=\"x\" href=\"#/m/server.py#require_auth\">require_auth<\/a><\/td>\n<td>Only asserts the header exists; the endpoint decides whether it matches the record<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>On top of the dependencies there is a second, per-record layer.\n<a class=\"x\" href=\"#/m/server.py#check_user_identifier\">check_user_identifier()<\/a> compares the\nidentifier in the <span class=\"mono\">Auth<\/span> header with the one on the record.\n<a class=\"x\" href=\"#/m/server.py#owns_record\">owns_record()<\/a> does the same for tables that carry\na <span class=\"mono\">UserIdentifier<\/span> column, and refuses any table not in the\n<span class=\"mono\">OWNED_TABLES<\/span> allowlist &mdash; that allowlist is what keeps the table name\nout of the SQL string unchecked. <span class=\"mono\">owns_playlist()<\/span> is a thin wrapper for\nthe Playlists case.<\/p>\n<p>Unknown identifier and wrong key deliberately produce the same 401, so valid identifiers cannot\nbe enumerated through the error message. Both cases write a WARN line to the log queue.<\/p>\n<div class=\"note risk\"><b>The stored key is hashed, the comparison still is not<\/b>\n<p><a class=\"x\" href=\"#/m/server.py#handle_create_user_req\">/create/user/<\/a> stores\n<code>hash_api_key(req.apikey)<\/code>, i.e. the SHA-256 hex digest.\n<code>require_user<\/code> computes <code>request_api_key_hash<\/code> from the incoming\n<code>X-User-Key<\/code> &mdash; and then never uses it: the comparison a few lines below is still\n<code>compare_digest(request_api_key, row[\"ApiKey\"])<\/code>, plaintext against digest. The variable\nsits there unused, so the fix looks applied but is not. As written, user authentication only\nsucceeds if the client sends the hex digest itself rather than the key. Passing\n<code>request_api_key_hash<\/code> into <code>compare_digest<\/code> closes it.<\/p><\/div>\n<div class=\"note risk\"><b>The keys do not protect the stream routes<\/b>\n<p>All <code>/stream/...<\/code> routes and <code>/download/progress/...<\/code> carry no security\ndependency, because a <code>&lt;video&gt;<\/code> tag cannot set its own headers. Anyone who knows a\nvalid <code>task_id<\/code> and <code>stream_id<\/code> reaches the content without a key. Both are\nUUIDs, and that is the only protection.<\/p>\n<p>The CORS configuration adds to this: <code>allow_origins=[\"*\"]<\/code> together with\n<code>allow_credentials=True<\/code>. Browsers reject that combination anyway, and for a service on\nlocalhost a fixed origin list is the appropriate setting.<\/p><\/div>\n<\/div>\n", "endpoints": "<div class=\"wrap\">\n<div class=\"crumb\">LocalServer / API<\/div>\n<h1>Endpoints<\/h1>\n<p class=\"lede\">38 routes, all of them in <span class=\"mono\">server.py<\/span>. Click a row for parameters, response model and a jump into the source.<\/p>\n<div class=\"epfilter\">\n  <span class=\"pill on\" data-f=\"*\">all 38<\/span>\n  <span class=\"pill\" data-f=\"Download &amp; streaming\">Download &amp; streaming 6<\/span><span class=\"pill\" data-f=\"Search\">Search 1<\/span><span class=\"pill\" data-f=\"Auth\">Auth 3<\/span><span class=\"pill\" data-f=\"CRUD\">CRUD 25<\/span><span class=\"pill\" data-f=\"System\">System 3<\/span>\n  <span class=\"pill\" data-f=\"GET\">GET<\/span><span class=\"pill\" data-f=\"POST\">POST<\/span>\n<\/div>\n<input id=\"epq\" placeholder=\"search path or handler\" spellcheck=\"false\"\n       style=\"width:100%;height:32px;padding:0 10px;border:1px solid var(--line2);border-radius:6px;background:var(--surface2);color:var(--ink);font-family:var(--mono);font-size:12.5px;margin-bottom:6px\">\n\n<h2 id=\"gdown\">Download & streaming<\/h2>\n<div class=\"ep\" data-m=\"POST\" data-g=\"Download &amp; streaming\" data-s=\"post /download/video-audio receive_download() download &amp; streaming\"><div class=\"ephead\"><span class=\"m m-POST\">POST<\/span><span class=\"eppath\">/download/video-audio<\/span><span class=\"epfn\">receive_download()<\/span><\/div><div class=\"epbody hidden\"><div class=\"chips\" style=\"margin:11px 0\"><span class=\"tag\">X-User-Key + Auth<\/span><span class=\"tag\">HTTPException<\/span><span class=\"tag\">core.models.errors.TaskFailedError<\/span><\/div><div class=\"tbl-wrap\"><table><thead><tr><th>Name<\/th><th>In<\/th><th>Type<\/th><\/tr><\/thead><tbody><tr><td class=\"mono\">data<\/td><td>Body<\/td><td class=\"mono\">requests.DownloadRequest<\/td><\/tr><\/tbody><\/table><\/div>
