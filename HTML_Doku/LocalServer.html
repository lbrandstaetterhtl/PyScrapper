s=\"chips\" style=\"margin:11px 0\"><span class=\"tag\">X-User-Key + Auth<\/span><span class=\"tag\">fastapi.HTTPException<\/span><\/div><div class=\"tbl-wrap\"><table><thead><tr><th>Name<\/th><th>In<\/th><th>Type<\/th><\/tr><\/thead><tbody><tr><td class=\"mono\">req<\/td><td>Body<\/td><td class=\"mono\">requests.CreatePlaylistMediaRequest<\/td><\/tr><\/tbody><\/table><\/div><div style=\"margin-top:11px\"><a class=\"tag\" href=\"#/m/server.py#handle_create_playlist_media_req\">Details &amp; source<\/a><a class=\"tag\" href=\"#/src/server.py#L1873\">line 1873<\/a><\/div><\/div><\/div>\n<div class=\"ep\" data-m=\"POST\" data-g=\"CRUD\" data-s=\"post /delete/playlistmedia handle_delete_playlist_media_req() crud\"><div class=\"ephead\"><span class=\"m m-POST\">POST<\/span><span class=\"eppath\">/delete/playlistmedia<\/span><span class=\"epfn\">handle_delete_playlist_media_req()<\/span><\/div><div class=\"epbody hidden\"><div class=\"chips\" style=\"margin:11px 0\"><span class=\"tag\">X-User-Key + Auth<\/span><span class=\"tag\">fastapi.HTTPException<\/span><\/div><div class=\"tbl-wrap\"><table><thead><tr><th>Name<\/th><th>In<\/th><th>Type<\/th><\/tr><\/thead><tbody><tr><td class=\"mono\">req<\/td><td>Body<\/td><td class=\"mono\">requests.DeletePlaylistMediaRequest<\/td><\/tr><\/tbody><\/table><\/div><div style=\"margin-top:11px\"><a class=\"tag\" href=\"#/m/server.py#handle_delete_playlist_media_req\">Details &amp; source<\/a><a class=\"tag\" href=\"#/src/server.py#L1915\">line 1915<\/a><\/div><\/div><\/div>\n<div class=\"ep\" data-m=\"GET\" data-g=\"CRUD\" data-s=\"get /get/playlistmedias/{playlist_identifier} get_playlist_medias() crud\"><div class=\"ephead\"><span class=\"m m-GET\">GET<\/span><span class=\"eppath\">/get/playlistmedias/<span class=\"prm\">{playlist_identifier}<\/span><\/span><span class=\"epfn\">get_playlist_medias()<\/span><\/div><div class=\"epbody hidden\"><div class=\"chips\" style=\"margin:11px 0\"><span class=\"tag\">X-Admin-Key<\/span><span class=\"tag\">Auth<\/span><span class=\"tag\">fastapi.HTTPException<\/span><\/div><div class=\"tbl-wrap\"><table><thead><tr><th>Name<\/th><th>In<\/th><th>Type<\/th><\/tr><\/thead><tbody><tr><td class=\"mono\">playlist_identifier<\/td><td>Path<\/td><td class=\"mono\">str<\/td><\/tr><\/tbody><\/table><\/div><div style=\"margin-top:11px\"><a class=\"tag\" href=\"#/m/server.py#get_playlist_medias\">Details &amp; source<\/a><a class=\"tag\" href=\"#/src/server.py#L1941\">line 1941<\/a><\/div><\/div><\/div>\n<div class=\"ep\" data-m=\"GET\" data-g=\"CRUD\" data-s=\"get /getuser/playlists/{user_identifier} get_user_playlists() crud\"><div class=\"ephead\"><span class=\"m m-GET\">GET<\/span><span class=\"eppath\">/getuser/playlists/<span class=\"prm\">{user_identifier}<\/span><\/span><span class=\"epfn\">get_user_playlists()<\/span><\/div><div class=\"epbody hidden\"><div class=\"chips\" style=\"margin:11px 0\"><span class=\"tag\">X-Admin-Key<\/span><span class=\"tag\">Auth<\/span><span class=\"tag\">fastapi.HTTPException<\/span><\/div><div class=\"tbl-wrap\"><table><thead><tr><th>Name<\/th><th>In<\/th><th>Type<\/th><\/tr><\/thead><tbody><tr><td class=\"mono\">user_identifier<\/td><td>Path<\/td><td class=\"mono\">str<\/td><\/tr><\/tbody><\/table><\/div><div style=\"margin-top:11px\"><a class=\"tag\" href=\"#/m/server.py#get_user_playlists\">Details &amp; source<\/a><a class=\"tag\" href=\"#/src/server.py#L1968\">line 1968<\/a><\/div><\/div><\/div>\n<h2 id=\"gsys\">System<\/h2>\n<div class=\"ep\" data-m=\"GET\" data-g=\"System\" data-s=\"get / root() system\"><div class=\"ephead\"><span class=\"m m-GET\">GET<\/span><span class=\"eppath\">/<\/span><span class=\"epfn\">root()<\/span><\/div><div class=\"epbody hidden\"><div class=\"chips\" style=\"margin:11px 0\"><span class=\"tag warn\">reachable without a key<\/span><\/div><div style=\"margin-top:11px\"><a class=\"tag\" href=\"#/m/server.py#root\">Details &amp; source<\/a><a class=\"tag\" href=\"#/src/server.py#L315\">line 315<\/a><\/div><\/div><\/div>\n<div class=\"ep\" data-m=\"POST\" data-g=\"System\" data-s=\"post /command receive_command() system\"><div class=\"ephead\"><span class=\"m m-POST\">POST<\/span><span class=\"eppath\">/command<\/span><span class=\"epfn\">receive_command()<\/span><\/div><div class=\"epbody hidden\"><div class=\"chips\" style=\"margin:11px 0\"><span class=\"tag\">X-User-Key + Auth<\/span><span class=\"tag\">HTTPException<\/span><\/div><div class=\"tbl-wrap\"><table><thead><tr><th>Name<\/th><th>In<\/th><th>Type<\/th><\/tr><\/thead><tbody><tr><td class=\"mono\">data<\/td><td>Body<\/td><td class=\"mono\">requests.CommandRequest<\/td><\/tr><\/tbody><\/table><\/div><div style=\"margin-top:11px\"><a class=\"tag\" href=\"#/m/server.py#receive_command\">Details &amp; source<\/a><a class=\"tag\" href=\"#/src/server.py#L383\">line 383<\/a><\/div><\/div><\/div>\n<div class=\"ep\" data-m=\"GET\" data-g=\"System\" data-s=\"get /health health() system\"><div class=\"ephead\"><span class=\"m m-GET\">GET<\/span><span class=\"eppath\">/health<\/span><span class=\"epfn\">health()<\/span><\/div><div class=\"epbody hidden\"><div class=\"chips\" style=\"margin:11px 0\"><span class=\"tag warn\">reachable without a key<\/span><span class=\"tag\">HTTPException<\/span><\/div><div style=\"margin-top:11px\"><a class=\"tag\" href=\"#/m/server.py#health\">Details &amp; source<\/a><a class=\"tag\" href=\"#/src/server.py#L921\">line 921<\/a><\/div><\/div><\/div>\n<\/div>", "flows": "<div class=\"wrap\">\n<div class=\"crumb\">LocalServer / flows<\/div>\n<h1>Program flows<\/h1>\n<p class=\"lede\">Every path through the server, step by step. Click a step &mdash; or use\nprev/next &mdash; to see what happens there, which errors it can raise and where it can go from\nhere. The tabs switch between flows.<\/p>\n<div class=\"flowmount\" data-flow=\"download,auth,stream,lifespan,save\"><\/div>\n\n<h2 id=\"reading\">How to read these<\/h2>\n<p>The spine on the left is the happy path in execution order. Dashed boxes are decision points;\nred ones are error exits. The buttons under &bdquo;Where it can go from here&ldquo; jump to the\nstep they name, which is how the branches and the error paths are reachable &mdash; they are not\npart of the linear sequence.<\/p>\n<p>Each step links into the source where there is a function to point at, so the flow answers\n&bdquo;what happens&ldquo; and the module page answers &bdquo;how&ldquo;.<\/p>\n<\/div>\n", "db": "<div class=\"wrap\">\n<div class=\"crumb\">LocalServer / database<\/div>\n<h1>SQLite schema<\/h1>\n<p class=\"lede\">5 tables in <span class=\"mono\">Data/data.db<\/span>, created at startup by\n<a class=\"x\" href=\"#/m/server.py#create_app_tables\">create_app_tables()<\/a>. Every identifier is\nTEXT and assigned by the client, not by the database.<\/p>\n<h3 id=\"tUsers\">Users<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Column<\/th><th>Type<\/th><th>Constraints<\/th><\/tr><\/thead><tbody><tr><td class=\"mono\">Identifier<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-enum\">PK<\/span><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">Username<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-pyd\">UNIQUE<\/span><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">PasswordHash<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">CreatedAt<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">LoggedIn<\/td><td class=\"mono\">BOOLEAN<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">ApiKey<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">LastLoggedIn<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"tDownloadedMedias\">DownloadedMedias<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Column<\/th><th>Type<\/th><th>Constraints<\/th><\/tr><\/thead><tbody><tr><td class=\"mono\">Identifier<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-enum\">PK<\/span><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">UserIdentifier<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">Url<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><\/div><\/td><\/tr><tr><td class=\"mono\">Title<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">MediaType<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">DownloadedAt<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><\/div><\/td><\/tr><tr><td class=\"mono\">DownloadPath<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-pyd\">UNIQUE<\/span><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">IsPlayable<\/td><td class=\"mono\">BOOLEAN<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"chips\" style=\"margin:9px 0 2px\"><span class=\"tag\">FOREIGN KEY (UserIdentifier) REFERENCES Users (Identifier) ON DELETE CASCADE<\/span><\/div>\n<h3 id=\"tPlaylists\">Playlists<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Column<\/th><th>Type<\/th><th>Constraints<\/th><\/tr><\/thead><tbody><tr><td class=\"mono\">Identifier<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-enum\">PK<\/span><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">UserIdentifier<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">Name<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">Description<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><\/div><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"chips\" style=\"margin:9px 0 2px\"><span class=\"tag\">FOREIGN KEY (UserIdentifier) REFERENCES Users (Identifier) ON DELETE CASCADE<\/span><\/div>\n<h3 id=\"tPlaylistMedias\">PlaylistMedias<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Column<\/th><th>Type<\/th><th>Constraints<\/th><\/tr><\/thead><tbody><tr><td class=\"mono\">PlaylistIdentifier<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">MediaIdentifier<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">Position<\/td><td class=\"mono\">INTEGER<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"chips\" style=\"margin:9px 0 2px\"><span class=\"tag\">PRIMARY KEY (PlaylistIdentifier, MediaIdentifier)<\/span><span class=\"tag\">FOREIGN KEY (PlaylistIdentifier) REFERENCES Playlists (Identifier) ON DELETE CASCADE<\/span><span class=\"tag\">FOREIGN KEY (MediaIdentifier) REFERENCES DownloadedMedias (Identifier) ON DELETE CASCADE<\/span><\/div>\n<h3 id=\"tSettings\">Settings<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Column<\/th><th>Type<\/th><th>Constraints<\/th><\/tr><\/thead><tbody><tr><td class=\"mono\">Identifier<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-enum\">PK<\/span><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">UserIdentifier<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-pyd\">UNIQUE<\/span><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">DownloadPath<\/td><td class=\"mono\">TEXT<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">DarkModeEnabled<\/td><td class=\"mono\">BOOLEAN<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><tr><td class=\"mono\">ScanFolderOnStartup<\/td><td class=\"mono\">BOOLEAN<\/td><td><div class=\"chips\"><span class=\"b b-priv\">NOT NULL<\/span><\/div><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"chips\" style=\"margin:9px 0 2px\"><span class=\"tag\">FOREIGN KEY (UserIdentifier) REFERENCES Users (Identifier) ON DELETE CASCADE<\/span><\/div>\n<h2 id=\"access\">Access patterns<\/h2>\n<p><a class=\"x\" href=\"#/m/server.py#connect_db\">connect_db()<\/a> opens the file with a 20 second\ntimeout and sets three pragmas on every connection:<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Pragma<\/th><th>Effect<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"mono\">journal_mode=WAL<\/td><td>Readers no longer block the writer, which is what a\npolling client plus a running download needs<\/td><\/tr>\n<tr><td class=\"mono\">foreign_keys=ON<\/td><td>The declared constraints and every\n<span class=\"mono\">ON DELETE CASCADE<\/span> are actually enforced<\/td><\/tr>\n<tr><td class=\"mono\">busy_timeout=5000<\/td><td>A blocked write waits five seconds instead of\nfailing immediately with <span class=\"mono\">database is locked<\/span><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Each handler opens and closes its own connection; there is no pool and no ORM layer, every\nquery is hand-written SQL with placeholders. <span class=\"mono\">row_factory<\/span> is\n<span class=\"mono\">sqlite3.Row<\/span>, so handlers index rows by column name.<\/p>\n<div class=\"note\"><b>Writes still run on the event loop<\/b>\n<p>The handlers are <code>async<\/code> but call sqlite3 directly. WAL and the busy timeout take the\nedge off, but a slow write still blocks the loop for its duration. Wrapping the database calls in\n<code>asyncio.to_thread<\/code> would move them off it entirely.<\/p><\/div>\n<div class=\"note\"><b>Ownership lives in the code, not in the schema<\/b>\n<p>Nothing in the schema restricts a row to its owner &mdash; <code>UserIdentifier<\/code> is just a\nforeign key. The actual check is <code>owns_record()<\/code> in the handler, against the\n<code>OWNED_TABLES<\/code> allowlist. A new table with a <code>UserIdentifier<\/code> column is\n<em>not<\/em> protected until it is added to that tuple.<\/p><\/div>\n<\/div>\n", "ops": "<div class=\"wrap\">\n<div class=\"crumb\">LocalServer / operations<\/div>\n<h1>Running, testing, shipping<\/h1>\n\n<h2 id=\"start\">Starting<\/h2>\n<p>The PowerShell script prefers the venv in the server folder and otherwise falls back to the\nPython on PATH. It changes into the server directory first &mdash; that matters, because\n<span class=\"mono\">Session<\/span> derives its cookie path from the working directory.<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>What<\/th><th>Value<\/th><\/tr><\/thead><tbody>\n<tr><td>Command<\/td><td class=\"mono\">python -m uvicorn server:app --host 127.0.0.1 --port 8765<\/td><\/tr>\n<tr><td>Script<\/td><td class=\"mono\">scripts/startServer.ps1<\/td><\/tr>\n<tr><td>Dependencies<\/td><td class=\"mono\">fastapi, uvicorn[standard], pydantic, certifi, yt-dlp, playwright, bcrypt, dotenv<\/td><\/tr>\n<tr><td>Secret<\/td><td class=\"mono\">ADMIN_KEY in .env next to server.py<\/td><\/tr>\n<tr><td>Log file<\/td><td class=\"mono\">logs/server_runtime.log<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>After installation Playwright also needs its browser binaries\n(<span class=\"mono\">playwright install chromium<\/span>). Without them every provider that relies on\nsniffing will fail.<\/p>\n\n<h2 id=\"tests\">Tests<\/h2>\n<p>The suite in <span class=\"mono\">tests/<\/span> needs no test runner. The scripts read the admin\nkey from the <span class=\"mono\">.env<\/span>, send real requests to a running server and write their\nresults to their own log file.<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Script<\/th><th>Covers<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"mono\"><a class=\"x\" href=\"#/m/tests%2Frun_tests.py\">run_tests.py<\/a><\/td>\n<td>Entry point that runs the other suites in turn and reports a combined result<\/td><\/tr>\n<tr><td class=\"mono\"><a class=\"x\" href=\"#/m/tests%2Ftest_common.py\">test_common.py<\/a><\/td>\n<td>Shared harness: request helpers, headers, evaluation and logging used by all suites<\/td><\/tr>\n<tr><td class=\"mono\"><a class=\"x\" href=\"#/m/tests%2Fdownload_tests.py\">download_tests.py<\/a><\/td>\n<td>Input validation of <span class=\"mono\">/download/video-audio<\/span><\/td><\/tr>\n<tr><td class=\"mono\"><a class=\"x\" href=\"#/m/tests%2Fsearch_tests.py\">search_tests.py<\/a><\/td>\n<td>The same for <span class=\"mono\">/search<\/span><\/td><\/tr>\n<tr><td class=\"mono\"><a class=\"x\" href=\"#/m/tests%2Fcreate_delete_tests.py\">create_delete_tests.py<\/a><\/td>\n<td>All create and delete routes, valid and invalid alike<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>The shape is the same everywhere: a list of cases with an expected status code, an\n<span class=\"mono\">evaluate()<\/span> function and a <span class=\"mono\">main()<\/span> that counts\nthrough them. New cases go into the constant list at the top of the file, not into the code below\nit.<\/p>\n<div class=\"note\"><b>Tests authenticate as a user now<\/b>\n<p>Because most routes moved from <code>X-Admin-Key<\/code> to <code>X-User-Key<\/code> plus\n<code>Auth<\/code>, the suites need a user that exists in the database and the matching key. The\nshared setup lives in <code>test_common.py<\/code>; a suite run against a fresh database will fail\non authentication before it ever reaches the case it meant to check.<\/p><\/div>\n\n<h2 id=\"errors\">Error handling in the routes<\/h2>\n<p>The handlers catch broadly and translate to HTTP codes. The pattern repeats:<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Caught<\/th><th>Becomes<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"mono\">ValueError, TypeError, ArgumentError<\/td><td>400, prefixed &bdquo;Invalid type for&ldquo;<\/td><\/tr>\n<tr><td class=\"mono\">TaskFailedError<\/td><td>500 with the text of the exception<\/td><\/tr>\n<tr><td class=\"mono\">sqlite3.IntegrityError<\/td><td>409 in the CRUD routes<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"note risk\"><b>UnicodeDecodeError ends up in the wrong branch<\/b>\n<p><code>UnicodeDecodeError<\/code> inherits from <code>ValueError<\/code> through\n<code>UnicodeError<\/code> and is therefore caught by the first branch. The client gets\n&bdquo;Invalid type for 'utf-8' codec can't decode byte ...&ldquo; and a 400, although the fault is\nneither the type nor the client. On top of that only <code>data<\/code> is logged, not the\nexception &mdash; so there is no traceback to look at.<\/p>\n<p>A dedicated <code>except UnicodeDecodeError<\/code> ahead of the ValueError branch and a\n<code>traceback.format_exc()<\/code> in every handler fixes both.<\/p><\/div>\n<\/div>\n"}, "pages_index": [{"title": "Overview", "hash": "#/overview", "sub": "start here"}, {"title": "Endpoints", "hash": "#/endpoints", "sub": "HTTP API"}, {"title": "Program flows", "hash": "#/flows", "sub": "interactive step-through"}, {"title": "Database", "hash": "#/db", "sub": "SQLite schema"}, {"title": "Operations", "hash": "#/ops", "sub": "start, test, errors"}, {"title": "GET /", "hash": "#/m/server.py#root", "sub": "root"}, {"title": "POST /command", "hash": "#/m/server.py#receive_command", "sub": "receive_command"}, {"title": "POST /download/video-audio", "hash": "#/m/server.py#receive_download", "sub": "receive_download"}, {"title": "GET /stream/watch/{task_id}/{stream_id}/index.m3u8", "hash": "#/m/server.py#stream_hls_index", "sub": "stream_hls_index"}, {"title": "GET /stream/watch/{task_id}/{stream_id}/segment/{segment_id}", "hash": "#/m/server.py#stream_hls_segment", "sub": "stream_hls_segment"}, {"title": "GET /stream/watch/{task_id}/{stream_id}/{file_name}.{file_type}", "hash": "#/m/server.py#client_watch_stream", "sub": "client_watch_stream"}, {"title": "GET /stream/download/{task_id}/{stream_id}", "hash": "#/m/server.py#client_download_stream", "sub": "client_download_stream"}, {"title": "GET /download/progress/{task_id}/{context_id}", "hash": "#/m/server.py#get_download_progress", "sub": "get_download_progress"}, {"title": "POST /search", "hash": "#/m/server.py#receive_search", "sub": "receive_search"}, {"title": "GET /health", "hash": "#/m/server.py#health", "sub": "health"}, {"title": "POST /save", "hash": "#/m/server.py#handle_save_user_data", "sub": "handle_save_user_data"}, {"title": "POST /set/user/loggedIn", "hash": "#/m/server.py#handle_set_logged_in", "sub": "handle_set_logged_in"}, {"title": "POST /set/user/lastLoggedIn", "hash": "#/m/server.py#handle_set_last_logged_in", "sub": "handle_set_last_logged_in"}, {"title": "GET /get/user/{identifier}", "hash": "#/m/server.py#get_user", "sub": "get_user"}, {"title": "GET /getall/users", "hash": "#/m/server.py#get_all_users", "sub": "get_all_users"}, {"title": "POST /create-tables/", "hash": "#/m/server.py#create_table", "sub": "create_table"}, {"title": "POST /create/user/", "hash": "#/m/server.py#handle_create_user_req", "sub": "handle_create_user_req"}, {"title": "POST /delete/user/{identifier}", "hash": "#/m/server.py#handle_delete_user_req", "sub": "handle_delete_user_req"}, {"title": "GET /get/playlists/{identifier}", "hash": "#/m/server.py#get_playlists", "sub": "get_playlists"}, {"title": "POST /create/playlist/", "hash": "#/m/server.py#handle_create_playlist_req", "sub": "handle_create_playlist_req"}, {"title": "POST /delete/playlist/{identifier}", "hash": "#/m/server.py#handle_delete_playlist_req", "sub": "handle_delete_playlist_req"}, {"title": "GET /getall/playlists", "hash": "#/m/server.py#get_all_playlists", "sub": "get_all_playlists"}, {"title": "POST /create/downloadedmedia", "hash": "#/m/server.py#handle_create_downloaded_media_req", "sub": "handle_create_downloaded_media_req"}, {"title": "POST /delete/downloadedmedia/{identifier}", "hash": "#/m/server.py#handle_delete_downloaded_media_req", "sub": "handle_delete_downloaded_media_req"}, {"title": "GET /get/downloadedmedia/{identifier}", "hash": "#/m/server.py#get_downloaded_media", "sub": "get_downloaded_media"}, {"title": "GET /getall/downloadedmedias", "hash": "#/m/server.py#get_all_downloaded_media", "sub": "get_all_downloaded_media"}, {"title": "GET /getuser/downloadedmedias/{user_identifier}", "hash": "#/m/server.py#get_user_downloaded_medias", "sub": "get_user_downloaded_medias"}, {"title": "POST /create/settings/", "hash": "#/m/server.py#handle_create_setting_req", "sub": "handle_create_setting_req"}, {"title": "POST /delete/settings/{identifier}", "hash": "#/m/server.py#handle_delete_setting_req", "sub": "handle_delete_setting_req"}, {"title": "GET /get/settings/{user_identifier}", "hash": "#/m/server.py#get_setting", "sub": "get_setting"}, {"title": "GET /getall/settings", "hash": "#/m/server.py#get_all_settings", "sub": "get_all_settings"}, {"title": "POST /create/playlistmedia", "hash": "#/m/server.py#handle_create_playlist_media_req", "sub": "handle_create_playlist_media_req"}, {"title": "POST /delete/playlistmedia", "hash": "#/m/server.py#handle_delete_playlist_media_req", "sub": "handle_delete_playlist_media_req"}, {"title": "GET /get/playlistmedias/{playlist_identifier}", "hash": "#/m/server.py#get_playlist_medias", "sub": "get_playlist_medias"}, {"title": "GET /getuser/playlists/{user_identifier}", "hash": "#/m/server.py#get_user_playlists", "sub": "get_user_playlists"}, {"title": "POST /login", "hash": "#/m/server.py#handle_login_req", "sub": "handle_login_req"}, {"title": "POST /register", "hash": "#/m/server.py#handle_register_req", "sub": "handle_register_req"}, {"title": "POST /logout/{identifier}", "hash": "#/m/server.py#handle_logout_req", "sub": "handle_logout_req"}], "flows": {"download": {"title": "Download request", "steps": [{"id": "in", "kind": "io", "title": "POST /download/video-audio", "sub": "DownloadRequest: urls, filenames, provider, strategy", "link": "#/m/server.py#receive_download", "next": "authenticated", "detail": "<p>The client sends a list of URLs with matching file names, a provider string and a <code>download_strategie<\/code>. One request can carry several URLs &mdash; they become one job with one context per file.<\/p>"}, {"id": "auth", "kind": "decision", "title": "require_user", "sub": "X-User-Key + Auth", "link": "#/m/server.py#require_user", "next": "user row returned", "detail": "<p>Runs as a FastAPI dependency before the handler body. See the <b>Authentication<\/b> flow for what happens inside.<\/p>", "branches": [{"label": "missing or wrong key &rarr; 401", "to": "err401", "warn": true}]}, {"id": "task", "kind": "step", "title": "Create task_id and Session", "sub": "uuid4() + a fresh cookie-aware Session", "next": "per URL", "detail": "<p>The <code>task_id<\/code> is the handle the client uses for every follow-up call. The <code>Session<\/code> carries the cookie jar into the engine, which is why a login harvested by the browser layer survives across the request.<\/p>"}, {"id": "provider", "kind": "decision", "title": "_resolveProviderSearchFunction", "sub": "provider string &rarr; resolve function", "link": "#/m/server.py#_resolveProviderSearchFunction", "next": "function found", "detail": "<p><code>utils.validateProviders()<\/code> turns the string into a <code>ProviderTypes<\/code> value, then <code>PROVIDER_GETRESULTS_MAPPING<\/code> looks up the function. Two separate failure points: the alias does not resolve, or it resolves but has no entry in the mapping.<\/p>", "branches": [{"label": "unknown provider &rarr; TaskFailedError &rarr; 500", "to": "err500", "warn": true}]}, {"id": "resolve", "kind": "step", "title": "Resolve every URL in parallel", "sub": "asyncio.gather over _resolve_provider", "link": "#/m/server.py#_resolveMediaAndCreateContexts", "next": "one ProviderResult per URL", "detail": "<p>One <code>ProviderResultRequest<\/code> per URL, all dispatched at once through <code>asyncio.gather<\/code>. This is where the engine takes over: the provider loads the page, sniffs with the browser or asks yt-dlp, and scores the candidates. A browser-based provider will really open Chromium here, so this step dominates the response time.<\/p>"}, {"id": "ctx", "kind": "step", "title": "Build one DownloadContext per file", "sub": "target + media_info + output", "next": "contexts ready", "detail": "<p>Each <code>ProviderResult<\/code> becomes a <code>DownloadContext<\/code> with <code>context_id = \"{task_id}-{filename}\"<\/code>. That composite id is what the progress and stream routes take as their second path parameter.<\/p>"}, {"id": "job", "kind": "step", "title": "Register the ServerJob", "sub": "server_state.jobs[task_id]", "next": "branch on strategy", "detail": "<p>Contexts plus session plus the shared download semaphore become a <code>DownloadInformation<\/code>, wrapped in a <code>ServerJob<\/code> with a creation timestamp. It lives in memory only &mdash; a restart loses every running job, deliberately.<\/p>"}, {"id": "strategy", "kind": "decision", "title": "download_strategie?", "sub": "LOCAL, STREAM, or neither", "next": "", "detail": "<p>The single branch point of the handler. LOCAL writes files on the server and the client polls; STREAM keeps nothing on disk and hands back URLs the player pulls from.<\/p>", "branches": [{"label": "LOCAL", "to": "local"}, {"label": "STREAM", "to": "stream"}, {"label": "anything else &rarr; 500", "to": "err500", "warn": true}]}, {"id": "local", "kind": "step", "title": "LOCAL: start a background download", "sub": "_run_local_download in a fire-and-forget task", "link": "#/m/server.py#_run_local_download", "next": "resources built", "detail": "<p><code>asyncio.create_task<\/code> starts <code>DownloadDispatcher.downloadToFile()<\/code> and the handler does <em>not<\/em> await it. The response returns immediately with a <code>progress_url<\/code> per context; failures surface only in the log and in <code>download_progress<\/code>, never as an HTTP error on this request.<\/p>", "branches": [{"label": "skip to the response", "to": "resp"}]}, {"id": "stream", "kind": "decision", "title": "STREAM: per context, HLS or not?", "sub": "ServerStream registered either way", "next": "", "detail": "<p>Each context gets a <code>ServerStream<\/code> stored under <code>job.stream_jobs<\/code>. What the watch URL looks like depends on the download type.<\/p>", "branches": [{"label": "HLS", "to": "hls"}, {"label": "FILE or UMP", "to": "file"}]}, {"id": "hls", "kind": "step", "title": "HLS: pre-compute the segment list", "sub": "_getIndexSegmentsForStreaming, off the loop", "link": "#/m/server.py#_getIndexSegmentsForStreaming", "next": "watch_url ends in /index.m3u8", "detail": "<p>Runs through <code>asyncio.to_thread<\/code> because it fetches and parses the playlist synchronously. Video and audio segment lists are stored on the <code>ServerStream<\/code>, so the later <code>/index.m3u8<\/code> call is a pure in-memory lookup rather than a second fetch.<\/p>", "branches": [{"label": "continue to the response", "to": "resp"}]}, {"id": "file", "kind": "step", "title": "FILE / UMP: point at the file name", "sub": "watch_url ends in /{full_filename}", "next": "resources built", "detail": "<p>No pre-computation. The stream type is reported as <code>file<\/code> and the player will issue range requests against the watch URL.<\/p>"}, {"id": "resp", "kind": "end", "title": "Return DownloadResponse", "sub": "task_id + one Resource per context", "next": "", "detail": "<p>Every resource carries <code>progress_url<\/code>, and in STREAM mode also <code>download_url<\/code>, <code>watch_url<\/code> and <code>stream_type<\/code>. The client is expected to use these URLs verbatim rather than assembling them itself.<\/p>"}, {"id": "err401", "kind": "error", "title": "401 Unauthorized", "sub": "raised by the dependency, handler never runs", "next": "", "detail": "<p>Missing header or a key that does not match. The same message is used for an unknown identifier and a wrong key.<\/p>"}, {"id": "err500", "kind": "error", "title": "Error responses", "sub": "400 / 422 / 500 depending on the exception", "next": "", "detail": "<p>The handler catches four families and maps them:<\/p><p><code>ValueError, TypeError, ArgumentError<\/code> &rarr; <b>400<\/b> with the prefix &bdquo;Invalid type for&ldquo;. <code>TaskFailedError<\/code> &rarr; <b>500<\/b>. <code>DRMProtectedMediaError<\/code> &rarr; <b>422<\/b>, which is how an encrypted Soundcloud stream reports itself. Anything else &rarr; <b>500<\/b>.<\/p><p>Only <code>data<\/code> is logged, not the traceback &mdash; and <code>UnicodeDecodeError<\/code> lands in the 400 branch because it inherits from <code>ValueError<\/code>.<\/p>"}]}, "auth": {"title": "Authenticating a request", "steps": [{"id": "in", "kind": "io", "title": "Request arrives with headers", "sub": "X-Admin-Key, X-User-Key, Auth", "next": "which dependency does the route declare?", "detail": "<p>Three schemes exist and most routes combine two. Which apply is visible on the route in the <a class=\"x\" href=\"#/endpoints\">Endpoints<\/a> list.<\/p>"}, {"id": "admin", "kind": "decision", "title": "require_admin", "sub": "only on routes that declare it", "link": "#/m/server.py#require_admin", "next": "admin key accepted", "detail": "<p><code>secrets.compare_digest(key, ADMIN_KEY)<\/code> against the value from the <code>.env<\/code>. Constant time, so the key cannot be recovered by timing the response. This guards the server as a whole, not a particular user's data.<\/p>", "branches": [{"label": "missing or wrong &rarr; 401", "to": "reject", "warn": true}]}, {"id": "hdr", "kind": "decision", "title": "require_user: headers present?", "sub": "X-User-Key and Auth must both be non-empty", "link": "#/m/server.py#require_user", "next": "both present", "detail": "<p>Two distinct 401 messages here: <code>Missing X-User-Key<\/code> and <code>Missing Auth header<\/code>. These are the only auth errors that tell the caller what was wrong.<\/p>", "branches": [{"label": "either missing &rarr; 401", "to": "reject", "warn": true}]}, {"id": "lookup", "kind": "decision", "title": "Look the user up by Auth identifier", "sub": "SELECT ... FROM Users WHERE Identifier = ?", "next": "row found", "detail": "<p>The <code>Auth<\/code> header carries the user identifier, the <code>X-User-Key<\/code> the secret. If no row comes back the response is the generic <code>Invalid user key<\/code> &mdash; deliberately identical to the wrong-key case, so valid identifiers cannot be enumerated through the error message. A WARN line goes to the log queue.<\/p>", "branches": [{"label": "no such identifier &rarr; 401", "to": "reject", "warn": true}]}, {"id": "compare", "kind": "decision", "title": "Compare the key", "sub": "compare_digest(request_api_key, row.ApiKey)", "next": "match", "detail": "<p>The stored column holds <code>hash_api_key(apikey)<\/code>, the SHA-256 hex digest written at registration.<\/p><p><b>This is where the two sides disagree.<\/b> <code>request_api_key_hash<\/code> is computed a few lines above and then never used &mdash; the comparison still passes the raw <code>request_api_key<\/code>. Plaintext against digest never matches, so authentication only succeeds if the client sends the digest itself. Substituting <code>request_api_key_hash<\/code> into the call closes it.<\/p>", "branches": [{"label": "mismatch &rarr; 401 + WARN", "to": "reject", "warn": true}]}, {"id": "user", "kind": "step", "title": "Return the authenticated user", "sub": "row as dict, plus _PlainApiKey", "next": "handler body starts", "detail": "<p>The plaintext key is attached as <code>_PlainApiKey<\/code> for the lifetime of this one request, so <code>/get/user<\/code> can hand it back to the same client. It is never written anywhere.<\/p>"}, {"id": "own", "kind": "decision", "title": "Ownership check inside the handler", "sub": "check_user_identifier / check_owner / owns_record", "link": "#/m/server.py#owns_record", "next": "caller owns the record", "detail": "<p>Authentication proves <em>who<\/em> is calling; this proves the record is theirs. <code>check_user_identifier()<\/code> compares against a user row, <code>check_owner()<\/code> against a <code>UserIdentifier<\/code> column, and <code>owns_record(table, ...)<\/code> looks the row up first.<\/p><p><code>owns_record<\/code> raises <code>ValueError<\/code> for any table outside <code>OWNED_TABLES<\/code> &mdash; that allowlist is what keeps an unchecked table name out of the SQL string. A new table with a <code>UserIdentifier<\/code> column is <b>not<\/b> protected until it is added there.<\/p>", "branches": [{"label": "not the owner &rarr; 403", "to": "reject", "warn": true}]}, {"id": "run", "kind": "end", "title": "Handler runs", "sub": "the actual endpoint body", "next": "", "detail": "<p>From here the route does its own work. A missing record returns <code>False<\/code> from the ownership helpers rather than a 404, so the caller cannot tell &bdquo;does not exist&ldquo; from &bdquo;not yours&ldquo;.<\/p>"}, {"id": "reject", "kind": "error", "title": "Rejected", "sub": "401 Unauthorized or 403 Forbidden", "next": "", "detail": "<p>401 means the caller was not identified, 403 that they were identified but the record is not theirs. Both write a WARN line into the log queue with the identifier that was attempted.<\/p>"}]}, "stream": {"title": "HLS playback", "steps": [{"id": "have", "kind": "io", "title": "Client holds a watch_url", "sub": "from the STREAM download response", "next": "player opens it", "detail": "<p><code>/stream/watch/{task_id}/{stream_id}/index.m3u8<\/code>, handed over in the <code>DownloadResponse<\/code>. The segment list was already computed when the download request was answered.<\/p>"}, {"id": "index", "kind": "step", "title": "GET .../index.m3u8", "sub": "stream_hls_index", "link": "#/m/server.py#stream_hls_index", "next": "playlist returned", "detail": "<p>Looks up the job and the stream job in <code>server_state<\/code> and renders a playlist whose entries point back at this server, one <code>/segment/{n}<\/code> per segment. The original CDN URLs never reach the player.<\/p>"}, {"id": "seg", "kind": "step", "title": "Player pulls each segment", "sub": "stream_hls_segment, one request per segment", "link": "#/m/server.py#stream_hls_segment", "next": "bytes streamed back", "detail": "<p>The server fetches the segment through the engine using the stored session and streams it straight through. Nothing is written to disk in STREAM mode.<\/p>"}, {"id": "noauth", "kind": "decision", "title": "No key is checked here", "sub": "no security dependency on any stream route", "next": "playback continues", "detail": "<p>A <code>&lt;video&gt;<\/code> tag cannot set request headers, so these routes carry no dependency at all. Anyone who knows a valid <code>task_id<\/code> and <code>stream_id<\/code> can pull the content. Both are UUIDs, and that is the whole protection.<\/p><p><code>/download/progress/...<\/code> is in the same position.<\/p>", "branches": [{"label": "see the CORS note on the overview", "to": "clean"}]}, {"id": "clean", "kind": "end", "title": "cleanup_download removes the stream", "sub": "delayed, after the fetch", "link": "#/m/server.py#cleanup_download", "next": "", "detail": "<p>Individual streams are dropped a while after they were retrieved. Whole jobs are dropped by <code>cleanup_loop()<\/code> once they are older than 24 hours &mdash; see the <b>Server lifecycle<\/b> flow.<\/p>"}]}, "lifespan": {"title": "Server lifecycle", "steps": [{"id": "boot", "kind": "start", "title": "uvicorn starts the app", "sub": "lifespan context entered", "link": "#/m/server.py#lifespan", "next": "background tasks", "detail": "<p>Everything below runs before the first request is served, and the teardown half runs after the last one.<\/p>"}, {"id": "logger", "kind": "step", "title": "Start the logger task", "sub": "drains log_queue into server_runtime.log", "link": "#/m/server.py#logger", "next": "", "detail": "<p>Producer/consumer: handlers call <code>log_queue.put_nowait()<\/code> and return immediately, one task does the file I/O. The queue is capped at 5000 entries.<\/p>"}, {"id": "cleanup", "kind": "step", "title": "Start cleanup_loop", "sub": "wakes every ten minutes", "link": "#/m/server.py#cleanup_loop", "next": "", "detail": "<p>Compares each job's <code>creation_timestamp<\/code> against <code>time.monotonic()<\/code> and drops anything older than 24 hours, together with its stream jobs.<\/p>"}, {"id": "tables", "kind": "step", "title": "create_app_tables()", "sub": "five CREATE TABLE IF NOT EXISTS", "link": "#/m/server.py#create_app_tables", "next": "ready", "detail": "<p>Idempotent, so a fresh database is created on first start and an existing one is left alone. Note that it only creates &mdash; a column added to the schema later will not appear in an existing file. There is no migration step.<\/p>"}, {"id": "serve", "kind": "step", "title": "yield &mdash; serving requests", "sub": "the app is live on 127.0.0.1:8765", "next": "shutdown signal", "detail": "<p>Everything in <code>ServerState<\/code> lives for exactly this window: jobs, stream jobs, both semaphores, the log queue.<\/p>"}, {"id": "quit", "kind": "decision", "title": "Shutdown requested", "sub": "Ctrl+C, or POST /command sets quit_event", "link": "#/m/server.py#receive_command", "next": "cancel the tasks", "detail": "<p><code>/command<\/code> is the client-facing way to stop the server; the desktop app uses it when it exits.<\/p>"}, {"id": "stop", "kind": "end", "title": "Cancel both background tasks", "sub": "cleanup_task and logger_task", "next": "", "detail": "<p>Cancellation is immediate. Anything still sitting in <code>log_queue<\/code> at that moment is not flushed to disk, so the tail of a crash is often missing from the log file.<\/p>"}]}, "save": {"title": "Saving user data", "steps": [{"id": "in", "kind": "io", "title": "POST /save", "sub": "one SaveDataRequest with the whole state", "link": "#/m/server.py#handle_save_user_data", "next": "checks first", "detail": "<p>The desktop app sends this once, when it exits. Playlists, media, assignments and settings all travel in a single request &mdash; nothing is written incrementally during the session.<\/p>"}, {"id": "owner", "kind": "decision", "title": "check_owner", "sub": "req.user_identifier vs the authenticated user", "next": "same user", "detail": "<p>Authentication already happened in <code>require_user<\/code>. This additionally refuses a request that tries to write <em>someone else's<\/em> data with a valid key.<\/p>", "branches": [{"label": "different user &rarr; 403", "to": "err", "warn": true}]}, {"id": "limits", "kind": "decision", "title": "Size limits", "sub": "1000 playlists, 10000 medias, id ≤ 100 chars", "next": "within limits", "detail": "<p>Straightforward DoS guards. Exceeding any of them is a 400 before a single row is touched.<\/p>", "branches": [{"label": "too large &rarr; 400", "to": "err", "warn": true}]}, {"id": "upmedia", "kind": "step", "title": "1. Upsert media", "sub": "INSERT ... ON CONFLICT(Identifier) DO UPDATE", "link": "#/m/server.py#save_user_data", "next": "", "detail": "<p>Every entry in the request is inserted or updated. The client's <code>Identifier<\/code> is the key, which is why identifiers are assigned client-side.<\/p>"}, {"id": "uppl", "kind": "step", "title": "2. Upsert playlists", "sub": "same pattern", "next": "now the deletes", "detail": "<p>Name and description are overwritten from the request.<\/p>"}, {"id": "delmedia", "kind": "step", "title": "3. Delete orphaned media", "sub": "DELETE ... WHERE Identifier NOT IN (request)", "next": "", "detail": "<p>This is what makes <code>/save<\/code> a full replacement rather than a merge: anything the client did not send is removed. <code>ON DELETE CASCADE<\/code> takes the matching <code>PlaylistMedias<\/code> rows with it &mdash; and it really fires now that <code>connect_db()<\/code> sets <code>foreign_keys=ON<\/code>.<\/p><p>An empty media list therefore deletes <em>all<\/em> of the user's media. A client that fails to load its data and then exits normally will wipe the account.<\/p>"}, {"id": "delpl", "kind": "step", "title": "4. Delete orphaned playlists", "sub": "same rule, same caveat", "next": "", "detail": "<p>Identical shape to step 3, including the empty-list case.<\/p>"}, {"id": "pm", "kind": "step", "title": "5. Rebuild the assignments", "sub": "delete all, re-insert what has both parents", "next": "", "detail": "<p><code>PlaylistMedias<\/code> is not upserted but rebuilt from scratch. Each row is checked against both parent tables first; a missing parent is skipped with a WARN line instead of failing the request. That is why a stale assignment silently disappears rather than causing an error.<\/p>"}, {"id": "settings", "kind": "step", "title": "6. Upsert the settings row", "sub": "download path, dark mode, scan on startup", "next": "commit", "detail": "<p>One row per user, guarded by the <code>UNIQUE<\/code> on <code>UserIdentifier<\/code>.<\/p>"}, {"id": "commit", "kind": "end", "title": "commit, or rollback on any error", "sub": "all six steps in one transaction", "next": "", "detail": "<p>Every step runs on one connection inside one transaction, so a failure half way leaves the previous state intact. The <code>except<\/code> rolls back and answers <b>400<\/b>; the outer handler turns anything that escapes into <b>500<\/b>.<\/p>"}, {"id": "err", "kind": "error", "title": "Rejected before any write", "sub": "403 or 400", "next": "", "detail": "<p>Both guards run before the connection is opened, so a rejected save cannot leave partial data behind.<\/p>"}]}}, "notes": {"server.py": "<div class=\"note\"><b>One file, five responsibilities<\/b>\n<p><code>server.py<\/code> holds state management, the three auth schemes, the download and stream\nlogic and the complete SQLite layer. To navigate it: the data classes are at the top, then auth and\nlifespan, from <code>receive_download<\/code> onwards the download path, and from\n<code>create_app_tables<\/code> onwards the CRUD routes.<\/p><\/div>", "serverBak.py": "<div class=\"note warn\"><b>Old revision, not active<\/b>\n<p>Nothing imports this file. It has no <code>ServerState<\/code>, no stream routes, no\n<code>/logout<\/code> and none of the user-key authentication; state lives in individual globals\ninstead. Read it for comparison, not as a template.<\/p><\/div>", "tests/test_common.py": "<div class=\"note\"><b>Shared harness<\/b>\n<p>Request helpers, headers and result evaluation for the other suites. Change a header or the\nbase URL here rather than in each suite.<\/p><\/div>"}}</script>
<script>

const DATA = JSON.parse(document.getElementById('payload').textContent);
const MODS = DATA.modules;
const BY_PATH = {};
MODS.forEach(m => BY_PATH[m.path] = m);

/* ------------------------------------------------------------------ utils */
const esc = s => (s == null ? '' : String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'));
const q1 = s => document.querySelector(s);

/* ------------------------------------------------ python syntax highlight */
const PY_KW = new Set(('False None True and as assert async await break class continue def del elif else ' +
  'except finally for from global if import in is lambda nonlocal not or pass raise return try while ' +
  'with yield match case self cls').split(' '));
const PY_BI = new Set(('abs all any bool bytes callable dict dir enumerate filter float format getattr ' +
  'hasattr int isinstance issubclass len list map max min next object open print range repr reversed ' +
  'round set setattr sorted str sum super tuple type zip Exception ValueError TypeError KeyError ' +
  'IndexError RuntimeError NotImplementedError StopIteration StopAsyncIteration OSError IOError ' +
  'UnicodeDecodeError AttributeError').split(' '));

const PY_RE = new RegExp([
  '(#[^\\n]*)',
  '([rbfuRBFU]{0,3}["]{3}[\\s\\S]*?["]{3}|[rbfuRBFU]{0,3}[\']{3}[\\s\\S]*?[\']{3})',
  '([rbfuRBFU]{0,3}"(?:\\\\.|[^"\\\\\\n])*"|[rbfuRBFU]{0,3}\'(?:\\\\.|[^\'\\\\\\n])*\')',
  '(@[A-Za-z_][\\w.]*)',
  '\\b(?:def|class)\\s+([A-Za-z_]\\w*)',
  '\\b(\\d[\\w.]*)\\b',
  '\\b([A-Za-z_]\\w*)\\b'
].join('|'), 'g');

function pyHighlight(code) {
  let out = '', last = 0, m;
  PY_RE.lastIndex = 0;
  while ((m = PY_RE.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    if (m[1]) out += '<span class="tk-c">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="tk-s">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="tk-s">' + esc(m[3]) + '</span>';
    else if (m[4]) out += '<span class="tk-d">' + esc(m[4]) + '</span>';
    else if (m[5]) {
      const kw = m[0].slice(0, m[0].length - m[5].length);
      out += '<span class="tk-k">' + esc(kw.trimEnd()) + '</span>' +
             esc(kw.slice(kw.trimEnd().length)) + '<span class="tk-def">' + esc(m[5]) + '</span>';
    }
    else if (m[6]) out += '<span class="tk-n">' + esc(m[6]) + '</span>';
    else if (m[7]) {
      const w = m[7];
      if (PY_KW.has(w)) out += '<span class="tk-k">' + esc(w) + '</span>';
      else if (PY_BI.has(w)) out += '<span class="tk-b">' + esc(w) + '</span>';
      else out += esc(w);
    }
    last = m.index + m[0].length;
  }
  out += esc(code.slice(last));
  return out;
}

const CS_KW = new Set(('abstract as async await base bool break byte case catch char checked class const ' +
  'continue decimal default delegate do double else enum event explicit extern false finally fixed float ' +
  'for foreach get goto if implicit in int interface internal is lock long namespace new null object ' +
  'operator out override params private protected public readonly record ref return sbyte sealed set short ' +
  'sizeof stackalloc static string struct switch this throw true try typeof uint ulong unchecked unsafe ' +
  'ushort using value var virtual void volatile when where while yield partial nameof').split(' '));
const CS_TYPES = new Set(('Task List Dictionary ObservableCollection IEnumerable IReadOnlyList Exception ' +
  'DateTime DateTimeOffset TimeSpan HttpClient HttpResponseMessage JsonSerializer Path File Directory ' +
  'Process Window Control Bitmap Image Uri Guid Convert Encoding Math Console CancellationToken ' +
  'ObservableObject Application Func Action Nullable StringBuilder Regex Stream').split(' '));

const CS_RE = /(\/\/\/[^\n]*|\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(@?\"(?:\"\"|\\.|[^\"\\])*\"|'(?:\\.|[^'\\])')|(\[[A-Za-z_][\w.]*(?:\([^\]]*\))?\])|\b(?:class|record|struct|interface|enum)\s+([A-Za-z_]\w*)|\b(\d[\w.]*)\b|\b([A-Za-z_]\w*)\b/g;

function csHighlight(code) {
  let out = '', last = 0, m;
  CS_RE.lastIndex = 0;
  while ((m = CS_RE.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    if (m[1]) out += '<span class="tk-c">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="tk-s">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="tk-d">' + esc(m[3]) + '</span>';
    else if (m[4]) {
      const kw = m[0].slice(0, m[0].length - m[4].length);
      out += '<span class="tk-k">' + esc(kw.trimEnd()) + '</span>' +
             esc(kw.slice(kw.trimEnd().length)) + '<span class="tk-def">' + esc(m[4]) + '</span>';
    }
    else if (m[5]) out += '<span class="tk-n">' + esc(m[5]) + '</span>';
    else if (m[6]) {
      const w = m[6];
      if (CS_KW.has(w)) out += '<span class="tk-k">' + esc(w) + '</span>';
      else if (CS_TYPES.has(w)) out += '<span class="tk-b">' + esc(w) + '</span>';
      else out += esc(w);
    }
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}

const XML_RE = /(<!--[\s\S]*?-->)|(<\/?)([\w:.\-]+)|([\w:.\-]+)(=)("[^"]*"|'[^']*')|(\/?>)/g;
function xmlHighlight(code) {
  let out = '', last = 0, m;
  XML_RE.lastIndex = 0;
  while ((m = XML_RE.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    if (m[1]) out += '<span class="tk-c">' + esc(m[1]) + '</span>';
    else if (m[3]) out += '<span class="tk-k">' + esc(m[2]) + '</span>' +
                          '<span class="tk-def">' + esc(m[3]) + '</span>';
    else if (m[4]) out += '<span class="tk-n">' + esc(m[4]) + '</span>' + esc(m[5]) +
                          '<span class="tk-s">' + esc(m[6]) + '</span>';
    else if (m[7]) out += '<span class="tk-k">' + esc(m[7]) + '</span>';
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}

let LANG = DATA.lang || 'py';
function highlight(code) {
  if (LANG === 'cs') return csHighlight(code);
  if (LANG === 'xml') return xmlHighlight(code);
  return pyHighlight(code);
}

function codeBlock(src, startLine, opts) {
  opts = opts || {};
  const lines = src.replace(/\r/g, '').split('\n');
  const hl = highlight(lines.join('\n')).split('\n');
  let rows = '';
  for (let i = 0; i < lines.length; i++) {
    const n = (startLine || 1) + i;
    rows += '<tr id="' + (opts.anchorPrefix || '') + 'L' + n + '"><td class="ln">' + n +
            '</td><td class="cd">' + (hl[i] || ' ') + '</td></tr>';
  }
  return '<pre class="code' + (opts.full ? ' full' : '') + '"><table><tbody>' + rows + '</tbody></table></pre>';
}

/* --------------------------------------------------------------- badges */
const FLAVORS = {
  enum:      ['enm', 'b-enum',  'enum'],
  dataclass: ['dcl', 'b-data',  'dataclass'],
  pydantic:  ['pyd', 'b-pyd',   'pydantic'],
  record:    ['dcl', 'b-data',  'record'],
  interface: ['pyd', 'b-pyd',   'interface'],
  static:    ['cls', 'b-class', 'static class'],
  viewmodel: ['rte', 'b-route', 'viewmodel'],
  view:      ['dcl', 'b-data',  'view'],
  'class':   ['cls', 'b-class', 'class']
};
function flavorMeta(c) { return FLAVORS[c.flavor] || FLAVORS['class']; }

function renderSig(fn) {
  let s = '<span class="pn">' + esc(fn.name) + '</span>(';
  const parts = fn.params.map(p => {
    let t = '';
    if (p.kind === 'vararg') t += '*';
    if (p.kind === 'kwarg') t += '**';
    t += '<span class="pn">' + esc(p.name) + '</span>';
    if (p.annotation) t += ': <span class="an">' + esc(p.annotation) + '</span>';
    if (p.default !== null && p.default !== undefined) t += ' = <span class="dv">' + esc(p.default) + '</span>';
    return t;
  });
  const long = parts.join(', ').replace(/<[^>]+>/g, '').length > 74;
  s += long ? '\n    ' + parts.join(',\n    ') + '\n' : parts.join(', ');
  s += ')';
  if (fn.returns) s += ' &rarr; <span class="rt">' + esc(fn.returns) + '</span>';
  return s;
}

let uid = 0;
function srcToggle(src, line) {
  const id = 'src' + (uid++);
  return '<button class="srcbtn" data-t="' + id + '">Source</button>' +
         '<div class="hidden" id="' + id + '" style="margin-top:9px">' + codeBlock(src, line) + '</div>';
}

function paramTable(fn) {
  const ps = fn.params.filter(p => !(fn.is_method && (p.name === 'self' || p.name === 'cls')));
  if (!ps.length) return '';
  let r = '';
  for (const p of ps) {
    r += '<tr><td class="mono">' + esc(p.name) + (p.kind === 'kwonly' ? ' <span class="tag">kw-only</span>' : '') +
         '</td><td class="mono">' + (p.annotation ? esc(p.annotation) : '<span style="color:var(--ink3)">&mdash;</span>') +
         '</td><td class="mono">' + (p.default !== null && p.default !== undefined
            ? esc(p.default) : '<span class="req">required</span>') + '</td></tr>';
  }
  return '<div class="tbl-wrap"><table><thead><tr><th>Parameter</th><th>Type</th><th>Default</th>' +
         '</tr></thead><tbody>' + r + '</tbody></table></div>';
}

function xrefFor(name) {
  const u = DATA.xref[name];
  if (!u || !u.length) return '';
  const links = u.slice(0, 14).map(x =>
    '<a class="tag" href="#/m/' + encodeURIComponent(x[0]) + '#' + x[1] + '">' + esc(x[1]) + '</a>').join('');
  return '<div style="margin-top:9px"><span style="font-size:11px;color:var(--ink3)">Called by</span>' +
         '<div class="chips" style="margin-top:5px">' + links +
         (u.length > 14 ? '<span class="tag">+' + (u.length - 14) + '</span>' : '') + '</div></div>';
}

function fnCard(fn, mod, owner) {
  const cls = fn.route ? 'rte' : 'fnc';
  let badges = '';
  if (fn.async) badges += '<span class="b b-async">async</span>';
  if (fn.route) badges += '<span class="b b-route">' + fn.route.method + '</span>';
  else badges += '<span class="b b-func">' + (fn.is_method ? 'method' : 'function') + '</span>';
  if (fn.private) badges += '<span class="b b-priv">internal</span>';
  for (const d of fn.decorators) {
    if (/abstractmethod/.test(d)) badges += '<span class="b b-abs">abstract</span>';
    else if (/staticmethod/.test(d)) badges += '<span class="b b-priv">static</span>';
    else if (/classmethod/.test(d)) badges += '<span class="b b-priv">classmethod</span>';
    else if (/property/.test(d)) badges += '<span class="b b-priv">property</span>';
    else if (/RelayCommand/.test(d)) badges += '<span class="b b-route">command</span>';
    else if (/ObservableProperty/.test(d)) badges += '<span class="b b-data">observable</span>';
  }
  const anchor = (owner ? owner + '.' : '') + fn.name;
  let h = '<div class="sym ' + cls + '" id="' + esc(anchor) + '">';
  h += '<div class="symhead"><div class="symname">' +
       (owner ? '<span class="own">' + esc(owner) + '.</span>' : '') + esc(fn.name) +
       '</div><div class="chips">' + badges + '</div>' +
       '<div style="margin-left:auto"><a class="tag" href="#/src/' + encodeURIComponent(mod.path) +
       '#L' + fn.lineno + '">line ' + fn.lineno + '</a></div></div>';
  h += '<div class="sigline">' + renderSig(fn) + '</div>';
  h += '<div class="symbody">';
  if (fn.doc) h += '<div class="doc">' + esc(fn.doc) + '</div>';
  h += paramTable(fn);
  if (fn.raises.length)
    h += '<div class="chips" style="margin:6px 0"><span style="font-size:11px;color:var(--ink3)">Raises</span>' +
         fn.raises.slice(0, 8).map(r => '<span class="tag warn">' + esc(r) + '</span>').join('') + '</div>';
  h += xrefFor(fn.name);
  h += '<div style="margin-top:10px">' + srcToggle(fn.source, fn.lineno) + '</div>';
  h += '</div></div>';
  return h;
}

function clsCard(c, mod) {
  const [k, badge, label] = flavorMeta(c);
  let h = '<div class="sym ' + k + '" id="' + esc(c.name) + '">';
  h += '<div class="symhead"><div class="symname">' + esc(c.name) + '</div><div class="chips">' +
       '<span class="b ' + badge + '">' + label + '</span>' +
       (c.bases.length ? c.bases.map(b => '<span class="b b-mod">' + esc(b) + '</span>').join('') : '') +
       '</div><div style="margin-left:auto"><a class="tag" href="#/src/' + encodeURIComponent(mod.path) +
       '#L' + c.lineno + '">line ' + c.lineno + '</a></div></div>';
  h += '<div class="symbody">';
  if (c.doc) h += '<div class="doc">' + esc(c.doc) + '</div>';
  if (c.fields.length) {
    let r = '';
    for (const f of c.fields) {
      r += '<tr><td class="mono">' + esc(f.name) + '</td><td class="mono">' +
           (f.annotation ? esc(f.annotation) : '<span style="color:var(--ink3)">&mdash;</span>') +
           '</td><td class="mono">' + (f.default != null ? esc(f.default)
             : (c.flavor === 'enum' ? '' : '<span class="req">required</span>')) + '</td></tr>';
    }
    h += '<div class="tbl-wrap"><table><thead><tr><th>' +
         (c.flavor === 'enum' ? 'Member' : 'Field') + '</th><th>Type</th><th>' +
         (c.flavor === 'enum' ? 'Value' : 'Default') + '</th></tr></thead><tbody>' + r + '</tbody></table></div>';
  }
  if (c.nested && c.nested.length)
    h += '<div class="chips" style="margin:6px 0"><span style="font-size:11px;color:var(--ink3)">Nested types</span>' +
         c.nested.map(n => '<a class="tag" href="#' + esc(n) + '">' + esc(n) + '</a>').join('') + '</div>';
  h += xrefFor(c.name);
  if (!c.methods.length) h += '<div style="margin-top:10px">' + srcToggle(c.source, c.lineno) + '</div>';
  h += '</div></div>';
  for (const m of c.methods) h += '<div style="margin-left:18px">' + fnCard(m, mod, c.name) + '</div>';
  return h;
}

/* ------------------------------------------------------------- module page */
function modulePage(mod) {
  LANG = mod.lang || DATA.lang || 'py';
  let h = '<div class="wrap">';
  h += '<div class="crumb">' + esc(DATA.package) + ' / ' + esc(mod.path) + '</div>';
  h += '<h1>' + esc(mod.name) + '</h1>';
  h += '<div class="chips" style="margin:10px 0 4px">' +
       '<span class="tag">' + mod.loc + ' lines</span>' +
       '<span class="tag">' + mod.classes.length + ' classes</span>' +
       '<span class="tag">' + mod.functions.length + ' functions</span>' +
       '<span class="tag">' + mod.constants.length + ' constants</span>' +
       '<a class="tag" href="#/src/' + encodeURIComponent(mod.path) + '">View whole file</a></div>';
  if (mod.doc) h += '<div class="doc" style="margin-top:14px">' + esc(mod.doc) + '</div>';
  if (DATA.notes && DATA.notes[mod.path]) h += DATA.notes[mod.path];

  if (mod.imports.length) {
    h += '<h2 id="__imports">Imports</h2>';
    const own = mod.imports.filter(i => /^from \.|^from PythonModule|^import PythonModule|PyScrapperDesktopApp/.test(i));
    const ext = mod.imports.filter(i => own.indexOf(i) === -1);
    const box = (title, arr) => arr.length
      ? '<h3>' + title + '</h3>' + codeBlock(arr.join('\n'), 1, { full: true }) : '';
    h += box('Project-internal', own) + box('External / stdlib', ext);
  }

  if (mod.constants.length) {
    h += '<h2 id="__consts">Constants</h2>';
    let r = '';
    for (const c of mod.constants) {
      const v = c.big
        ? '<button class="srcbtn" data-t="c' + uid + '">show ' + c.value.length + ' characters</button>' +
          '<div class="hidden" id="c' + (uid++) + '" style="margin-top:6px">' +
          codeBlock(c.value, 1, { full: true }) + '</div>'
        : '<span class="mono">' + esc(c.value) + '</span>';
      r += '<tr><td class="mono" style="white-space:nowrap">' + esc(c.name) + '</td><td>' + v + '</td></tr>';
    }
    h += '<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Value</th></tr></thead><tbody>' +
         r + '</tbody></table></div>';
  }

  if (mod.classes.length) {
    h += '<h2 id="__classes">Classes</h2>';
    for (const c of mod.classes) h += clsCard(c, mod);
  }
  if (mod.functions.length) {
    h += '<h2 id="__functions">Functions</h2>';
    for (const f of mod.functions) h += fnCard(f, mod, null);
  }
  h += '</div>';
  return h;
}

function sourcePage(mod) {
  LANG = mod.lang || DATA.lang || 'py';
  let h = '<div class="wrap">';
  h += '<div class="crumb"><a class="x" href="#/m/' + encodeURIComponent(mod.path) + '">&larr; ' +
       esc(mod.name) + '</a></div>';
  h += '<h1>' + esc(mod.path) + '</h1>';
  h += '<p class="lede">Full source, ' + mod.loc +
       ' lines. Line numbers are linkable (<span class="mono">#L42</span>).</p>';
  h += codeBlock(mod.source, 1, { full: true });
  h += '</div>';
  return h;
}

/* ---------------------------------------------------------------- sidebar */
function buildTree() {
  const root = { dirs: {}, files: [] };
  for (const m of MODS) {
    const parts = m.path.split('/');
    let node = root;
    for (let i = 0; i < parts.length - 1; i++) {
      node.dirs[parts[i]] = node.dirs[parts[i]] || { dirs: {}, files: [] };
      node = node.dirs[parts[i]];
    }
    node.files.push(m);
  }
  const render = (node, depth) => {
    let h = '';
    for (const name of Object.keys(node.dirs).sort()) {
      const d = node.dirs[name];
      h += '<div class="dir' + (depth > 0 ? ' closed' : '') + '">' +
           '<div class="dirhead"><span class="car">&#9660;</span>' + esc(name) + '/</div>' +
           '<div class="dirkids">' + render(d, depth + 1) + '</div></div>';
    }
    for (const f of node.files.sort((a, b) => a.path.localeCompare(b.path))) {
      const base = f.path.split('/').pop();
      const n = f.classes.length + f.functions.length;
      h += '<a class="modlink" data-p="' + esc(f.path) + '" href="#/m/' + encodeURIComponent(f.path) + '">' +
           esc(base) + '<span class="cnt">' + (n || '') + '</span></a>';
    }
    return h;
  };
  q1('#tree').innerHTML = render(root, 0);
  q1('#tree').addEventListener('click', e => {
    const dh = e.target.closest('.dirhead');
    if (dh) dh.parentElement.classList.toggle('closed');
  });
}

/* ----------------------------------------------------------------- search */
const INDEX = [];
(function buildIndex() {
  for (const p of DATA.pages_index) INDEX.push({ n: p.title, k: 'page', h: p.hash, p: p.sub || '' });
  for (const m of MODS) {
    INDEX.push({ n: m.name, k: 'module', h: '#/m/' + encodeURIComponent(m.path), p: m.path });
    for (const c of m.classes) {
      INDEX.push({ n: c.name, k: c.flavor, h: '#/m/' + encodeURIComponent(m.path) + '#' + c.name, p: m.path });
      for (const f of c.methods)
        INDEX.push({ n: c.name + '.' + f.name, k: 'method', h: '#/m/' + encodeURIComponent(m.path) + '#' + c.name + '.' + f.name, p: m.path });
    }
    for (const f of m.functions) {
      const kind = f.route ? f.route.method : 'function';
      INDEX.push({ n: f.name, k: kind, h: '#/m/' + encodeURIComponent(m.path) + '#' + f.name, p: m.path,
                   extra: f.route ? f.route.path : '' });
    }
    for (const c of m.constants)
      INDEX.push({ n: c.name, k: 'const', h: '#/m/' + encodeURIComponent(m.path) + '#__consts', p: m.path });
  }
})();

function score(name, term) {
  const n = name.toLowerCase();
  const i = n.indexOf(term);
  if (i === -1) return -1;
  let s = 100 - i;
  if (i === 0) s += 60;
  if (n === term) s += 200;
  s -= Math.min(name.length, 40) * 0.3;
  return s;
}
function markHit(name, term) {
  const i = name.toLowerCase().indexOf(term);
  if (i === -1) return esc(name);
  return esc(name.slice(0, i)) + '<span class="hl">' + esc(name.slice(i, i + term.length)) +
         '</span>' + esc(name.slice(i + term.length));
}
let selIdx = 0, curRes = [];
function runSearch(term) {
  const box = q1('#results');
  term = term.trim().toLowerCase();
  if (!term) { box.classList.remove('on'); return; }
  const out = [];
  for (const it of INDEX) {
    let s = score(it.n, term);
    if (s < 0 && it.extra) s = score(it.extra, term) - 20;
    if (s > 0) out.push([s, it]);
  }
  out.sort((a, b) => b[0] - a[0]);
  curRes = out.slice(0, 40).map(x => x[1]);
  selIdx = 0;
  if (!curRes.length) { box.innerHTML = '<div class="nores">grep: ' + esc(term) + ': no match</div>'; box.classList.add('on'); return; }
  box.innerHTML = curRes.map((r, i) =>
    '<div class="res' + (i === 0 ? ' sel' : '') + '" data-h="' + esc(r.h) + '">' +
    '<span class="b b-mod">' + esc(r.k) + '</span>' +
    '<span class="nm">' + markHit(r.n, term) + '</span>' +
    '<span class="pt">' + esc(r.extra || r.p) + '</span></div>').join('');
  box.classList.add('on');
}
function moveSel(d) {
  const items = document.querySelectorAll('.res');
  if (!items.length) return;
  items[selIdx].classList.remove('sel');
  selIdx = (selIdx + d + items.length) % items.length;
  items[selIdx].classList.add('sel');
  items[selIdx].scrollIntoView({ block: 'nearest' });
}

/* ------------------------------------------------------------------ router */
function setActive(hash) {
  document.querySelectorAll('.navlink,.modlink').forEach(a => a.classList.remove('act'));
  const a = document.querySelector('[href="' + CSS.escape(hash) + '"]');
  if (a) {
    a.classList.add('act');
    let p = a.parentElement;
    while (p) { if (p.classList && p.classList.contains('dir')) p.classList.remove('closed'); p = p.parentElement; }
  }
}

function buildToc() {
  const main = q1('#main');
  const heads = [...main.querySelectorAll('h2, .sym > .symhead > .symname')];
  if (heads.length < 2) { q1('#toc').innerHTML = ''; return; }
  let h = '<h5>outline</h5>';
  for (const n of heads) {
    if (n.tagName === 'H2') {
      h += '<a href="#' + (n.id || '') + '" data-i="' + (n.id || '') + '">' + esc(n.textContent) + '</a>';
    } else {
      const box = n.closest('.sym');
      h += '<a class="lvl2" href="#' + box.id + '" data-i="' + box.id + '">' + esc(n.textContent) + '</a>';
    }
  }
  q1('#toc').innerHTML = h;
  q1('#toc').querySelectorAll('a').forEach(a => a.addEventListener('click', ev => {
    ev.preventDefault();
    const t = document.getElementById(a.dataset.i);
    if (t) t.scrollIntoView({ block: 'start' });
  }));
}

function render() {
  const raw = location.hash || '#/overview';
  const [route, frag] = raw.split(/#(?![/])/);
  const main = q1('#main');
  let html = '';
  if (route.startsWith('#/m/')) {
    const mod = BY_PATH[decodeURIComponent(route.slice(4))];
    html = mod ? modulePage(mod) : '<div class="wrap"><h1>404</h1><p>Module not found.</p></div>';
  } else if (route.startsWith('#/src/')) {
    const mod = BY_PATH[decodeURIComponent(route.slice(6))];
    html = mod ? sourcePage(mod) : '<div class="wrap"><h1>404</h1></div>';
  } else {
    LANG = DATA.lang || 'py';
    const key = route.replace('#/', '');
    html = DATA.pages[key] || DATA.pages['overview'];
  }
  main.innerHTML = html;
  main.scrollTop = 0;
  setActive(route);
  buildToc();
  wirePage();
  updateStatus(route);
  if (frag) {
    const t = document.getElementById(frag);
    if (t) { t.scrollIntoView({ block: 'start' }); if (t.tagName === 'TR') t.classList.add('hit'); }
  }
}

function updateStatus(route) {
  const mode = q1('#stmode'), path = q1('#stpath'), info = q1('#stinfo');
  if (route.startsWith('#/m/') || route.startsWith('#/src/')) {
    const p = decodeURIComponent(route.replace(/^#\/(m|src)\//, ''));
    const mod = BY_PATH[p];
    mode.textContent = route.startsWith('#/src/') ? 'SOURCE' : 'MODULE';
    path.textContent = DATA.package + '/' + p;
    if (mod) {
      const nm = mod.classes.length + mod.functions.length +
                 mod.classes.reduce((a, c) => a + c.methods.length, 0);
      info.textContent = mod.loc + ' lines  ' + nm + ' symbols';
    } else info.textContent = '-';
  } else {
    mode.textContent = 'DOC';
    path.textContent = DATA.package;
    info.textContent = MODS.length + ' modules  ' + DATA.total_loc + ' lines';
  }
}

/* ------------------------------------------------------------- flowcharts */
/* Interactive program-flow widget. Data comes from DATA.flows, a page just
   drops <div class="flowmount" data-flow="id,id2"></div> and this fills it. */
const FKIND = {
  step: 'step', decision: 'decision', io: 'i/o', error: 'error path',
  end: 'end', start: 'start'
};

function flowNodeHtml(s, i, sel, seen) {
  const kind = s.kind || 'step';
  let cls = 'fnode k-' + kind;
  if (i === sel) cls += ' on';
  else if (seen) cls += ' done';
  const glyph = kind === 'decision' ? '<span>?</span>' : (i + 1);
  return '<div class="' + cls + '" data-i="' + i + '" role="button" tabindex="0">' +
         '<div class="fn">' + glyph + '</div><div><div class="ft">' + esc(s.title) + '</div>' +
         (s.sub ? '<div class="fs">' + esc(s.sub) + '</div>' : '') + '</div></div>';
}

function flowEdgeHtml(label) {
  return '<div class="fedge"><div class="fline"></div>' +
         (label ? '<div class="flabel">' + esc(label) + '</div>' : '') + '</div>';
}

function flowDetailHtml(flow, i) {
  const s = flow.steps[i];
  let h = '<h4>' + esc(s.title) + '</h4>';
  h += '<div class="fkind">' + (FKIND[s.kind || 'step'] || 'step') +
       ' &middot; step ' + (i + 1) + ' of ' + flow.steps.length + '</div>';
  h += s.detail || '';
  const outs = s.branches || [];
  if (outs.length) {
    h += '<div class="fbranch"><div class="fbh">Where it can go from here</div>';
    for (const b of outs) {
      const t = flow.steps.findIndex(x => x.id === b.to);
      h += '<button class="fgoto' + (b.warn ? ' warn' : '') + '" data-goto="' +
           (t < 0 ? '' : t) + '">' + esc(b.label) +
           (t >= 0 ? ' &rarr; ' + (t + 1) : '') + '</button>';
    }
    h += '</div>';
  }
  if (s.link) {
    h += '<div class="fmini"><a class="tag" href="' + s.link + '">Open in the source</a></div>';
  }
  return h;
}

function buildFlow(mount) {
  const ids = (mount.dataset.flow || '').split(',').map(x => x.trim()).filter(Boolean);
  const flows = ids.map(id => (DATA.flows || {})[id]).filter(Boolean);
  if (!flows.length) return;

  let fi = 0, sel = 0;
  const wrap = document.createElement('div');
  wrap.className = 'flowwrap';
  mount.appendChild(wrap);

  function paint() {
    const flow = flows[fi];
    let tabs = '';
    if (flows.length > 1) {
      tabs = flows.map((f, i) =>
        '<button class="flowtab' + (i === fi ? ' on' : '') + '" data-tab="' + i + '">' +
        esc(f.title) + '</button>').join('');
    }
    let steps = '';
    flow.steps.forEach((s, i) => {
      if (i) steps += flowEdgeHtml(flow.steps[i - 1].next);
      steps += flowNodeHtml(s, i, sel, i < sel);
    });
    wrap.innerHTML =
      '<div class="flowbar"><div class="flowtabs">' + tabs + '</div>' +
      '<div class="flowctl">' +
      '<button class="flowbtn" data-nav="-1"' + (sel === 0 ? ' disabled' : '') + '>&larr; prev</button>' +
      '<span class="flowcount">' + (sel + 1) + ' / ' + flow.steps.length + '</span>' +
      '<button class="flowbtn" data-nav="1"' +
      (sel === flow.steps.length - 1 ? ' disabled' : '') + '>next &rarr;</button>' +
      '</div></div>' +
      '<div class="flowbody"><div class="flowsteps">' + steps + '</div>' +
      '<div class="fdetail">' + flowDetailHtml(flow, sel) + '</div></div>';
  }

  function go(i) {
    const flow = flows[fi];
    sel = Math.max(0, Math.min(flow.steps.length - 1, i));
    paint();
    const node = wrap.querySelector('.fnode.on');
    if (node) node.scrollIntoView({ block: 'nearest' });
  }

  wrap.addEventListener('click', e => {
    const tab = e.target.closest('[data-tab]');
    if (tab) { fi = +tab.dataset.tab; sel = 0; paint(); return; }
    const nav = e.target.closest('[data-nav]');
    if (nav) { go(sel + (+nav.dataset.nav)); return; }
    const jump = e.target.closest('[data-goto]');
    if (jump && jump.dataset.goto !== '') { go(+jump.dataset.goto); return; }
    const node = e.target.closest('.fnode');
    if (node) go(+node.dataset.i);
  });
  wrap.addEventListener('keydown', e => {
    const node = e.target.closest('.fnode');
    if (node && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); go(+node.dataset.i);
    }
  });

  paint();
}

function wirePage() {
  document.querySelectorAll('.flowmount').forEach(m => {
    if (m.dataset.wired) return;
    m.dataset.wired = '1';
    buildFlow(m);
  });
  document.querySelectorAll('.srcbtn[data-t]').forEach(b => {
    if (b.dataset.wired) return;
    b.dataset.wired = '1';
    b.dataset.label = b.textContent;
    b.addEventListener('click', () => {
      const t = document.getElementById(b.dataset.t);
      const closed = t.classList.toggle('hidden');
      b.textContent = closed ? b.dataset.label : 'Hide';
    });
  });
  document.querySelectorAll('.ephead').forEach(hd => {
    if (hd.dataset.wired) return;
    hd.dataset.wired = '1';
    hd.addEventListener('click', () => hd.parentElement.querySelector('.epbody').classList.toggle('hidden'));
  });
  const pills = document.querySelectorAll('.pill[data-f]');
  pills.forEach(p => {
    if (p.dataset.wired) return;
    p.dataset.wired = '1';
    p.addEventListener('click', () => {
      pills.forEach(x => x.classList.remove('on'));
      p.classList.add('on');
      const f = p.dataset.f;
      document.querySelectorAll('.ep').forEach(e => {
        e.style.display = (f === '*' || e.dataset.m === f || e.dataset.g === f) ? '' : 'none';
      });
    });
  });
  const epq = document.getElementById('epq');
  if (epq && !epq.dataset.wired) {
    epq.dataset.wired = '1';
    epq.addEventListener('input', () => {
      const v = epq.value.toLowerCase();
      document.querySelectorAll('.ep').forEach(e => {
        e.style.display = e.dataset.s.indexOf(v) > -1 ? '' : 'none';
      });
    });
  }
}

/* -------------------------------------------------------------------- init */
buildTree();
window.addEventListener('hashchange', render);

const qi = q1('#q');
qi.addEventListener('input', () => runSearch(qi.value));
qi.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
  else if (e.key === 'Enter') {
    const s = document.querySelector('.res.sel');
    if (s) { location.hash = s.dataset.h; qi.blur(); q1('#results').classList.remove('on'); }
  } else if (e.key === 'Escape') { qi.blur(); q1('#results').classList.remove('on'); }
});
q1('#results').addEventListener('click', e => {
  const r = e.target.closest('.res');
  if (r) { location.hash = r.dataset.h; q1('#results').classList.remove('on'); qi.value = ''; }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.searchwrap')) q1('#results').classList.remove('on');
});
document.addEventListener('keydown', e => {
  if ((e.key === '/' || (e.key === 'k' && (e.ctrlKey || e.metaKey))) &&
      document.activeElement !== qi) { e.preventDefault(); qi.focus(); qi.select(); }
});

q1('#navfilter').addEventListener('input', e => {
  const v = e.target.value.toLowerCase();
  document.querySelectorAll('.modlink').forEach(a => {
    const ok = a.dataset.p.toLowerCase().indexOf(v) > -1;
    a.style.display = ok ? '' : 'none';
  });
  document.querySelectorAll('.dir').forEach(d => {
    const any = [...d.querySelectorAll('.modlink')].some(a => a.style.display !== 'none');
    d.style.display = any ? '' : 'none';
    if (v && any) d.classList.remove('closed');
  });
});

q1('#theme').addEventListener('click', () => {
  const h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
  q1('#theme').textContent = h.dataset.theme === 'dark' ? 'light' : 'dark';
});
q1('#burger').addEventListener('click', () => q1('.side').classList.toggle('open'));

render();

</script>
