ait", "str"], "raises": ["fastapi.HTTPException"], "source": "async def handle_create_playlist_media_req(key: str, req: CreatePlaylistMediaRequest):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT COUNT(*) FROM PlaylistMedias WHERE PlaylistIdentifier = ? AND MediaIdentifier = ?\", (req.playlist_identifier, req.media_identifier))\n        count = cursor.fetchone()[0]\n\n        if count > 0:\n            conn.close()\n            log_queue.put_nowait(f\"[ERROR] Media '{req.media_identifier}' already exists in playlist '{req.playlist_identifier}'\")\n            raise fastapi.HTTPException(status_code=400, detail=\"Media already exists in the playlist\")\n\n        cursor.execute(\"SELECT MAX(Position) FROM PlaylistMedias WHERE PlaylistIdentifier = ?\", (req.playlist_identifier,))\n        max_position_row = cursor.fetchone()\n        max_position = max_position_row[0] if max_position_row[0] is not None else 0\n        new_position = max_position + 1\n\n        cursor.execute(\"\"\"INSERT INTO PlaylistMedias (PlaylistIdentifier, MediaIdentifier, Position) VALUES (?, ?, ?)\"\"\", (req.playlist_identifier, req.media_identifier, new_position))\n        conn.commit()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Media '{req.media_identifier}' added to playlist '{req.playlist_identifier}' at position {new_position}\")\n        return {\"message\": \"Media added to playlist successfully\", \"position\": new_position}\n    except fastapi.HTTPException:\n        raise\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error adding media '{req.media_identifier}' to playlist '{req.playlist_identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=400, detail=str(e))", "is_method": false, "private": false, "dunder": false}, {"kind": "function", "name": "handle_delete_playlist_media_req", "qualname": "handle_delete_playlist_media_req", "async": true, "signature": "(key: str, req: DeletePlaylistMediaRequest)", "params": [{"name": "key", "annotation": "str", "default": null, "kind": "pos"}, {"name": "req", "annotation": "DeletePlaylistMediaRequest", "default": null, "kind": "pos"}], "returns": null, "doc": null, "decorators": ["app.post('/delete/playlistmedia/{key}', response_model=MessageResponse)"], "route": {"method": "POST", "path": "/delete/playlistmedia/{key}", "decorator": "app.post('/delete/playlistmedia/{key}', response_model=MessageResponse)"}, "lineno": 928, "end_lineno": 944, "calls": ["app.post", "conn.close", "conn.commit", "conn.cursor", "connect_db", "cursor.execute", "fastapi.HTTPException", "log_queue.put_nowait", "str"], "raises": ["fastapi.HTTPException"], "source": "async def handle_delete_playlist_media_req(key: str, req: DeletePlaylistMediaRequest):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"DELETE FROM PlaylistMedias WHERE PlaylistIdentifier = ? AND MediaIdentifier = ?\", (req.playlist_identifier, req.media_identifier))\n        conn.commit()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Media '{req.media_identifier}' removed from playlist '{req.playlist_identifier}'\")\n        return {\"message\": \"Media removed from playlist successfully\"}\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error removing media '{req.media_identifier}' from playlist '{req.playlist_identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))", "is_method": false, "private": false, "dunder": false}, {"kind": "function", "name": "get_playlist_medias", "qualname": "get_playlist_medias", "async": true, "signature": "(playlist_identifier: str)", "params": [{"name": "playlist_identifier", "annotation": "str", "default": null, "kind": "pos"}], "returns": null, "doc": null, "decorators": ["app.get('/get/playlistmedias/{playlist_identifier}', response_model=List[PlaylistMediaResponse])"], "route": {"method": "GET", "path": "/get/playlistmedias/{playlist_identifier}", "decorator": "app.get('/get/playlistmedias/{playlist_identifier}', response_model=List[PlaylistMediaResponse])"}, "lineno": 948, "end_lineno": 961, "calls": ["app.get", "conn.close", "conn.cursor", "connect_db", "cursor.execute", "cursor.fetchall", "dict", "fastapi.HTTPException", "len", "log_queue.put_nowait", "str"], "raises": ["fastapi.HTTPException"], "source": "async def get_playlist_medias(playlist_identifier: str):\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT PlaylistIdentifier, MediaIdentifier, Position FROM PlaylistMedias WHERE PlaylistIdentifier = ? ORDER BY Position\", (playlist_identifier,))\n        rows = cursor.fetchall()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Retrieved {len(rows)} media entries for playlist '{playlist_identifier}'\")\n        return [dict(row) for row in rows]\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error retrieving media for playlist '{playlist_identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))", "is_method": false, "private": false, "dunder": false}, {"kind": "function", "name": "get_user_playlists", "qualname": "get_user_playlists", "async": true, "signature": "(user_identifier: str)", "params": [{"name": "user_identifier", "annotation": "str", "default": null, "kind": "pos"}], "returns": null, "doc": null, "decorators": ["app.get('/getuser/playlists/{user_identifier}', response_model=List[PlaylistResponse])"], "route": {"method": "GET", "path": "/getuser/playlists/{user_identifier}", "decorator": "app.get('/getuser/playlists/{user_identifier}', response_model=List[PlaylistResponse])"}, "lineno": 964, "end_lineno": 977, "calls": ["app.get", "conn.close", "conn.cursor", "connect_db", "cursor.execute", "cursor.fetchall", "dict", "fastapi.HTTPException", "len", "log_queue.put_nowait", "str"], "raises": ["fastapi.HTTPException"], "source": "async def get_user_playlists(user_identifier: str):\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT Identifier, UserIdentifier, Name, Description FROM Playlists WHERE UserIdentifier = ?\", (user_identifier,))\n        rows = cursor.fetchall()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Retrieved {len(rows)} playlists for user '{user_identifier}'\")\n        return [dict(row) for row in rows]\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error retrieving playlists for user '{user_identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))", "is_method": false, "private": false, "dunder": false}, {"kind": "function", "name": "handle_login_req", "qualname": "handle_login_req", "async": true, "signature": "(req: LoginRequest)", "params": [{"name": "req", "annotation": "LoginRequest", "default": null, "kind": "pos"}], "returns": null, "doc": null, "decorators": ["app.post('/login', response_model=LoginResponse)"], "route": {"method": "POST", "path": "/login", "decorator": "app.post('/login', response_model=LoginResponse)"}, "lineno": 983, "end_lineno": 1008, "calls": ["app.post", "bcrypt.checkpw", "conn.close", "conn.cursor", "connect_db", "cursor.execute", "cursor.fetchone", "fastapi.HTTPException", "log_queue.put_nowait", "password_hash.encode", "req.password.encode", "str"], "raises": ["fastapi.HTTPException"], "source": "async def handle_login_req(req: LoginRequest):\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT Identifier, PasswordHash FROM Users WHERE Username = ?\", (req.username,))\n        row = cursor.fetchone()\n        conn.close()\n\n        if row is None:\n            log_queue.put_nowait(f\"[ERROR] Login failed: user '{req.username}' not found\")\n            raise fastapi.HTTPException(status_code=404, detail=\"User not found\")\n\n        identifier, password_hash = row[\"Identifier\"], row[\"PasswordHash\"]\n\n        if not bcrypt.checkpw(req.password.encode(\"utf-8\"), password_hash.encode(\"utf-8\")):\n            log_queue.put_nowait(f\"[ERROR] Login failed: invalid password for user '{req.username}'\")\n            raise fastapi.HTTPException(status_code=401, detail=\"Invalid password\")\n\n        log_queue.put_nowait(f\"[INFO] User '{req.username}' logged in successfully\")\n        return {\"message\": \"Login successful\", \"identifier\": identifier}\n    except fastapi.HTTPException:\n        raise\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error during login for user '{req.username}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))", "is_method": false, "private": false, "dunder": false}, {"kind": "function", "name": "handle_register_req", "qualname": "handle_register_req", "async": true, "signature": "(req: RegisterRequest)", "params": [{"name": "req", "annotation": "RegisterRequest", "default": null, "kind": "pos"}], "returns": null, "doc": null, "decorators": ["app.post('/register')"], "route": {"method": "POST", "path": "/register", "decorator": "app.post('/register')"}, "lineno": 1011, "end_lineno": 1024, "calls": ["CreateUserRequest", "app.post", "fastapi.HTTPException", "handle_create_user_req", "log_queue.put_nowait", "str"], "raises": ["fastapi.HTTPException"], "source": "async def handle_register_req(req: RegisterRequest):\n    try:\n\n        create_user_req = CreateUserRequest(username=req.username, password=req.password)\n        response = await handle_create_user_req(ADMIN_KEY, create_user_req)\n\n        if response:\n            log_queue.put_nowait(f\"[INFO] User '{req.username}' registered successfully\")\n            return {\"message\": \"User registered successfully\", \"identifier\" : response[\"identifier\"]}\n    except fastapi.HTTPException:\n        raise\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error during registration for user '{req.username}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))", "is_method": false, "private": false, "dunder": false}], "source": "import sys, os\n\nfrom uvicorn import lifespan\n\n\n\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nimport fastapi\nfrom PythonModule.models.settings import PROGRESSDICT\nfrom PythonModule.models.responses import (\n    MessageResponse,\n    CreateResponse,\n    CreatePlaylistMediaResponse,\n    LoginResponse,\n    PlaylistResponse,\n    DownloadedMediaResponse,\n    SettingsResponse,\n    PlaylistMediaResponse,\n    UserResponse\n)\nfrom PythonModule.models.requests import SearchRequest, DownloadRequest, CommandRequest, CreateUserRequest, CreatePlaylistRequest, CreateDownloadedMediaRequest, CreateSettingsRequest, CreatePlaylistMediaRequest, DeletePlaylistMediaRequest, RegisterRequest, LoginRequest\nfrom PythonModule.serverservices import downloadProcessor, commandProcessor, searchProcessor, utils\nfrom PythonModule.core.request import Session\nfrom dotenv import load_dotenv\nfrom contextlib import asynccontextmanager\n\nfrom fastapi import FastAPI, HTTPException\nfrom fastapi.middleware.cors import CORSMiddleware\nfrom pydantic import BaseModel\nfrom typing import Optional, List\nimport  time, re, json, uuid\nfrom datetime import datetime\nimport bcrypt\n\nimport platform, subprocess\n\nimport os\nimport asyncio\nimport sqlite3\nimport secrets\n\n#Global Variables\ncurrent_path = os.path.dirname(os.path.abspath(__file__))\nproject_root = os.path.dirname(current_path)\ndb_path = os.path.join(current_path, \"Data\", \"data.db\")\nload_dotenv()\nADMIN_KEY = os.getenv(\"ADMIN_KEY\")\n\nlog_dir = os.path.join(project_root, \"LocalServer\", \"logs\")\nlog_file = os.path.join(log_dir, \"server_runtime.log\")\nos.makedirs(log_dir, exist_ok=True)\n\nses = Session.Session()\n\napp = FastAPI()\n\napp.add_middleware(\n    CORSMiddleware,\n    allow_origins=[\n        \"http://localhost:5173\",\n        \"http://127.0.0.1:5173\",\n    ],\n    allow_credentials=True,\n    allow_methods=[\"*\"],\n    allow_headers=[\"*\"],\n)\n\nlog_queue = asyncio.Queue(maxsize=5000)\nquit_event = asyncio.Event()\n\ndownload_jobs = set()\nsearch_jobs = set()\ndownload_progress = {}\n\n\nclass SearchError(Exception): ...\nclass CommandError(Exception): ...\nclass DownloadError(Exception): ...\n\n\nasync def logger(quit_event: asyncio.Event, log_queue: asyncio.Queue):\n    global log_file\n\n    while not quit_event.is_set():\n        try:\n            message = await log_queue.get()\n\n            if not isinstance(message, str):\n                message = json.dumps(message, ensure_ascii=False)\n\n            timestamp = datetime.now().strftime(\"%Y-%m-%d_%H-%M-%S\")\n\n            with open(log_file, \"a\", encoding=\"utf-8\") as f:\n                f.write(f\"[{str(timestamp)}] \" + message + \"\\n\")\n\n        except asyncio.CancelledError:\n            break\n        except Exception as e:\n            print(e)\n\n\ndownload_limiter = asyncio.Semaphore(50)\n\n\n@app.get(\"/\")\nasync def root():\n    return {\n        \"message\": \"Server startup successful!\",\n    }\n\n\n#'@app.on_event(\"startup\")\n#async def startup_event():\n #   global quit_event, log_queue\n#\n #   asyncio.create_task(logger(quit_event, log_queue))\n  #  log_queue.put_nowait(\"[INFO] Server started successfully\")\n   # create_app_tables()\n\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    global quit_event, log_queue\n    asyncio.create_task(logger(quit_event, log_queue))\n    log_queue.put_nowait(\"[INFO] Server started successfully\")\n    create_app_tables()\n    yield\n\napp = FastAPI(lifespan=lifespan)\n\n@app.post(\"/command\")\nasync def receive_command(data: CommandRequest):\n    global log_file, log_queue, quit_event\n    try:\n        await commandProcessor.CommandProcessor(\n            command=data.command,\n            logFile=log_file,\n            logQueue=log_queue,\n            quitEvent=quit_event\n        ).run()\n\n        log_queue.put_nowait(f\"[INFO] Command '{data.command}' executed successfully\")\n\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error handling command {data.command}.\\nError Message: {str(e)}\")\n        raise HTTPException(status_code=500, detail=str(e))\n\n\n@app.post(\"/download\")\nasync def receive_download(data: DownloadRequest):\n \n    global log_queue, ses, download_limiter\n    task_id = str(uuid.uuid4())\n    try:\n        ses.reloadCookies()\n        utils.validate_url(session=ses, url=data.url)\n\n        download_progress[task_id] = PROGRESSDICT.copy()\n        download_progress[task_id]['id'] = task_id\n\n\n        \n    \n        task = asyncio.create_task(downloadProcessor.DownloadProcessor(\n            downloadRequest=data,\n            progressDict=download_progress[task_id],\n            session=ses,\n            downloadLimiter=download_limiter,\n            logQueue=log_queue\n            ).run(),\n            name=task_id)\n\n        def done(t: asyncio.Task):\n            download_jobs.discard(t)\n            asyncio.create_task(utils.cleanup_progress(\n                download_progess=download_progress,\n                task_id=task_id,\n                delay=60\n            ))\n\n        task.add_done_callback(done)\n        download_jobs.add(task)\n\n        log_queue.put_nowait(f\"[INFO] Created download task with id {task_id} for provider {data.provider} with url {data.url}\")\n        return {\"id\": task_id, \"message\": f\"Request received for download, you can view progress under /download/progress/{task_id}\"}\n\n    except (ValueError, TypeError) as e:\n        log_queue.put_nowait(f\"[ERROR] failed to create download task with arguments given: provider {data.provider}, url: {data.url}, filepath {data.download_path}.\\nError Message: Invalid type for {str(e)}\")\n        raise HTTPException(status_code=400, detail=f\"Invalid type for {str(e)}\")\n\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] failed to create download task with arguments given: provider {data.provider}, url: {data.url}, filepath {data.download_path}.\\nError Message: {str(e)}\")\n        raise HTTPException(status_code=500, detail=str(e))\n\n\n@app.get(\"/download/progress/{task_id}\")\nasync def get_download_progress(task_id: str):\n    progress = download_progress.get(task_id)\n    if not progress:\n        log_queue.put_nowait(f\"[ERROR] Tried to access resource /download/progress/{task_id} which doesn't exist\")\n        raise HTTPException(status_code=404, detail=f\"No such resource /download/progress/{task_id}\")\n    return progress\n\n\n@app.post(\"/search\")\nasync def receive_search(data: SearchRequest):\n    global ses\n    search_id = str(uuid.uuid4())\n    try:\n        response = await searchProcessor.SearchProcessor(\n            searchRequest=data,\n            session=ses,\n            ).run()\n\n        log_queue.put_nowait(f\"[INFO] Search succesfull for job {search_id} with query {data.search} and provider {data.provider}\")\n        return response\n\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Failed search task with given arguments: id {search_id} provider {data.provider} and searchinput {data.search}.\\n Error Message:{str(e)}\")\n        raise HTTPException(status_code=500, detail=str(e))\n\n\nstart_time = time.time()\n\n@app.get(\"/health\")\ndef health():\n    try:\n        uptime_seconds = time.time() - start_time\n        try:\n            mem = self_memory_mb()\n        except Exception:\n            mem = None\n\n        active_downloads = [v for v in download_progress.values() if v[\"status\"] not in (\"complete\", \"error\")]\n        downloads_with_errors = [v for v in download_progress.values() if v[\"status\"] == \"error\"]\n        error_messages = [v[\"errorMessage\"] for v in downloads_with_errors if v[\"errorMessage\"]]\n\n        return {\n            \"ok\": True,\n            \"uptime_seconds\": round(uptime_seconds, 2),\n            \"memory_mb\": mem,\n            \"pid\": os.getpid(),\n            \"processes\": list_python_processes(),\n            \"active_downloads\": active_downloads,\n            \"error_messages\": error_messages\n        }\n    except Exception as e:\n        raise HTTPException(status_code=500, detail=str(e))\n\n\ndef self_memory_mb():\n    pid = os.getpid()\n    try:\n        if platform.system() == \"Windows\":\n            out = subprocess.check_output(\n                [\"tasklist\", \"/FI\", f\"PID eq {pid}\", \"/FO\", \"CSV\"],\n                text=True, errors=\"replace\"\n            )\n            line = out.splitlines()[1]\n            mem = line.split(\",\")[-1]\n            digits = re.sub(r\"\\D\", \"\", mem)\n            if not digits:\n                return None\n            return round(int(digits) / 1024, 2)\n        else:\n            with open(f\"/proc/{pid}/status\") as f:\n                for line in f:\n                    if line.startswith(\"VmRSS:\"):\n                        kb = int(line.split()[1])\n                        return round(kb / 1024, 2)\n            return None\n    except Exception:\n        return None\n\n\ndef list_python_processes():\n    if platform.system() != \"Windows\":\n        out = subprocess.check_output([\"ps\", \"-eo\", \"pid,comm\"], text=True)\n        procs = []\n        for line in out.splitlines()[1:]:\n            pid, name = line.strip().split(None, 1)\n            if name.lower().startswith(\"python\"):\n                procs.append({\"pid\": int(pid), \"name\": name})\n        return procs\n\n    ps = r\"\"\"\nGet-CimInstance Win32_Process -Filter \"Name LIKE 'python%'\" |\nSelect-Object ProcessId, Name |\nConvertTo-Json\n\"\"\".strip()\n\n    out = subprocess.check_output(\n        [\"powershell\", \"-NoProfile\", \"-ExecutionPolicy\", \"Bypass\", \"-Command\", ps],\n        text=True, encoding=\"utf-8\", errors=\"replace\"\n    ).strip()\n\n    if not out:\n        return []\n\n    data = json.loads(out)\n    if isinstance(data, dict):\n        data = [data]\n\n    return [{\"pid\": int(p[\"ProcessId\"]), \"name\": p[\"Name\"]} for p in data]\n\n\n#---------------- DB management ------------------------\n\ndef create_app_tables():\n    os.makedirs(os.path.dirname(db_path), exist_ok=True)\n\n    conn = connect_db()\n    cursor = conn.cursor()\n\n    cursor.execute(\"\"\"\n                   CREATE TABLE IF NOT EXISTS Users (\n                        Identifier TEXT NOT NULL PRIMARY KEY,\n                        Username TEXT NOT NULL UNIQUE,\n                        PasswordHash TEXT NOT NULL,\n                        CreatedAt TEXT NOT NULL)\"\"\")\n\n    cursor.execute(\"\"\"\n                   CREATE TABLE IF NOT EXISTS DownloadedMedias\n                   (\n                       Identifier TEXT NOT NULL PRIMARY KEY,\n                       UserIdentifier TEXT NOT NULL,\n                       Url TEXT,\n                       Title TEXT NOT NULL,\n                       MediaType TEXT NOT NULL,\n                       DownloadedAt TEXT,\n                       DownloadPath TEXT NOT NULL UNIQUE,\n                       IsPlayable BOOLEAN NOT NULL,\n                       FOREIGN KEY (UserIdentifier) REFERENCES Users (Identifier) ON DELETE CASCADE\n                   )\"\"\")\n\n    cursor.execute(\"\"\"\n                   CREATE TABLE IF NOT EXISTS Playlists\n                   (\n                       Identifier TEXT NOT NULL PRIMARY KEY,\n                       UserIdentifier TEXT NOT NULL,\n                       Name TEXT NOT NULL,\n                       Description TEXT,\n                       FOREIGN KEY (UserIdentifier) REFERENCES Users (Identifier) ON DELETE CASCADE\n                   )\"\"\")\n\n    cursor.execute(\"\"\"\n                   CREATE TABLE IF NOT EXISTS PlaylistMedias\n                   (\n                       PlaylistIdentifier TEXT NOT NULL,\n                       MediaIdentifier TEXT NOT NULL,\n                       Position INTEGER NOT NULL,\n                       PRIMARY KEY (PlaylistIdentifier, MediaIdentifier),\n                       FOREIGN KEY (PlaylistIdentifier) REFERENCES Playlists (Identifier) ON DELETE CASCADE,\n                       FOREIGN KEY (MediaIdentifier) REFERENCES DownloadedMedias (Identifier) ON DELETE CASCADE\n                   )\"\"\")\n\n    cursor.execute(\"\"\"\n                   CREATE TABLE IF NOT EXISTS Settings\n                   (\n                       Identifier TEXT NOT NULL PRIMARY KEY,\n                       UserIdentifier TEXT NOT NULL UNIQUE,\n                       DownloadPath TEXT NOT NULL,\n                       DarkModeEnabled BOOLEAN NOT NULL,\n                       ScanFolderOnStartup BOOLEAN NOT NULL,\n                       FOREIGN KEY (UserIdentifier) REFERENCES Users (Identifier) ON DELETE CASCADE\n                   )\"\"\")\n\n    conn.commit()\n    conn.close()\n\ndef connect_db():\n    conn = sqlite3.connect(db_path, timeout=20.0)\n    conn.execute(\"PRAGMA journal_mode=WAL\")\n    conn.execute(\"PRAGMA foreign_keys = ON\")\n    conn.execute(\"PRAGMA busy_timeout=5000\")\n    conn.row_factory = sqlite3.Row\n    return conn\n\nclass PlaylistModel(BaseModel):\n    Identifier: str\n    Name: str\n    Description: Optional[str] = None\n\nclass MediaModel(BaseModel):\n    Identifier: str\n    Url: str\n    MediaType: str\n    DownloadedAt: str\n    DownloadPath: str\n    IsPlayable: bool\n    Title: str\n\nclass PlaylistMediaModel(BaseModel):\n    PlaylistIdentifier: str\n    MediaIdentifier: str\n    Position: int\n\nclass SettingsModel(BaseModel):\n    Identifier: str\n    DownloadPath: str\n    DarkModeEnabled: bool\n    ScanFolderOnStartup: bool\n\nclass SaveUserDataRequest(BaseModel):\n    user_identifier: str\n    playlists: List[PlaylistModel]\n    medias: List[MediaModel]\n    playlist_medias: List[PlaylistMediaModel]\n    setting: SettingsModel\n\n\ndef save_user_data(request: SaveUserDataRequest):\n    user_identifier = request.user_identifier\n    playlists = request.playlists\n    medias = request.medias\n    playlist_medias = request.playlist_medias\n    setting = request.setting\n\n    conn = connect_db()\n    cursor = conn.cursor()\n\n    try:\n        for media in medias:\n            cursor.execute(\n                \"\"\"INSERT INTO DownloadedMedias \n                   (Identifier, UserIdentifier, Url, MediaType, DownloadedAt, DownloadPath, IsPlayable, Title)\n                   VALUES (?, ?, ?, ?, ?, ?, ?, ?)\n                   ON CONFLICT(Identifier) DO UPDATE SET\n                   Url = excluded.Url,\n                   MediaType = excluded.MediaType,\n                   DownloadedAt = excluded.DownloadedAt,\n                   DownloadPath = excluded.DownloadPath,\n                   IsPlayable = excluded.IsPlayable,\n                   Title = excluded.Title\"\"\",\n                (media.Identifier, user_identifier, media.Url, media.MediaType,\n                 media.DownloadedAt, media.DownloadPath, media.IsPlayable, media.Title)\n            )\n\n        for playlist in playlists:\n            cursor.execute(\n                \"\"\"INSERT INTO Playlists (Identifier, UserIdentifier, Name, Description)\n                   VALUES (?, ?, ?, ?) ON CONFLICT(Identifier) DO\n                UPDATE SET\n                    Name = excluded.Name,\n                    Description = excluded.Description\"\"\",\n                (playlist.Identifier, user_identifier, playlist.Name, playlist.Description)\n            )\n\n        for playlist_media in playlist_medias:\n            cursor.execute(\n                \"\"\"INSERT INTO PlaylistMedias (PlaylistIdentifier, MediaIdentifier, Position)\n                   VALUES (?, ?, ?) ON CONFLICT(PlaylistIdentifier, MediaIdentifier) DO\n                UPDATE SET\n                    Position = excluded.Position\"\"\",\n                (playlist_media.PlaylistIdentifier, playlist_media.MediaIdentifier, playlist_media.Position)\n            )\n\n        cursor.execute(\n            \"\"\"INSERT INTO Settings\n               (Identifier, UserIdentifier, DownloadPath, DarkModeEnabled, ScanFolderOnStartup)\n               VALUES (?, ?, ?, ?, ?) ON CONFLICT(Identifier) DO\n            UPDATE SET\n                DownloadPath = excluded.DownloadPath,\n                DarkModeEnabled = excluded.DarkModeEnabled,\n                ScanFolderOnStartup = excluded.ScanFolderOnStartup\"\"\",\n            (setting.Identifier, user_identifier, setting.DownloadPath,\n             setting.DarkModeEnabled, setting.ScanFolderOnStartup)\n        )\n\n        conn.commit()\n        conn.close()\n    except Exception as e:\n        raise fastapi.HTTPException(status_code=400, detail=str(e))\n\n@app.post(\"/save\")\nasync def handle_save_user_data(req: SaveUserDataRequest):\n\n    # Validiere user_identifier\n    if not req.user_identifier or len(req.user_identifier) > 100:\n        raise fastapi.HTTPException(status_code=400, detail=\"Invalid user identifier\")\n\n    # Validiere Größen (DoS Prevention)\n    if len(req.playlists) > 1000:\n        raise fastapi.HTTPException(status_code=400, detail=\"Too many playlists\")\n\n    if len(req.medias) > 10000:\n        raise fastapi.HTTPException(status_code=400, detail=\"Too many medias\")\n\n    try:\n        save_user_data(req)\n        log_queue.put_nowait(f\"[INFO] User data for '{req.user_identifier}' saved successfully\")\n        return {\"message\": \"User data saved successfully\"}\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error saving user data for '{req.user_identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n# ---------------- User Endpoints ----------------\n\ndef create_user(username: str, password: str, identifier: str, created_at: str):\n    conn = connect_db()\n    cursor = conn.cursor()\n\n    cursor.execute(\"\"\"INSERT INTO Users (Username, PasswordHash, Identifier, CreatedAt) VALUES (?, ?, ?, ?)\"\"\", (username, password, identifier, created_at))\n    conn.commit()\n    conn.close()\n\n@app.get(\"/get/user/{identifier}\", response_model=UserResponse)\nasync def get_users(identifier: str):\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT Identifier, Username, CreatedAt FROM Users WHERE Identifier = ?\", (identifier,))\n        row = cursor.fetchone()\n\n        if row is None:\n            cursor.execute(\"SELECT Identifier, Username, CreatedAt FROM Users WHERE Username = ?\", (identifier,))\n            row = cursor.fetchone()\n\n            if row is None:\n                conn.close()\n                log_queue.put_nowait(f\"[ERROR] User lookup failed for identifier/username '{identifier}'\")\n                raise fastapi.HTTPException(status_code=404, detail=\"User not found\")\n\n        conn.close()\n        log_queue.put_nowait(f\"[INFO] User '{identifier}' retrieved successfully\")\n        return dict(row)\n    except fastapi.HTTPException:\n        raise\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error retrieving user '{identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.get(\"/getall/users/{key}\", response_model=List[UserResponse])\nasync def get_all_users(key: str):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT Identifier, Username, CreatedAt FROM Users\")\n        rows = cursor.fetchall()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Retrieved {len(rows)} users\")\n        return [dict(row) for row in rows]\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error retrieving all users: {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.post(\"/create-tables/{key}\", response_model=MessageResponse)\nasync def create_table(key: str):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        create_app_tables()\n        log_queue.put_nowait(\"[INFO] Tables created successfully\")\n        return {\"message\": \"Tables created successfully\"}\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error creating tables: {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.post(\"/create/user/{key}\", response_model=CreateResponse)\nasync def handle_create_user_req(key: str, req: CreateUserRequest):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        identifier = str(uuid.uuid4())\n        username = req.username\n        password = req.password\n        created_at = datetime.now().isoformat()\n\n        password_hash = bcrypt.hashpw(password.encode(\"utf-8\"), bcrypt.gensalt()).decode(\"utf-8\")\n\n        create_user(username, password_hash, identifier, created_at)\n\n        log_queue.put_nowait(f\"[INFO] User '{username}' created successfully with id {identifier}\")\n        return {\"message\": \"User created successfully\", \"identifier\": identifier}\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error creating user '{req.username}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=400, detail=str(e))\n\n\n@app.post(\"/delete/user/{key}\", response_model=MessageResponse)\nasync def handle_delete_user_req(key: str, identifier: str):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"\"\"DELETE FROM Users WHERE Identifier = ?\"\"\", (identifier,))\n        conn.commit()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] User '{identifier}' deleted successfully\")\n        return {\"message\": \"User deleted successfully\"}\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error deleting user '{identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n# ---------------- Playlist Endpoints ----------------\n\n@app.get(\"/get/playlists/{identifier}\", response_model=List[PlaylistResponse])\nasync def get_playlists(identifier: str):\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT Identifier, UserIdentifier, Name, Description FROM Playlists WHERE Identifier = ?\", (identifier,))\n        rows = cursor.fetchall()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Retrieved playlist(s) for identifier '{identifier}'\")\n        return [dict(row) for row in rows]\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error retrieving playlists for '{identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.post(\"/create/playlist/{key}\", response_model=CreateResponse)\nasync def handle_create_playlist_req(key: str, req: CreatePlaylistRequest):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        identifier = str(uuid.uuid4())\n\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"\"\"INSERT INTO Playlists (Identifier, UserIdentifier, Name, Description) VALUES (?, ?, ?, ?)\"\"\", (identifier, req.user_identifier, req.name, req.description))\n        conn.commit()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Playlist '{req.name}' created successfully with id {identifier}\")\n        return {\"message\": \"Playlist created successfully\", \"identifier\": identifier}\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error creating playlist '{req.name}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=400, detail=str(e))\n\n\n@app.post(\"/delete/playlist/{key}\", response_model=MessageResponse)\nasync def handle_delete_playlist_req(key: str, identifier: str):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"\"\"DELETE FROM Playlists WHERE Identifier = ?\"\"\", (identifier,))\n        conn.commit()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Playlist '{identifier}' deleted successfully\")\n        return {\"message\": \"Playlist deleted successfully\"}\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error deleting playlist '{identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.get(\"/getall/playlists/{key}\", response_model=List[PlaylistResponse])\nasync def get_all_playlists(key: str):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT Identifier, UserIdentifier, Name, Description FROM Playlists\")\n        rows = cursor.fetchall()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Retrieved {len(rows)} playlists\")\n        return [dict(row) for row in rows]\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error retrieving all playlists: {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n# ---------------- DownloadedMedia Endpoints ----------------\n\n@app.post(\"/create/downloadedmedia/{key}\", response_model=CreateResponse)\nasync def handle_create_downloaded_media_req(key: str, req: CreateDownloadedMediaRequest):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        identifier = str(uuid.uuid4())\n\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\n            \"\"\"INSERT INTO DownloadedMedias (Identifier, UserIdentifier, Url, MediaType, DownloadedAt, DownloadPath, IsPlayable, Title) VALUES (?, ?, ?, ?, ?, ?, ?, ?)\"\"\",\n            (identifier, req.user_identifier, req.url, req.mediatype, req.downloaded_at, req.download_path, req.is_playable, req.title)\n        )\n        conn.commit()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Downloaded media '{req.title}' created successfully with id {identifier}\")\n        return {\"message\": \"Downloaded media created successfully\", \"identifier\": identifier}\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error creating downloaded media '{req.title}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=400, detail=str(e))\n\n\n@app.post(\"/delete/downloadedmedia/{key}\", response_model=MessageResponse)\nasync def handle_delete_downloaded_media_req(key: str, identifier: str):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"\"\"DELETE FROM DownloadedMedias WHERE Identifier = ?\"\"\", (identifier,))\n        conn.commit()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Downloaded media '{identifier}' deleted successfully\")\n        return {\"message\": \"Downloaded media deleted successfully\"}\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error deleting downloaded media '{identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.get(\"/get/downloadedmedia/{identifier}\", response_model=DownloadedMediaResponse)\nasync def get_downloaded_media(identifier: str):\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT Identifier, UserIdentifier, Url, MediaType, DownloadedAt, DownloadPath, IsPlayable, Title FROM DownloadedMedias WHERE Identifier = ?\", (identifier,))\n        row = cursor.fetchone()\n        conn.close()\n\n        if row is None:\n            log_queue.put_nowait(f\"[ERROR] Downloaded media '{identifier}' not found\")\n            raise fastapi.HTTPException(status_code=404, detail=\"Downloaded media not found\")\n\n        log_queue.put_nowait(f\"[INFO] Downloaded media '{identifier}' retrieved successfully\")\n        return dict(row)\n    except fastapi.HTTPException:\n        raise\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error retrieving downloaded media '{identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.get(\"/getall/downloadedmedias/{key}\", response_model=List[DownloadedMediaResponse])\nasync def get_all_downloaded_media(key: str):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT Identifier, UserIdentifier, Url, MediaType, DownloadedAt, DownloadPath, IsPlayable, Title FROM DownloadedMedias\")\n        rows = cursor.fetchall()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Retrieved {len(rows)} downloaded medias\")\n        return [dict(row) for row in rows]\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error retrieving all downloaded medias: {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.get(\"/getuser/downloadedmedias/{user_identifier}\", response_model=List[DownloadedMediaResponse])\nasync def get_user_downloaded_medias(user_identifier: str):\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT Identifier, UserIdentifier, Title, Url, MediaType, DownloadedAt, DownloadPath, IsPlayable FROM DownloadedMedias WHERE UserIdentifier = ?\", (user_identifier,))\n        rows = cursor.fetchall()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Retrieved {len(rows)} downloaded medias for user '{user_identifier}'\")\n        return [dict(row) for row in rows]\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error retrieving downloaded medias for user '{user_identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n# ---------------- Settings Endpoints ----------------\n\n@app.post(\"/create/settings/{key}\", response_model=CreateResponse)\nasync def handle_create_setting_req(key: str, req: CreateSettingsRequest):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        identifier = str(uuid.uuid4())\n\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\n            \"\"\"INSERT INTO Settings (Identifier, UserIdentifier, DownloadPath, DarkModeEnabled, ScanFolderOnStartup) VALUES (?, ?, ?, ?, ?)\"\"\",\n            (identifier, req.user_identifier, req.default_download_path, req.dark_mode_enabled, req.scan_folder_on_startup)\n        )\n        conn.commit()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Settings created successfully for user '{req.user_identifier}' with id {identifier}\")\n        return {\"message\": \"Setting created successfully\", \"identifier\": identifier}\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error creating settings for user '{req.user_identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=400, detail=str(e))\n\n\n@app.post(\"/delete/settings/{key}\", response_model=MessageResponse)\nasync def handle_delete_setting_req(key: str, identifier: str):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"\"\"DELETE FROM Settings WHERE Identifier = ?\"\"\", (identifier,))\n        conn.commit()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Settings '{identifier}' deleted successfully\")\n        return {\"message\": \"Setting deleted successfully\"}\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error deleting settings '{identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.get(\"/get/settings/{user_identifier}\", response_model=SettingsResponse)\nasync def get_setting(user_identifier: str):\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT Identifier, UserIdentifier, DownloadPath, DarkModeEnabled, ScanFolderOnStartup FROM Settings WHERE UserIdentifier = ?\", (user_identifier,))\n        row = cursor.fetchone()\n        conn.close()\n\n        if row is None:\n            log_queue.put_nowait(f\"[INFO] No settings found for user '{user_identifier}' (expected for new users)\")\n            raise fastapi.HTTPException(status_code=404, detail=\"Setting not found\")\n\n        log_queue.put_nowait(f\"[INFO] Settings retrieved for user '{user_identifier}'\")\n        return dict(row)\n    except fastapi.HTTPException:\n        raise\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error retrieving settings for user '{user_identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.get(\"/getall/settings/{key}\", response_model=List[SettingsResponse])\nasync def get_all_settings(key: str):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT Identifier, UserIdentifier, DownloadPath, DarkModeEnabled, ScanFolderOnStartup FROM Settings\")\n        rows = cursor.fetchall()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Retrieved {len(rows)} settings entries\")\n        return [dict(row) for row in rows]\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error retrieving all settings: {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n# ---------------- PlaylistMedia Endpoints ----------------\n\n@app.post(\"/create/playlistmedia/{key}\", response_model=CreatePlaylistMediaResponse)\nasync def handle_create_playlist_media_req(key: str, req: CreatePlaylistMediaRequest):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT COUNT(*) FROM PlaylistMedias WHERE PlaylistIdentifier = ? AND MediaIdentifier = ?\", (req.playlist_identifier, req.media_identifier))\n        count = cursor.fetchone()[0]\n\n        if count > 0:\n            conn.close()\n            log_queue.put_nowait(f\"[ERROR] Media '{req.media_identifier}' already exists in playlist '{req.playlist_identifier}'\")\n            raise fastapi.HTTPException(status_code=400, detail=\"Media already exists in the playlist\")\n\n        cursor.execute(\"SELECT MAX(Position) FROM PlaylistMedias WHERE PlaylistIdentifier = ?\", (req.playlist_identifier,))\n        max_position_row = cursor.fetchone()\n        max_position = max_position_row[0] if max_position_row[0] is not None else 0\n        new_position = max_position + 1\n\n        cursor.execute(\"\"\"INSERT INTO PlaylistMedias (PlaylistIdentifier, MediaIdentifier, Position) VALUES (?, ?, ?)\"\"\", (req.playlist_identifier, req.media_identifier, new_position))\n        conn.commit()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Media '{req.media_identifier}' added to playlist '{req.playlist_identifier}' at position {new_position}\")\n        return {\"message\": \"Media added to playlist successfully\", \"position\": new_position}\n    except fastapi.HTTPException:\n        raise\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error adding media '{req.media_identifier}' to playlist '{req.playlist_identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=400, detail=str(e))\n\n\n@app.post(\"/delete/playlistmedia/{key}\", response_model=MessageResponse)\nasync def handle_delete_playlist_media_req(key: str, req: DeletePlaylistMediaRequest):\n    if key != ADMIN_KEY:\n        raise fastapi.HTTPException(status_code=401, detail=\"Unauthorized\")\n\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"DELETE FROM PlaylistMedias WHERE PlaylistIdentifier = ? AND MediaIdentifier = ?\", (req.playlist_identifier, req.media_identifier))\n        conn.commit()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Media '{req.media_identifier}' removed from playlist '{req.playlist_identifier}'\")\n        return {\"message\": \"Media removed from playlist successfully\"}\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error removing media '{req.media_identifier}' from playlist '{req.playlist_identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n@app.get(\"/get/playlistmedias/{playlist_identifier}\", response_model=List[PlaylistMediaResponse])\nasync def get_playlist_medias(playlist_identifier: str):\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT PlaylistIdentifier, MediaIdentifier, Position FROM PlaylistMedias WHERE PlaylistIdentifier = ? ORDER BY Position\", (playlist_identifier,))\n        rows = cursor.fetchall()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Retrieved {len(rows)} media entries for playlist '{playlist_identifier}'\")\n        return [dict(row) for row in rows]\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error retrieving media for playlist '{playlist_identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n@app.get(\"/getuser/playlists/{user_identifier}\", response_model=List[PlaylistResponse])\nasync def get_user_playlists(user_identifier: str):\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT Identifier, UserIdentifier, Name, Description FROM Playlists WHERE UserIdentifier = ?\", (user_identifier,))\n        rows = cursor.fetchall()\n        conn.close()\n\n        log_queue.put_nowait(f\"[INFO] Retrieved {len(rows)} playlists for user '{user_identifier}'\")\n        return [dict(row) for row in rows]\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error retrieving playlists for user '{user_identifier}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n\n# ---------------- Login ----------------\n\n@app.post(\"/login\", response_model=LoginResponse)\nasync def handle_login_req(req: LoginRequest):\n    try:\n        conn = connect_db()\n        cursor = conn.cursor()\n\n        cursor.execute(\"SELECT Identifier, PasswordHash FROM Users WHERE Username = ?\", (req.username,))\n        row = cursor.fetchone()\n        conn.close()\n\n        if row is None:\n            log_queue.put_nowait(f\"[ERROR] Login failed: user '{req.username}' not found\")\n            raise fastapi.HTTPException(status_code=404, detail=\"User not found\")\n\n        identifier, password_hash = row[\"Identifier\"], row[\"PasswordHash\"]\n\n        if not bcrypt.checkpw(req.password.encode(\"utf-8\"), password_hash.encode(\"utf-8\")):\n            log_queue.put_nowait(f\"[ERROR] Login failed: invalid password for user '{req.username}'\")\n            raise fastapi.HTTPException(status_code=401, detail=\"Invalid password\")\n\n        log_queue.put_nowait(f\"[INFO] User '{req.username}' logged in successfully\")\n        return {\"message\": \"Login successful\", \"identifier\": identifier}\n    except fastapi.HTTPException:\n        raise\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error during login for user '{req.username}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))\n\n@app.post(\"/register\")\nasync def handle_register_req(req: RegisterRequest):\n    try:\n\n        create_user_req = CreateUserRequest(username=req.username, password=req.password)\n        response = await handle_create_user_req(ADMIN_KEY, create_user_req)\n\n        if response:\n            log_queue.put_nowait(f\"[INFO] User '{req.username}' registered successfully\")\n            return {\"message\": \"User registered successfully\", \"identifier\" : response[\"identifier\"]}\n    except fastapi.HTTPException:\n        raise\n    except Exception as e:\n        log_queue.put_nowait(f\"[ERROR] Error during registration for user '{req.username}': {str(e)}\")\n        raise fastapi.HTTPException(status_code=500, detail=str(e))", "loc": 1024, "error": null, "lang": "py"}, {"path": "tests/create_delete_tests.py", "name": "tests.create_delete_tests", "doc": "Auth- und Robustheitstest fuer die create/delete-Endpunkte.\n\nBeispiele:\n    python create_delete_tests.py quick\n    python create_delete_tests.py normal\n    python create_delete_tests.py intense --base-url http://127.0.0.1:8765\n\nAbgedeckte Endpunkte (Pfade und Modelle exakt nach server.py):\n    POST /create/user/               CreateUserRequest\n    POST /delete/user/{id}\n    POST ck_server,\n                         enable_colors, load_env_value, mask_secret,\n                         run_suite, select_cases, selected_mode)\n\nTESTS_DIR = Path(__file__).resolve().parent\nSERVER_DIR = TESTS_DIR.parent\nPROJECT_ROOT = SERVER_DIR.parent\nLOG_FILE = TESTS_DIR / \"download_endpoint_test.log\"\nENV_FILE = PROJECT_ROOT / \".env\"\nHEADER_NAME = \"X-Admin-Key\"\nDEFAULT_ENDPOINT = \"/download/video-audio\"\n\nTIMEOUT = {\"quick\": 10, \"normal\": 15, \"intense\": 30}\nPAUSE = {\"quick\": 0.0, \"normal\": 0.1, \"intense\": 0.15}\n\n# Strukturell gueltiger Body. Nur fuer die Auth-Ebene - dort greift die Auth\n# vor jeder Verarbeitung, es wird also nichts heruntergeladen.\nVALID = {\n    \"provider\": \"youtube\",\n    \"urls\": [\"https://www.youtube.com/watch?v=dQw4w9WgXcQ\"],\n    \"filenames\": [\"pyscrapper_authtest\"],\n    \"download_strategie\": \"stream\",\n    \"preferred_type\": \"audio\",\n    \"preferred_file\": \"mp3\",\n}\n\nS_AUTH = \"AUTH\"\nS_SCHEMA = \"SCHEMA\"\nS_PROVIDER = \"PROVIDER\"\nS_URL = \"URLS\"\nS_FILE = \"DATEINAMEN\"\nS_OPT = \"OPTIONEN\"\nS_EDGE = \"GRENZWERTE\"\n\n\ndef build_cases(admin_key: str) -> list[Case]:\n    def body(**overrides):\n        return {**VALID, **overrides}\n\n    return [\n        # ---------------------------------------------------------- AUTH\n        Case(\"kein Admin-Key\", \"unauth\", S_AUTH, VALID, headers={}, level=\"quick\",\n             checks=\"Endpoint haengt an require_admin\"),\n        Case(\"falscher Admin-Key\", \"unauth\", S_AUTH, VALID,\n             headers={HEADER_NAME: \"definitiv-falscher-key\"}, level=\"quick\",\n             checks=\"fremder Key darf nicht durchkommen\"),\n        Case(\"leerer Admin-Key\", \"unauth\", S_AUTH, VALID,\n             headers={HEADER_NAME: \"\"}, level=\"quick\",\n             checks=\"leerer Header ist kein gueltiger Key\"),\n        Case(\"Key im Authorization-Header\", \"unauth\", S_AUTH, VALID,\n             headers={\"Authorization\": admin_key}, level=\"normal\",\n             checks=\"nur X-Admin-Key zaehlt\"),\n        Case(\"Key als Query-Parameter\", \"unauth\", S_AUTH, VALID, headers={},\n             path=f\"{DEFAULT_ENDPOINT}?key={admin_key}\", level=\"intense\",\n             checks=\"alter Aufrufstil mit Key im Pfad darf nicht greifen\"),\n\n        # -------------------------------------------------------- SCHEMA\n        Case(\"leerer Body\", \"reject\", S_SCHEMA, {}, level=\"quick\",\n             checks=\"provider, urls und filenames fehlen\"),\n        Case(\"voellig falsche Felder\", \"reject\", S_SCHEMA,\n             {\"foo\": \"bar\", \"banana\": 42}, level=\"quick\",\n             checks=\"keines der Pflichtfelder vorhanden\"),\n        Case(\"altes Schema url/filename/mediatype\", \"reject\", S_SCHEMA,\n             {\"provider\": \"youtube\", \"url\": \"https://example.com/x\",\n              \"mediatype\": \".mp3\", \"filename\": \"test\"}, level=\"quick\",\n             checks=\"Regression: Modell erwartet urls und filenames als Listen\"),\n        Case(\"null in Pflichtfeldern\", \"reject\", S_SCHEMA,\n             {\"provider\": None, \"urls\": None, \"filenames\": None}, level=\"normal\",\n             checks=\"None ist fuer str und list[str] nicht zulaessig\"),\n        Case(\"falsche Typen\", \"reject\", S_SCHEMA,\n             {\"provider\": 12345, \"urls\": \"keine liste\", \"filenames\": {\"a\": 1}},\n             level=\"quick\", checks=\"Pydantic-Typpruefung je Feld\"),\n        Case(\"urls als String statt Liste\", \"reject\", S_SCHEMA,\n             {\"provider\": \"youtube\", \"urls\": \"https://example.com/x\",\n              \"filenames\": [\"a\"]}, level=\"normal\",\n             checks=\"urls muss list[str] sein\"),\n        Case(\"Liste mit Nicht-Strings\", \"reject\", S_SCHEMA,\n             {\"provider\": \"youtube\", \"urls\": [123, None], \"filenames\": [\"a\", \"b\"]},\n             level=\"normal\", checks=\"validateListStr prueft jeden Eintrag\"),\n        Case(\"Body ist eine Liste\", \"reject\", S_SCHEMA, [1, 2, 3], level=\"normal\",\n             checks=\"Body muss ein JSON-Objekt sein\"),\n        Case(\"fehlendes filenames\", \"reject\", S_SCHEMA,\n             {\"provider\": \"youtube\", \"urls\": [\"https://example.com/x\"]},\n             level=\"normal\", checks=\"filenames ist Pflichtfeld\"),\n\n        # ------------------------------------------------------ PROVIDER\n        Case(\"unbekannter Provider\", \"reject\", S_PROVIDER,\n             body(provider=\"totallynotaprovider\"), level=\"quick\",\n             checks=\"validateProviders findet keinen Alias\"),\n        Case(\"leerer Provider\", \"reject\", S_PROVIDER, body(provider=\"\"),\n             level=\"normal\", checks=\"leerer String trifft keinen Provider\"),\n        Case(\"Provider nur Whitespace\", \"reject\", S_PROVIDER, body(provider=\"   \"),\n             level=\"intense\", checks=\"Whitespace darf keinen Provider treffen\"),\n        Case(\"Provider mit Steuerzeichen\", \"reject\", S_PROVIDER,\n             body(provider=\"youtube\\n\"), level=\"intense\",\n             checks=\"Alias-Vergleich soll Steuerzeichen nicht dulden\"),\n        Case(\"Provider mit Pfadanteil\", \"reject\", S_PROVIDER,\n             body(provider=\"../youtube\"), level=\"intense\",\n             checks=\"Alias-Lookup darf keine Pfade dulden\"),\n\n        # ---------------------------------------------------------- URLS\n        Case(\"leere URL-Liste\", \"reject\", S_URL, body(urls=[], filenames=[]),\n             level=\"normal\", checks=\"ohne URL gibt es nichts aufzuloesen\"),\n        Case(\"urls und filenames unterschiedlich lang\", \"reject\", S_URL,\n             body(urls=[\"https://example.com/a\", \"https://example.com/b\"],\n                  filenames=[\"nur_einer\"]), level=\"quick\",\n             checks=\"ArgumentErrorCompare in model_post_init\"),\n        Case(\"http statt https\", \"reject\", S_URL,\n             body(urls=[\"http://example.com/x\"]), level=\"quick\",\n             checks=\"validateHostDefault erlaubt nur https\"),\n        Case(\"file://-Schema\", \"reject\", S_URL,\n             body(urls=[\"file:///etc/passwd\"]), level=\"quick\",\n             checks=\"lokaler Dateizugriff ueber die URL\"),\n        Case(\"ftp://-Schema\", \"reject\", S_URL,\n             body(urls=[\"ftp://example.com/x\"]), level=\"normal\",\n             checks=\"nur http-Schemata sind vorgesehen\"),\n        Case(\"data:-Schema\", \"reject\", S_URL,\n             body(urls=[\"data:text/plain,hello\"]), level=\"normal\",\n             checks=\"Datenschema ist keine abrufbare Ressource\"),\n        Case(\"javascript:-Schema\", \"reject\", S_URL,\n             body(urls=[\"javascript:alert(1)\"]), level=\"normal\",\n             checks=\"Skriptschema darf nicht akzeptiert werden\"),\n        Case(\"kein URL-Format, nur Text\", \"reject\", S_URL,\n             body(urls=[\"das ist keine url\"]), level=\"normal\",\n             checks=\"urlparse liefert kein Schema\"),\n        Case(\"localhost als Ziel\", \"reject\", S_URL,\n             body(urls=[\"https://127.0.0.1:8765/health\"]), level=\"intense\",\n             checks=\"SSRF auf den eigenen Server\"),\n        Case(\"interne IP als Ziel\", \"reject\", S_URL,\n             body(urls=[\"https://192.168.0.1/admin\"]), level=\"intense\",\n             checks=\"SSRF ins lokale Netz\"),\n        Case(\"Zugangsdaten in der URL\", \"reject\", S_URL,\n             body(urls=[\"https://user:pass@example.com/x\"]), level=\"intense\",\n             checks=\"Credentials im URL-Teil\"),\n\n        # ---------------------------------------------------- DATEINAMEN\n        Case(\"Path-Traversal Windows\", \"reject\", S_FILE,\n             body(filenames=[\"..\\\\..\\\\..\\\\windows\\\\system32\\\\evil\"]), level=\"quick\",\n             checks=\"Ausbruch aus dem Zielordner\"),\n        Case(\"Path-Traversal Unix\", \"reject\", S_FILE,\n             body(filenames=[\"../../../../etc/cron.d/x\"]), level=\"quick\",\n             checks=\"Ausbruch aus dem Zielordner\"),\n        Case(\"absoluter Windows-Pfad\", \"reject\", S_FILE,\n             body(filenames=[\"C:\\\\Windows\\\\evil\"]), level=\"normal\",\n             checks=\"os.path.join ignoriert den Zielordner\"),\n        Case(\"absoluter Unix-Pfad\", \"reject\", S_FILE,\n             body(filenames=[\"/etc/passwd\"]), level=\"normal\",\n             checks=\"fuehrender Slash setzt den Zielordner ausser Kraft\"),\n        Case(\"UNC-Pfad\", \"reject\", S_FILE,\n             body(filenames=[\"\\\\\\\\server\\\\share\\\\evil\"]), level=\"intense\",\n             checks=\"Netzwerkfreigabe als Ziel\"),\n        Case(\"Reservename CON\", \"reject\", S_FILE, body(filenames=[\"CON\"]),\n             level=\"normal\", checks=\"reservierte Geraetenamen unter Windows\"),\n        Case(\"Reservename COM1\", \"reject\", S_FILE, body(filenames=[\"COM1\"]),\n             level=\"intense\", checks=\"reservierte Geraetenamen unter Windows\"),\n        Case(\"leerer Dateiname\", \"reject\", S_FILE, body(filenames=[\"\"]),\n             level=\"normal\", checks=\"Name ohne Stamm\"),\n        Case(\"Dateiname nur Whitespace\", \"reject\", S_FILE, body(filenames=[\"   \"]),\n             level=\"intense\", checks=\"Whitespace als Dateiname\"),\n        Case(\"Dateiname ist ein Punkt\", \"reject\", S_FILE, body(filenames=[\".\"]),\n             level=\"intense\", checks=\"Punkt verweist auf den Ordner selbst\"),\n        Case(\"Nullbyte im Dateinamen\", \"reject\", S_FILE,\n             body(filenames=[\"evil\\u0000.mp3\"]), level=\"intense\",\n             checks=\"Nullbyte kann Pfadpruefungen abschneiden\"),\n        Case(\"Steuerzeichen im Dateinamen\", \"reject\", S_FILE,\n             body(filenames=[\"a\\r\\nb\"]), level=\"intense\",\n             checks=\"Zeilenumbrueche in Pfaden und Logs\"),\n\n        # ------------------------------------------------------ OPTIONEN\n        Case(\"unbekannte Strategie\", \"reject\", S_OPT,\n             body(download_strategie=\"teleport\"), level=\"normal\",\n             checks=\"Enum kennt nur stream, local und cached_stream\"),\n        Case(\"preferred_type ungueltig\", \"reject\", S_OPT,\n             body(preferred_type=\"hologram\"), level=\"normal\",\n             checks=\"erlaubt sind nur audio und video\"),\n        Case(\"preferred_file nicht unterstuetzt\", \"reject\", S_OPT,\n             body(preferred_file=\"exe\"), level=\"quick\",\n             checks=\"Endung steht nicht in SUPPORTED_EXTENSIONS\"),\n        Case(\"preferred_file mit fuehrendem Punkt\", \"note\", S_OPT,\n             body(preferred_file=\".mp3\"), level=\"intense\",\n             checks=\"removeprefix('.') soll das abfangen - Verhalten dokumentieren\"),\n        Case(\"extra_headers als String\", \"reject\", S_OPT,\n             body(extra_headers=\"nicht-dict\"), level=\"normal\",\n             checks=\"extra_headers muss ein Objekt sein\"),\n        Case(\"local mit nicht existentem Pfad\", \"reject\", S_OPT,\n             body(download_strategie=\"local\", download_path=\"Z:\\\\gibt\\\\es\\\\nicht\"),\n             level=\"normal\",\n             checks=\"bei local wird der Zielordner auf Existenz und Schreibrecht geprueft\"),\n        Case(\"local mit Systemordner\", \"reject\", S_OPT,\n             body(download_strategie=\"local\", download_path=\"C:\\\\Windows\\\\System32\"),\n             level=\"intense\", checks=\"Schreibversuch in einen Systemordner\"),\n        Case(\"auto_convert als String\", \"reject\", S_OPT,\n             body(download_strategie=\"local\", auto_convert=\"ja\"), level=\"intense\",\n             checks=\"bool wird erwartet\"),\n\n        # ---------------------------------------------------- GRENZWERTE\n        Case(\"extrem langer Dateiname\", \"reject\", S_EDGE,\n             body(filenames=[\"A\" * 5000]), level=\"normal\",\n             checks=\"Pfadlaengenbegrenzung des Dateisystems\"),\n ch     str\n    top        int = 5\n    filters    { creator: str, tags: list[str] }\n\nEin Feld mediatype gibt es nicht - es wurde vom Server stillschweigend\nignoriert, weshalb die frueheren Faelle dazu echte Suchen ausgeloest haben\nstatt eine Ablehnung zu pruefen.\n\nFaelle, die mit gueltigem Provider und gueltigem Suchbegriff durchlaufen,\nloesen echten Traffic zu YouTube und Co. aus. Sie sind mit external=True\nmarkiert und laufen nur in intense oder mit --allow-external.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport sys\nfrom pathlib import Path\n\nsys.path.insert(0, str(Path(__file__).resolve().parent))\n\nfrom test_common import (Case, Reporter, add_common_arguments, check_server,\n                         enable_colors, load_env_value, mask_secret,\n                         run_suite, select_cases, selected_mode)\n\nTESTS_DIR = Path(__file__).resolve().parent\nSERVER_DIR = TESTS_DIR.parent\nPROJECT_ROOT = SERVER_DIR.parent\nLOG_FILE = TESTS_DIR / \"search_endpoint_test.log\"\nENV_FILE = PROJECT_ROOT / \".env\"\nHEADER_NAME = \"X-Admin-Key\"\nDEFAULT_ENDPOINT = \"/search\"\n\nTIMEOUT = {\"quick\": 10, \"normal\": 20, \"intense\": 35}\nPAUSE = {\"quick\": 0.0, \"normal\": 0.1, \"intense\": 0.2}\n\nVALID = {\"provider\": \"youtube\", \"search\": \"test\", \"top\": 3,\n         \"filters\": {\"creator\": \"\", \"tags\": []}}\n\nS_AUTH = \"AUTH\"\nS_SCHEMA = \"SCHEMA\"\nS_PROVIDER = \"PROVIDER\"\nS_QUERY = \"SUCHBEGRIFF\"\nS_TOP = \"TOP\"\nS_FILTER = \"FILTER\"\nS_EDGE = \"GRENZWERTE\"\n\n\ndef build_cases(admin_key: str) -> list[Case]:\n    def body(**overrides):\n        return {**VALID, **overrides}\n\n    return [\n        # ---------------------------------------------------------- AUTH\n        Case(\"kein Admin-Key\", \"unauth\", S_AUTH, VALID, headers={}, level=\"quick\",\n             checks=\"Endpoint haengt an require_admin\"),\n        Case(\"falscher Admin-Key\", \"unauth\", S_AUTH, VALID,\n             headers={HEADER_NAME: \"definitiv-falscher-key\"}, level=\"quick\",\n             checks=\"fremder Key darf nicht durchkommen\"),\n        Case(\"leerer Admin-Key\", \"unauth\", S_AUTH, VALID,\n             headers={HEADER_NAME: \"\"}, level=\"quick\",\n             checks=\"leerer Header ist kein gueltiger Key\"),\n        Case(\"Key mit Leerzeichen am Rand\", \"unauth\", S_AUTH, VALID,\n             headers={HEADER_NAME: f\" {admin_key} \"}, level=\"intense\",\n             checks=\"compare_digest trimmt nicht\"),\n\n        # -------------------------------------------------------- SCHEMA\n        Case(\"leerer Body\", \"reject\", S_SCHEMA, {}, level=\"quick\",\n             checks=\"provider und search fehlen\"),\n        Case(\"voellig falsche Felder\", \"reject\", S_SCHEMA,\n             {\"foo\": \"bar\", \"banana\": 42}, level=\"quick\",\n             checks=\"keine Pflichtfelder vorhanden\"),\n        Case(\"altes Schema query statt search\", \"reject\", S_SCHEMA,\n             {\"provider\": \"youtube\", \"query\": \"test\", \"mediatype\": \".mp3\"},\n             level=\"quick\", checks=\"Regression: Modell erwartet search, nicht query\"),\n        Case(\"null in Pflichtfeldern\", \"reject\", S_SCHEMA,\n             {\"provider\": None, \"search\": None}, level=\"normal\",\n             checks=\"None ist fuer str nicht zulaessig\"),\n        Case(\"falsche Typen\", \"reject\", S_SCHEMA,\n             {\"provider\": 123, \"search\": [\"a\", \"b\"]}, level=\"quick\",\n             checks=\"Pydantic-Typpruefung\"),\n        Case(\"search als Objekt\", \"reject\", S_SCHEMA,\n             {\"provider\": \"youtube\", \"search\": {\"q\": \"test\"}}, level=\"normal\",\n             checks=\"search muss ein String sein\"),\n        Case(\"fehlender Provider\", \"reject\", S_SCHEMA, {\"search\": \"test\"},\n             level=\"normal\", checks=\"provider ist Pflichtfeld\"),\n        Case(\"fehlendes search\", \"reject\", S_SCHEMA, {\"provider\": \"youtube\"},\n             level=\"normal\", checks=\"search ist Pflichtfeld\"),\n        Case(\"Body ist ein String\", \"reject\", S_SCHEMA, \"einfach nur text\",\n             level=\"normal\", checks=\"Body muss ein JSON-Objekt sein\"),\n\n        # ------------------------------------------------------ PROVIDER\n        Case(\"unbekannter Provider\", \"reject\", S_PROVIDER,\n             body(provider=\"totallynotaprovider\"), level=\"quick\",\n             checks=\"kein Alias trifft zu - erwartet wird 4xx, nicht 5xx\"),\n        Case(\"leerer Provider\", \"reject\", S_PROVIDER, body(provider=\"\"),\n             level=\"normal\", checks=\"leerer String trifft keinen Provider\"),\n        Case(\"Provider nur Whitespace\", \"reject\", S_PROVIDER, body(provider=\"   \"),\n             level=\"normal\", checks=\"Whitespace darf keinen Provider treffen\"),\n        Case(\"Provider mit Steuerzeichen\", \"reject\", S_PROVIDER,\n             body(provider=\"youtube\\n\"), level=\"intense\",\n             checks=\"Alias-Vergleich soll Steuerzeichen nicht dulden\"),\n        Case(\"Provider ohne Suchfunktion (default)\", \"reject\", S_PROVIDER,\n             body(provider=\"default\"), level=\"normal\",\n             checks=\"default steht nur im Getresults-Mapping\"),\n        Case(\"Provider ohne Suchfunktion (wcoflix)\", \"reject\", S_PROVIDER,\n             body(provider=\"wcoflix\"), level=\"normal\",\n             checks=\"wcoflix hat keine search-Funktion\"),\n        Case(\"suno - Suche ist Platzhalter\", \"note\", S_PROVIDER,\n             body(provider=\"suno\"), level=\"normal\",\n             checks=\"Verhalten der Platzhalter-Suche dokumentieren\"),\n\n        # --------------------------------------------------- SUCHBEGRIFF\n        Case(\"leerer Suchbegriff\", \"reject\", S_QUERY, body(search=\"\"),\n             level=\"quick\",\n             checks=\"leere Suche soll vor dem Provideraufruf abgelehnt werden\"),\n        Case(\"Suchbegriff nur Whitespace\", \"reject\", S_QUERY, body(search=\"     \"),\n             level=\"normal\", checks=\"Whitespace ist kein Suchbegriff\"),\n        Case(\"SQL-artige Zeichen\", \"note\", S_QUERY,\n             body(search=\"'; DROP TABLE Users;--\"), level=\"normal\", external=True,\n             checks=\"muss als harmloser String behandelt werden\"),\n        Case(\"HTML im Suchbegriff\", \"note\", S_QUERY,\n             body(search=\"<script>alert(1)<\/script>\"), level=\"intense\", external=True,\n             checks=\"darf nicht ungefiltert weitergereicht werden\"),\n        Case(\"Newline im Suchbegriff\", \"note\", S_QUERY,\n             body(search=\"test\\r\\nX-Injected: 1\"), level=\"intense\", external=True,\n             checks=\"Header-Injection in den ausgehenden Aufruf\"),\n\n        # ----------------------------------------------------------- TOP\n        Case(\"top negativ\", \"reject\", S_TOP, body(top=-5), level=\"normal\",\n             checks=\"negative Trefferzahl ergibt keinen Sinn\"),\n        Case(\"top als String\", \"note\", S_TOP, body(top=\"5\"), level=\"intense\",\n             external=True, checks=\"Pydantic wandelt numerische Strings um\"),\n        Case(\"top absurd hoch\", \"reject\", S_TOP, body(top=1_000_000),\n             level=\"intense\", checks=\"Obergrenze fuer aufgeloeste Ergebnisse\"),\n\n        # -------------------------------------------------------- FILTER\n        Case(\"filters als String\", \"reject\", S_FILTER,\n             body(filters=\"keine-struktur\"), level=\"normal\",\n             checks=\"filters muss ein Objekt sein\"),\n        Case(\"tags als String statt Liste\", \"reject\", S_FILTER,\n             body(filters={\"creator\": \"\", \"tags\": \"track\"}), level=\"normal\",\n             checks=\"tags ist list[str]\"),\n        Case(\"tags mit Nicht-Strings\", \"reject\", S_FILTER,\n             body(filters={\"creator\": \"\", \"tags\": [1, None]}), level=\"intense\",\n             checks=\"jeder Tag muss ein String sein\"),\n        Case(\"unbekannter Tag\", \"note\", S_FILTER,\n             body(filters={\"creator\": \"\", \"tags\": [\"gibtsnicht\"]}),\n             level=\"normal\", external=True,\n             checks=\"unbekannter Tag filtert alles weg - leeres Ergebnis erwartet\"),\n\n        # ---------------------------------------------------- GRENZWERTE\n        Case(\"extrem langer Suchbegriff\", \"note\", S_EDGE, body(search=\"A\" * 10000),\n             level=\"normal\", external=True,\n             checks=\"10000 Zeichen gehen ungefiltert an den Anbieter\"),\n        Case(\"sehr viele Tags\", \"note\", S_EDGE,\n             body(filters={\"creator\": \"\", \"tags\": [f\"t{i}\" for i in range(2000)]}),\n             level=\"intense\", external=True, checks=\"grosse Filterliste\"),\n        Case(\"Unicode im Suchbegriff\", \"note\", S_EDGE, body(search=\"Musik Test\"),\n             level=\"intense\", external=True,\n             checks=\"nicht-lateinische Zeichen im Suchbegriff\"),\n    ]\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser(\n        description=\"Auth- und Robustheitstest fuer /search\")\n    add_common_arguments(parser)\n    parser.add_argument(\"--endpoint\", default=DEFAULT_ENDPOINT,\n                        help=f\"Endpoint-Pfad (Default: {DEFAULT_ENDPOINT})\")\n    args = parser.parse_args()\n    enable_colors(args.no_color)\n\n    mode = selected_mode(args)\n    base_url = args.base_url.rstrip(\"/\")\n    endpoint = \"/\" + args.endpoint.strip(\"/\")\n\n    reporter = Reporter(\"PyScrapper · Search-Endpoint\", mode, base_url,\n                        LOG_FILE, verbose=args.verbose)\n\n    admin_key = load_env_value(ENV_FILE, \"ADMIN_KEY\")\n    if not admin_key:\n        reporter.banner(base_url + endpoint, Path(__file__), ENV_FILE)\n        reporter.out(f\"\\n ABBRUCH: ADMIN_KEY nicht in {ENV_FILE} gefunden.\")\n        sys.exit(2)\n\n    all_cases = build_cases(admin_key)\n    cases = select_cases(all_cases, mode, args)\n    external = sum(1 for c in cases if c.external)\n    reporter.banner(base_url + endpoint, Path(__file__), ENV_FILE,\n                    planned=len(cases), total=len(all_cases),\n                    extra={\"Admin-Key\": mask_secret(admin_key)})\n    check_server(reporter, base_url, {HEADER_NAME: admin_key})\n\n    if not cases:\n        reporter.out(\"\\n Kein Fall passt zu Modus und Filter.\")\n        sys.exit(2)\n    if external:\n        reporter.info(f\"{external} Faelle loesen echte Suchanfragen beim Anbieter aus \"\n                      f\"(ohne --allow-external nur in intense).\")\n\n    run_suite(reporter, base_url, cases, endpoint, {HEADER_NAME: admin_key},\n              args, TIMEOUT[mode], PAUSE[mode])\n    sys.exit(reporter.summary())\n\n\nif __name__ == \"__main__\":\n    main()\n", "loc": 218, "error": null, "lang": "py"}, {"path": "tests/test_common.py", "name": "tests.test_common", "doc": "test_common.py\n==============\nGemeinsame Basis der PyScrapper-Endpoint-Tests.\n\nEnthaelt Argumentparser, .env-Zugriff, HTTP-Client (urllib, keine externen\nPakete) und die Ergebnisausgabe.\n\nAusgabe pro Fall ist eine Zeile:\n\n    <symbol> <nr>  <name>                    <status>  <dauer>  <urteil>\n\nDetails (Request, Antwort, geprueftes Verhalten) erscheinen nur bei\nAuffaelligkeiten - oder bei allen Faellen mit --verbose. Am Ende steht eine\nTabelle pro Abschnitt und eine Wiederholung aller Auffaelligkeiten.\n\nDas Logfile enthaelt dasselbe ohne Farbcodes.", "imports": ["from __future__ import annotations", "import argparse", "import json", "import os", "import re", "import socket", "import sys", "import time", "from dataclasses import dataclass, field", "from datetime import datetime", "from pathlib import Path", "from typing import Any, Callable, Mapping", "from urllib import error as urllib_error", "from urllib import request as urllib_request"], "constants": [{"name": "MODES", "value": "('quick', 'normal', 'intense')", "lineno": 37, "big": false}, {"name": "RANK", "value": "{'quick': 0, ' \" {name[:40].ljust(40)}\"\n                     f\"{C.p(str(a).rjust(6), C.GREEN if a else C.GREY)}\"\n                     f\"{C.p(str(b).rjust(12), C.RED if b else C.GREY)}\"\n                     f\"{C.p(str(n).rjust(10), C.YELLOW if n else C.GREY)}\"\n                     f\"{str(a + b + n).rjust(9)}\")\n        self.rule()\n        self.out(f\" {C.p('Gesamt'.ljust(40), C.BOLD)}\"\n                 f\"{C.p(str(self.passed).rjust(6), C.GREEN, C.BOLD)}\"\n                 f\"{C.p(str(self.failed).rjust(12), C.RED if self.failed else C.GREY, C.BOLD)}\"\n                 f\"{C.p(str(self.noted).rjust(10), C.YELLOW if self.noted else C.GREY)}\"\n                 f\"{str(total).rjust(9)}\")\n\n        if self.durations:\n            slowest, slow_name = max(self.durations)\n            average = sum(d for d, _ in self.durations) / len(self.durations)\n            self.out(f\" {C.p('Dauer'.ljust(40), C.GREY)}{elapsed:.1f}s gesamt, \"\n                     f\"{average * 1000:.0f}ms im Schnitt, langsamster \"\n                     f\"{slowest * 1000:.0f}ms ({clip(slow_name, 40)})\")\n        self.out(f\" {C.p('Modus'.ljust(40), C.GREY)}{self.mode}\")\n        self.out(f\" {C.p('Log'.ljust(40), C.GREY)}{self.log_file.resolve()}\")\n\n        if self.failed:\n            self.out()\n            self.out(C.p(\" AUFFAELLIG\", C.RED, C.BOLD))\n            for nr, state, name, section, method, path, reason, checks in self.rows:\n                if state != \"FAIL\":\n                    continue\n                self.out(C.p(f\"  ✗ {nr:03d}  {name}\", C.RED))\n                self.out(C.p(f\"         {section} · {method} {path}\", C.GREY))\n                self.out(C.p(f\"         {reason}\", C.GREY))\n                if checks:\n                    self.out(C.p(f\"         prueft {checks}\", C.GREY))\n\n        if self.noted:\n            self.out()\n            self.out(C.p(\" NOTIERT - dokumentiertes Verhalten, nicht bewertet\", C.YELLOW))\n            for nr, state, name,
