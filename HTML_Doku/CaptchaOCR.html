<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>pyscrapper/ocr :: doc</title>
<style>

*,*::before,*::after{box-sizing:border-box}

/* ============================================================ palette
   dark = default. base is a deep desaturated ink with a cool cast,
   never pure black. accents are a semantic ANSI-derived set: each
   symbol kind owns a hue, so colour carries information.            */
:root, html[data-theme="dark"]{
  --bg:#0B100F; --panel:#101614; --panel2:#151D1A; --panel3:#1B2521;
  --line:#1F2C27; --line2:#2C3D36; --line3:#3D5249;
  --fg:#CBD8D1; --fg2:#8FA298; --fg3:#74897E;
  --grn:#5BD97A; --cyn:#4FD3D3; --mag:#EE7BC8; --yel:#E0B44E;
  --vio:#AC92FF; --red:#FF7373; --blu:#77A9FF; --org:#F09A4B;
  --sel:#1B2E28; --caret:#5BD97A;
  --code:#0D1312; --gutter:#3D5249;
  --tk-k:#EE7BC8; --tk-s:#5BD97A; --tk-c:#4E6259; --tk-n:#E0B44E;
  --tk-d:#F09A4B; --tk-b:#4FD3D3; --tk-def:#AC92FF;
  --glow:0 0 12px rgba(91,217,122,.22);
  --scan:rgba(255,255,255,.014);
}
html[data-theme="light"]{
  --bg:#F2F1EC; --panel:#FBFAF7; --panel2:#EFEEE8; --panel3:#E4E3DC;
  --line:#DCDAD1; --line2:#C4C2B7; --line3:#A6A498;
  --fg:#1B211F; --fg2:#4E5754; --fg3:#68716D;
  --grn:#1E7A3C; --cyn:#0E6E74; --mag:#A4267E; --yel:#8A6206;
  --vio:#5B3FBF; --red:#B32626; --blu:#1D53BF; --org:#A85C10;
  --sel:#DDEADF; --caret:#1E7A3C;
  --code:#F7F6F1; --gutter:#A6A498;
  --tk-k:#A4267E; --tk-s:#1E7A3C; --tk-c:#8D948F; --tk-n:#8A6206;
  --tk-d:#A85C10; --tk-b:#0E6E74; --tk-def:#5B3FBF;
  --glow:none; --scan:rgba(0,0,0,.012);
}
:root{
  --mono:"Cascadia Mono","JetBrains Mono","SF Mono","SFMono-Regular",ui-monospace,
         Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;
  --sans:"Inter","Segoe UI Variable Text","Segoe UI",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --hdr:46px; --bar:26px;
}

html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);
     font-size:13.5px;line-height:1.6;-webkit-font-smoothing:antialiased;
     font-variant-ligatures:none;overflow:hidden}
/* faint scanline wash - the only decorative layer, deliberately near-invisible */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:200;
  background:repeating-linear-gradient(to bottom,var(--scan) 0 1px,transparent 1px 3px)}
a{color:inherit;text-decoration:none}
a.x{color:var(--cyn);border-bottom:1px dotted currentColor}
a.x:hover{background:var(--sel);border-bottom-style:solid}
:focus-visible{outline:1px solid var(--grn);outline-offset:2px}
::selection{background:var(--sel);color:var(--fg)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line2);border:2px solid var(--bg);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--line3)}

/* ============================================================ header */
.top{position:relative;z-index:60;display:flex;align-items:center;gap:14px;height:var(--hdr);
     padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line2)}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .sig{color:var(--grn);text-shadow:var(--glow)}
.brand b{font-size:13.5px;font-weight:600;letter-spacing:-.01em;color:var(--fg)}
.brand span{font-size:11px;color:var(--fg3)}
.searchwrap{position:relative;flex:1;max-width:560px;display:flex;align-items:center;
  background:var(--panel2);border:1px solid var(--line2);height:30px;padding:0 8px;border-radius:3px}
.searchwrap:focus-within{border-color:var(--line3);box-shadow:var(--glow)}
.searchwrap .ps{color:var(--grn);font-size:12.5px;margin-right:7px;user-select:none}
#q{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--fg);
   font-family:var(--mono);font-size:12.5px;outline:none;padding:0}
#q::placeholder{color:var(--fg3)}
.searchwrap .kbd{display:flex;gap:4px;margin-left:8px}
kbd{font-size:10px;padding:1px 5px;border:1px solid var(--line2);border-radius:2px;
    color:var(--fg3);background:var(--panel3)}
.topright{margin-left:auto;display:flex;align-items:center;gap:8px}
.tbtn{height:26px;padding:0 9px;border:1px solid var(--line2);background:var(--panel2);
      color:var(--fg2);border-radius:3px;font-size:11.5px;cursor:pointer;font-family:var(--mono);
      transition:background .12s,color .12s,border-color .12s}
.tbtn:hover{background:var(--panel3);color:var(--fg);border-color:var(--line3)}

/* ============================================================ results */
#results{position:absolute;top:34px;left:-1px;right:-1px;max-height:66vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line3);border-radius:3px;
  box-shadow:0 18px 46px rgba(0,0,0,.5);display:none;z-index:70}
#results.on{display:block}
.res{display:flex;gap:9px;align-items:center;padding:5px 10px;cursor:pointer;font-size:12.5px}
.res.sel{background:var(--sel);box-shadow:inset 2px 0 0 var(--grn)}
.res .nm{color:var(--fg)}
.res .pt{margin-left:auto;font-size:11px;color:var(--fg3);
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:48%}
.res .hl{color:var(--grn);font-weight:600}
.nores{padding:12px;color:var(--fg3);font-size:12.5px}

/* ============================================================ shell */
.shell{display:grid;grid-template-columns:280px minmax(0,1fr) 214px;
       height:calc(100vh - var(--hdr) - var(--bar))}
.side{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:10px 0 40px}
.main{overflow:auto;padding:0 0 90px;background:var(--bg)}
.toc{overflow:auto;border-left:1px solid var(--line);padding:18px 12px 40px}
.wrap{max-width:880px;margin:0 auto;padding:24px 28px}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.wrap{animation:fadein .16s ease-out}

/* ============================================================ status bar */
.statusbar{position:fixed;bottom:0;left:0;right:0;height:var(--bar);z-index:80;
  display:flex;align-items:center;background:var(--panel);
  border-top:1px solid var(--line2);font-size:11px;color:var(--fg3)}
.statusbar .seg{padding:0 11px;height:100%;display:flex;align-items:center;
  border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusbar .seg.mode{color:var(--bg);background:var(--grn);font-weight:700;letter-spacing:.06em;
  border-right:0}
html[data-theme="light"] .statusbar .seg.mode{color:#FBFAF7}
.statusbar .seg.path{color:var(--fg2);flex:0 1 auto;min-width:0}
.statusbar .spacer{flex:1}
.statusbar .seg.keys{border-right:0;border-left:1px solid var(--line);color:var(--fg3)}
.statusbar .seg.keys b{color:var(--fg2);font-weight:600}

/* ============================================================ sidebar */
.navsec{padding:2px 10px 8px}
.navsec h4{margin:8px 0 5px;font-size:10.5px;color:var(--fg3);font-weight:600;letter-spacing:.08em}
.navsec h4::before{content:"-- ";color:var(--line3)}
.navlink{display:block;padding:3px 9px;font-size:12.5px;color:var(--fg2);border-radius:2px;
         transition:background .1s,color .1s}
.navlink::before{content:"  ";white-space:pre}
.navlink:hover{background:var(--panel2);color:var(--fg)}
.navlink.act{background:var(--sel);color:var(--fg)}
.navlink.act::before{content:"> ";color:var(--grn)}
.tree{padding:0 6px}
.dir{margin:0}
.dirhead{display:flex;align-items:center;gap:5px;padding:2px 8px;cursor:pointer;
         font-size:12px;color:var(--fg2);border-radius:2px}
.dirhead:hover{background:var(--panel2);color:var(--fg)}
.dirhead .car{width:8px;color:var(--fg3);transition:transform .12s}
.dir.closed>.dirkids{display:none}
.dir.closed .car{transform:rotate(-90deg)}
.dirkids{padding-left:9px;border-left:1px solid var(--line);margin-left:11px}
.modlink{display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:2px;
         font-size:12px;color:var(--fg2);transition:background .1s,color .1s}
.modlink:hover{background:var(--panel2);color:var(--fg)}
.modlink.act{background:var(--sel);color:var(--fg);box-shadow:inset 2px 0 0 var(--cyn)}
.modlink .cnt{margin-left:auto;font-size:10px;color:var(--fg3)}
.filterbox{padding:0 10px 8px}
#navfilter{width:100%;height:25px;padding:0 8px;border:1px solid var(--line2);border-radius:3px;
           background:var(--panel2);color:var(--fg);font-family:var(--mono);font-size:11.5px;outline:none}
#navfilter:focus{border-color:var(--line3)}

/* ============================================================ type */
h1{font-size:24px;line-height:1.2;letter-spacing:-.02em;margin:0 0 4px;font-weight:600;color:var(--fg)}
h1::before{content:"$ ";color:var(--grn);font-weight:400}
h2{font-size:15px;margin:34px 0 10px;font-weight:600;color:var(--fg);
   padding-bottom:5px;border-bottom:1px solid var(--line2);letter-spacing:0}
h2::before{content:"## ";color:var(--fg3);font-weight:400}
h3{font-size:13.5px;margin:22px 0 7px;font-weight:600;color:var(--fg)}
h3::before{content:"# ";color:var(--fg3);font-weight:400}
p{margin:0 0 11px;max-width:70ch;color:var(--fg2);font-family:var(--sans);font-size:14px;line-height:1.62}
p strong{color:var(--fg);font-weight:600}
.lede{font-size:14.5px;color:var(--fg2);max-width:68ch}
ul,ol{max-width:70ch;color:var(--fg2);padding-left:18px;font-family:var(--sans);font-size:14px}
li{margin:3px 0}
li::marker{color:var(--fg3)}
.crumb{font-size:11.5px;color:var(--fg3);margin-bottom:9px}
.crumb::before{content:"~/";color:var(--line3)}
.mono,code{font-family:var(--mono)}
p .mono,li .mono,td .mono{font-size:12.5px;color:var(--fg)}

/* ============================================================ badges */
.b{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;
   letter-spacing:.02em;color:var(--fg3)}
.b::before{content:"["}
.b::after{content:"]"}
.b-class{color:var(--vio)} .b-func{color:var(--grn)} .b-enum{color:var(--yel)}
.b-data{color:var(--cyn)} .b-route{color:var(--mag)} .b-const{color:var(--fg3)}
.b-pyd{color:var(--blu)} .b-err{color:var(--red)} .b-mod{color:var(--fg3)}
.b-async{color:var(--blu)} .b-priv{color:var(--fg3)} .b-abs{color:var(--org)}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}

/* ============================================================ symbols */
.sym{border:1px solid var(--line);background:var(--panel);margin:12px 0;border-radius:3px;
     scroll-margin-top:60px;transition:border-color .12s}
.sym:hover{border-color:var(--line2)}
.sym.cls{box-shadow:inset 0 2px 0 var(--vio)}
.sym.fnc{box-shadow:inset 0 2px 0 var(--grn)}
.sym.enm{box-shadow:inset 0 2px 0 var(--yel)}
.sym.dcl{box-shadow:inset 0 2px 0 var(--cyn)}
.sym.pyd{box-shadow:inset 0 2px 0 var(--blu)}
.sym.rte{box-shadow:inset 0 2px 0 var(--mag)}
.symhead{display:flex;align-items:center;gap:9px;padding:10px 12px 4px;flex-wrap:wrap}
.symname{font-size:14px;font-weight:600;color:var(--fg)}
.symname .own{color:var(--fg3);font-weight:400}
.sigline{font-size:12px;color:var(--fg2);padding:0 12px 9px;white-space:pre-wrap;word-break:break-word}
.sigline .pn{color:var(--fg)}
.sigline .an{color:var(--cyn)}
.sigline .dv{color:var(--org)}
.sigline .rt{color:var(--vio)}
.symbody{padding:0 12px 11px}
.doc{background:var(--panel2);border-left:2px solid var(--line3);padding:7px 10px;
     font-size:12.5px;color:var(--fg2);white-space:pre-wrap;margin:0 0 9px;border-radius:0 3px 3px 0}
.tag{font-size:11px;padding:0 6px;border:1px solid var(--line2);border-radius:2px;
     background:var(--panel2);color:var(--fg2);line-height:17px;transition:border-color .1s,color .1s}
a.tag:hover{color:var(--fg);border-color:var(--line3)}
.tag.warn{border-color:var(--org);color:var(--org);background:transparent}

/* ============================================================ tables */
.tbl-wrap{border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--panel);
          margin:8px 0 12px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin:0}
th{text-align:left;font-weight:600;color:var(--fg3);font-size:10.5px;letter-spacing:.05em;
   padding:5px 9px;background:var(--panel2);border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:5px 9px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--fg2)}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel2)}
td.mono,th.mono{font-size:12.5px}
td .req{color:var(--red)}
.tbl-wrap+p,.tbl-wrap+h2,.tbl-wrap+h3{margin-top:14px}

/* ============================================================ code */
.srcbtn{font-family:var(--mono);font-size:11px;color:var(--fg3);background:var(--panel2);
        border:1px solid var(--line2);border-radius:2px;padding:1px 8px;cursor:pointer;
        transition:color .1s,border-color .1s}
.srcbtn::before{content:"> "}
.srcbtn:hover{color:var(--grn);border-color:var(--line3)}
pre.code{margin:0;background:var(--code);border:1px solid var(--line);border-radius:3px;
  overflow:auto;font-size:12px;line-height:1.55;max-height:600px}
pre.code.full{max-height:none}
.code table{margin:0;border:0;width:auto;min-width:100%;background:transparent}
.code td{border:0;padding:0;color:var(--fg);background:transparent}
.code tbody tr:hover td{background:var(--panel2)}
.code td.ln{width:1%;text-align:right;padding:0 11px;color:var(--gutter);
  user-select:none;font-size:11px;white-space:pre;position:sticky;left:0;
  background:var(--code);border-right:1px solid var(--line)}
.code td.cd{padding:0 16px 0 11px;white-space:pre}
.code tr.hit td.cd{background:var(--sel)}
.code tr.hit td.ln{color:var(--grn)}
.tk-k{color:var(--tk-k)} .tk-s{color:var(--tk-s)} .tk-c{color:var(--tk-c);font-style:italic}
.tk-n{color:var(--tk-n)} .tk-d{color:var(--tk-d)} .tk-b{color:var(--tk-b)}
.tk-def{color:var(--tk-def);font-weight:600}
.hidden{display:none}

/* ============================================================ callouts */
.note{border:1px solid var(--line2);border-left:2px solid var(--blu);background:var(--panel);
      padding:9px 12px;border-radius:0 3px 3px 0;margin:12px 0;font-size:13px;color:var(--fg2)}
.note b{display:block;color:var(--fg);margin-bottom:2px;font-size:12.5px;font-family:var(--mono)}
.note b::before{content:"! ";color:inherit}
.note p{margin:0 0 7px;font-size:13.5px;max-width:68ch}
.note p:last-child{margin:0}
.note code{background:var(--panel3);padding:0 4px;border-radius:2px;font-size:12px;color:var(--fg)}
.note.warn{border-left-color:var(--org)} .note.warn b{color:var(--org)}
.note.risk{border-left-color:var(--red)} .note.risk b{color:var(--red)}

/* ============================================================ overview */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);
       border-radius:3px;overflow:hidden;background:var(--panel);margin:18px 0 22px}
.stat{padding:10px 13px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:21px;letter-spacing:-.02em;color:var(--grn);
        font-weight:600;text-shadow:var(--glow)}
.stat span{font-size:10.5px;color:var(--fg3)}
.hero{border:1px solid var(--line);border-radius:3px;background:var(--panel);
      padding:4px 8px 0;margin:18px 0}
.hero svg{width:100%;height:auto;display:block}
.svg-box{fill:var(--panel2);stroke:var(--line3)}
.svg-t{fill:var(--fg);font-family:var(--mono);font-size:10.5px}
.svg-s{fill:var(--fg3);font-family:var(--mono);font-size:9px}
.svg-l{stroke:var(--line3);fill:none}
.svg-ar{fill:var(--line3)}

/* ============================================================ endpoints */
.epfilter{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0 8px}
.pill{font-size:11.5px;padding:1px 9px;border-radius:2px;cursor:pointer;
      border:1px solid var(--line2);background:var(--panel);color:var(--fg2);
      transition:background .1s,color .1s,border-color .1s}
.pill:hover{border-color:var(--line3);color:var(--fg)}
.pill.on{background:var(--grn);color:var(--bg);border-color:var(--grn);font-weight:600}
html[data-theme="light"] .pill.on{color:#FBFAF7}
#epq{width:100%;height:28px;padding:0 9px;border:1px solid var(--line2);border-radius:3px;
     background:var(--panel2);color:var(--fg);font-family:var(--mono);font-size:12px;
     margin-bottom:8px;outline:none}
#epq:focus{border-color:var(--line3)}
.ep{border:1px solid var(--line);border-radius:3px;background:var(--panel);margin:5px 0;
    overflow:hidden;transition:border-color .12s}
.ep:hover{border-color:var(--line2)}
.ephead{display:flex;align-items:center;gap:10px;padding:6px 11px;cursor:pointer}
.ephead:hover{background:var(--panel2)}
.m{font-size:10.5px;font-weight:700;padding:0 6px;border-radius:2px;line-height:17px;
   min-width:46px;text-align:center;border:1px solid currentColor}
.m-GET{color:var(--blu)} .m-POST{color:var(--grn)} .m-DELETE{color:var(--red)}
.m-PUT{color:var(--yel)} .m-PATCH{color:var(--yel)}
.eppath{font-size:12.5px;color:var(--fg)}
.eppath .prm{color:var(--mag)}
.epfn{margin-left:auto;font-size:11.5px;color:var(--fg3)}
.epbody{padding:0 11px 11px;border-top:1px solid var(--line)}

/* ============================================================ toc */
.toc h5{margin:0 0 7px;font-size:10.5px;color:var(--fg3);font-weight:600;letter-spacing:.06em}
.toc h5::before{content:"-- ";color:var(--line3)}
.toc a{display:block;padding:2px 0 2px 8px;font-size:11.5px;color:var(--fg3);
       border-left:1px solid var(--line2);overflow:hidden;text-overflow:ellipsis;
       white-space:nowrap;transition:color .1s,border-color .1s}
.toc a:hover{color:var(--fg2);border-left-color:var(--line3)}
.toc a.lvl2{padding-left:17px;font-size:11px}

@media(max-width:1180px){.shell{grid-template-columns:250px minmax(0,1fr)}.toc{display:none}}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .side.open{display:block;position:fixed;top:var(--hdr);left:0;bottom:var(--bar);width:262px;z-index:50}
  .wrap{padding:18px 14px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .brand span{display:none}
  .statusbar .seg.keys{display:none}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
@media print{.side,.toc,.top,.statusbar,body::after{display:none}
  .shell{display:block;height:auto}body{overflow:visible}}

/* ============================================================ flow charts
   interactive program-flow widget: node spine on the left, detail on the
   right. everything keyboard reachable, no external deps.                */
.flowwrap{border:1px solid var(--line2);border-radius:8px;background:var(--panel);
  margin:16px 0;overflow:hidden}
.flowbar{display:flex;align-items:center;gap:8px;padding:8px 10px;
  border-bottom:1px solid var(--line2);background:var(--panel2);flex-wrap:wrap}
.flowtabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.flowtab{font-family:var(--mono);font-size:11.5px;padding:3px 9px;border-radius:5px;
  border:1px solid var(--line2);background:var(--panel);color:var(--fg2);cursor:pointer}
.flowtab:hover{border-color:var(--line3);color:var(--fg)}
.flowtab.on{background:var(--sel);border-color:var(--grn);color:var(--fg)}
.flowctl{display:flex;align-items:center;gap:6px}
.flowbtn{font-family:var(--mono);font-size:12px;line-height:1;padding:5px 10px;
  border-radius:5px;border:1px solid var(--line2);background:var(--panel);
  color:var(--fg2);cursor:pointer}
.flowbtn:hover:not(:disabled){border-color:var(--grn);color:var(--fg)}
.flowbtn:disabled{opacity:.35;cursor:default}
.flowcount{font-family:var(--mono);font-size:11.5px;color:var(--fg3);
  min-width:52px;text-align:center}
.flowbody{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
@media(max-width:1000px){.flowbody{grid-template-columns:1fr}}
.flowsteps{padding:14px 12px;border-right:1px solid var(--line2);
  max-height:560px;overflow:auto}
@media(max-width:1000px){.flowsteps{border-right:none;border-bottom:1px solid var(--line2);
  max-height:none}}
.fnode{position:relative;display:flex;gap:10px;align-items:flex-start;
  padding:9px 10px;border:1px solid var(--line2);border-radius:7px;
  background:var(--panel2);cursor:pointer;transition:border-color .12s,background .12s}
.fnode:hover{border-color:var(--line3)}
.fnode.on{border-color:var(--grn);background:var(--sel);box-shadow:var(--glow)}
.fnode.done{opacity:.72}
.fnode .fn{flex:none;width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;border:1px solid var(--line3);
  color:var(--fg2);background:var(--panel)}
.fnode.on .fn{border-color:var(--grn);color:var(--grn)}
.fnode .ft{font-family:var(--mono);font-size:12.5px;color:var(--fg);line-height:1.35}
.fnode .fs{font-size:11.5px;color:var(--fg3);margin-top:2px;line-height:1.4}
.fnode.k-decision{border-style:dashed}
.fnode.k-decision .fn{border-radius:4px;transform:rotate(45deg)}
.fnode.k-decision .fn span{transform:rotate(-45deg)}
.fnode.k-error{border-color:rgba(255,115,115,.42)}
.fnode.k-error .fn{color:var(--red);border-color:rgba(255,115,115,.5)}
.fnode.k-end .fn{color:var(--cyn);border-color:var(--cyn)}
.fnode.k-io .fn{color:var(--blu);border-color:var(--blu)}
.fedge{display:flex;align-items:center;gap:7px;margin:0 0 0 21px;
  padding:3px 0;min-height:18px}
.fedge .fline{width:1px;height:18px;background:var(--line3)}
.fedge .flabel{font-family:var(--mono);font-size:10.5px;color:var(--fg3)}
.fdetail{padding:16px 16px 18px}
.fdetail h4{margin:0 0 3px;font-family:var(--mono);font-size:13.5px;
  color:var(--fg);font-weight:600}
.fdetail .fkind{font-family:var(--mono);font-size:10.5px;color:var(--fg3);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px}
.fdetail p{margin:0 0 9px;font-size:12.5px;line-height:1.65;color:var(--fg2)}
.fdetail code{font-family:var(--mono);font-size:11.5px;background:var(--code);
  border:1px solid var(--line2);border-radius:3px;padding:1px 4px;color:var(--fg)}
.fbranch{margin-top:10px}
.fbranch .fbh{font-size:11px;color:var(--fg3);margin-bottom:5px}
.fgoto{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);
  font-size:11px;padding:3px 8px;border:1px solid var(--line2);border-radius:5px;
  background:var(--panel2);color:var(--fg2);cursor:pointer;margin:0 5px 5px 0}
.fgoto:hover{border-color:var(--grn);color:var(--fg)}
.fgoto.warn{border-color:rgba(224,180,78,.4);color:var(--yel)}
.fmini{margin-top:12px;padding-top:10px;border-top:1px solid var(--line2)}

</style>

text(image_path: &str, ocr_dir: &str) -> PyResult<Vec<String>> {\n    let config = match Config::load(ocr_dir) {\n        Ok(c) => c,\n        Err(e) => return Err(PyValueError::new_err(e.to_string())),\n    };\n\n    let device = config.device().map_err(|e| PyValueError::new_err(e.to_string()))?;\n    let tensors = load_and_split(image_path, &device).map_err(|e| PyValueError::new_err(e.to_string()))?;\n    let cnn = CNN::load(&device, &config, ocr_dir).map_err(|e| PyValueError::new_err(e.to_string()))?;\n\n    let mut per_position = Vec::new();\n    for tensor in tensors {\n        let logits = cnn.forward(&tensor).map_err(|e| PyValueError::new_err(e.to_string()))?;\n        per_position.push(top_k(&logits, config.max_candidates, &cnn).map_err(|e| PyValueError::new_err(e.to_string()))?);\n    }\n\n    let ranked = candidates(&per_position, config.max_candidates);\n    let results = ranked.into_iter().map(|(c, _)| c).collect::<Vec<String>>();\n    Ok(results)\n}\n\nfn top_k(logits: &Tensor, k: usize, cnn: &CNN) -> Result<Vec<(char, f32)>, String> {\n    let probs: Vec<f32> = softmax(&logits.squeeze(0).map_err(|e| e.to_string())?, candle_core::D::Minus1)\n        .map_err(|e| e.to_string())?\n        .to_vec1()\n        .map_err(|e| e.to_string())?;\n\n    if probs.len() != cnn.vocab.len() {\n        return Err(format!(\n            \"Model returns {} classes, vocab has {} characters\",\n            probs.len(),\n            cnn.vocab.len()\n        ));\n    }\n\n    let mut ranked: Vec<(char, f32)> = probs\n        .into_iter()\n        .enumerate()\n        .map(|(i, p)| (cnn.vocab.decode(i as u32), p))\n        .collect();\n    ranked.sort_by(|a, b| b.1.total_cmp(&a.1));\n    ranked.truncate(k);\n    Ok(ranked)\n}\nfn candidates(per_position: &[Vec<(char, f32)>], max: usize) -> Vec<(String, f32)> {\n    let mut result: Vec<(String, f32)> = vec![(String::new(), 0.0)];\n\n    for options in per_position {\n        let mut next = Vec::with_capacity(result.len() * options.len());\n        for (prefix, logp) in &result {\n            for &(ch, p) in options {\n                let mut s = prefix.clone();\n                s.push(ch);\n                next.push((s, logp + p.max(1e-9).ln()));\n            }\n        }\n        next.sort_by(|a, b| b.1.total_cmp(&a.1));\n        next.truncate(max);\n        result = next;\n    }\n\n    result.into_iter().map(|(s, logp)| (s, logp.exp())).collect()\n}\n\nfn to_emnist(crop: &GrayImage) -> GrayImage {\n    let (cw, ch) = crop.dimensions();\n    let scale = 20.0 / cw.max(ch) as f32;\n    let nw = ((cw as f32 * scale).round() as u32).clamp(1, 20);\n    let nh = ((ch as f32 * scale).round() as u32).clamp(1, 20);\n    let resized = imageops::resize(crop, nw, nh, imageops::FilterType::Triangle);\n\n    let mut out = GrayImage::from_pixel(28, 28, Luma([0]));\n    let dx = (28 - nw) / 2;\n    let dy = (28 - nh) / 2;\n    imageops::replace(&mut out, &resized, dx as i64, dy as i64);\n    out\n}\n\npub fn load_and_split(path: &str, device: &Device) -> Result<Vec<Tensor>, String> {\n    let img = load_image(path.to_string()).map_err(|error| error.to_string())?;\n\n    let letters = image_clean_and_split_up(img).map_err(|error| error.to_string())?;\n\n    let mut tensors: Vec<Tensor> = Vec::new();\n    for letter in letters {\n        let pixel: Vec<f32> = letter.into_raw().iter()\n            .map(|&p| p as f32 / 255.0).collect();\n\n        let t = Tensor::from_vec(pixel, (1, 1, 28, 28), &device).map_err(|error| error.to_string())?;\n\n        tensors.push(t);\n    }\n\n    Ok(tensors)\n}\n\nfn load_image(path: String) -> Result<DynamicImage, String> {\n    let img = image::open(path)\n        .map_err(|e| e.to_string())?;\n    Ok(img)\n}\n\nfn image_clean_and_split_up(image: DynamicImage) -> Result<Vec<GrayImage>, String> {\n    let gray = image.grayscale();\n    let mut black_and_white = make_black_and_white(&gray.to_rgb8());\n    black_and_white = median_filter(&black_and_white, 1, 1);\n\n    let letters = image_split_up(black_and_white).map_err(|error| error.to_string())?;\n\n    Ok(letters)\n}\n\nfn make_black_and_white(image: &RgbImage) -> GrayImage {\n    let bg = background_color(&image);\n\n    let max_dist = (3.0f32 * 255.0 * 255.0).sqrt();\n    let (w, h) = image.dimensions();\n    let mut black_and_white = GrayImage::new(w, h);\n    for (x, y, px) in image.enumerate_pixels() {\n        let Rgb([r, g, b]) = *px;\n        let dr = r as f32 - bg[0];\n        let dg = g as f32 - bg[1];\n        let db = b as f32 - bg[2];\n        let d = (dr * dr + dg * dg + db * db).sqrt() / max_dist * 255.0;\n        black_and_white.put_pixel(x, y, Luma([if d > 32.0 { 255 } else { 0 }]));\n    }\n\n    black_and_white\n}\n\nfn background_color(img: &RgbImage) -> [f32; 3] {\n    let mut ch: [Vec<u8>; 3] = [Vec::new(), Vec::new(), Vec::new()];\n    for p in img.pixels() {\n        for c in 0..3 {\n            ch[c].push(p.0[c]);\n        }\n    }\n    let mut bg = [0.0f32; 3];\n    for c in 0..3 {\n        ch[c].sort_unstable();\n        bg[c] = ch[c][ch[c].len() / 2] as f32;\n    }\n    bg\n}\n\nfn image_split_up(image: GrayImage) -> Result<Vec<GrayImage>, String> {\n    let labels = connected_components(&image.clone(), Connectivity::Eight, Luma([0]));\n\n    let min_area = 30;\n    let min_fill = 0.15;\n    let mut bboxes: Vec<BBox> = get_bounding_boxes(&labels)\n        .into_iter()\n        .filter(|b| b.area >= min_area)\n        .filter(|b| b.fill() >= min_fill)\n        .collect();\n\n    let max_h = bboxes.iter().map(|b| b.height()).max().unwrap_or(0);\n    bboxes.retain(|b| b.height() * 10 >= max_h * 4);\n\n    let mut result: Vec<GrayImage> = Vec::new();\n\n    for bbox in bboxes {\n        result.push(match crop_letter(&image.clone(), &bbox, 3).map(|c| to_emnist(&c)) {\n            Some(result) => result,\n            None => continue,\n        });\n    }\n\n    Ok(result)\n}\n\nfn get_bounding_boxes(labels: &ImageBuffer<Luma<u32>, Vec<u32>>) -> Vec<BBox> {\n    let mut boxes: HashMap<u32, BBox> = HashMap::new();\n\n    for (x, y, px) in labels.enumerate_pixels() {\n        let label = px.0[0];\n        if label == 0 {\n            continue;\n        }\n\n        boxes\n            .entry(label)\n            .and_modify(|b| {\n                b.min_x = b.min_x.min(x);\n                b.max_x = b.max_x.max(x);\n                b.min_y = b.min_y.min(y);\n                b.max_y = b.max_y.max(y);\n                b.area += 1;\n            })\n            .or_insert(BBox { min_x: x, min_y: y, max_x: x, max_y: y, area: 1});\n    }\n\n    let mut result: Vec<BBox> = boxes.into_values().collect();\n    result.sort_by_key(|b| b.min_x);\n    result\n}\nfn crop_letter(src: &GrayImage, b: &BBox, pad: u32) -> Option<GrayImage> {\n    let (w, h) = src.dimensions();\n\n    let left = b.min_x.saturating_sub(pad);\n    let top = b.min_y.saturating_sub(pad);\n    let right = (b.max_x + 1 + pad).min(w);\n    let bottom = (b.max_y + 1 + pad).min(h);\n\n    if right <= left || bottom <= top {\n        return None;\n    }\n\n    Some(imageops::crop_imm(src, left, top, right - left, bottom - top).to_image())\n}", "loc": 235, "error": null, "lang": "rs"}, {"path": "test.py", "name": "test", "doc": "Captcha-model testen.\n\nAufruf:\n    python test_ocr.py captcha.jpeg\n    python test_ocr.py captcha.jpeg --ocr-dir C:\\pfad\\zum\\ocr_dir\n    python test_ocr.py captcha.jpeg -n 10\n\nDen Modellordner entweder mit --ocr-dir angeben, in der Umgebungsvariable\nOCR_DIR setzen oder unten bei DEFAULT_OCR_DIR eintragen.", "imports": ["import argparse", "import os", "import sys", "import time", "import ocr"], "constants": [{"name": "DEFAULT_OCR_DIR", "value": "'C:\\\\Users\\\\p50232\\\\RustroverProjects\\\\pyscrapper_ocr\\\\model'", "lineno": 20, "big": false}], "classes": [], "functions": [{"kind": "function", "name": "main", "qualname": "main", "async": false, "signature": "()", "params": [], "returns": "int", "doc": null, "decorators": [], "route": \ndef main() -> int:\n    parser = argparse.ArgumentParser(description=\"Captcha-Bild erkennen\")\n    parser.add_argument(\"image\", help=\"Pfad zur Bilddatei\")\n    parser.add_argument(\"--ocr-dir\", default=os.environ.get(\"OCR_DIR\", DEFAULT_OCR_DIR),\n                        help=\"Modellordner (Standard: OCR_DIR oder DEFAULT_OCR_DIR)\")\n    parser.add_argument(\"-n\", type=int, default=5, help=\"Anzahl angezeigter Kandidaten (Standard: 5)\")\n    args = parser.parse_args()\n\n    if not os.path.isfile(args.image):\n        print(f\"Datei nicht gefunden: {args.image}\", file=sys.stderr)\n        return 1\n\n    start = time.perf_counter()\n    try:\n        candidates = ocr.img_to_text(args.image, args.ocr_dir)\n    except ValueError as e:\n        print(f\"Fehler: {e}\", file=sys.stderr)\n        return 1\n    elapsed = time.perf_counter() - start\n\n    if not candidates:\n        print(\"Keine Kandidaten erhalten\", file=sys.stderr)\n        return 1\n\n    print(candidates[0])\n\n    if args.n > 1:\n        print()\n        for i, c in enumerate(candidates[:args.n]):\n            print(f\"  {i + 1}. {c}\")\n        print(f\"\\n{elapsed:.2f}s\")\n\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())", "loc": 59, "error": null, "lang": "py"}, {"path": "Cargo.toml", "name": "Cargo.toml", "doc": "Source: LocalServer/docker/captcha_ocr_source/Cargo.toml", "imports": [], "constants": [], "classes": [], "functions": [], "source": "[package]\nname = \"ocr\"\nversion = \"0.1.0\"\nedition = \"2021\"\n\n[lib]\nname = \"ocr\"\ncrate-type = [\"cdylib\"]\n\n[dependencies]\npyo3 = { version = \"0.30.1\", features = [\"extension-module\"] }\nflate2 = \"1\"\nimageproc = \"0.27.0\"\nserde = { version = \"1\", features = [\"derive\"] }\nserde_json = \"1\"\nimage = \"0.25\"\ncandle-core = \"0.11.0\"\ncandle-nn = \"0.11.0\"", "loc": 18, "error": null, "lang": "text"}, {"path": "pyproject.toml", "name": "pyproject.toml", "doc": "Source: LocalServer/docker/captcha_ocr_source/pyproject.toml", "imports": [], "constants": [], "classes": [], "functions": [], "source": "[build-system]\nrequires = [\"maturin>=1.7,<2.0\"]\nbuild-backend = \"maturin\"\n\n[project]\nname = \"ocr\"\nversion = \"0.1.0\"\nrequires-python = \">=3.9\"\nclassifiers = [\"Programming Language :: Rust\"]\n\n[tool.maturin]\nfeatures = [\"pyo3/extension-module\", \"pyo3/abi3-py39\"]", "loc": 12, "error": null, "lang": "text"}, {"path": "README.txt", "name": "README.txt", "doc": "Source: LocalServer/docker/captcha_ocr_source/README.txt", "imports": [], "constants": [], "classes": [], "functions": [], "source": "captcha_ocr bauen und in die venv installieren (Ubuntu) OHNE DOCKER\n========================================================\n\n--- Einmalig: Werkzeuge ---------------------------------\n\n# Compiler, Python-Header und venv-Unterstuetzung installieren.\nsudo apt install -y build-essential python3-dev python3-venv curl\n\n# Rust installieren (wird zum Bauen gebraucht).\ncurl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal\n\n# Rust in der aktuellen Shell verfuegbar machen.\nsource \"$HOME/.cargo/env\"\n\n\n--- venv anlegen und maturin installieren ---------------\n\n# In das Projekt wechseln.\ncd ~/PyScrapper\n\n# venv anlegen (nur beim ersten Mal noetig).\npython3 -m venv .venv\n\n# venv aktivieren\nsource .venv/bin/activate\n\n# PyScrapper-Abhaengigkeiten in die venv installieren.\ncd ~/PyScrapper\npip install -r LocalServer/requirements.txt\n\n# maturin (Build-Tool fuer Rust-Python-Pakete) in die venv installieren.\npip install --upgrade pip maturin\n\n\n--- Paket bauen -----------------------------------------\n\n# In den Ordner mit der Cargo.toml wechseln.\ncd ~/PyScrapper/LocalServer/docker/captcha_ocr_source\n\n# Alte Builds entfernen, damit spaeter sicher die neue .whl installiert wird.\nrm -f target/wheels/*.whl\n\n# Paket als .whl bauen (dauert beim ersten Mal einige Minuten).\nmaturin build --release\n\n# Pruefen, dass die .whl entstanden ist.\nls target/wheels/\n\n\n--- In die venv installieren ----------------------------\n\n# Gebaute .whl in die aktive venv installieren (ueberschreibt alte Version).\npip install --force-reinstall target/wheels/captcha_ocr-*.whl\n\n# Testen, ob das Paket importiert werden kann.\npython -c \"import captcha_ocr; print(captcha_ocr.img_to_text)\"\n\n\n--- Kurzweg (bauen + installieren in einem Schritt) -----\n\n# Baut und installiert direkt in die aktive venv, ohne .whl-Datei.\ncd ~/PyScrapper/LocalServer/docker/captcha_ocr_source && maturin develop --release\n\n\n--- Nach Aenderungen am Rust-Code -----------------------\n\n# Ab \"Paket bauen\" wiederholen, danach den Server neu starten.\nsudo systemctl restart pyscrapper\n\n\ncaptcha_ocr bauen und in die venv installieren (Ubuntu) MIT DOCKER\n========================================================\n\n\n--- Bauen und starten -----------------------------------\n \n# In den Ordner mit der compose.yaml wechseln.\ncd ~/PyScrapper/LocalServer/docker\n \n# Image bauen (inkl. captcha_ocr) und Container im Hintergrund starten.\ndocker compose up -d --build\n\n\nSCHNELLLLLLLLLLLL!!!!!!!\ncd ~/PyScrapper && git pull && cd LocalServer/docker && docker compose up -d --build", "loc": 85, "error": null, "lang": "text"}, {"path": "model/config.json", "name": "config.json", "doc": "Source: PythonModule/providers/ocr/config.json", "imports": [], "constants": [], "classes": [], "functions": [], "source": "{\n  \"kernel_size\": 3,\n  \"conv_count\": 3,\n  \"input_size\": 28,\n  \"vocab_str\": \"0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz\",\n  \"pool_after\": [\n    true,\n    true,\n    false\n  ],\n  \"model_name\": \"model.safetensors\",\n  \"device\": \"cpu\",\n  \"max_candidates\": 3\n}", "loc": 14, "error": null, "lang": "text"}, {"path": "docker/Dockerfile", "name": "Dockerfile", "doc": "Source: LocalServer/docker/Dockerfile", "imports": [], "constants": [], "classes": [], "functions": [], "source": "\n # ---------- Stufe 1: captcha_ocr bauen ----------\nFROM python:3.11-slim AS captcha-build\n    \nRUN apt-get update && apt-get install -y --no-install-recommends \\\n        build-essential \\\n        curl \\\n        ca-certificates \\\n        && rm -rf /var/lib/apt/lists/*\n    \nRUN curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal\nENV PATH=\"/root/.cargo/bin:${PATH}\"\n    \nRUN pip install --no-cache-dir maturin\n    \nWORKDIR /build\nCOPY LocalServer/docker/captcha_ocr_source/ .\nRUN maturin build --release --out /wheels\n    \n    \n    # ---------- Stufe 2: PyScrapper ----------\nFROM python:3.11-slim\n    \nWORKDIR /app\n    \n    # Installiere System Dependencies\nRUN apt-get update && apt-get install -y \\\n    procps \\\n    && rm -rf /var/lib/apt/lists/*\n\nRUN apt-get update && apt-get install -y \\\n    ffmpeg \\\n    && rm -rf /var/lib/apt/lists/*\n\n# captcha_ocr aus Stufe 1 installieren\nCOPY --from=captcha-build /wheels /tmp/wheels\nRUN pip install --no-cache-dir /tmp/wheels/*.whl && rm -rf /tmp/wheels\n\n# Kopiere gesamtes PyScrapper Projekt\nCOPY . .\n\n# Installiere Python Dependencies\nRUN pip install --no-cache-dir -r LocalServer/requirements.txt\n\nRUN playwright install && python -m playwright install --with-deps chromium\n\n# Setze Workdir auf LocalServer\nWORKDIR /app/LocalServer\n\n# Expose Port\nEXPOSE 8000\n\n# Starte Server\nCMD [\"uvicorn\", \"server:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]", "loc": 54, "error": null, "lang": "text"}], "xref": {"height": [["src/bbox.rs", "BBox.fill"], ["src/lib.rs", "image_split_up"]], "width": [["src/bbox.rs", "BBox.fill"]], "len": [["src/cnn.rs", "CNN.new"], ["src/cnn.rs", "CNN.forward"], ["src/lib.rs", "top_k"], ["src/lib.rs", "candidates"], ["src/lib.rs", "background_color"]], "new": [["src/cnn.rs", "CNN.load"], ["src/config.rs", "Config.load"], ["src/lib.rs", "img_to_text"], ["src/lib.rs", "candidates"], ["src/lib.rs", "load_and_split"], ["src/lib.rs", "make_black_and_white"], ["src/lib.rs", "background_color"], ["src/lib.rs", "image_split_up"], ["src/lib.rs", "get_bounding_boxes"]], "default": [["src/config.rs", "Config.load"]], "save": [["src/config.rs", "Config.load"]], "load": [["src/lib.rs", "img_to_text"]], "candidates": [["src/lib.rs", "img_to_text"]], "device": [["src/lib.rs", "img_to_text"]], "forward": [["src/lib.rs", "img_to_text"]], "load_and_split": [["src/lib.rs", "img_to_text"]], "top_k": [["src/lib.rs", "img_to_text"]], "decode": [["src/lib.rs", "top_k"]], "image_clean_and_split_up": [["src/lib.rs", "load_and_split"]], "load_image": [["src/lib.rs", "load_and_split"]], "image_split_up": [["src/lib.rs", "image_clean_and_split_up"]], "make_black_and_white": [["src/lib.rs", "image_clean_and_split_up"]], "background_color": [["src/lib.rs", "make_black_and_white"]], "crop_letter": [["src/lib.rs", "image_split_up"]], "fill": [["src/lib.rs", "image_split_up"]], "get_bounding_boxes": [["src/lib.rs", "image_split_up"]], "to_emnist": [["src/lib.rs", "image_split_up"]], "img_to_text": [["test.py", "main"]]}, "total_loc": 691, "lang": "rs", "pages": {"build": "<div class=\"wrap\">\n<div class=\"crumb\">CaptchaOCR / build<\/div>\n<h1>Build and run<\/h1>\n<p class=\"lede\">The crate is compiled into a Python wheel with maturin. There are three ways to get\nit into the Python environment the server runs in.<\/p>\n\n<h2 id=\"ways\">Three ways to install<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Situation<\/th><th>Do this<\/th><\/tr><\/thead><tbody>\n<tr><td>Windows, local server<\/td>\n<td class=\"mono\">pip install --force-reinstall PythonModule\\providers\\ocr\\ocr-0.1.0-cp39-abi3-win_amd64.whl<\/td><\/tr>\n<tr><td>Linux or macOS, local server<\/td>\n<td class=\"mono\">cd LocalServer/docker/captcha_ocr_source<br>pip install maturin<br>maturin develop --release<\/td><\/tr>\n<tr><td>Docker<\/td>\n<td class=\"mono\">cd LocalServer/docker<br>docker compose up -d --build<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><span class=\"mono\">maturin develop<\/span> builds and installs into the active virtual environment in\none step. To get a wheel file instead, use <span class=\"mono\">maturin build --release<\/span>; the\nresult lands in <span class=\"mono\">target/wheels/<\/span> and is named\n<span class=\"mono\">ocr-0.1.0-cp39-abi3-&lt;platform&gt;.whl<\/span>.<\/p>\n<p>The first build downloads and compiles candle and the image crates and takes several minutes;\nlater builds are incremental. Rust is installed with rustup\n(<span class=\"mono\">curl https://sh.rustup.rs | sh -s -- -y --profile minimal<\/span>), and the\ncompiler needs a C toolchain (<span class=\"mono\">build-essential<\/span> on Debian/Ubuntu, the MSVC\nbuild tools on Windows).<\/p>\n\n<h2 id=\"abi3\">One wheel per platform, not per Python<\/h2>\n<p><span class=\"mono\">pyproject.toml<\/span> enables <span class=\"mono\">pyo3/abi3-py39<\/span>, so the\nwheel uses only the stable Python ABI and runs on every CPython from 3.9 on. A wheel is still bound to\nthe operating system and CPU: the one in the repository is <span class=\"mono\">win_amd64<\/span> and\nwill not install on Linux or on ARM.<\/p>\n\n<h2 id=\"docker\">In the server image<\/h2>\n<p><a class=\"x\" href=\"#/m/docker%2FDockerfile\">LocalServer/docker/Dockerfile<\/a> has a first stage\nbased on <span class=\"mono\">python:3.11-slim<\/span> that installs the build tools, rustup and maturin,\ncopies the crate and runs <span class=\"mono\">maturin build --release --out /wheels<\/span>. The second\nstage installs that wheel with pip before the server's own requirements. Rust is therefore not part\nof the final image.<\/p>\n\n<h2 id=\"model\">The model directory<\/h2>\n<p>The wheel contains only code. At runtime <span class=\"mono\">img_to_text<\/span> needs a directory\nwith <span class=\"mono\">config.json<\/span> and the weights file it names. In this project that is\n<span class=\"mono\">PythonModule/providers/ocr/<\/span>, which the Bandcamp provider finds relative to its\nown file. The directory has to be writable if <span class=\"mono\">config.json<\/span> is missing,\nbecause the module then writes a default one.<\/p>\n\n<h2 id=\"trouble\">When it does not work<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Symptom<\/th><th>Cause<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"mono\">ModuleNotFoundError: No module named 'ocr'<\/td><td>The wheel is not installed in the environment the server runs in. Check with <span class=\"mono\">python -c \"import ocr\"<\/span> using that interpreter.<\/td><\/tr>\n<tr><td class=\"mono\">is not a supported wheel on this platform<\/td><td>The Windows wheel on Linux/macOS, or a wheel built for another CPU. Build it locally with maturin.<\/td><\/tr>\n<tr><td>Candidates look random<\/td><td>The weights file was not found and the network runs with random weights &mdash; check the <span class=\"mono\">ocr_dir<\/span> and <span class=\"mono\">model_name<\/span>.<\/td><\/tr>\n<tr><td class=\"mono\">Model returns N classes, vocab has M characters<\/td><td><span class=\"mono\">vocab_str<\/span> in the config does not match the trained model.<\/td><\/tr>\n<tr><td class=\"mono\">unknown device<\/td><td><span class=\"mono\">device<\/span> in the config is not <span class=\"mono\">cpu<\/span>, <span class=\"mono\">cuda<\/span> or <span class=\"mono\">metal<\/span>; the last two also need a candle build with that feature.<\/td><\/tr>\n<tr><td>Always one character too few<\/td><td>Two letters touch in the captcha and are segmented as one; see <a class=\"x\" href=\"#/pipeline\">Image to letters<\/a>.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n\n<div class=\"note warn\"><b>README.txt uses old names<\/b>\n<p>The build guide next to the crate still installs <code>target/wheels/captcha_ocr-*.whl<\/code> and\ntests with <code>import captcha_ocr<\/code>. The package is called <code>ocr<\/code> now, so the wheel is\n<code>ocr-*.whl<\/code> and the import is <code>import ocr<\/code>. Its shell commands also mix PowerShell\nand bash.<\/p><\/div>\n<\/div>\n", "flows": "<div class=\"wrap\">\n<div class=\"crumb\">CaptchaOCR / flows<\/div>\n<h1>Program flows<\/h1>\n<p class=\"lede\">The two paths through the OCR, step by step. Click a step &mdash; or use prev/next\n&mdash; to see what happens there and where it can fail. The tabs switch between flows.<\/p>\n<div class=\"flowmount\" data-flow=\"ocr,bandcamp\"><\/div>\n\n<h2 id=\"reading\">How to read these<\/h2>\n<p>The spine on the left is the happy path in execution order. Dashed boxes are decision points,\nred ones are error exits; the buttons under &bdquo;Where it can go from here&ldquo; jump to them.<\/p>\n<p><b>img_to_text<\/b> is what happens inside the Rust module for one call. <b>Bandcamp captcha<\/b> is\nthe surrounding Python side: when the OCR is called and what is done with its answer.<\/p>\n<\/div>\n", "integration": "<div class=\"wrap\">\n<div class=\"crumb\">CaptchaOCR / integration<\/div>\n<h1>Python and Bandcamp<\/h1>\n<p class=\"lede\">The extension exposes exactly one function. Its only caller is the Bandcamp search,\nwhich uses it to get past the &bdquo;Client Challenge&ldquo; page Bandcamp shows to repeated or\nautomated searches.<\/p>\n\n<h2 id=\"api\">The Python API<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Call<\/th><th>Returns<\/th><th>Raises<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"mono\"><a class=\"x\" href=\"#/m/src%2Flib.rs#img_to_text\">ocr.img_to_text(image_path: str, ocr_dir: str)<\/a><\/td>\n<td class=\"mono\">list[str]<\/td>\n<td class=\"mono\">ValueError<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul>\n<li><span class=\"mono\">image_path<\/span> &mdash; a file on disk; the function does not take bytes.<\/li>\n<li><span class=\"mono\">ocr_dir<\/span> &mdash; the model directory holding <span class=\"mono\">config.json<\/span>\nand the weights, e.g. <span class=\"mono\">PythonModule/providers/ocr<\/span>.<\/li>\n<li>The result holds at most <span class=\"mono\">max_candidates<\/span> strings, most likely first. Their\nprobabilities are computed but not returned.<\/li>\n<li>Every Rust error (unreadable image, bad config, tensor shape mismatch) is converted into a\n<span class=\"mono\">ValueError<\/span> with the message text. A panic surfaces as\n<span class=\"mono\">pyo3_runtime.PanicException<\/span>.<\/li>\n<\/ul>\n<p>The function holds the GIL for its whole run and loads the config and the weights again on every\ncall. For the occasional captcha that is fine; for bulk use the model would have to be cached.<\/p>\n<pre class=\"code full\"><table><tbody><tr><td class=\"ln\">1<\/td><td class=\"cd\">import ocr<\/td><\/tr><tr><td class=\"ln\">2<\/td><td class=\"cd\">candidates = ocr.img_to_text(\"captcha.jpeg\", \"PythonModule/providers/ocr\")<\/td><\/tr><tr><td class=\"ln\">3<\/td><td class=\"cd\">print(candidates)   # up to max_candidates strings, best first<\/td><\/tr><\/tbody><\/table><\/pre>\n\n<h2 id=\"bandcamp\">How Bandcamp uses it<\/h2>\n<p>The full sequence is in the <a class=\"x\" href=\"#/flows\">Bandcamp captcha<\/a> flow. In short:\n<a class=\"x\" href=\"https://github.com/lbrandstaetterhtl/PyScrapper/blob/main/PythonModule/providers/Bandcamp/bandcamp_search.py\">bandcamp_search.py<\/a>\nloads the search page, and if <span class=\"mono\">_isClientChallenge()<\/span> recognises the challenge\nit opens the page in a headless browser, cuts the Base64 JPEG out of the HTML, writes it to a\ntemporary file in the working directory and calls <span class=\"mono\">ocr.img_to_text<\/span> with\n<span class=\"mono\">OCR_PATH<\/span> (the <span class=\"mono\">providers/ocr<\/span> folder). The browser\ntypes the candidates into <span class=\"mono\">#capInput<\/span> one after another; when it stops, its\ncookies are written to the session's cookie file, the session reloads them and the search is\nrepeated &mdash; up to <span class=\"mono\">CAPTCHA_RETRIES<\/span> (3) times before the search gives up\nwith a <span class=\"mono\">TaskFailedError<\/span>.<\/p>\n<p>The provider modules are documented in the engine documentation\n(<span class=\"mono\">HTML_Doku/PythonModule.html<\/span>, page &bdquo;providers&ldquo;).<\/p>\n<div class=\"note risk\"><b>The engine does not load without the module<\/b>\n<p><code>bandcamp_search.py<\/code> has <code>import ocr<\/code> at the top, and\n<code>providers/__init__.py<\/code> imports every provider. If the extension is not installed, the\nwhole engine &mdash; and with it the server &mdash; fails to start with\n<code>ModuleNotFoundError: No module named 'ocr'<\/code>, even if nobody ever searches Bandcamp. A\nlazy import inside <code>_solveCaptcha()<\/code> would confine the dependency to the one place that\nneeds it.<\/p><\/div>\n<div class=\"note warn\"><b>Success is only detected when the click fails<\/b>\n<p><code>BandcampCaptchaBrowser.sendCaptchaSolutions()<\/code> fills in a candidate and clicks\n<code>#capSubmit<\/code>. It returns <code>True<\/code> only from the <code>except<\/code> branch, i.e. when\nthe click raises and the page content has changed. If the click goes through normally, the loop\nmoves on to the next candidate and the method finally returns <code>False<\/code> even when the\ncaptcha was solved. The search still repeats afterwards, so a solved captcha is noticed one round\nlater; the log line &bdquo;Couldn't solve captcha&ldquo; can therefore be misleading.<\/p><\/div>\n\n<h2 id=\"test\">Trying it by hand<\/h2>\n<p><a class=\"x\" href=\"#/m/test.py\">test.py<\/a> runs the OCR on one image and prints the candidates and\nthe time taken:<\/p>\n<pre class=\"code full\"><table><tbody><tr><td class=\"ln\">1<\/td><td class=\"cd\">python test.py captcha.jpeg --ocr-dir PythonModule/providers/ocr<\/td><\/tr><\/tbody><\/table><\/pre>\n<p>Without <span class=\"mono\">--ocr-dir<\/span> it uses the environment variable\n<span class=\"mono\">OCR_DIR<\/span> or a hard-coded path from the author's machine. Its\n<span class=\"mono\">-n<\/span> option defaults to 5, but the module never returns more than\n<span class=\"mono\">max_candidates<\/span> (3) strings.<\/p>\n<\/div>\n", "model": "<div class=\"wrap\">\n<div class=\"crumb\">CaptchaOCR / model<\/div>\n<h1>The network<\/h1>\n<p class=\"lede\">A deliberately small convolutional classifier: one 28&times;28 letter in, one score\nper character out. Its shape is not hard-coded &mdash;\n<a class=\"x\" href=\"#/m/src%2Fcnn.rs#CNN.new\">CNN::new<\/a> builds it from\n<span class=\"mono\">config.json<\/span>, and the weights in\n<span class=\"mono\">model.safetensors<\/span> must match what the config describes.<\/p>\n\n<h2 id=\"layers\">Layers<\/h2>\n<p>The table below is computed during the documentation build the same way\n<span class=\"mono\">CNN::new<\/span> computes it, and every tensor is checked against the header of\nthe shipped model file.<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Layer<\/th><th>Operation<\/th><th>In<\/th><th>Out<\/th><th>Tensors in the model file<\/th><th>Parameters<\/th><\/tr><\/thead><tbody><tr><td class=\"mono\">conv0<\/td><td>Conv2d 1&rarr;16, 3&times;3, ReLU, max-pool 2<\/td><td class=\"mono\">1 &times; 28 &times; 28<\/td><td class=\"mono\">16 &times; 13 &times; 13<\/td><td class=\"mono\" style=\"font-size:11.5px\">conv0.weight [16, 1, 3, 3]<br>conv0.bias [16]<\/td><td class=\"mono\">160<\/td><\/tr><tr><td class=\"mono\">conv1<\/td><td>Conv2d 16&rarr;32, 3&times;3, ReLU, max-pool 2<\/td><td class=\"mono\">16 &times; 13 &times; 13<\/td><td class=\"mono\">32 &times; 5 &times; 5<\/td><td class=\"mono\" style=\"font-size:11.5px\">conv1.weight [32, 16, 3, 3]<br>conv1.bias [32]<\/td><td class=\"mono\">4,640<\/td><\/tr><tr><td class=\"mono\">conv2<\/td><td>Conv2d 32&rarr;64, 3&times;3, ReLU<\/td><td class=\"mono\">32 &times; 5 &times; 5<\/td><td class=\"mono\">64 &times; 3 &times; 3<\/td><td class=\"mono\" style=\"font-size:11.5px\">conv2.weight [64, 32, 3, 3]<br>conv2.bias [64]<\/td><td class=\"mono\">18,496<\/td><\/tr><tr><td class=\"mono\">fc<\/td><td>Linear 576&rarr;62 (after flatten)<\/td><td class=\"mono\">576<\/td><td class=\"mono\">62 logits<\/td><td class=\"mono\" style=\"font-size:11.5px\">fc.weight [62, 576]<br>fc.bias [62]<\/td><td class=\"mono\">35,774<\/td><\/tr><tr><td><\/td><td><b>Total<\/b><\/td><td><\/td><td><\/td><td><\/td><td class=\"mono\"><b>59,070<\/b><\/td><\/tr><\/tbody><\/table><\/div><p>Every tensor in <span class=\"mono\">model.safetensors<\/span> has exactly the shape this walk predicts from <span class=\"mono\">config.json<\/span>, and the file holds no others.<\/p>\n<p>Each convolution has stride 1 and no padding, so it shrinks the image by\n<span class=\"mono\">kernel_size &minus; 1<\/span>. The channel count starts at 16 and doubles with every\nlayer. Whether a 2&times;2 max-pool follows is taken from <span class=\"mono\">pool_after<\/span>. After\nthe last layer the feature map is flattened and a single linear layer maps it to\n62 logits.<\/p>\n\n<h2 id=\"forward\">Forward pass<\/h2>\n<p><a class=\"x\" href=\"#/m/src%2Fcnn.rs#CNN.forward\">CNN::forward<\/a> runs\n<span class=\"mono\">conv &rarr; ReLU &rarr; (max-pool)<\/span> per layer, flattens from dimension 1 and\napplies the linear layer. There is no dropout or batch norm; inference is deterministic.<\/p>\n<p><a class=\"x\" href=\"#/m/src%2Flib.rs#top_k\">top_k<\/a> applies softmax to the logits and keeps the\n<span class=\"mono\">max_candidates<\/span> most likely characters for that position. It also checks that\nthe model's output width equals the vocabulary length and fails with a clear message otherwise.<\/p>\n\n<h2 id=\"beam\">From letters to strings<\/h2>\n<p><a class=\"x\" href=\"#/m/src%2Flib.rs#candidates\">candidates<\/a> is a beam search over the\npositions. It starts with the empty string, extends every kept prefix with every candidate character\nof the next position, scores the result by the sum of log-probabilities, and keeps the best\n<span class=\"mono\">max_candidates<\/span>. At the end the scores are turned back into probabilities;\n<span class=\"mono\">img_to_text<\/span> discards them and returns only the strings, best first.<\/p>\n<p>With <span class=\"mono\">max_candidates = 3<\/span>, 3 alternatives per letter\nare considered, but only 3 complete strings come back. Raising it makes\nBandcamp's retry loop try more answers per captcha at the cost of more form submissions.<\/p>\n\n<h2 id=\"vocab\">Vocabulary<\/h2>\n<p><a class=\"x\" href=\"#/m/src%2Fcnn.rs#Vocab\">Vocab<\/a> is the <span class=\"mono\">vocab_str<\/span>\nfrom the config as a list of characters; class <span class=\"mono\">i<\/span> of the network is\ncharacter <span class=\"mono\">i<\/span> of that string. Digits, upper case and lower case &mdash;\n62 classes. The order has to be exactly the one used in training.<\/p>\n\n<h2 id=\"config\">config.json<\/h2>\n<p><a class=\"x\" href=\"#/m/src%2Fconfig.rs#Config.load\">Config::load<\/a> reads\n<span class=\"mono\">config.json<\/span> from the model directory. If the file does not exist, it writes\n<a class=\"x\" href=\"#/m/src%2Fconfig.rs#Config.default\">Config::default()<\/a> there and uses that.<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Key<\/th><th>Value in the shipped config.json<\/th><\/tr><\/thead><tbody><tr><td class=\"mono\">kernel_size<\/td><td class=\"mono\">3<\/td><\/tr><tr><td class=\"mono\">conv_count<\/td><td class=\"mono\">3<\/td><\/tr><tr><td class=\"mono\">input_size<\/td><td class=\"mono\">28<\/td><\/tr><tr><td class=\"mono\">vocab_str<\/td><td class=\"mono\">&quot;0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz&quot;<\/td><\/tr><tr><td class=\"mono\">pool_after<\/td><td class=\"mono\">[true, true, false]<\/td><\/tr><tr><td class=\"mono\">model_name<\/td><td class=\"mono\">&quot;model.safetensors&quot;<\/td><\/tr><tr><td class=\"mono\">device<\/td><td class=\"mono\">&quot;cpu&quot;<\/td><\/tr><tr><td class=\"mono\">max_candidates<\/td><td class=\"mono\">3<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Key<\/th><th>Meaning<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"mono\">kernel_size<\/td><td>Side length of every convolution kernel<\/td><\/tr>\n<tr><td class=\"mono\">conv_count<\/td><td>Number of convolution layers<\/td><\/tr>\n<tr><td class=\"mono\">input_size<\/td><td>Side length of the input crop; the preprocessing always produces 28, so this must stay 28<\/td><\/tr>\n<tr><td class=\"mono\">vocab_str<\/td><td>The characters, in class order<\/td><\/tr>\n<tr><td class=\"mono\">pool_after<\/td><td>One flag per convolution: max-pool after it or not. Must have at least <span class=\"mono\">conv_count<\/span> entries<\/td><\/tr>\n<tr><td class=\"mono\">model_name<\/td><td>File name of the weights inside the model directory<\/td><\/tr>\n<tr><td class=\"mono\">device<\/td><td><span class=\"mono\">cpu<\/span>, <span class=\"mono\">cuda<\/span> or <span class=\"mono\">metal<\/span><\/td><\/tr>\n<tr><td class=\"mono\">max_candidates<\/td><td>Characters kept per position and strings returned<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"note risk\"><b>A missing model file is not an error<\/b>\n<p><a class=\"x\" href=\"#/m/src%2Fcnn.rs#CNN.load\">CNN::load<\/a> loads the weights only\n<code>if model_path.exists()<\/code>. Without the file the network keeps the random weights it was\ninitialised with, and <code>img_to_text<\/code> happily returns nonsense. A wrong\n<code>ocr_dir<\/code> therefore looks like a bad model, not like a configuration mistake. Returning an\nerror when the file is missing would make this visible.<\/p><\/div>\n<div class=\"note warn\"><b>Two settings that only look configurable<\/b>\n<p><code>device = \"cuda\"<\/code> or <code>\"metal\"<\/code> needs candle built with the matching\nfeature; <span class=\"mono\">Cargo.toml<\/span> enables neither, so both fail at runtime. And a\n<code>pool_after<\/code> shorter than <code>conv_count<\/code> indexes past the end of the vector,\nwhich panics in Rust and reaches Python as <code>pyo3_runtime.PanicException<\/code> instead of a\n<code>ValueError<\/code>.<\/p><\/div>\n<\/div>\n", "overview": "<div class=\"wrap\">\n<div class=\"crumb\">CaptchaOCR<\/div>\n<h1>Captcha OCR<\/h1>\n<p class=\"lede\">A small Rust extension that reads the text out of Bandcamp's image captchas. Python\nimports it as <span class=\"mono\">ocr<\/span> and calls one function,\n<span class=\"mono\">img_to_text(image_path, ocr_dir)<\/span>, which returns a short list of candidate\nstrings, most likely first.<\/p>\n<div class=\"stats\"><div class=\"stat\"><b>449<\/b><span>lines of Rust<\/span><\/div><div class=\"stat\"><b>59,070<\/b><span>model parameters<\/span><\/div><div class=\"stat\"><b>62<\/b><span>characters<\/span><\/div><div class=\"stat\"><b>231&nbsp;KiB<\/b><span>model file<\/span><\/div><\/div><div class=\"hero\"><svg viewBox=\"0 0 880 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"From captcha image to text candidates\"><rect class=\"svg-box\" x=\"12\" y=\"14\" width=\"176\" height=\"46\" rx=\"6\" stroke-width=\"1\"/><text class=\"svg-t\" x=\"23\" y=\"33\">captcha.jpeg<\/text><text class=\"svg-s\" x=\"23\" y=\"47\">from Bandcamp<\/text><line class=\"svg-l\" x1=\"188\" y1=\"37\" x2=\"222\" y2=\"37\" stroke-width=\"1.2\"/><polygon class=\"svg-ar\" points=\"228,37 222,33.5 222,40.5\"/><rect class=\"svg-box\" x=\"228\" y=\"14\" width=\"176\" height=\"46\" rx=\"6\" stroke-width=\"1\"/><text class=\"svg-t\" x=\"239\" y=\"33\">black / white<\/text><text class=\"svg-s\" x=\"239\" y=\"47\">distance to background<\/text><line class=\"svg-l\" x1=\"404\" y1=\"37\" x2=\"438\" y2=\"37\" stroke-width=\"1.2\"/><polygon class=\"svg-ar\" points=\"444,37 438,33.5 438,40.5\"/><rect class=\"svg-box\" x=\"444\" y=\"14\" width=\"176\" height=\"46\" rx=\"6\" stroke-width=\"1\"/><text class=\"svg-t\" x=\"455\" y=\"33\">connected parts<\/text><text class=\"svg-s\" x=\"455\" y=\"47\">filter by size<\/text><line class=\"svg-l\" x1=\"620\" y1=\"37\" x2=\"654\" y2=\"37\" stroke-width=\"1.2\"/><polygon class=\"svg-ar\" points=\"660,37 654,33.5 654,40.5\"/><rect class=\"svg-box\" x=\"660\" y=\"14\" width=\"176\" height=\"46\" rx=\"6\" stroke-width=\"1\"/><text class=\"svg-t\" x=\"671\" y=\"33\">28 &times; 28 crops<\/text><text class=\"svg-s\" x=\"671\" y=\"47\">one per letter<\/text><rect class=\"svg-box\" x=\"12\" y=\"104\" width=\"176\" height=\"46\" rx=\"6\" stroke-width=\"1\"/><text class=\"svg-t\" x=\"23\" y=\"123\">CNN<\/text><text class=\"svg-s\" x=\"23\" y=\"137\">3 conv + fc<\/text><line class=\"svg-l\" x1=\"188\" y1=\"127\" x2=\"222\" y2=\"127\" stroke-width=\"1.2\"/><polygon class=\"svg-ar\" points=\"228,127 222,123.5 222,130.5\"/><rect class=\"svg-box\" x=\"228\" y=\"104\" width=\"176\" height=\"46\" rx=\"6\" stroke-width=\"1\"/><text class=\"svg-t\" x=\"239\" y=\"123\">top-k per letter<\/text><text class=\"svg-s\" x=\"239\" y=\"137\">softmax<\/text><line class=\"svg-l\" x1=\"404\" y1=\"127\" x2=\"438\" y2=\"127\" stroke-width=\"1.2\"/><polygon class=\"svg-ar\" points=\"444,127 438,123.5 438,130.5\"/><rect class=\"svg-box\" x=\"444\" y=\"104\" width=\"176\" height=\"46\" rx=\"6\" stroke-width=\"1\"/><text class=\"svg-t\" x=\"455\" y=\"123\">beam search<\/text><text class=\"svg-s\" x=\"455\" y=\"137\">joint probability<\/text><line class=\"svg-l\" x1=\"620\" y1=\"127\" x2=\"654\" y2=\"127\" stroke-width=\"1.2\"/><polygon class=\"svg-ar\" points=\"660,127 654,123.5 654,130.5\"/><rect class=\"svg-box\" x=\"660\" y=\"104\" width=\"176\" height=\"46\" rx=\"6\" stroke-width=\"1\"/><text class=\"svg-t\" x=\"671\" y=\"123\">candidates<\/text><text class=\"svg-s\" x=\"671\" y=\"137\">list[str]<\/text><path class=\"svg-l\" d=\"M748.0,60 V82 H100.0 V98\" stroke-width=\"1.2\" fill=\"none\"/><polygon class=\"svg-ar\" points=\"100.0,104 96.5,98 103.5,98\"/><\/svg><\/div>\n\n<h2 id=\"what\">What it does<\/h2>\n<p>The input is the JPEG Bandcamp shows when it suspects a bot: a few letters and digits on a\ncoloured background. The crate does not read the whole image at once. It first separates the\nletters into single 28&times;28 crops, classifies each crop with a small convolutional network, and\nthen combines the per-letter guesses into whole strings with a beam search. That way a letter the\nnetwork is unsure about still produces several plausible answers instead of one wrong one.<\/p>\n<p>The caller gets at most <span class=\"mono\">max_candidates<\/span> strings (currently\n3). Bandcamp's captcha form is then simply tried with each of them in turn.<\/p>\n\n<h2 id=\"where\">Where the pieces live<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Path<\/th><th>Contents<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"mono\">LocalServer/docker/captcha_ocr_source/<\/td><td>The Rust crate (this documentation's tree), its <span class=\"mono\">Cargo.toml<\/span>, the maturin <span class=\"mono\">pyproject.toml<\/span>, a test script and a build guide<\/td><\/tr>\n<tr><td class=\"mono\">PythonModule/providers/ocr/<\/td><td>The model directory passed as <span class=\"mono\">ocr_dir<\/span>: <span class=\"mono\">config.json<\/span>, <span class=\"mono\">model.safetensors<\/span>, plus a prebuilt Windows wheel<\/td><\/tr>\n<tr><td class=\"mono\">PythonModule/providers/Bandcamp/bandcamp_search.py<\/td><td>The only caller: detects the captcha page, runs the OCR, hands the candidates to the browser<\/td><\/tr>\n<tr><td class=\"mono\">LocalServer/docker/Dockerfile<\/td><td>First build stage compiles the crate into a wheel for the server image<\/td><\/tr>\n<\/tbody><\/table><\/div>\n\n<h2 id=\"files\">The crate<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>File<\/th><th>Role<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"mono\"><a class=\"x\" href=\"#/m/src%2Flib.rs\">src/lib.rs<\/a><\/td><td>The Python module, the public function and the whole image pipeline: loading, binarising, segmentation, cropping, top-k and beam search<\/td><\/tr>\n<tr><td class=\"mono\"><a class=\"x\" href=\"#/m/src%2Fcnn.rs\">src/cnn.rs<\/a><\/td><td><span class=\"mono\">CNN<\/span> (built from the config, weights loaded from safetensors) and <span class=\"mono\">Vocab<\/span> (class index &harr; character)<\/td><\/tr>\n<tr><td class=\"mono\"><a class=\"x\" href=\"#/m/src%2Fconfig.rs\">src/config.rs<\/a><\/td><td><span class=\"mono\">Config<\/span>, read from <span class=\"mono\">config.json<\/span> in the model directory<\/td><\/tr>\n<tr><td class=\"mono\"><a class=\"x\" href=\"#/m/src%2Fbbox.rs\">src/bbox.rs<\/a><\/td><td><span class=\"mono\">BBox<\/span>, the bounding box of one connected region<\/td><\/tr>\n<\/tbody><\/table><\/div>\n\n<h2 id=\"stack\">Dependencies<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Crate<\/th><th>For<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"mono\">pyo3<\/td><td>The Python binding; built as abi3 for Python 3.9 and later, so one wheel serves every newer Python<\/td><\/tr>\n<tr><td class=\"mono\">candle-core, candle-nn<\/td><td>Tensors, convolution, softmax and safetensors loading &mdash; Hugging Face's pure-Rust ML library, no Python or libtorch at runtime<\/td><\/tr>\n<tr><td class=\"mono\">image, imageproc<\/td><td>Decoding, grayscale, resize, median filter, connected components<\/td><\/tr>\n<tr><td class=\"mono\">serde, serde_json<\/td><td>Reading and writing <span class=\"mono\">config.json<\/span><\/td><\/tr>\n<tr><td class=\"mono\">flate2<\/td><td>Declared, but not used by any source file<\/td><\/tr>\n<\/tbody><\/table><\/div>\n\n<div class=\"note\"><b>No training code in this repository<\/b>\n<p>The crate only runs inference. <span class=\"mono\">model.safetensors<\/span> was trained elsewhere;\nthe trainer is not part of the project. <span class=\"mono\">LocalServer/testing_captcha_ocr.py<\/span>\nstill calls a <span class=\"mono\">captcha_ocr.train()<\/span> function from that earlier stage and does\nnot work against the current module.<\/p><\/div>\n<\/div>\n", "pipeline": "<div class=\"wrap\">\n<div class=\"crumb\">CaptchaOCR / pipeline<\/div>\n<h1>From image to letters<\/h1>\n<p class=\"lede\">Everything before the network runs in\n<a class=\"x\" href=\"#/m/src%2Flib.rs#load_and_split\">load_and_split()<\/a>. Its job is to turn one\ncaptcha into an ordered list of 28&times;28 tensors, one per letter. Whether the OCR succeeds is\ndecided here more often than in the network: a letter that is lost or split here cannot be\nrecovered later.<\/p>\n\n<h2 id=\"steps\">The steps<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Step<\/th><th>Function<\/th><th>What happens<\/th><\/tr><\/thead><tbody>\n<tr><td>1<\/td><td class=\"mono\"><a class=\"x\" href=\"#/m/src%2Flib.rs#load_image\">load_image<\/a><\/td>\n<td>Decodes the file with the <span class=\"mono\">image<\/span> crate. Any format it knows works; Bandcamp delivers JPEG.<\/td><\/tr>\n<tr><td>2<\/td><td class=\"mono\">grayscale &rarr; to_rgb8<\/td>\n<td>The picture is reduced to gray and then widened back to three equal channels, because the next step works on RGB.<\/td><\/tr>\n<tr><td>3<\/td><td class=\"mono\"><a class=\"x\" href=\"#/m/src%2Flib.rs#background_color\">background_color<\/a><\/td>\n<td>The median of every channel over all pixels. Background is assumed to cover more than half of the image, so the median is its colour.<\/td><\/tr>\n<tr><td>4<\/td><td class=\"mono\"><a class=\"x\" href=\"#/m/src%2Flib.rs#make_black_and_white\">make_black_and_white<\/a><\/td>\n<td>Each pixel's Euclidean distance to that background colour, scaled to 0&ndash;255. Above 32 it becomes white (ink), otherwise black.<\/td><\/tr>\n<tr><td>5<\/td><td class=\"mono\">median_filter(1, 1)<\/td>\n<td>A 3&times;3 median removes salt-and-pepper noise left by the JPEG and by the captcha's speckles.<\/td><\/tr>\n<tr><td>6<\/td><td class=\"mono\"><a class=\"x\" href=\"#/m/src%2Flib.rs#image_split_up\">image_split_up<\/a><\/td>\n<td><span class=\"mono\">connected_components<\/span> with 8-connectivity labels every white blob;\n<a class=\"x\" href=\"#/m/src%2Flib.rs#get_bounding_boxes\">get_bounding_boxes<\/a> collects a\n<span class=\"mono\">BBox<\/span> with pixel count per label, sorted left to right.<\/td><\/tr>\n<tr><td>7<\/td><td class=\"mono\">filters<\/td>\n<td>A blob survives if it has at least 30 pixels, fills at least 15&nbsp;% of its box, and is at least 40&nbsp;% as tall as the tallest blob. That drops dots, lines and stray noise.<\/td><\/tr>\n<tr><td>8<\/td><td class=\"mono\"><a class=\"x\" href=\"#/m/src%2Flib.rs#crop_letter\">crop_letter<\/a><\/td>\n<td>Cuts the box out of the binary image with 3 pixels of padding, clamped to the image edges.<\/td><\/tr>\n<tr><td>9<\/td><td class=\"mono\"><a class=\"x\" href=\"#/m/src%2Flib.rs#to_emnist\">to_emnist<\/a><\/td>\n<td>Scales the crop so its longer side is 20 pixels (triangle filter) and centres it on a black 28&times;28 canvas &mdash; the layout of the EMNIST dataset.<\/td><\/tr>\n<tr><td>10<\/td><td class=\"mono\">Tensor::from_vec<\/td>\n<td>Pixels divided by 255, shaped <span class=\"mono\">(1, 1, 28, 28)<\/span>: batch, channel, height, width.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n\n<h2 id=\"assumptions\">What the segmentation assumes<\/h2>\n<p>The approach only works for captchas whose letters do not touch. Two letters that share a\npixel after binarising become one blob, one crop and one prediction &mdash; the result is then\nmissing a character and none of the candidates can be right. A letter that breaks apart (a thin\n<span class=\"mono\">i<\/span>, a broken stroke) can either vanish under the size filters or turn into\ntwo predictions.<\/p>\n<p>The order of the letters is the order of the boxes' left edges. Overlapping boxes from\nslanted letters are therefore still read left to right, but a short letter tucked under a long\none's overhang can swap places.<\/p>\n<div class=\"note warn\"><b>An image without letters returns one empty string<\/b>\n<p>If every blob is filtered out, <span class=\"mono\">load_and_split<\/span> returns an empty list,\nthe beam search starts from <span class=\"mono\">(\"\", 0.0)<\/span> and never extends it, and\n<span class=\"mono\">img_to_text<\/span> returns <span class=\"mono\">[\"\"]<\/span> rather than raising.\nThe Bandcamp browser then submits an empty answer.<\/p><\/div>\n\n<h2 id=\"tuning\">The numbers to change when it fails<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Constant<\/th><th>Where<\/th><th>Value<\/th><th>Effect of raising it<\/th><\/tr><\/thead><tbody>\n<tr><td>Ink threshold<\/td><td class=\"mono\">make_black_and_white<\/td><td class=\"mono\">32<\/td><td>Fainter strokes and background texture turn black; risks breaking thin letters<\/td><\/tr>\n<tr><td>Median filter radius<\/td><td class=\"mono\">image_clean_and_split_up<\/td><td class=\"mono\">1, 1<\/td><td>More noise removed, but thin strokes erode<\/td><\/tr>\n<tr><td>Minimum area<\/td><td class=\"mono\">image_split_up<\/td><td class=\"mono\">30<\/td><td>More small blobs dropped (dots, but also small letters)<\/td><\/tr>\n<tr><td>Minimum fill<\/td><td class=\"mono\">image_split_up<\/td><td class=\"mono\">0.15<\/td><td>Drops long thin lines that cross the image<\/td><\/tr>\n<tr><td>Relative height<\/td><td class=\"mono\">image_split_up<\/td><td class=\"mono\">4 / 10<\/td><td>Drops more short blobs; lower-case letters are at risk<\/td><\/tr>\n<tr><td>Crop padding<\/td><td class=\"mono\">image_split_up<\/td><td class=\"mono\">3<\/td><td>More margin around each letter before scaling<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>All of them are literals in <span class=\"mono\">src/lib.rs<\/span>, not part of\n<span class=\"mono\">config.json<\/span>, so changing one means rebuilding the wheel.<\/p>\n<\/div>\n"}, "pages_index": [{"title": "Overview", "hash": "#/overview", "sub": "start here"}, {"title": "Image to letters", "hash": "#/pipeline", "sub": "preprocessing and segmentation"}, {"title": "The network", "hash": "#/model", "sub": "CNN, config, model file"}, {"title": "Program flows", "hash": "#/flows", "sub": "interactive step-through"}, {"title": "Python and Bandcamp", "hash": "#/integration", "sub": "img_to_text, captcha solving"}, {"title": "Build and run", "hash": "#/build", "sub": "maturin, wheel, Docker"}, {"title": "img_to_text", "hash": "#/m/src%2Flib.rs#img_to_text", "sub": "the Python entry point"}], "flows": {"ocr": {"title": "img_to_text", "steps": [{"id": "call", "kind": "io", "title": "ocr.img_to_text(image_path, ocr_dir)", "sub": "called from Python, holds the GIL", "link": "#/m/src%2Flib.rs#img_to_text", "next": "read the config", "detail": "<p>Two strings: the image file and the model directory. Nothing is cached between calls &mdash; config and weights are loaded again every time.<\/p>"}, {"id": "cfg", "kind": "decision", "title": "Config::load(ocr_dir)", "sub": "config.json, or write the default", "link": "#/m/src%2Fconfig.rs#Config.load", "next": "config ready", "detail": "<p>If <code>config.json<\/code> exists it is parsed with serde; unknown keys are ignored, missing keys are an error. If it does not exist, <code>Config::default()<\/code> is written to the directory and used.<\/p>", "branches": [{"label": "unreadable or invalid JSON → ValueError", "to": "err", "warn": true}]}, {"id": "dev", "kind": "decision", "title": "config.device()", "sub": "cpu / cuda / metal", "link": "#/m/src%2Fconfig.rs#Config.device", "next": "device chosen", "detail": "<p>The shipped config says <code>cpu<\/code>. CUDA and Metal would need candle compiled with those features, which <code>Cargo.toml<\/code> does not enable.<\/p>", "branches": [{"label": "unknown or unavailable device → ValueError", "to": "err", "warn": true}]}, {"id": "split", "kind": "step", "title": "load_and_split", "sub": "image → one 28×28 tensor per letter", "link": "#/m/src%2Flib.rs#load_and_split", "next": "letter tensors", "detail": "<p>Grayscale, distance-to-background thresholding, median filter, connected components, size filters, crop and EMNIST-style centring. Details on the <a class=\"x\" href=\"#/pipeline\">Image to letters<\/a> page.<\/p>", "branches": [{"label": "image cannot be opened → ValueError", "to": "err", "warn": true}]}, {"id": "net", "kind": "decision", "title": "CNN::load", "sub": "build from config, load safetensors", "link": "#/m/src%2Fcnn.rs#CNN.load", "next": "network ready", "detail": "<p>The layers are created from <code>conv_count<\/code>, <code>kernel_size<\/code>, <code>pool_after<\/code> and the vocabulary size, then the weights are loaded from <code>model_name<\/code>.<\/p><p>If the weights file does not exist, nothing is loaded and the network runs with random initial weights &mdash; without any error.<\/p>", "branches": [{"label": "shapes do not match the file → ValueError", "to": "err", "warn": true}, {"label": "file missing → random weights", "to": "random", "warn": true}]}, {"id": "fwd", "kind": "step", "title": "forward + top_k per letter", "sub": "softmax, keep max_candidates characters", "link": "#/m/src%2Flib.rs#top_k", "next": "per-position candidates", "detail": "<p>Each letter tensor goes through conv/ReLU/pool layers and the final linear layer. Softmax turns the logits into probabilities, and the best <code>max_candidates<\/code> characters with their probabilities are kept.<\/p>"}, {"id": "beam", "kind": "step", "title": "candidates", "sub": "beam search over the positions", "link": "#/m/src%2Flib.rs#candidates", "next": "ranked strings", "detail": "<p>Every kept prefix is extended with every candidate of the next position; the sum of log-probabilities ranks them and only the best <code>max_candidates<\/code> survive each round.<\/p>"}, {"id": "out", "kind": "end", "title": "list[str]", "sub": "best first, probabilities dropped", "link": "#/m/src%2Flib.rs#img_to_text", "detail": "<p>The strings only. If segmentation found no letters at all, the list is <code>[\"\"]<\/code> &mdash; one empty string, not an error.<\/p>", "next": ""}, {"id": "random", "kind": "error", "title": "Silent random output", "sub": "no weights were loaded", "detail": "<p>The call succeeds and returns strings, but they are guesses of an untrained network. The usual cause is a wrong <code>ocr_dir<\/code> or <code>model_name<\/code>.<\/p>", "next": ""}, {"id": "err", "kind": "error", "title": "ValueError", "sub": "every Rust error is converted", "detail": "<p><code>img_to_text<\/code> maps each <code>Err<\/code> to <code>PyValueError<\/code> with the message text. A Rust panic (for example a too short <code>pool_after<\/code>) is not caught and arrives as <code>pyo3_runtime.PanicException<\/code>.<\/p>", "next": ""}]}, "bandcamp": {"title": "Bandcamp captcha", "steps": [{"id": "search", "kind": "io", "title": "Bandcamp.search()", "sub": "fetch the search results page", "next": "check for the challenge", "detail": "<p>The provider loads <code>bandcamp.com/search?...<\/code> with the session's cookies.<\/p>"}, {"id": "detect", "kind": "decision", "title": "_isClientChallenge(html)", "sub": "&lt;title&gt;Client Challenge&lt;/title&gt; or /_fs-ch-", "next": "challenge found", "detail": "<p>Without the markers the results are parsed normally and the OCR is never touched.<\/p>", "branches": [{"label": "no challenge → parse results", "to": "done"}]}, {"id": "retry", "kind": "decision", "title": "Retries left?", "sub": "CAPTCHA_RETRIES = 3", "next": "try to solve", "detail": "<p>Each detected challenge counts one attempt. After the third the search raises <code>TaskFailedError<\/code> asking for manual help.<\/p>", "branches": [{"label": "exhausted → TaskFailedError", "to": "fail", "warn": true}]}, {"id": "browser", "kind": "step", "title": "Open the challenge headless", "sub": "BandcampCaptchaBrowser.run(headless=True)", "next": "page loaded", "detail": "<p>A Playwright browser with the session's cookie file. The page must be rendered by a browser because the image is created by script.<\/p>"}, {"id": "img", "kind": "step", "title": "Cut out
