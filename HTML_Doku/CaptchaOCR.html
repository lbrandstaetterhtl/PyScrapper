the image", "sub": "&lt;img src=\"data:image/jpeg;base64,...\"&gt;", "next": "temporary JPEG", "detail": "<p>The Base64 data is decoded and written to <code>&lt;timestamp&gt;-Bandcamp-captcha.jpeg<\/code> in the current working directory. The file is deleted in a <code>finally<\/code> block.<\/p>"}, {"id": "ocr", "kind": "step", "title": "ocr.img_to_text(file, OCR_PATH)", "sub": "see the img_to_text flow", "link": "#/m/src%2Flib.rs#img_to_text", "next": "candidates", "detail": "<p><code>OCR_PATH<\/code> is <code>PythonModule/providers/ocr<\/code>, resolved relative to the provider file. A <code>ValueError<\/code> from the module becomes a <code>TaskFailedError<\/code> with the model path in its hints.<\/p>"}, {"id": "submit", "kind": "step", "title": "Try each candidate", "sub": "fill #capInput, click #capSubmit", "next": "browser closed", "detail": "<p>Candidates are tried in order. Success is only recognised when the click raises and the page has changed; a solved captcha after a normal click is reported as failure and only noticed on the next round.<\/p>"}, {"id": "cookies", "kind": "step", "title": "Cookies back into the session", "sub": "browser.stop() writes them, session.reloadCookies()", "next": "search again", "detail": "<p>Bandcamp remembers a solved challenge in a cookie. The browser saves its cookies to the shared cookie file when it stops; the HTTP session reloads them, and the loop fetches the search page again.<\/p>", "branches": [{"label": "back to the search", "to": "search"}]}, {"id": "done", "kind": "end", "title": "Search results", "sub": "list of tracks, albums expanded", "next": "", "detail": "<p>Normal provider output. The OCR has done its job once the challenge page no longer appears.<\/p>"}, {"id": "fail", "kind": "error", "title": "TaskFailedError", "sub": "captcha persisted after 3 attempts", "detail": "<p>The message suggests solving the captcha manually. Since the solved state lives in the cookie file, a captcha solved once in a normal browser with the same cookies also unblocks the server.<\/p>", "next": ""}]}}, "notes": {"src/cnn.rs": "<div class=\"note risk\"><b>Missing weights are ignored<\/b>\n<p><code>CNN::load<\/code> only loads the safetensors file if it exists. Otherwise the network keeps its random initialisation and every call returns guesses without an error.<\/p><\/div>", "src/config.rs": "<div class=\"note warn\"><b>Load can write<\/b>\n<p>Without <code>config.json<\/code>, <code>Config::load<\/code> writes the default into the model directory. In a read-only location (a mounted volume, an installed package) that fails with &bdquo;Could not save config&ldquo;. <code>cuda<\/code> and <code>metal<\/code> are accepted values but need candle features this crate does not enable.<\/p><\/div>", "src/lib.rs": "<div class=\"note\"><b>One public function<\/b>\n<p>Only <code>img_to_text<\/code> is exported to Python; everything else here is the private image pipeline. Errors become <code>ValueError<\/code>; an image without detectable letters returns <code>[\"\"]<\/code>.<\/p><\/div>", "README.txt": "<div class=\"note warn\"><b>Outdated names<\/b>\n<p>This guide still refers to <code>captcha_ocr<\/code> (wheel name and import). The package is <code>ocr<\/code> today. See <a class=\"x\" href=\"#/build\">Build and run<\/a> for the current commands.<\/p><\/div>", "test.py": "<div class=\"note\"><b>Model path<\/b>\n<p>Pass <code>--ocr-dir PythonModule/providers/ocr<\/code> or set <code>OCR_DIR<\/code>; the built-in default points at a folder on the author's machine.<\/p><\/div>", "Cargo.toml": "<div class=\"note\"><b>flate2 is unused<\/b>\n<p>Declared as a dependency, but no source file uses it.<\/p><\/div>"}}</script>
<script>

const DATA = JSON.parse(document.getElementById('payload').textContent);
const MODS = DATA.modules;
const BY_PATH = {};
MODS.forEach(m => BY_PATH[m.path] = m);

/* ------------------------------------------------------------------ utils */
const esc = s => (s == null ? '' : String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'));
const q1 = s => document.querySelector(s);

/* ------------------------------------------------ python syntax highlight */
const PY_KW = new Set(('False None True and as assert async await break class continue def del elif else ' +
  'except finally for from global if import in is lambda nonlocal not or pass raise return try while ' +
  'with yield match case self cls').split(' '));
const PY_BI = new Set(('abs all any bool bytes callable dict dir enumerate filter float format getattr ' +
  'hasattr int isinstance issubclass len list map max min next object open print range repr reversed ' +
  'round set setattr sorted str sum super tuple type zip Exception ValueError TypeError KeyError ' +
  'IndexError RuntimeError NotImplementedError StopIteration StopAsyncIteration OSError IOError ' +
  'UnicodeDecodeError AttributeError').split(' '));

const PY_RE = new RegExp([
  '(#[^\\n]*)',
  '([rbfuRBFU]{0,3}["]{3}[\\s\\S]*?["]{3}|[rbfuRBFU]{0,3}[\']{3}[\\s\\S]*?[\']{3})',
  '([rbfuRBFU]{0,3}"(?:\\\\.|[^"\\\\\\n])*"|[rbfuRBFU]{0,3}\'(?:\\\\.|[^\'\\\\\\n])*\')',
  '(@[A-Za-z_][\\w.]*)',
  '\\b(?:def|class)\\s+([A-Za-z_]\\w*)',
  '\\b(\\d[\\w.]*)\\b',
  '\\b([A-Za-z_]\\w*)\\b'
].join('|'), 'g');

function pyHighlight(code) {
  let out = '', last = 0, m;
  PY_RE.lastIndex = 0;
  while ((m = PY_RE.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    if (m[1]) out += '<span class="tk-c">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="tk-s">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="tk-s">' + esc(m[3]) + '</span>';
    else if (m[4]) out += '<span class="tk-d">' + esc(m[4]) + '</span>';
    else if (m[5]) {
      const kw = m[0].slice(0, m[0].length - m[5].length);
      out += '<span class="tk-k">' + esc(kw.trimEnd()) + '</span>' +
             esc(kw.slice(kw.trimEnd().length)) + '<span class="tk-def">' + esc(m[5]) + '</span>';
    }
    else if (m[6]) out += '<span class="tk-n">' + esc(m[6]) + '</span>';
    else if (m[7]) {
      const w = m[7];
      if (PY_KW.has(w)) out += '<span class="tk-k">' + esc(w) + '</span>';
      else if (PY_BI.has(w)) out += '<span class="tk-b">' + esc(w) + '</span>';
      else out += esc(w);
    }
    last = m.index + m[0].length;
  }
  out += esc(code.slice(last));
  return out;
}

const CS_KW = new Set(('abstract as async await base bool break byte case catch char checked class const ' +
  'continue decimal default delegate do double else enum event explicit extern false finally fixed float ' +
  'for foreach get goto if implicit in int interface internal is lock long namespace new null object ' +
  'operator out override params private protected public readonly record ref return sbyte sealed set short ' +
  'sizeof stackalloc static string struct switch this throw true try typeof uint ulong unchecked unsafe ' +
  'ushort using value var virtual void volatile when where while yield partial nameof').split(' '));
const CS_TYPES = new Set(('Task List Dictionary ObservableCollection IEnumerable IReadOnlyList Exception ' +
  'DateTime DateTimeOffset TimeSpan HttpClient HttpResponseMessage JsonSerializer Path File Directory ' +
  'Process Window Control Bitmap Image Uri Guid Convert Encoding Math Console CancellationToken ' +
  'ObservableObject Application Func Action Nullable StringBuilder Regex Stream').split(' '));

const CS_RE = /(\/\/\/[^\n]*|\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(@?\"(?:\"\"|\\.|[^\"\\])*\"|'(?:\\.|[^'\\])')|(\[[A-Za-z_][\w.]*(?:\([^\]]*\))?\])|\b(?:class|record|struct|interface|enum)\s+([A-Za-z_]\w*)|\b(\d[\w.]*)\b|\b([A-Za-z_]\w*)\b/g;

function csHighlight(code) {
  let out = '', last = 0, m;
  CS_RE.lastIndex = 0;
  while ((m = CS_RE.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    if (m[1]) out += '<span class="tk-c">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="tk-s">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="tk-d">' + esc(m[3]) + '</span>';
    else if (m[4]) {
      const kw = m[0].slice(0, m[0].length - m[4].length);
      out += '<span class="tk-k">' + esc(kw.trimEnd()) + '</span>' +
             esc(kw.slice(kw.trimEnd().length)) + '<span class="tk-def">' + esc(m[4]) + '</span>';
    }
    else if (m[5]) out += '<span class="tk-n">' + esc(m[5]) + '</span>';
    else if (m[6]) {
      const w = m[6];
      if (CS_KW.has(w)) out += '<span class="tk-k">' + esc(w) + '</span>';
      else if (CS_TYPES.has(w)) out += '<span class="tk-b">' + esc(w) + '</span>';
      else out += esc(w);
    }
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}

const XML_RE = /(<!--[\s\S]*?-->)|(<\/?)([\w:.\-]+)|([\w:.\-]+)(=)("[^"]*"|'[^']*')|(\/?>)/g;
function xmlHighlight(code) {
  let out = '', last = 0, m;
  XML_RE.lastIndex = 0;
  while ((m = XML_RE.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    if (m[1]) out += '<span class="tk-c">' + esc(m[1]) + '</span>';
    else if (m[3]) out += '<span class="tk-k">' + esc(m[2]) + '</span>' +
                          '<span class="tk-def">' + esc(m[3]) + '</span>';
    else if (m[4]) out += '<span class="tk-n">' + esc(m[4]) + '</span>' + esc(m[5]) +
                          '<span class="tk-s">' + esc(m[6]) + '</span>';
    else if (m[7]) out += '<span class="tk-k">' + esc(m[7]) + '</span>';
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}

let LANG = DATA.lang || 'py';
const RS_KW = new Set(('as async await break const continue crate dyn else enum extern false fn for if impl in ' +
  'let loop match mod move mut pub ref return self Self static struct super trait true type unsafe use where ' +
  'while Some None Ok Err').split(' '));
const RS_TYPES = new Set(('u8 u16 u32 u64 usize i8 i16 i32 i64 isize f32 f64 bool char str String Vec Option ' +
  'Result Box HashMap Path Tensor Device GrayImage RgbImage DynamicImage ImageBuffer Luma Rgb PyResult ' +
  'PyModule Bound VarMap VarBuilder Conv2d Linear').split(' '));
const RS_RE = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])')|(#!?\[[^\]]*\])|\b(?:fn|struct|enum|impl|mod|trait)\s+([A-Za-z_]\w*)|\b(\d[\w.]*)\b|\b([A-Za-z_]\w*!?)/g;

function rsHighlight(code) {
  let out = '', last = 0, m;
  RS_RE.lastIndex = 0;
  while ((m = RS_RE.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    if (m[1]) out += '<span class="tk-c">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="tk-s">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="tk-d">' + esc(m[3]) + '</span>';
    else if (m[4]) {
      const kw = m[0].slice(0, m[0].length - m[4].length);
      out += '<span class="tk-k">' + esc(kw.trimEnd()) + '</span>' +
             esc(kw.slice(kw.trimEnd().length)) + '<span class="tk-def">' + esc(m[4]) + '</span>';
    }
    else if (m[5]) out += '<span class="tk-n">' + esc(m[5]) + '</span>';
    else if (m[6]) {
      const w = m[6];
      if (w.endsWith('!')) out += '<span class="tk-d">' + esc(w) + '</span>';
      else if (RS_KW.has(w)) out += '<span class="tk-k">' + esc(w) + '</span>';
      else if (RS_TYPES.has(w)) out += '<span class="tk-b">' + esc(w) + '</span>';
      else out += esc(w);
    }
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}

function highlight(code) {
  if (LANG === 'cs') return csHighlight(code);
  if (LANG === 'rs') return rsHighlight(code);
  if (LANG === 'text') return esc(code);
  if (LANG === 'xml') return xmlHighlight(code);
  return pyHighlight(code);
}

function codeBlock(src, startLine, opts) {
  opts = opts || {};
  const lines = src.replace(/\r/g, '').split('\n');
  const hl = highlight(lines.join('\n')).split('\n');
  let rows = '';
  for (let i = 0; i < lines.length; i++) {
    const n = (startLine || 1) + i;
    rows += '<tr id="' + (opts.anchorPrefix || '') + 'L' + n + '"><td class="ln">' + n +
            '</td><td class="cd">' + (hl[i] || ' ') + '</td></tr>';
  }
  return '<pre class="code' + (opts.full ? ' full' : '') + '"><table><tbody>' + rows + '</tbody></table></pre>';
}

/* --------------------------------------------------------------- badges */
const FLAVORS = {
  enum:      ['enm', 'b-enum',  'enum'],
  dataclass: ['dcl', 'b-data',  'dataclass'],
  pydantic:  ['pyd', 'b-pyd',   'pydantic'],
  record:    ['dcl', 'b-data',  'record'],
  interface: ['pyd', 'b-pyd',   'interface'],
  static:    ['cls', 'b-class', 'static class'],
  viewmodel: ['rte', 'b-route', 'viewmodel'],
  view:      ['dcl', 'b-data',  'view'],
  struct:    ['dcl', 'b-data',  'struct'],
  'class':   ['cls', 'b-class', 'class']
};
function flavorMeta(c) { return FLAVORS[c.flavor] || FLAVORS['class']; }

function renderSig(fn) {
  let s = '<span class="pn">' + esc(fn.name) + '</span>(';
  const parts = fn.params.map(p => {
    let t = '';
    if (p.kind === 'vararg') t += '*';
    if (p.kind === 'kwarg') t += '**';
    t += '<span class="pn">' + esc(p.name) + '</span>';
    if (p.annotation) t += ': <span class="an">' + esc(p.annotation) + '</span>';
    if (p.default !== null && p.default !== undefined) t += ' = <span class="dv">' + esc(p.default) + '</span>';
    return t;
  });
  const long = parts.join(', ').replace(/<[^>]+>/g, '').length > 74;
  s += long ? '\n    ' + parts.join(',\n    ') + '\n' : parts.join(', ');
  s += ')';
  if (fn.returns) s += ' &rarr; <span class="rt">' + esc(fn.returns) + '</span>';
  return s;
}

let uid = 0;
function srcToggle(src, line) {
  const id = 'src' + (uid++);
  return '<button class="srcbtn" data-t="' + id + '">Source</button>' +
         '<div class="hidden" id="' + id + '" style="margin-top:9px">' + codeBlock(src, line) + '</div>';
}

function paramTable(fn) {
  const ps = fn.params.filter(p => !(fn.is_method && (p.name === 'self' || p.name === 'cls')));
  if (!ps.length) return '';
  let r = '';
  for (const p of ps) {
    r += '<tr><td class="mono">' + esc(p.name) + (p.kind === 'kwonly' ? ' <span class="tag">kw-only</span>' : '') +
         '</td><td class="mono">' + (p.annotation ? esc(p.annotation) : '<span style="color:var(--ink3)">&mdash;</span>') +
         '</td><td class="mono">' + (p.default !== null && p.default !== undefined
            ? esc(p.default) : '<span class="req">required</span>') + '</td></tr>';
  }
  return '<div class="tbl-wrap"><table><thead><tr><th>Parameter</th><th>Type</th><th>Default</th>' +
         '</tr></thead><tbody>' + r + '</tbody></table></div>';
}

function xrefFor(name) {
  const u = DATA.xref[name];
  if (!u || !u.length) return '';
  const links = u.slice(0, 14).map(x =>
    '<a class="tag" href="#/m/' + encodeURIComponent(x[0]) + '#' + x[1] + '">' + esc(x[1]) + '</a>').join('');
  return '<div style="margin-top:9px"><span style="font-size:11px;color:var(--ink3)">Called by</span>' +
         '<div class="chips" style="margin-top:5px">' + links +
         (u.length > 14 ? '<span class="tag">+' + (u.length - 14) + '</span>' : '') + '</div></div>';
}

function fnCard(fn, mod, owner) {
  const cls = fn.route ? 'rte' : 'fnc';
  let badges = '';
  if (fn.async) badges += '<span class="b b-async">async</span>';
  if (fn.route) badges += '<span class="b b-route">' + fn.route.method + '</span>';
  else badges += '<span class="b b-func">' + (fn.is_method ? 'method' : 'function') + '</span>';
  if (fn.private) badges += '<span class="b b-priv">internal</span>';
  for (const d of fn.decorators) {
    if (/abstractmethod/.test(d)) badges += '<span class="b b-abs">abstract</span>';
    else if (/staticmethod/.test(d)) badges += '<span class="b b-priv">static</span>';
    else if (/classmethod/.test(d)) badges += '<span class="b b-priv">classmethod</span>';
    else if (/property/.test(d)) badges += '<span class="b b-priv">property</span>';
    else if (/RelayCommand/.test(d)) badges += '<span class="b b-route">command</span>';
    else if (/pyfunction|pymodule/.test(d)) badges += '<span class="b b-route">python api</span>';
    else if (/ObservableProperty/.test(d)) badges += '<span class="b b-data">observable</span>';
  }
  const anchor = (owner ? owner + '.' : '') + fn.name;
  let h = '<div class="sym ' + cls + '" id="' + esc(anchor) + '">';
  h += '<div class="symhead"><div class="symname">' +
       (owner ? '<span class="own">' + esc(owner) + '.</span>' : '') + esc(fn.name) +
       '</div><div class="chips">' + badges + '</div>' +
       '<div style="margin-left:auto"><a class="tag" href="#/src/' + encodeURIComponent(mod.path) +
       '#L' + fn.lineno + '">line ' + fn.lineno + '</a></div></div>';
  h += '<div class="sigline">' + renderSig(fn) + '</div>';
  h += '<div class="symbody">';
  if (fn.doc) h += '<div class="doc">' + esc(fn.doc) + '</div>';
  h += paramTable(fn);
  if (fn.raises.length)
    h += '<div class="chips" style="margin:6px 0"><span style="font-size:11px;color:var(--ink3)">Raises</span>' +
         fn.raises.slice(0, 8).map(r => '<span class="tag warn">' + esc(r) + '</span>').join('') + '</div>';
  h += xrefFor(fn.name);
  h += '<div style="margin-top:10px">' + srcToggle(fn.source, fn.lineno) + '</div>';
  h += '</div></div>';
  return h;
}

function clsCard(c, mod) {
  const [k, badge, label] = flavorMeta(c);
  let h = '<div class="sym ' + k + '" id="' + esc(c.name) + '">';
  h += '<div class="symhead"><div class="symname">' + esc(c.name) + '</div><div class="chips">' +
       '<span class="b ' + badge + '">' + label + '</span>' +
       (c.bases.length ? c.bases.map(b => '<span class="b b-mod">' + esc(b) + '</span>').join('') : '') +
       '</div><div style="margin-left:auto"><a class="tag" href="#/src/' + encodeURIComponent(mod.path) +
       '#L' + c.lineno + '">line ' + c.lineno + '</a></div></div>';
  h += '<div class="symbody">';
  if (c.doc) h += '<div class="doc">' + esc(c.doc) + '</div>';
  if (c.fields.length) {
    let r = '';
    for (const f of c.fields) {
      r += '<tr><td class="mono">' + esc(f.name) + '</td><td class="mono">' +
           (f.annotation ? esc(f.annotation) : '<span style="color:var(--ink3)">&mdash;</span>') +
           '</td><td class="mono">' + (f.default != null ? esc(f.default)
             : (c.flavor === 'enum' ? '' : '<span class="req">required</span>')) + '</td></tr>';
    }
    h += '<div class="tbl-wrap"><table><thead><tr><th>' +
         (c.flavor === 'enum' ? 'Member' : 'Field') + '</th><th>Type</th><th>' +
         (c.flavor === 'enum' ? 'Value' : 'Default') + '</th></tr></thead><tbody>' + r + '</tbody></table></div>';
  }
  if (c.nested && c.nested.length)
    h += '<div class="chips" style="margin:6px 0"><span style="font-size:11px;color:var(--ink3)">Nested types</span>' +
         c.nested.map(n => '<a class="tag" href="#' + esc(n) + '">' + esc(n) + '</a>').join('') + '</div>';
  h += xrefFor(c.name);
  if (!c.methods.length) h += '<div style="margin-top:10px">' + srcToggle(c.source, c.lineno) + '</div>';
  h += '</div></div>';
  for (const m of c.methods) h += '<div style="margin-left:18px">' + fnCard(m, mod, c.name) + '</div>';
  return h;
}

/* ------------------------------------------------------------- module page */
function modulePage(mod) {
  LANG = mod.lang || DATA.lang || 'py';
  let h = '<div class="wrap">';
  h += '<div class="crumb">' + esc(DATA.package) + ' / ' + esc(mod.path) + '</div>';
  h += '<h1>' + esc(mod.name) + '</h1>';
  h += '<div class="chips" style="margin:10px 0 4px">' +
       '<span class="tag">' + mod.loc + ' lines</span>' +
       '<span class="tag">' + mod.classes.length + ' classes</span>' +
       '<span class="tag">' + mod.functions.length + ' functions</span>' +
       '<span class="tag">' + mod.constants.length + ' constants</span>' +
       '<a class="tag" href="#/src/' + encodeURIComponent(mod.path) + '">View whole file</a></div>';
  if (mod.doc) h += '<div class="doc" style="margin-top:14px">' + esc(mod.doc) + '</div>';
  if (DATA.notes && DATA.notes[mod.path]) h += DATA.notes[mod.path];

  if (mod.imports.length) {
    h += '<h2 id="__imports">Imports</h2>';
    const own = mod.imports.filter(i => /^from \.|^from PythonModule|^import PythonModule|PyScrapperDesktopApp|^use crate|^mod /.test(i));
    const ext = mod.imports.filter(i => own.indexOf(i) === -1);
    const box = (title, arr) => arr.length
      ? '<h3>' + title + '</h3>' + codeBlock(arr.join('\n'), 1, { full: true }) : '';
    h += box('Project-internal', own) + box('External / stdlib', ext);
  }

  if (mod.constants.length) {
    h += '<h2 id="__consts">Constants</h2>';
    let r = '';
    for (const c of mod.constants) {
      const v = c.big
        ? '<button class="srcbtn" data-t="c' + uid + '">show ' + c.value.length + ' characters</button>' +
          '<div class="hidden" id="c' + (uid++) + '" style="margin-top:6px">' +
          codeBlock(c.value, 1, { full: true }) + '</div>'
        : '<span class="mono">' + esc(c.value) + '</span>';
      r += '<tr><td class="mono" style="white-space:nowrap">' + esc(c.name) + '</td><td>' + v + '</td></tr>';
    }
    h += '<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Value</th></tr></thead><tbody>' +
         r + '</tbody></table></div>';
  }

  if (mod.classes.length) {
    h += '<h2 id="__classes">Classes</h2>';
    for (const c of mod.classes) h += clsCard(c, mod);
  }
  if (mod.functions.length) {
    h += '<h2 id="__functions">Functions</h2>';
    for (const f of mod.functions) h += fnCard(f, mod, null);
  }
  h += '</div>';
  return h;
}

function sourcePage(mod) {
  LANG = mod.lang || DATA.lang || 'py';
  let h = '<div class="wrap">';
  h += '<div class="crumb"><a class="x" href="#/m/' + encodeURIComponent(mod.path) + '">&larr; ' +
       esc(mod.name) + '</a></div>';
  h += '<h1>' + esc(mod.path) + '</h1>';
  h += '<p class="lede">Full source, ' + mod.loc +
       ' lines. Line numbers are linkable (<span class="mono">#L42</span>).</p>';
  h += codeBlock(mod.source, 1, { full: true });
  h += '</div>';
  return h;
}

/* ---------------------------------------------------------------- sidebar */
function buildTree() {
  const root = { dirs: {}, files: [] };
  for (const m of MODS) {
    const parts = m.path.split('/');
    let node = root;
    for (let i = 0; i < parts.length - 1; i++) {
      node.dirs[parts[i]] = node.dirs[parts[i]] || { dirs: {}, files: [] };
      node = node.dirs[parts[i]];
    }
    node.files.push(m);
  }
  const render = (node, depth) => {
    let h = '';
    for (const name of Object.keys(node.dirs).sort()) {
      const d = node.dirs[name];
      h += '<div class="dir' + (depth > 0 ? ' closed' : '') + '">' +
           '<div class="dirhead"><span class="car">&#9660;</span>' + esc(name) + '/</div>' +
           '<div class="dirkids">' + render(d, depth + 1) + '</div></div>';
    }
    for (const f of node.files.sort((a, b) => a.path.localeCompare(b.path))) {
      const base = f.path.split('/').pop();
      const n = f.classes.length + f.functions.length;
      h += '<a class="modlink" data-p="' + esc(f.path) + '" href="#/m/' + encodeURIComponent(f.path) + '">' +
           esc(base) + '<span class="cnt">' + (n || '') + '</span></a>';
    }
    return h;
  };
  q1('#tree').innerHTML = render(root, 0);
  q1('#tree').addEventListener('click', e => {
    const dh = e.target.closest('.dirhead');
    if (dh) dh.parentElement.classList.toggle('closed');
  });
}

/* ----------------------------------------------------------------- search */
const INDEX = [];
(function buildIndex() {
  for (const p of DATA.pages_index) INDEX.push({ n: p.title, k: 'page', h: p.hash, p: p.sub || '' });
  for (const m of MODS) {
    INDEX.push({ n: m.name, k: 'module', h: '#/m/' + encodeURIComponent(m.path), p: m.path });
    for (const c of m.classes) {
      INDEX.push({ n: c.name, k: c.flavor, h: '#/m/' + encodeURIComponent(m.path) + '#' + c.name, p: m.path });
      for (const f of c.methods)
        INDEX.push({ n: c.name + '.' + f.name, k: 'method', h: '#/m/' + encodeURIComponent(m.path) + '#' + c.name + '.' + f.name, p: m.path });
    }
    for (const f of m.functions) {
      const kind = f.route ? f.route.method : 'function';
      INDEX.push({ n: f.name, k: kind, h: '#/m/' + encodeURIComponent(m.path) + '#' + f.name, p: m.path,
                   extra: f.route ? f.route.path : '' });
    }
    for (const c of m.constants)
      INDEX.push({ n: c.name, k: 'const', h: '#/m/' + encodeURIComponent(m.path) + '#__consts', p: m.path });
  }
})();

function score(name, term) {
  const n = name.toLowerCase();
  const i = n.indexOf(term);
  if (i === -1) return -1;
  let s = 100 - i;
  if (i === 0) s += 60;
  if (n === term) s += 200;
  s -= Math.min(name.length, 40) * 0.3;
  return s;
}
function markHit(name, term) {
  const i = name.toLowerCase().indexOf(term);
  if (i === -1) return esc(name);
  return esc(name.slice(0, i)) + '<span class="hl">' + esc(name.slice(i, i + term.length)) +
         '</span>' + esc(name.slice(i + term.length));
}
let selIdx = 0, curRes = [];
function runSearch(term) {
  const box = q1('#results');
  term = term.trim().toLowerCase();
  if (!term) { box.classList.remove('on'); return; }
  const out = [];
  for (const it of INDEX) {
    let s = score(it.n, term);
    if (s < 0 && it.extra) s = score(it.extra, term) - 20;
    if (s > 0) out.push([s, it]);
  }
  out.sort((a, b) => b[0] - a[0]);
  curRes = out.slice(0, 40).map(x => x[1]);
  selIdx = 0;
  if (!curRes.length) { box.innerHTML = '<div class="nores">grep: ' + esc(term) + ': no match</div>'; box.classList.add('on'); return; }
  box.innerHTML = curRes.map((r, i) =>
    '<div class="res' + (i === 0 ? ' sel' : '') + '" data-h="' + esc(r.h) + '">' +
    '<span class="b b-mod">' + esc(r.k) + '</span>' +
    '<span class="nm">' + markHit(r.n, term) + '</span>' +
    '<span class="pt">' + esc(r.extra || r.p) + '</span></div>').join('');
  box.classList.add('on');
}
function moveSel(d) {
  const items = document.querySelectorAll('.res');
  if (!items.length) return;
  items[selIdx].classList.remove('sel');
  selIdx = (selIdx + d + items.length) % items.length;
  items[selIdx].classList.add('sel');
  items[selIdx].scrollIntoView({ block: 'nearest' });
}

/* ------------------------------------------------------------------ router */
function setActive(hash) {
  document.querySelectorAll('.navlink,.modlink').forEach(a => a.classList.remove('act'));
  const a = document.querySelector('[href="' + CSS.escape(hash) + '"]');
  if (a) {
    a.classList.add('act');
    let p = a.parentElement;
    while (p) { if (p.classList && p.classList.contains('dir')) p.classList.remove('closed'); p = p.parentElement; }
  }
}

function buildToc() {
  const main = q1('#main');
  const heads = [...main.querySelectorAll('h2, .sym > .symhead > .symname')];
  if (heads.length < 2) { q1('#toc').innerHTML = ''; return; }
  let h = '<h5>outline</h5>';
  for (const n of heads) {
    if (n.tagName === 'H2') {
      h += '<a href="#' + (n.id || '') + '" data-i="' + (n.id || '') + '">' + esc(n.textContent) + '</a>';
    } else {
      const box = n.closest('.sym');
      h += '<a class="lvl2" href="#' + box.id + '" data-i="' + box.id + '">' + esc(n.textContent) + '</a>';
    }
  }
  q1('#toc').innerHTML = h;
  q1('#toc').querySelectorAll('a').forEach(a => a.addEventListener('click', ev => {
    ev.preventDefault();
    const t = document.getElementById(a.dataset.i);
    if (t) t.scrollIntoView({ block: 'start' });
  }));
}

function render() {
  const raw = location.hash || '#/overview';
  const [route, frag] = raw.split(/#(?![/])/);
  const main = q1('#main');
  let html = '';
  if (route.startsWith('#/m/')) {
    const mod = BY_PATH[decodeURIComponent(route.slice(4))];
    html = mod ? modulePage(mod) : '<div class="wrap"><h1>404</h1><p>Module not found.</p></div>';
  } else if (route.startsWith('#/src/')) {
    const mod = BY_PATH[decodeURIComponent(route.slice(6))];
    html = mod ? sourcePage(mod) : '<div class="wrap"><h1>404</h1></div>';
  } else {
    LANG = DATA.lang || 'py';
    const key = route.replace('#/', '');
    html = DATA.pages[key] || DATA.pages['overview'];
  }
  main.innerHTML = html;
  main.scrollTop = 0;
  setActive(route);
  buildToc();
  wirePage();
  updateStatus(route);
  if (frag) {
    const t = document.getElementById(frag);
    if (t) { t.scrollIntoView({ block: 'start' }); if (t.tagName === 'TR') t.classList.add('hit'); }
  }
}

function updateStatus(route) {
  const mode = q1('#stmode'), path = q1('#stpath'), info = q1('#stinfo');
  if (route.startsWith('#/m/') || route.startsWith('#/src/')) {
    const p = decodeURIComponent(route.replace(/^#\/(m|src)\//, ''));
    const mod = BY_PATH[p];
    mode.textContent = route.startsWith('#/src/') ? 'SOURCE' : 'MODULE';
    path.textContent = DATA.package + '/' + p;
    if (mod) {
      const nm = mod.classes.length + mod.functions.length +
                 mod.classes.reduce((a, c) => a + c.methods.length, 0);
      info.textContent = mod.loc + ' lines  ' + nm + ' symbols';
    } else info.textContent = '-';
  } else {
    mode.textContent = 'DOC';
    path.textContent = DATA.package;
    info.textContent = MODS.length + ' modules  ' + DATA.total_loc + ' lines';
  }
}

/* ------------------------------------------------------------- flowcharts */
/* Interactive program-flow widget. Data comes from DATA.flows, a page just
   drops <div class="flowmount" data-flow="id,id2"></div> and this fills it. */
const FKIND = {
  step: 'step', decision: 'decision', io: 'i/o', error: 'error path',
  end: 'end', start: 'start'
};

function flowNodeHtml(s, i, sel, seen) {
  const kind = s.kind || 'step';
  let cls = 'fnode k-' + kind;
  if (i === sel) cls += ' on';
  else if (seen) cls += ' done';
  const glyph = kind === 'decision' ? '<span>?</span>' : (i + 1);
  return '<div class="' + cls + '" data-i="' + i + '" role="button" tabindex="0">' +
         '<div class="fn">' + glyph + '</div><div><div class="ft">' + esc(s.title) + '</div>' +
         (s.sub ? '<div class="fs">' + esc(s.sub) + '</div>' : '') + '</div></div>';
}

function flowEdgeHtml(label) {
  return '<div class="fedge"><div class="fline"></div>' +
         (label ? '<div class="flabel">' + esc(label) + '</div>' : '') + '</div>';
}

function flowDetailHtml(flow, i) {
  const s = flow.steps[i];
  let h = '<h4>' + esc(s.title) + '</h4>';
  h += '<div class="fkind">' + (FKIND[s.kind || 'step'] || 'step') +
       ' &middot; step ' + (i + 1) + ' of ' + flow.steps.length + '</div>';
  h += s.detail || '';
  const outs = s.branches || [];
  if (outs.length) {
    h += '<div class="fbranch"><div class="fbh">Where it can go from here</div>';
    for (const b of outs) {
      const t = flow.steps.findIndex(x => x.id === b.to);
      h += '<button class="fgoto' + (b.warn ? ' warn' : '') + '" data-goto="' +
           (t < 0 ? '' : t) + '">' + esc(b.label) +
           (t >= 0 ? ' &rarr; ' + (t + 1) : '') + '</button>';
    }
    h += '</div>';
  }
  if (s.link) {
    h += '<div class="fmini"><a class="tag" href="' + s.link + '">Open in the source</a></div>';
  }
  return h;
}

function buildFlow(mount) {
  const ids = (mount.dataset.flow || '').split(',').map(x => x.trim()).filter(Boolean);
  const flows = ids.map(id => (DATA.flows || {})[id]).filter(Boolean);
  if (!flows.length) return;

  let fi = 0, sel = 0;
  const wrap = document.createElement('div');
  wrap.className = 'flowwrap';
  mount.appendChild(wrap);

  function paint() {
    const flow = flows[fi];
    let tabs = '';
    if (flows.length > 1) {
      tabs = flows.map((f, i) =>
        '<button class="flowtab' + (i === fi ? ' on' : '') + '" data-tab="' + i + '">' +
        esc(f.title) + '</button>').join('');
    }
    let steps = '';
    flow.steps.forEach((s, i) => {
      if (i) steps += flowEdgeHtml(flow.steps[i - 1].next);
      steps += flowNodeHtml(s, i, sel, i < sel);
    });
    wrap.innerHTML =
      '<div class="flowbar"><div class="flowtabs">' + tabs + '</div>' +
      '<div class="flowctl">' +
      '<button class="flowbtn" data-nav="-1"' + (sel === 0 ? ' disabled' : '') + '>&larr; prev</button>' +
      '<span class="flowcount">' + (sel + 1) + ' / ' + flow.steps.length + '</span>' +
      '<button class="flowbtn" data-nav="1"' +
      (sel === flow.steps.length - 1 ? ' disabled' : '') + '>next &rarr;</button>' +
      '</div></div>' +
      '<div class="flowbody"><div class="flowsteps">' + steps + '</div>' +
      '<div class="fdetail">' + flowDetailHtml(flow, sel) + '</div></div>';
  }

  function go(i) {
    const flow = flows[fi];
    sel = Math.max(0, Math.min(flow.steps.length - 1, i));
    paint();
    const node = wrap.querySelector('.fnode.on');
    if (node) node.scrollIntoView({ block: 'nearest' });
  }

  wrap.addEventListener('click', e => {
    const tab = e.target.closest('[data-tab]');
    if (tab) { fi = +tab.dataset.tab; sel = 0; paint(); return; }
    const nav = e.target.closest('[data-nav]');
    if (nav) { go(sel + (+nav.dataset.nav)); return; }
    const jump = e.target.closest('[data-goto]');
    if (jump && jump.dataset.goto !== '') { go(+jump.dataset.goto); return; }
    const node = e.target.closest('.fnode');
    if (node) go(+node.dataset.i);
  });
  wrap.addEventListener('keydown', e => {
    const node = e.target.closest('.fnode');
    if (node && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); go(+node.dataset.i);
    }
  });

  paint();
}

function wirePage() {
  document.querySelectorAll('.flowmount').forEach(m => {
    if (m.dataset.wired) return;
    m.dataset.wired = '1';
    buildFlow(m);
  });
  document.querySelectorAll('.srcbtn[data-t]').forEach(b => {
    if (b.dataset.wired) return;
    b.dataset.wired = '1';
    b.dataset.label = b.textContent;
    b.addEventListener('click', () => {
      const t = document.getElementById(b.dataset.t);
      const closed = t.classList.toggle('hidden');
      b.textContent = closed ? b.dataset.label : 'Hide';
    });
  });
  document.querySelectorAll('.ephead').forEach(hd => {
    if (hd.dataset.wired) return;
    hd.dataset.wired = '1';
    hd.addEventListener('click', () => hd.parentElement.querySelector('.epbody').classList.toggle('hidden'));
  });
  const pills = document.querySelectorAll('.pill[data-f]');
  pills.forEach(p => {
    if (p.dataset.wired) return;
    p.dataset.wired = '1';
    p.addEventListener('click', () => {
      pills.forEach(x => x.classList.remove('on'));
      p.classList.add('on');
      const f = p.dataset.f;
      document.querySelectorAll('.ep').forEach(e => {
        e.style.display = (f === '*' || e.dataset.m === f || e.dataset.g === f) ? '' : 'none';
      });
    });
  });
  const epq = document.getElementById('epq');
  if (epq && !epq.dataset.wired) {
    epq.dataset.wired = '1';
    epq.addEventListener('input', () => {
      const v = epq.value.toLowerCase();
      document.querySelectorAll('.ep').forEach(e => {
        e.style.display = e.dataset.s.indexOf(v) > -1 ? '' : 'none';
      });
    });
  }
}

/* -------------------------------------------------------------------- init */
buildTree();
window.addEventListener('hashchange', render);

const qi = q1('#q');
qi.addEventListener('input', () => runSearch(qi.value));
qi.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
  else if (e.key === 'Enter') {
    const s = document.querySelector('.res.sel');
    if (s) { location.hash = s.dataset.h; qi.blur(); q1('#results').classList.remove('on'); }
  } else if (e.key === 'Escape') { qi.blur(); q1('#results').classList.remove('on'); }
});
q1('#results').addEventListener('click', e => {
  const r = e.target.closest('.res');
  if (r) { location.hash = r.dataset.h; q1('#results').classList.remove('on'); qi.value = ''; }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.searchwrap')) q1('#results').classList.remove('on');
});
document.addEventListener('keydown', e => {
  if ((e.key === '/' || (e.key === 'k' && (e.ctrlKey || e.metaKey))) &&
      document.activeElement !== qi) { e.preventDefault(); qi.focus(); qi.select(); }
});

q1('#navfilter').addEventListener('input', e => {
  const v = e.target.value.toLowerCase();
  document.querySelectorAll('.modlink').forEach(a => {
    const ok = a.dataset.p.toLowerCase().indexOf(v) > -1;
    a.style.display = ok ? '' : 'none';
  });
  document.querySelectorAll('.dir').forEach(d => {
    const any = [...d.querySelectorAll('.modlink')].some(a => a.style.display !== 'none');
    d.style.display = any ? '' : 'none';
    if (v && any) d.classList.remove('closed');
  });
});

q1('#theme').addEventListener('click', () => {
  const h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
  q1('#theme').textContent = h.dataset.theme === 'dark' ? 'light' : 'dark';
});
q1('#burger').addEventListener('click', () => q1('.side').classList.toggle('open'));

render();

</script>
