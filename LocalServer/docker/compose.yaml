services:
  pyscrapper-server:
    build:
      context: ../..
      dockerfile: LocalServer/docker/Dockerfile
    container_name: pyscrapper-localserver
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ../Data:/app/LocalServer/Data
      - ../logs:/app/LocalServer/logs
      - ../.env:/app/LocalServer/.env:ro
    restart: unless-stopped
    networks:
      - pyscrapper-network

networks:
  pyscrapper-network:
    driver: bridge