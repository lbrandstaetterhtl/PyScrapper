[package]
name = "ocr"
version = "0.1.0"
edition = "2021"

[lib]
name = "ocr"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module"] }
flate2 = "1"
imageproc = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
candle-core = "0.11.0"
candle-nn = "0.11.0"